"\n  MARGA: 그러니까 주는 거야. 선반 위에 있으면 먼지만 쌓여. 머리 위에 있어야 모자지.\n  그녀는 모자를 당신 머리에 억지로 씌운다.\n  ~ item add hat_fisher\n  ~ equip hat_fisher\n-\n~ money +3\n~ item add fish_fried\n~ item give fish_fried\n~ task done t_marga\n~ marga_trust += 1\n-> marga_hub\n\n=== marga_ship\n그녀가 국자로 만 쪽을 가리킨다. 멀리, 방파제 너머에 회색 배 한 척이 닻을 내리고 있다. 깃발이 없다. 선체에 번호만 있다.\nMARGA: 저거? \"펠리컨의 자비\"호. 회사가 불렀어. 용병들. 회색 까마귀라고 불러. 파업 시작하고 일주일째에 왔어. \"회사 재산 보호\"한대.\nMARGA: 밤에 가끔 보트를 타고 부두에 내려. 선술집에서 술 마시고, 하역부들 째려보고, 돌아가. 아직은 그게 다야. 아직은.\nHALFLIGHT: 아직은. 이 도시의 모든 것이 \"아직은\" 위에 서 있다.\n~ crows_heard = 1\n-> marga_hub\n\n// ─────────────────────────────────────────────\n// 이그나시오 — 헌책 노점\n// ─────────────────────────────────────────────\n\n=== ignacio_hub\n{first} 빛바랜 파란 우산 밑, 바퀴 달린 나무 수레에 책이 층층이 쌓여 있다. 곰팡이와 종이와 담배 냄새. 수레 옆 접이식 의자에 앉은 노인은 코끝에 반달 안경을 걸치고, 무릎 위의 책에서 눈을 떼지 않는다.\n{first} IGNACIO: 사지 않을 거면 만지지 마시오. 살 거면 더 만지지 마시오. 책은 사람 손을 싫어하오.\n{first} ~ ignacio_named = 1\n{!first} IGNACIO: 아, 대통령 양반. 오늘은 뭘 안 사러 오셨소?\n+ 수레의 책들을 훑어본다. -> ignacio_books\n* \"솔레아의 역사를 잘 아시오?\" -> ignacio_history\n* \"익사한 왕에 대해 말해 주시오.\" -> ignacio_king\n* {ebb_heard} \"썰물에 관한 책이 있소?\" -> ignacio_ebb\n* {autopsy_done || victim_named} \"안경 쓴 협약 남자가 여기서 책을 산 적 있소?\" -> ignacio_victim\n* \"혹시 라디오 레테라는 걸 아시오?\" -> ignacio_radio\n+ \"구경 잘 했소.\" -> END\n\n=== ignacio_books\n책들. 등이 갈라진 것, 표지가 없는 것, 물에 불었다 마른 것. 제목들이 당신을 올려다본다.\n「사르가 해운사 제3권」. 「반도네온 교본 — 초급」. 「코뮌 법령집(불완전판)」. 「썰물의 지질학」. 「사랑의 편지 쓰는 법 — 백 가지 예문」. 그리고 싸구려 펄프 소설들이 한 무더기. 「말로우 경감의 모험」 시리즈. 7권, 9권, 12권.\n+ {money >= 1 && !has.pulp_mallow && !yun_pulp_given} 「말로우 경감의 모험 9권 — 죽음은 탱고를 추지 않는다」를 산다. (1솔도)\n  IGNACIO: 그거? 1솔도. 표지가 선정적이라 그렇지 내용은 괜찮소. 탐정이 마지막에 늘 옳은 놈을 잡는다오. 현실하고 반대로.\n  ~ money -1\n  ~ item add pulp_mallow\n  {met_yun} PERCEPTION[8]: 윤 경위의 시선이 당신 손의 책 표지에 0.5초 머문다. 그녀의 재킷 안주머니에도 같은 크기의 문고판이 하나 꽂혀 있다. 모서리가 닳은. 제목의 일부가 보인다. \"말로우 경감의 모……\"\n  -> ignacio_books\n+ {money >= 2 && !has.commune_pin} 수레 구석의 코뮌 배지를 산다. (2솔도)\n  IGNACIO: 진품이오. 52년 전 거. 수만 개가 있었는데 이젠 몇 개 안 남았소. 협약이 달고 다니는 사람을 잡아갔거든. 사람들이 강에 던졌지.\n  ~ money -2\n  ~ item add commune_pin\n  -> ignacio_books\n+ 「반도네온 교본」을 펼쳐 본다.\n  첫 페이지에 누군가 연필로 적어 놓았다. \"반도네온은 숨을 쉰다. 너도 같이 쉬어라.\" 그 밑에 다른 필체로: \"쉬는 법을 잊었다.\" 그 밑에 또 다른 필체로: \"그래도 쉬어라.\"\n  EMPATHY: 세 사람이 이 책을 거쳐 갔다. 서로 모르는 세 사람이, 같은 페이지에서 대화를 했다.\n  -> ignacio_books\n+ 「사랑의 편지 쓰는 법」을 펼쳐 본다.\n  예문 37번: \"당신이 떠난 뒤로 나는 매일 아침 커피를 두 잔 끓입니다. 한 잔은 식어 갑니다. 나는 그것을 마시지 않습니다. 그것이 당신에 대한 나의 충성입니다.\"\n  LIMBIC: 너 이거 했어. 6년 동안. 커피 두 잔.\n  {!read_loveletter} ~ morale -1\n  ~ read_loveletter = 1\n  -> ignacio_books\n+ 수레에서 물러난다. -> ignacio_hub\n\n=== ignacio_history\nIGNACIO: 역사? 역사는 내 전공이오. 사르가 대학 역사학과 교수 34년. 협약이 대학을 \"재편\"하면서 쫓겨났소. 코뮌에 대해 너무 정확하게 가르쳤다나.\n그가 안경을 고쳐 쓴다. 강의 모드다.\nIGNACIO: 솔레아는 원래 어촌이었소. 레테 강 하구의 뱀장어 잡이 마을. 해양 왕관이 이곳에 항구를 세웠고, 300년 동안 세계의 배들이 여기 드나들었지. 향신료, 은, 노예, 탱고.\nIGNACIO: 52년 전 조수 혁명이 여기서 시작됐소. 부두 노동자들이 먼저 일어났지. 기근이 3년째였고, 왕은 해전에서 함대를 잃었고, 빵값이 여섯 배가 됐소. 어느 아침, 하역부들이 크레인을 멈췄소. 지금처럼.\nIGNACIO: 역사는 반복되지 않소. 운율을 맞출 뿐이지.\n* \"그다음은?\"\n  IGNACIO: 왕이 바다로 걸어 들어갔고, 코뮌이 선포됐고, 6년 뒤에 협약 함대가 왔소. 아홉 날의 포격. 그다음은 조수 요새의 벽. 그다음은 46년의 침묵.\n  IGNACIO: 그리고 지금, 3주째 크레인이 멈춰 있소. 운율이 맞기 시작했지.\n  RHETORIC[9]: 그는 두려워하고 있다. 그리고 동시에 기대하고 있다. 역사학자의 병이다. 재앙을 목격하고 싶은 욕망.\n  ~ al_communard += 1\n* \"협약은 왜 대학에서 코뮌을 가르치지 못하게 했소?\"\n  IGNACIO: 기억은 위험하니까. \"우리는 잊지 않는다\" — 그게 코뮌의 구호였소. 협약의 구호는 말이 없지만, 있다면 이럴 거요. \"잊으시오. 번영하시오.\"\n  IGNACIO: 레테 강 위에 세운 도시에 딱 맞는 통치 철학 아니오?\n  ~ thought tide_ghost\n-\n~ xp 5\n-> ignacio_hub\n\n=== ignacio_king\nIGNACIO: 아우렐리오 4세. 마지막 왕. 익사한 왕.\nIGNACIO: 혁명군이 왕궁 문을 부수던 날 아침, 왕은 대관식 예복을 입고 왕관을 쓰고 왕궁 앞 계단을 내려갔소. 계단은 바다까지 이어져 있었지. 수백 명이 봤소. 혁명군도, 하녀들도, 어부들도. 아무도 막지 않았소. 왕은 걸음을 멈추지 않았소. 물이 무릎까지, 허리까지, 가슴까지. 왕관이 마지막으로 가라앉았다오.\nIGNACIO: 시신은 찾지 못했소. 왕관도. 그래서 전설이 생겼지. 왕은 죽지 않았다. 바다 밑에서 기다린다. 사르가가 다시 위대해질 때 돌아온다.\n* \"믿으시오?\"\n  IGNACIO: 나는 역사학자요. 왕은 익사했소. 조류 기록을 보면 시신은 썰물을 타고 먼 바다로 나갔을 거요.\n  IGNACIO: 그래도 폭풍 치는 밤이면 나도 가끔 바다를 보오. 역사학자도 사람이니까.\n* \"저기 종이 왕관 쓴 남자가 자기가 손자라던데.\"\n  IGNACIO: 아우렐리오? 불쌍한 친구. 30년 전엔 조선소 용접공이었소. 사고로 머리를 다쳤지. 그 뒤로 왕손이 됐소.\n  IGNACIO: 놀리지 마시오. 이 도시에서 그보다 더 이 도시를 사랑하는 사람은 없소. 방식이 좀 이상할 뿐이지.\n  ~ aurelio_backstory = 1\n-\n~ thought drowned_king\n-> ignacio_hub\n\n=== ignacio_ebb\nIGNACIO: 썰물? 아, 에밀이 읽는 그 이단 서적 말이구려. 그 친구가 여기서 샀소.\nIGNACIO: 썰물에 관한 책은 두 종류요. 과학 책과 광기의 책. 과학 책은 지루하고, 광기의 책은 재미있소. 둘 다 틀렸을 거요.\nIGNACIO: 하나 말해 주지. 썰물학자들이 절대 책에 안 쓰는 이야기. 썰물을 건넌 선원들 중에, 이름을 잃지 않고 돌아온 사람이 딱 한 명 있었소. 그 사람은 건너는 내내 한 이름을 불렀다오. 애인 이름. 쉬지 않고. 사흘 동안.\nIGNACIO: 그 사람은 자기 이름을 잊었소. 애인 이름은 기억했고.\nEMPATHY: 그는 이 이야기를 좋아한다. 사실인지는 상관없다.\n~ ebb_heard = 1\n~ thought ebb_theory\n-> ignacio_hub\n\n=== ignacio_victim\nIGNACIO: 안경 쓴 협약 남자? 키 크고, 말을 더듬는?\n그가 무릎 위의 책을 덮는다.\nIGNACIO: 왔었소. 세 번. 첫 번엔 「탱고 입문 — 스텝과 음악」을 샀고, 두 번째엔 「솔레아 방언 사전」을 샀소. 협약 사람이 솔레아 방언을 배우다니. 희한하지. 사르가 표준어도 아니고 부두 사투리를.\nIGNACIO: 왜 사냐고 물었지. 그랬더니 얼굴이 빨개지면서 그러더군. \"누군가와 그녀의 말로 이야기하고 싶어서요.\"\nIGNACIO: 세 번째엔 아무것도 안 샀소. 코뮌 찬가 가사가 실린 팸플릿을 한참 들여다보다가 그냥 갔소. 「우리는 잊지 않으리」.\nEMPATHY: 그는 누군가를 위해 새로운 언어를 배우고 있었다. 춤과 사투리와 노래. 그녀의 세계로 들어가는 세 개의 문.\n~ victim_ignacio = 1\n~ ines_student_known = 1\n~ xp 10\n-> ignacio_hub\n\n=== ignacio_radio\nIGNACIO: 라디오 레테? 알다마다. 익사한 종의 교회 종탑에서 밤마다 방송하는 해적 방송이오. 협약 전파 관리청이 3년째 잡으려고 하는데 못 잡고 있소.\nIGNACIO: 방송하는 아이가 여기 와서 내 책을 빌려 가오. 밤에 낭독하려고. 시집, 소설, 코뮌 팸플릿. 나는 공짜로 빌려주고 대신 방송에서 내 노점 광고를 해 달라고 했지. \"부두 거리의 이그나시오, 곰팡이 핀 지혜를 팝니다.\" 한 번도 안 해 줬소.\nIGNACIO: 요 며칠은 방송이 안 들리더군. 송신기가 고장 났다나. 부품이 없어서.\n~ radio_heard = 1\n-> ignacio_hub\n");
  load("07_quay_people.tl", "// ─────────────────────────────────────────────\n// 07. 부두의 두 노인 — 아우렐리오와 그레고르\n// ─────────────────────────────────────────────\n\n=== aurelio_hub\n{first} 문 닫은 경매장 처마 밑, 생선 상자 세 개를 쌓아 만든 단 위에 한 남자가 앉아 있다. 쉰 살쯤. 사자 갈기 같은 회색 수염, 어깨에 두른 좀먹은 자주색 벨벳 커튼. 머리에는 정어리 통조림 상표를 오려 이어 붙인 종이 왕관. 손에는 끝에 놋쇠 문손잡이를 박은 빗자루 자루.\n{first} 그가 빗자루 자루로 자갈을 두 번 친다. 쿵, 쿵.\n{first} AURELIO: 멈춰라! 솔레아의 옥좌 앞에 다가오는 자는 누구냐!\n{night} 아우렐리오는 벨벳 커튼을 이불 삼아 상자 위에 웅크리고 있다. 종이 왕관은 벗어서 가슴에 안았다. 당신의 발소리에 그가 한쪽 눈을 뜬다.\n{night} AURELIO: ……짐은 알현 시간이 끝났다. 그래도 급한 일이면 말하라. 왕은 백성을 외면하지 않는다. 춥지만.\n{!first && !night} AURELIO: 아, 짐의 충성스러운 경찰이 왔구나. 무슨 일로 옥좌를 찾았느냐.\n* {!aurelio_named} \"당신은 누구요?\"\n  AURELIO: 짐을 모르느냐? 짐은 아우렐리오. 아우렐리오 5세. 해양 왕관의 정당한 계승자, 익사한 왕 아우렐리오 4세의 손자, 솔레아와 레테 하구와 일곱 바다의 주인이다.\n  AURELIO: 지금은 망명 중이다. 내 나라 안에서.\n  ~ aurelio_named = 1\n  * 고개를 숙인다. \"폐하.\"\n    그의 눈이 커진다. 사자 갈기 같은 수염이 떨린다.\n    AURELIO: ……폐하. 폐하라고 불렀다. 너는 폐하라고 불렀구나.\n    AURELIO: 30년 동안 이 부두에서 짐을 폐하라고 부른 자는 네가 세 번째다. 첫째는 술 취한 선원이었고, 둘째는 짐을 놀리던 꼬마였다. 너는 어느 쪽이냐?\n    * \"진심이오, 폐하.\"\n      AURELIO: 그렇다면 너를 기억하겠다. 왕은 충신을 잊지 않는다.\n      ~ aurelio_trust += 2\n      ~ al_crown += 1\n    * \"……둘 다 아니오. 그냥 예의요.\"\n      AURELIO: 예의! 예의도 좋다. 이 도시에선 그것도 귀하다.\n      ~ aurelio_trust += 1\n    -\n  * \"망명 중인 왕이 생선 상자 위에서 뭘 하시오?\"\n    AURELIO: 기다린다. 왕들은 기다린다. 할아버지는 바다 밑에서 기다리고, 짐은 바다 위에서 기다린다. 사르가가 다시 위대해질 날을.\n    AURELIO: 생선 상자는 임시 옥좌다. 원래 옥좌는 협약 은행가들이 녹여서 금괴로 만들었다.\n  -\n* \"크레인에 매달린 남자를 봤소?\" -> aurelio_crane\n* {aurelio_named} \"왕가의 역사를 들려주시오.\" -> aurelio_lineage\n* {aurelio_named} \"사르가가 다시 위대해진다니, 어떻게?\" -> aurelio_politics\n* {aurelio_named && !task.t_crown} \"폐하께 필요한 것이 있소?\" -> aurelio_quest\n* {active.t_crown && has.royal_coin} 분수에서 건진 은화를 보여 준다. -> aurelio_coin\n+ 물러난다. -> END\n\n=== aurelio_crane\nAURELIO: 반역자 말이냐? 봤다. 짐은 모든 것을 본다. 짐의 옥좌는 이 부두를 다 내려다본다.\nAURELIO: 닷새 전 밤. 새벽 네 시. 짐은 자고 있었다. 왕도 잔다. 그런데 크레인 엔진이 짐을 깨웠다. 파업 중인데. 짐은 일어났다.\nAURELIO: 충성스러운 신민 넷이 무언가를 들고 부두를 걸어왔다. 담요에 싼 긴 것. 가장 덩치 큰 자가 앞장섰다. 그들은 그것을 일곱 번째 크레인 밑에 눕혔다. 갈매기 시몬이 운전실로 올라갔다. 레버를 두 번씩 당기는 버릇, 짐은 안다.\nAURELIO: 갈고리가 내려왔고, 그들은 그것의 목에 밧줄을 걸었고, 갈고리가 올라갔다. 하늘로. 반역자는 하늘에 매달렸다. 왕의 이름으로 처형된 것이다.\n* \"그 남자는 발버둥 쳤소?\"\n  AURELIO: 발버둥?\n  그가 수염을 쓸어내린다. 무언가를 기억해 내는 얼굴.\n  AURELIO: ……아니다. 아니었다. 반역자들은 발버둥 친다. 짐의 할아버지 시대 기록에 다 나와 있다. 교수대의 반역자는 다리로 허공을 걷는다. 그런데 그자는 걷지 않았다. 담요에서 나올 때부터 축 늘어져 있었다. 이미 잠든 사람처럼.\n  AURELIO: 죽은 자는 잠든다. 짐은 그것도 안다.\n  LOGIC: 목격자다. 머리가 이상한 목격자지만, 목격자다. 시신은 새벽 네 시에 부두로 옮겨졌고, 크레인에 매달렸고, 그때 이미 죽어 있었다. 그리고 크레인을 움직인 건 시몬이다.\n  ~ aurelio_saw = 1\n  ~ simon_hint = 1\n  ~ xp 15\n* \"그 넷이 누구였소?\"\n  AURELIO: 신민들의 얼굴을 다 기억하면 왕 노릇을 못 한다. 그래도 가장 큰 자는 알았다. 황소. 로사 과부의 조카. 그자는 울고 있었다.\n  AURELIO: 사형 집행인이 울다니. 할아버지 시대엔 없던 일이다.\n  ~ aurelio_saw_mateo = 1\n  ~ simon_hint = 1\n-\n-> aurelio_hub\n\n=== aurelio_lineage\nAURELIO: 짐의 할아버지 아우렐리오 4세께서는 바다로 걸어 들어가시기 전날 밤, 궁정 세탁부와 사랑을 나누셨다. 그 세탁부가 짐의 할머니다. 그리고 그 사랑의 열매가 짐의 아버지, 조선소 용접공 페르난도다.\nAURELIO: 증거는 없다. 증거는 협약이 불태웠다. 그러나 짐의 코를 보라. 이 코를.\n그가 옆얼굴을 보여 준다. 긴 매부리코.\n{has.royal_coin} PERCEPTION: 당신 주머니 속 은화의 옆얼굴과…… 음. 코가 비슷하긴 하다. 긴 코를 가진 사르가 남자는 수만 명이지만.\n{aurelio_backstory} EMPATHY: 이그나시오가 말했다. 조선소 용접공, 사고, 머리. 그 사고 전의 아우렐리오는 페르난도의 아들이었다. 그 사고 후의 아우렐리오는 왕의 손자다. 어느 쪽이 더 행복한지는 알 수 없다.\n* \"코가 훌륭하시오.\"\n  AURELIO: 그렇지! 왕가의 코다! 바람을 가르고 바다를 읽는 코!\n  ~ aurelio_trust += 1\n* \"증거 없는 혈통은 혈통이 아니오.\"\n  AURELIO: 증거 없는 혈통이 혈통이 아니라면, 증거 없는 사랑은 사랑이 아니냐? 증거 없는 기억은 기억이 아니냐?\n  AURELIO: 너는 기억이 없다고 들었다, 경찰. 그럼 너는 누구냐? 증거가 없는데.\n  RHETORIC[10]: 이 미친 왕이 방금 좋은 논점을 짚었다. 불쾌할 정도로 좋은.\n  ~ aurelio_point = 1\n-\n-> aurelio_hub\n\n=== aurelio_politics\nAURELIO: 어떻게? 간단하다.\n그가 빗자루 홀을 치켜든다. 목소리가 커진다. 선술집 앞의 하역부 몇 명이 고개를 돌렸다가, 익숙하다는 듯 다시 돌린다.\nAURELIO: 첫째. 협약의 은행가들을 바다로 돌려보낸다. 그들이 온 곳으로. 둘째. 코뮌의 떨거지들, 빨간 깃발을 흔드는 자들, 크레인을 멈추는 자들을 일터로 돌려보낸다. 셋째. 사르가의 땅은 사르가 사람에게. 동쪽 섬에서 온 자들, 가람 놈들이 우리 염전과 우리 부두와 우리 경찰서를 차지하고……\n그의 눈이 당신의 어깨 너머, 윤 경위에게 멈춘다.\n{met_yun} AURELIO: ……저기 저 여자처럼. 가람 계집이 사르가 경찰 옷을 입고 있구나. 할아버지께서 보셨다면 통곡하셨을 것이다.\n{met_yun} 윤 경위는 움직이지 않는다. 표정도 변하지 않는다. 수첩에 무언가를 적지도 않는다. 그냥 서 있다. 이 말을 천 ost\n-> gregor_hub\n\n=== gregor_strike\nGREGOR: 이 파업은 코뮌의 손주요.\nGREGOR: 회사는 크레인을 썩게 뒀소. 케이블 하나 가는 값이 하역부 여섯 목숨보다 비쌌다는 거지. 그리고 여섯이 죽자, 죽은 놈 탓을 했소. 운전자 과실. 토마스 이바라가 30년 동안 몬 크레인을.\nGREGOR: 노동자들이 멈춘 건 당연하오. 멈추지 않았다면 그게 이상한 거지.\n* [RHETORIC 10] \"그런데 파업이 이길 수 있소? 회사엔 협약이 있고, 용병이 있소.\"\n  ?+\n    GREGOR: 이길 수 없소.\n    그가 빵 부스러기를 던진다. 비둘기들이 몰려든다.\n    GREGOR: 코뮌도 이길 수 없었소. 그래도 6년 동안 이겼소. 파업도 이길 수 없소. 그래도 3주 동안 이기고 있소. 크레인이 멈춰 있는 한, 회사는 매일 지고 있는 거요. 그게 계급 투쟁의 산수요. 이길 수 없는 싸움을 최대한 오래 이기는 것.\n    RHETORIC: 절망과 투지가 한 문장 안에 들어 있다. 이 노인은 46년 동안 이 문장을 다듬었다.\n    ~ al_communard += 1\n  ?-\n    GREGOR: 경찰이 그런 질문을 하는 건 대답을 이미 알아서요. 경찰은 늘 이긴 쪽에 서 있으니까.\n    GREGOR: 가시오.\n    ~ gregor_annoyed = 1\n* \"로사가 회사하고 뒤에서 협상한다는 소문이 있던데.\"\n  GREGOR: 소문? 소문 아니오. 내 눈으로 봤소.\n  GREGOR: 지난주에 두 번. 밤 열한 시. 회사 협상 대표 그 창백한 청년이 택시를 타고 통조림 공장 뒷문으로 왔소. 한 시간 있다 갔소. 로사는 아무한테도 말 안 했소. 노조 집행부한테도.\n  GREGOR: 로사가 노동자들을 팔아넘기려는 건지, 회사를 속이려는 건지는 모르오. 로사하고는 둘 다일 수도 있소. 그 여자는 코뮌 때부터 그랬소. 늘 두 수 앞을 봤지. 그래서 살아남았고.\n  ~ rosa_deal_rumor = 1\n-\n-> gregor_hub\n\n=== gregor_body\nGREGOR: 회사 첩자가 받을 걸 받았소.\n그는 빵 부스러기를 던진다. 무심하게.\nGREGOR: 74년에도 그랬소. 코뮌 2년째. 밀고자들을 크레인에 매달았지. 인민의 정의. 밧줄은 법원보다 빠르고, 판사보다 정직하오.\n* [RHETORIC 11] \"인민의 정의요, 로사 이바라의 정의요?\"\n  ?+\n    그의 손이 봉투 속에서 멈춘다.\n    GREGOR: ……\n    GREGOR: 동무는 좋은 질문을 하는구려. 경찰답지 않게.\n    GREGOR: 맞소. 냄새가 나오. 74년의 밧줄은 인민 재판소의 판결이 있었소. 엉터리 재판이었지만, 재판이었소. 이번 건 아무것도 없소. 판결문도, 투표도, 연설도. 그냥 로사의 조카하고 그 패거리가 새벽에 몰래 한 짓이오.\n    GREGOR: 그건 코뮌이 아니오. 그건 가족이오. 가족의 정의는 인민의 정의가 아니오.\n    ~ gregor_doubt = 1\n    ~ xp 10\n  ?-\n    GREGOR: 로사가 곧 인민이오. 적어도 이 부두에서는.\n    GREGOR: 경찰 동무는 이해 못 하오. 이해할 필요도 없고.\n* \"밧줄이 정직하다고? 그 사람이 정말 첩자였는지 확인은 했소?\"\n  GREGOR: 확인? 코뮌 때도 확인은 안 했소. 확인할 시간이 없었으니까.\n  GREGOR: ……그래서 졌는지도 모르지.\n  그는 더 말하지 않는다. 비둘기들을 본다.\n  ~ gregor_doubt = 1\n* \"당신은 교수형을 찬성하는 거요?\"\n  GREGOR: 나는 아무것도 찬성하지 않소. 나는 여든두 살이오. 나는 비둘기한테 빵을 줄 뿐이오.\n-\n-> gregor_hub\n\n=== gregor_rosa\nGREGOR: 로사.\n그 이름을 말하는 그의 목소리가 처음으로 달라진다. 무언가가 그 안에서 부드러워졌다가, 곧바로 다시 굳는다.\nGREGOR: 생선 공장 여공이었소. 열여덟. 나는 열여섯. 공장에서 짐을 나르다가 처음 봤소. 그녀는 칼로 정어리 대가리를 일 초에 하나씩 쳐냈소. 한 번도 안 틀리고. 나는 그걸 보면서 혁명을 믿게 됐소. 저런 손이 세상을 바꿀 거라고.\nGREGOR: 그녀는 바르톨로메하고 결혼했소. 나보다 나이도 많고, 춤도 잘 추고, 연설도 잘했소. 당연하지.\n* \"그녀를 사랑했소?\"\n  GREGOR: 사랑? 나는 혁명을 사랑했소. 로사는 혁명의 얼굴이었을 뿐이오.\n  PERCEPTION[9]: 그의 손가락이 목에 두른 붉은 목도리의 끝을 만지작거린다. 손뜨개다. 오래되고, 여러 번 기웠다. 뜨개질하는 사람이 떴다. 로사는 뜨개질을 한다.\n  * [EMPATHY 9] \"그 목도리, 로사가 떴소?\"\n    ?+\n      GREGOR: ……\n      그가 목도리에서 손을 뗀다. 늦었다.\n      GREGOR: 바르톨로메가 총살당하고 1년 뒤에 내가 감옥에서 나왔을 때. 그녀가 이걸 줬소. 아무 말도 없이. 그 뒤로 46년 동안 우리는 한 번도 단둘이 이야기하지 않았소.\n      GREGOR: 그녀는 혁명하고 결혼했소. 바르톨로메가 죽은 뒤에도. 그리고 나는…… 나는 비둘기하고 결혼했지.\n      EMPATHY: 그는 46년 동안 이 목도리를 둘렀다. 여름에도.\n      ~ gregor_scarf = 1\n      ~ morale -1\n    ?-\n      GREGOR: 목도리는 목도리요. 동무는 사소한 걸 너무 많이 보오.\n  -\n* \"그녀는 지금 어떤 사람이오?\"\n  GREGOR: 무서운 사람이오. 코뮌이 남긴 것 중에 제일 무서운 것.\n  GREGOR: 코뮌은 우리에게 두 가지를 가르쳤소. 하나, 우리는 서로를 위해 죽을 수 있다. 둘, 우리는 서로를 죽일 수 있다. 로사는 둘 다 배웠소. 둘 다 잘하오.\n-\n~ rosa_history = 1\n-> gregor_hub\n\n=== gregor_pigeons\nGREGOR: 동무요. 모두 동무요.\n그가 비둘기들을 하나씩 가리킨다.\nGREGOR: 저 회색은 회색 동무. 욕심이 많소. 저 외발은 외발 동무. 코뮌 3년째 바리케이드에서 발을 잃은 동지 이름을 땄소. 저 흰 것은 에르난. 시인 이름이오. 늘 딴 데를 보고 있지. 저 뚱뚱한 건 협약. 제일 많이 먹소.\nGREGOR: 비둘기들은 계급이 없소. 모두 같은 빵을 먹소. 먼저 오는 놈이 먼저 먹지만. 그러니까 계급이 있는 거지. 젠장.\n~ gregor_pigeons_done = 1\n-> gregor_hub\n\n=== gregor_score\nGREGOR: 파코.\n그가 빵 봉투를 접는다. 비둘기들이 불만스럽게 운다.\nGREGOR: 그 배신자가 악보를 원한다고.\nGREGOR: 코뮌이 무너진 지 한 달 만에 그자는 협약 장교들 앞에서 탱고를 켰소. 레테에서. 인민 무도장에서. 우리 동지들이 요새 벽 앞에 서 있던 그 주에. 나는 선창 감옥 창살 사이로 그 소리를 들었소. 바람을 타고 왔지. 「올비도」였소.\nGREGOR: 에르난 소토의 친필 악보는 내가 포격 사흘째에 무너진 무도장에서 주웠소. 46년 동안 가지고 있었소. 배신자한테는 못 주오.\n* [RHETORIC 12] \"당신은 그 악보를 서랍에 가두고 있소. 그건 기억이 아니라 망각이오. 파코는 그 곡을 매일 밤 연주하오.\"\n  ?+\n    GREGOR: ……\n    그가 한참 동안 비둘기들을 본다.\n    GREGOR: 서랍에 가둔 게 망각이라.\n    GREGOR: 동무 말이 맞소. 나는 그걸 46년 동안 숨겨 뒀소. 아무도 못 보게. 나 자신도. 그게 코뮌을 지키는 거라고 생각했지. 아무도 더럽히지 못하게.\n    GREGOR: 그런데 파코는 매일 밤 켰소. 협약 놈들 앞에서도, 은행 놈들 앞에서도, 술 취한 하역부들 앞에서도. 그래서 그 곡이 살아 있는 거요. 내 서랍 속에서가 아니라.\n    -> gregor_score_give\n  ?-\n    GREGOR: 말장난이오. 경찰 동무. 가시오.\n* [EMPATHY 11] \"파코가 협약 앞에서 연주한 건 레테를 지키려고였소. 오를라를 위해. 과부들이 춤출 곳을 남기려고.\"\n  ?+\n    GREGOR: 오를라를 위해.\n    그가 눈을 감는다.\n    GREGOR: 오를라. 포격 전날 밤에 그 노래를 부르던 아이. 목소리를 잃고 그 무도장을 샀지. 나는 한 번도 거기 가지 않았소. 46년 동안. 거기 가면 그 노래가 들릴까 봐.\n    GREGOR: 파코가 그걸 지켰다고. 그 무도장을. 협약한테 굽신거리면서.\n    GREGOR: ……누군가는 굽신거려야 했겠지. 나 같은 놈들이 벤치에 앉아서 순수함을 지키는 동안.\n    -> gregor_score_give\n  ?-\n    GREGOR: 동무는 파코를 모르오. 나는 알고. 가시오.\n* \"생각해 보시오.\"\n  GREGOR: 46년 동안 생각했소.\n-\n-> gregor_hub\n\n=== gregor_score_give\n그는 피코트 안주머니에 손을 넣는다. 한참 뒤적인다. 그리고 기름종이에 몇 겹으로 싼 납작한 꾸러미를 꺼낸다. 46년 동안 거기 있었던 것이다. 그의 심장 바로 옆에.\nGREGOR: 가져가시오. 파코한테 전하시오.\nGREGOR: 그리고 말하시오. 그레고르가…… 아니, 아무 말도 하지 마시오. 그자는 알 거요.\n~ item add score_commune\n~ score_gregor_gave = 1\n~ al_communard += 1\n~ xp 20\n그는 다시 빵 봉투를 편다. 비둘기들이 돌아온다.\nGREGOR: 회색 동무, 욕심 부리지 마.\n-> gregor_hub\n");
  load("08_crane.tl", "// ─────────────────────────────────────────────\n// 08. 7번 크레인 — 시신, 추모비, 시신 내리기\n// ─────────────────────────────────────────────\n\n=== crane @location name=\"7번 크레인 아래\" art=crane travel=3\n{first} 부두 거리가 끝나는 곳에서 자갈이 콘크리트로 바뀐다. 바다 쪽으로 튀어나온 넓은 부두. 계선 기둥들, 녹슨 레일, 버려진 화물 운반대. 그리고 그 위로, 일곱 번째 크레인이 선다.\n{first} 가까이서 보면 크레인은 건물이다. 교회만 한 철골의 탑. 다리 네 개가 레일 위에 서 있고, 그 위로 운전실이, 그 위로 지브가 바다를 향해 비스듬히 뻗어 있다. 붉은 방청 페인트가 벗겨져 녹이 비늘처럼 일어났다.\n{first} 지브 끝에서 케이블이 곧게 내려와 있다. 그 끝에.\n{first} -> crane_first_look\n{!first && !body_down} 일곱 번째 크레인이 머리 위에 서 있다. 그리고 그 끝에 그 남자가.\n{!first && body_down && !night} 일곱 번째 크레인. 갈고리가 비었다. 드럼통 불가에서 하역부들이 담배를 나눠 피운다. 구호 소리가 조금 작아졌다.\n{!first && night} 밤의 크레인 아래. 드럼통 속의 불이 하역부들의 얼굴을 아래에서 비춘다. 그림자들이 크레인 다리를 타고 올라간다.\n{standoff_done} 부두 콘크리트에 검은 얼룩들이 남아 있다. 누군가 모래를 뿌렸다. 모래도 그것을 다 덮지는 못한다.\n+ {!body_down} 매달린 남자를 올려다본다. -> crane_body_look\n+ {body_down && !autopsy_done} 부두에 내려놓은 시신을 검시한다. -> autopsy_start\n+ {body_down && autopsy_done} 방수포 밑의 시신을 다시 본다. -> autopsy_revisit\n+ 드럼통 불가의 하역부들에게 간다. -> dogs_hub\n+ 크레인 옆 양철 초소로 간다. -> simon_hub\n+ 4번 크레인 추모비 앞에 선다. -> crane_memorial\n+ {!body_down && !night && !bobo_ran} 돌을 던지는 꼬마에게 간다. -> bobo_first\n+ {rosa_permission && !body_down} 크레인 사다리를 올려다본다. -> crane_cab\n+ {met_yun} 윤 경위와 이야기한다. -> yun_hub\n+ 부두 거리로 돌아간다. => quay 3\n\n// ───────── 처음 올려다보기 ─────────\n\n=== crane_first_look\n남자가 매달려 있다.\n지상 20미터. 머리 위로, 케이블 끝의 쇠갈고리에 걸린 밧줄, 그 밧줄 끝에 목. 회색 양복. 바람이 불 때마다 몸 전체가 천천히 돈다. 한 바퀴 돌 때 3분쯤. 시계의 분침처럼.\n발은 하나는 맨발이다. 다른 하나에는 반짝이는 검은 구두가 신겨져 있다. 가느다란 밑창, 끈이 발등을 X자로 감는.\nSAVOIR[7]: 탱고 구두다. 남자용 탱고 구두. 저 사람은 춤을 추던 사람이다.\nLIMBIC: 너처럼. 구두 한 짝. 너처럼.\n갈매기 네 마리가 지브 위에 앉아 있다. 한 마리가 내려와 그의 어깨에 앉는다. 고개를 기울인다. 쪼는다.\n~ body_seen = 1\n~ task add t_body_down\n-> crane_body_look_details\n\n=== crane_body_look\n{body_seen} 당신은 다시 올려다본다. 회색 양복, 한 짝의 탱고 구두, 천천히 도는 몸. 시계의 분침처럼.\n~ body_seen = 1\n~ task add t_body_down\n-> crane_body_look_details\n\n=== crane_body_look_details\n{met_yun && !yun_body_line} YUN: 형사님. 저 사람을 내려야 해요. 오늘.\n{met_yun && !yun_body_line && !rosa_met} YUN: 하역부들이 크레인을 막고 있어요. 저 사람들한테 먼저 이야기해 봐야 할 것 같아요.\n{met_yun} ~ yun_body_line = 1\n* [VISUAL 8] 높이와 각도를 잰다.\n  ?+\n    VISUAL: 지상고 20.4미터. 밧줄 길이 약 1.5미터. 케이블은 수직, 흔들림 주기 약 9초. 목이 오른쪽으로 꺾인 각도가 비정상적이다. 교수형이라면 매듭 반대쪽으로 꺾여야 한다. 이건 매듭 쪽으로 꺾였다.\n    VISUAL: 결론은 아직 없다. 하지만 이 각도는 거짓말을 하고 있다. 누군가 무게가 이미 축 늘어진 몸에 밧줄을 걸었다.\n    ~ angle_wrong = 1\n  ?-\n    VISUAL: 높다. 무척 높다. 목이 이상하게 꺾여 있다. 교수형 시신의 목은 다 저렇게 꺾이는가? 모르겠다. 너무 높아서 잘 안 보인다.\n* [PERCEPTION 9] 매달린 몸을 자세히 본다.\n  ?+\n    회색 양복은 좋은 천이다. 햇빛에 은색으로 번쩍인다. 협약 쪽 재단. 셔츠는 흰색, 넥타이는 없다. 오른손이 주먹을 쥐고 있다. 왼손은 펴져 있다.\n    그리고 얼굴. 갈매기들이 먼저 다녀갔다. 당신은 얼굴을 오래 보지 않는다. 대신 콧등을 본다. 양쪽에 작고 붉은 자국. 안경을 오래 쓴 사람의 자국.\n    PERCEPTION: 안경은 없다. 어디 갔지?\n    ~ glasses_mark_seen = 1\n  ?-\n    회색 양복. 한 짝의 구두. 갈매기들. 당신의 눈은 세부를 붙잡지 못하고 미끄러진다. 숙취가 시야 가장자리를 뿌옇게 만든다.\n* <INLAND 10> 그에게 말을 건다. 속으로.\n  바람이 멎는다. 그 짧은 순간, 모든 소리가 사라진다. 구호도, 갈매기도, 파도도.\n  CORPSE: ……내려 줘.\n  INLAND: 목소리는 20미터 위에서가 아니라, 당신 목 바로 뒤에서 들린다. 차갑고, 공손하고, 조금 더듬는 목소리.\n  CORPSE: 여기는 추워. 그리고 모두가 봐. 나는 사람들이 쳐다보는 게 싫어. 늘 싫었어. 춤출 때도.\n  CORPSE: 내려 줘. 부탁이야. 그리고 그녀한테…… 아니야. 내려 주기만 해.\n  바람이 다시 분다. 목소리가 흩어진다.\n  ~ corpse_spoke = 1\n* <EMPATHY 8> 그를 본다. 사람으로서.\n  EMPATHY: 누군가 이 사람을 사랑했다. 저 양복을 다려 준 사람, 저 구두를 골라 준 사람. 그리고 이 사람도 누군가를 사랑했다. 탱고 구두를 신고 춤추러 가는 남자는 대개 누군가를 사랑한다.\n  EMPATHY: 나흘. 나흘 동안 아무도 이 사람을 내려 주지 않았다. 도시 전체가 등을 돌렸다. 당신까지.\n  ~ morale -1\n* <ESPRIT 9> 경비대가 여기 있었다면.\n  ESPRIT: 9분서의 신입이라도 첫날 오후에 이 사람을 내렸을 것이다. 사다리를 가져오고, 노조와 담판을 짓고, 정 안 되면 소방대를 불렀을 것이다. 그게 경찰이 하는 일이다. 가장 기본적인 일.\n  ESPRIT: 나흘 동안 이 도시의 경찰은 무도장 2층에서 「올비도」를 듣고 있었다.\n  ~ morale -1\n  ~ cop_sorry += 1\n+ 시선을 내린다. -> END\n\n// ───────── 4번 크레인 추모비 ─────────\n\n=== crane_memorial\n부두 끝, 바다를 등진 자리에 4번 크레인의 잔해가 있다. 무너진 철골은 치워졌고, 부러진 다리 하나만 남아 콘크리트에 박혀 있다. 녹슨 쇠기둥이 하늘을 향해 비스듬히, 부러진 뼈처럼.\n그 밑에 누군가 나무판자를 세우고 흰 페인트로 이름을 적었다. 여섯 개.\n토마스 이바라. 에스테반 루이스. 호아킨 메사. 파블로 \"꼬마\" 세라노. 비센테 오르티스. 다니엘 고.\n판자 앞에 촛불이 수십 개. 녹아서 서로 붙었다. 꽃은 대부분 시들었고, 몇 송이는 오늘 아침에 놓였다. 사진 몇 장. 담배 한 갑. 럼 한 병, 뚜껑을 딴 채로. 크레용 그림 한 장, 비에 젖어 번졌다. \"아빠\"라고 쓰여 있다.\n{!memorial_seen} ~ crane4_known = 1\n~ memorial_seen = 1\n* 이름을 하나씩 읽는다.\n  당신은 이름을 읽는다. 소리 내어. 천천히.\n  \"토마스 이바라. 에스테반 루이스. 호아킨 메사. 파블로 세라노. 비센테 오르티스. 다니엘 고.\"\n  드럼통 불가의 하역부 몇 명이 고개를 돌린다. 한 명이 모자를 벗는다.\n  VOLITION: 이름은 부르라고 있는 거야. 부르지 않으면 썰물이 가져가.\n  {pass(ENCYCLOPEDIA, 9)} ENCYCLOPEDIA: 다니엘 고. 가람식 성이다. 여섯 명 중 한 명은 가람 출신이었다.\n  {met_yun} 윤 경위가 여섯 번째 이름 앞에서 잠시 서 있다. 아무 말도 하지 않는다. 장갑을 벗고, 판자 위의 흰 글씨를 손끝으로 한 번 만진다. 가람에서 죽은 자에게 하는 인사다.\n  ~ thought six_names\n  ~ names_read = 1\n* 사진들을 본다.\n  빛바랜 사진들. 크레인 앞에서 웃는 남자들. 아이를 안은 남자. 결혼식 사진. 그중 하나에 당신의 눈이 멈춘다.\n  쉰 살쯤 된 남자. 두꺼운 팔, 짙은 눈썹, 웃는 입. 크레인 운전실 문에 기대 서 있다. 그 옆에 스무 살 남짓한 여자가 그의 어깨에 팔을 두르고, 앞에 여섯 살쯤 된 사내아이가 다리에 매달려 있다. 사진 밑에 \"토마스와 이네스와 보보, 여름\".\n  EMPATHY: 토마스 이바라. 4번 크레인 운전자. 회사가 \"과실\"이라고 부른 사람. 그리고 그의 딸과 아들.\n  ~ ines_heard = 1\n  ~ bobo_heard = 1\n  ~ family_photo_seen = 1\n* <PERCEPTION 9> 제물들 사이를 살핀다.\n  촛불과 꽃 사이에, 판자 발치에 여자 구두 한 켤레가 가지런히 놓여 있다. 굽이 낮고, 발등에 끈이 두 개. 앞코가 닳았고, 밑창에 송진 가루가 하얗게 배어 있다. 오래 신은 탱고 구두.\n  PERCEPTION: 먼지가 거의 없다. 비를 한 번 맞았다. 닷새, 엿새 전쯤 놓였다.\n  EMPATHY: 누군가 자기 춤을 아버지에게 바쳤다. 그리고 떠났다.\n  ~ ines_shoes_memorial = 1\n* [VISUAL 10] 부러진 크레인 다리를 조사한다.\n  ?+\n    VISUAL: 다리는 용접 이음매가 아니라 부재 중간에서 부러졌다. 하지만 이건 결과다. 원인은 위에 있었다. 크레인이 쓰러진 방향과 다리의 뒤틀림을 보면, 붕괴는 지브에서 시작됐다. 인양 중에 무언가 끊어졌고, 하중이 갑자기 한쪽으로 쏠렸고, 구조 전체가 그 방향으로 넘어졌다.\n    VISUAL: 운전자가 레버를 잘못 당겨서 이런 붕괴가 일어나려면, 25톤짜리 컨테이너를 들고 지브를 최대 속도로 돌려야 한다. 30년 경력의 운전자가 그렇게 할 리는 없다. 끊어진 건 케이블이다. 거의 확실하다.\n    ~ crane4_cable = 1\n    ~ crane4_known = 1\n    ~ thought metal_fatigue\n    ~ xp 10\n  ?-\n    VISUAL: 부러진 쇠. 녹. 무언가가 무너졌다. 무엇이 먼저였는지는 알 수 없다. 금속은 입을 다물었다.\n+ 물러선다. -> END\n\n// ───────── 크레인 운전실로 ─────────\n\n=== crane_cab\n크레인 다리 하나에 철제 사다리가 붙어 있다. 수직으로, 32미터. 중간중간 쉼판이 있고, 맨 위에 운전실 문이 있다. 사다리 가로대는 녹슬었고 갈매기 똥으로 미끄럽다.\n{!simon_agrees} HALFLIGHT[8]: 올라가겠다고? 직접? 저 높이를? 크레인을 움직인 적도 없으면서? 기억이 없으니 움직인 적이 있는지도 모르겠지만.\n{simon_agrees} 시몬이 이미 운전실에 올라가 있다. 창문 너머로 그가 손짓한다. 준비됐다고.\n+ {simon_agrees} 시몬에게 신호를 보낸다. 내리라고. -> crane_   load("09_dogs_simon_bobo.tl", "// ─────────────────────────────────────────────\n// 09. 일곱 번째 부두의 개들, 크레인 기사 시몬, 꼬마 보보\n// ─────────────────────────────────────────────\n\n=== dogs_hub\n{first} 크레인 다리 옆, 구멍 뚫린 드럼통 안에서 판자 조각이 탄다. 그 둘레에 남자 넷이 서 있다. 손을 불에 쬐고, 담배를 돌려 피우고, 가끔 생각난 듯 구호를 외친다. 뒤에는 손으로 쓴 피켓들이 크레인 다리에 기대 서 있다. \"우리는 잊지 않는다\". \"여섯 명의 이름을 기억하라\". \"케이블은 거짓말하지 않는다\".\n{first} 가장 큰 남자가 불가에서 몸을 돌린다. 황소 같다. 대머리에 굵은 목, 찢어진 노조 작업복이 어깨에서 터질 듯하다. 그런데 눈은 이상하게 순하다. 젖은 소의 눈.\n{first} MATEO: 경찰.\n{first} 그 한마디에 나머지 셋이 움직인다. 콧수염을 기르고 귀에 연필을 꽂은 마른 남자, 손가락 하나가 없는 불안한 눈의 남자, 곱슬머리에 졸린 눈을 한 청년. 넷이 벽처럼 선다. 당신과 크레인 사이에.\n{first} MATEO: 여기 볼일 없어. 위원장님 명령이야. 아무도 크레인에 손 못 대.\n{!first} 드럼통 불가의 네 남자가 당신을 본다. 반기지도 않고, 쫓아내지도 않는다.\n* {!dogs_named} \"당신들은 누구요?\"\n  ALONSO: 우리는 개들이오. 부두의 개들.\n  콧수염의 남자가 귀의 연필을 빼서 공중에 원을 그린다. 낭송하듯이.\n  ALONSO: 일곱 번째 부두의 개들. 짖고, 지키고, 물고, 가끔 핥지. 나는 알론소. 사람들은 시인이라고 부르오. 저 덩치는 마테오, 황소. 저 아홉 손가락은 페페. 저 졸린 놈은 라우로.\n  LAURO: (하품하며) 안녕하세요.\n  PEPE: 이름 알려 주지 마, 알론소! 경찰이 수첩에 적는다고!\n  {met_yun} 윤 경위가 수첩에 적는다. 네 개의 이름. 페페가 신음한다.\n  ~ dogs_named = 1\n  ~ mateo_named = 1\n* {!body_down} \"저 남자를 내려야 하오.\" -> dogs_block\n* \"파업에 대해 말해 주시오.\" -> dogs_strike\n* {dogs_named} 황소 마테오와 이야기한다. -> mateo_talk\n* {dogs_named} 시인 알론소와 이야기한다. -> alonso_talk\n* {dogs_named} 아홉 손가락 페페와 이야기한다. -> pepe_talk\n* {dogs_named} 졸린 라우로와 이야기한다. -> lauro_talk\n* {autopsy_done && (postmortem_rope || found_bullet) && !dogs_confessed} \"크레인의 남자에 대해 할 말이 있을 텐데.\" -> dogs_confront\n+ 물러난다. -> END\n\n=== dogs_block\nMATEO: 안 돼.\nMATEO: 크레인은 노조 거야. 파업 중엔 아무도 못 움직여. 저 사람도 파업이 끝날 때까지 거기 있어.\nPEPE: 저놈은 회사 첩자야! 4번 크레인을 망가뜨린 놈이라고! 거기 매달려 있는 게 딱이야!\n{met_yun} YUN: 시신을 나흘 동안 방치하는 건 공중위생법 위반이에요. 그리고 그 사람이 누구든, 가족이 있을 거예요.\n{met_yun} MATEO: ……\n{met_yun} 황소의 순한 눈이 흔들린다. 잠깐.\n* [AUTHORITY 13] \"비켜라. 경비대 수사다.\" -> dogs_block_auth_ok | dogs_block_auth_fail\n* \"누구 허락을 받아야 하오?\"\n  MATEO: 위원장님. 로사 이바라. 통조림 공장에 계셔. 위원장님이 된다고 하면 돼. 안 된다고 하면 안 되고.\n  ALONSO: 이 부두에서 \"된다\"와 \"안 된다\"는 한 입에서 나오오. 주름진 입.\n  ~ rosa_needed +\n    황소의 어깨가 무너진다. 그는 드럼통 불을 오래 본다.\n    MATEO: 가벼웠어.\n    MATEO: 이상하게 가벼웠어. 저렇게 큰 사람이. 영혼이 먼저 떠난 것처럼. 나는 그 사람 머리 쪽을 들었어. 그 사람 머리가 내 팔에 기대 있었어. 안경이 없었어. 눈을 뜨고 있었어.\n    MATEO: 나는 그 사람 이름도 몰라. 그런데 그 사람 머리 무게는 알아.\n    그가 손등으로 눈을 문지른다. 그리고 동료들을 본다. 아무도 못 봤다는 듯이.\n    ~ mateo_cried = 1\n    ~ xp 10\n  ?-\n    MATEO: 무슨 소리야. 꺼져.\n-\n-> dogs_hub\n\n=== alonso_talk\nALONSO: 시가 필요하오, 경찰 양반?\n* \"파업 시를 한 수 읊어 주시오.\"\n  그가 연필을 귀에서 빼서 지휘봉처럼 든다.\n  ALONSO: *크레인이 멈추면 바다가 말을 한다. / 바다는 말한다, 너희는 짐이 아니라고. / 너희는 짐을 드는 손이라고. / 손이 멈추면 세상이 멈춘다고. / 세상이 멈추면, 드디어, 세상이 너희를 본다고.*\n  PEPE: 좋다! 좋아!\n  LAURO: (하품) 좋아요.\n  CONCEPT[9]: 나쁘지 않다. 운율은 엉성하지만 이미지는 정확하다. \"손이 멈추면 세상이 멈춘다.\" 총파업의 본질을 한 줄에 담았다. 이 남자는 하역부로 태어난 시인이다. 혹은 시인으로 태어난 하역부.\n  ~ al_communard += 1\n* \"크레인의 남자에 대한 시는 없소?\"\n  알론소의 연필이 멈춘다. 그는 크레인 쪽을 본다. 오래.\n  ALONSO: ……있소. 어젯밤에 썼소. 아무한테도 안 읽어 줬소.\n  ALONSO: *구름 위 무도장에서 춤추던 이방인, / 새벽에 크레인의 팔에 안겼네. / 발 하나는 맨발, 하나는 춤추는 구두. / 그를 안아 준 건 바람뿐. / 바람은 그의 이름을 묻지 않았네.*\n  MATEO: 알론소.\n  황소의 목소리가 낮다. 경고다.\n  ALONSO: ……그냥 시요. 시는 거짓말이오. 다들 알잖소.\n  ~ alonso_poem = 1\n  * [CONCEPT 9] \"구름 위 무도장.\" 그 구절을 곱씹는다.\n    ?+\n      CONCEPT: 은유가 너무 구체적이다. \"구름 위의 무도장\". 시인들은 보통 하늘을 무도장이라고 부르지, 무도장을 구름 위에 놓지 않는다. 이건 은유가 아니다. 이건 장소다. 높은 곳에 있는 무도장. 지붕 위의 무도장.\n      LOGIC: 레테 무도장의 옥상.\n      ~ roof_scene_known = 1\n      ~ xp 10\n    ?-\n      CONCEPT: 구름 위의 무도장. 천국이라는 뜻인가? 진부하다. 이 시인은 조금 과대평가됐다.\n  * 박수를 친다.\n    ALONSO: 고맙소. 시인에게 박수는 빵보다 귀하오. 빵도 좋지만.\n  -\n-\n-> dogs_hub\n\n=== pepe_talk\nPEPE: 뭐. 뭐가 궁금해. 난 아무것도 몰라. 아니, 다 알아. 근데 말 안 해.\n* \"그 남자를 누가 죽였다고 생각하오?\"\n  PEPE: 회사! 회사가 죽였어! 자기네 첩자를 죽이고 우리한테 뒤집어씌우려고! 그날 밤 저 회색 배에서 보트가 나왔어. 불빛을 봤어. 내 눈으로!\n  PEPE: ……아니, 우리가 죽였어. 첩자니까. 아니, 회사가. 둘 다일 수도 있어. 음모는 겹쳐 있어. 양파처럼.\n  DRAMA[9]: 나리, 이 자는 진실과 거짓을 섞어서 휘젓고 있사옵니다. 무엇이 진실인지 본인도 헷갈리게 하려는 것이옵니다. 아니면 정말로 헷갈리는 것이옵니다.\n  ~ pepe_boat = 1\n* \"손가락은 어떻게 된 거요?\"\n  PEPE: 이거? 10년 전. 윈치 체인에 끼었어. 윈치 브레이크가 고장 난 지 두 달째였어. 세 번 보고했어. 회사가 \"점검 완료\"라고 적었어. 점검은 안 하고.\n  PEPE: 그래서 나는 음모를 믿어. 회사는 늘 거짓말을 적어. 서류에. 서류는 거짓말을 좋아해.\n  EMPATHY[8]: 그의 음모론은 병이 아니라 상처다. 한 번 서류에 속은 손가락이 모든 서류를 의심한다.\n  ~ crane4_logs_rumor = 1\n* \"썰물에 대해 아는 게 있소?\"\n  PEPE: 협약이 하는 거야. 세상 가장자리를 말려서 땅을 넓히는 거지. 간척 사업. 그리고 그 땅을 회사들한테 팔아. 증거? 증거는 없어. 증거가 없다는 게 증거야.\n  PEPE: 그리고 방파제의 그 늙은이가 찾는 왜가리. 그것도 협약 거야. 감시용. 날개 달린 첩자.\n  LOGIC: 이 대화에서 얻을 수 있는 정보: 0. 오락적 가치: 상당함.\n-\n-> dogs_hub\n\n=== lauro_talk\n라우로가 하품을 한다. 스무 살쯤. 곱슬머리, 여드름 자국, 꾸벅꾸벅 조는 눈. 드럼통 불가에서 서서 자는 법을 익힌 사람.\nLAURO: 네에?\n* \"피곤해 보이는군.\"\n  LAURO: 야간조였어요. 파업 전엔. 밤에 짐 내리고 낮에 자고. 지금은 밤에 피켓 서고 낮에 피켓 서요. 잘 시간이 없어요.\n  LAURO: 그리고 요즘은 잠이 잘 안 와요.\n* {!lauro_slip} [SUGGESTION 9] \"닷새 전 밤도 야간이었겠군. 힘들었지. 많이 옮겼소?\"\n  ?+\n    LAURO: 말도 마요. 무겁고, 계단은 좁고, 녹슬어서 미끄럽고. 레테 뒤 비상계단은 원래……\n    그의 입이 멈춘다. 졸린 눈이 갑자기 크게 떠진다.\n    LAURO: ……원래…… 짐 옮기는 계단이 아니잖아요. 그러니까 아무 계단이나요. 부두의. 부두 계단.\n    마테오가 불 너머에서 라우로를 본다. 라우로가 입을 다문다.\n    LOGIC: \"레테 뒤 비상계단.\" 시신은 레테 무도장 뒤 비상계단으로 옮겨졌다. 비상계단은 옥상으로 이어진다.\n    ~ lauro_slip = 1\n    ~ roof_scene_known = 1\n    ~ xp 15\n  ?-\n    LAURO: 옮기다니요? 뭘요? 우리 파업 중인데요.\n    그가 하품을 한다. 너무 크게. 연기다.\n* \"잠이 안 온다니, 왜지?\"\n  LAURO: 그냥요.\n  그가 크레인 쪽을 본다. 그리고 재빨리 눈을 돌린다.\n  LAURO: 꿈을 꿔요. 누가 자꾸 제 이름을 물어봐요. 모르는 사람이. 안경 쓴.\n  EMPATHY: 이 청년은 무언가를 했다. 그리고 그 무언가가 매일 밤 그를 찾아온다.\n-\n-> dogs_hub\n\n=== dogs_confront\n당신은 드럼통 불가로 다가간다. 네 남자가 당신을 본다.\n당신은 말한다. 크레인의 남자는 매달리기 전에 이미 죽어 있었다고.\n{postmortem_rope} 목의 밧줄 자국에 멍이 없었다고. 살아 있는 사람을 매달면 반드시 생기는 피하출혈이.\n{found_bullet} 그리고 그의 가슴에 총알이 박혀 있었다고.\n불이 탁탁 튄다. 아무도 말하지 않는다. 라우로가 마테오를 본다. 페페가 알론소를 본다. 알론소가 하늘을 본다. 마테오는 불을 본다.\nMATEO: ……그래.\nMATEO: 우리가 했어.\n그가 고개를 든다. 눈이 붉다. 불빛 때문일 수도 있다.\nMATEO: 우리가 매달았어. 회사 첩자. 4번 크레인을 망가뜨린 놈. 그날 새벽에 7번 크레인 근처에서 렌치를 들고 얼쩡거리는 걸 잡았어. 사보타주하려고. 그래서 우리가…… 정의를 실현했어. 여섯 명을 위해.\nPEPE: 맞아! 정의! 인민의 정의!\n~ dogs_confessed = 1\n* [LOGIC 9] \"렌치를 들고 크레인 근처에 있었다고? 그는 탱고 구두를 신고 있었소. 한 짝은 맨발이고.\"\n  ?+\n    LOGIC: 탱고 구두는 밑창이 가죽이다. 얇고, 미끄럽다. 크레인 사다리를 오르거나 부두의 기름 묻은 콘크리트를 걷기엔 최악의 신발이다. 사보타주하러 가는 사람은 탱고 구두를 신지 않는다. 춤추러 가는 사람이 신는다.\n    당신이 그렇게 말한다.\n    PEPE: 그, 그건…… 위장이야! 춤추는 척하려고!\n    ALONSO: 페페.\n    ~ dogs_lie1 = 1\n  ?-\n    LOGIC: 렌치. 사보타주. 음. 말이 되는 것 같기도 하다. 회사 첩자라면 그럴 수도.\n* [DRAMA 10] 그들의 얼굴을 읽는다.\n  ?+\n    DRAMA: 나리, 이것은 연극이옵니다. 그것도 연습한 연극. 대사가 너무 매끄럽사옵니다. \"정의를 실현했어. 여섯 명을 위해.\" 누군가 이 대사를 써 주었사옵니다. 그리고 황소는 자기 대사를 싫어하옵니다.\n    ~ dogs_lie2 = 1\n  ?-\n    DRAMA: 흠. 분노. 슬픔. 정의감. 그럴듯하옵니다. 저들은 진심일지도 모르옵니다.\n-\n{found_bullet} * \"그는 총에 맞았소. 경비대 탄이었소. 당신들 총이 있소?\"\n  LAURO: 총이요? 우리 총 없……\n  MATEO: 라우로!\n  라우로가 입을 다문다.\n  ALONSO: ……우리가 먼저 쐈소. 고통 없게 하려고. 자비로.\n  PEPE: 무슨 총으로? 우리한테 총이 어디……\n  ALONSO: 페페, 제발.\n  그들이 서로를 본다. 대본에 없는 장면에 들어선 배우들처럼.\n  ~ dogs_lie3 = 1\n* \"누구를 감싸고 있는 거요?\"\n  MATEO: 아무도.\n  MATEO: 우리가 했어. 그게 다야.\n-\nMATEO: 더 할 말 없어. 알고 싶으면 위원장님한테 가.\n그가 등을 돌린다. 나머지 셋도. 드럼통 불이 네 개의 등을 비춘다.\n{dogs_lie1 || dogs_lie2 || dogs_lie3} LOGIC: 그들은 매달았다. 그건 사실이다. 그러나 죽이지는 않았다. 그들은 누군가를 감싸고 있다. 누군가, 혹은 무언가를. 그리고 그 대본을 쓴 사람은 통조림 공장에 있다.\n{dogs_lie1 || dogs_lie2 || dogs_lie3} ~ dogs_lie_exposed = 1\n~ xp 20\n-> END\n\n// ─────────────────────────────────────────────\n// 시몬 \"갈매기\" — 크레인 기사\n// ─────────────────────────────────────────────\n\n=== simon_hub\n{first} 크레인 다리 옆에 붙은 양철 초소. 문에 페인트로 \"7\"이라고 적혀 있다. 당신이 문을 두드리기도 전에 안에서 쉰 목소리가 들린다.\n{first} SIMON: 꺼져.\n{first} 잠시 뒤.\n{first} SIMON: ……아니, 들어와. 문 닫고. 바람 들어와.\n{first} 안은 좁다. 무쇠 난로, 야전 침대, 창문 하나. 창문은 크레인을 향해 나 있다. 바닥에 빈 병이 굴러다닌다. 난로 옆 의자에 늙은 남자가 앉아 있다. 예순쯤. 마르고, 뾰족한 매부리코, 하얀 수염, 기름에 전 작업복, 털실 모자. 갈매기를 닮았다. 그래서 갈매기다.\n{first} 그는 창문 너머 크레인을 보고 있다. 병을 들고. 당신을 보지 않는다.\n{first} ~ simon_named = 1\n{!first && !simon_agrees} 시몬은 여전히 창가에 앉아 크레인을 본다. 병이 조금 더 비었다.\n{!first && simon_agrees} 시몬은 난로에 불을 지피고 있다. 병은 치웠다. 손이 떨린다. 그래도 불을 지핀다.\n* \"당신이 크레인 기사요?\"\n  SIMON: 40년. 7번은 내 여자야. 40년 동안 매일 아침 저 여자한테 올라가서 인사했어. 좋은 아침이야, 예쁜이. 오늘도 잘 부탁해.\n  SIMON: 파업하고 나서 3주 동안 못 올라갔어. 그리고 닷새 전에……\n  그는 말을 멈춘다. 병을 기울인다.\n* {!rosa_permission && !body_down} \"크레인을 움직여 주시오. 저 남자를 내려야 하오.\"\n  SIMON: 위원장님 말씀 없이는 안 돼. 파업 중이야. 나는 노조원이야. 40년.\n  ~ rosa_needed = 1\n* {rosa_permission && !simon_agrees && !body_down} \"로사가 허락했소. 크레인을 움직여 주시오.\" -> simon_persuade\n* {!c   load("10_cannery.tl", "// ─────────────────────────────────────────────\n// 10. 통조림 공장 — 붉은 닻 노조 본부, 로사 이바라\n// ─────────────────────────────────────────────\n\n=== cannery @location name=\"솔레아 제1통조림 공장 · 붉은 닻 본부\" art=cannery travel=4\n{first} 정문은 쇠사슬로 감겨 있다. 사슬에 매달린 판자에 \"파업 중 — 출입은 뒷문으로\". 뒷문을 지나면 거대한 공간이 열린다.\n{first} 높은 천장, 녹슨 철골 트러스, 기름때 낀 천창. 한가운데를 컨베이어 벨트 세 줄이 가로지른다. 멈춘 지 3주. 벨트 위에 빈 깡통들이 그대로 줄지어 서 있다. 행진하다 얼어붙은 병사들처럼.\n{first} 그 사이사이에 사람들이 있다. 여공 수십 명이 컨베이어 옆 긴 의자에 앉아 피켓을 칠하고, 뜨개질을 하고, 아이들을 달랜다. 한쪽 구석에서는 커다란 솥에서 생선 수프가 끓는다. 줄을 선 사람들. 하역부들, 그들의 아내들, 아이들. 벽에는 칠판과 붉은 깃발, 그리고 목탄으로 그린 젊은 남자의 초상화.\n{first} 그리고 공장 한쪽 벽의 중간 높이에, 철계단으로 올라가는 유리 상자가 있다. 옛 작업반장실. 유리창 너머에 스탠드 불빛. 그 안에 누군가 앉아 있다. 아래의 모든 것을 내려다보며.\n{first} SHIVERS[9]: 공장이 숨을 죽이고 있다. 기계들은 멈췄지만, 여기가 솔레아에서 가장 살아 있는 곳이다. 모든 싸움이 여기서 계산된다. 모든 빵이 여기서 나눠진다.\n{!first} 통조림 공장. 멈춘 컨베이어, 뜨개질하는 여공들, 끓는 수프. 유리 상자 속의 스탠드 불빛.\n+ 철계단을 올라 유리 사무실로 간다. -> rosa_hub\n+ 뜨개질하는 여공들에게 간다. -> workers_talk\n+ {soup_day != day} 수프 솥 앞의 줄에 선다. -> cannery_soup\n+ 벽의 칠판을 본다. -> cannery_board\n+ 붉은 깃발과 초상화를 본다. -> cannery_portrait\n+ {met_yun} 윤 경위와 이야기한다. -> yun_hub\n+ 뒷문으로 나가 부두 거리로 간다. => quay 4\n\n// ───────── 여공들 ─────────\n\n=== workers_talk\n긴 의자에 여자들이 줄지어 앉아 있다. 스무 살부터 일흔 살까지. 손이 쉬지 않는다. 뜨개바늘, 붓, 아기 포대기. 손끝이 모두 거칠다. 생선 소금과 칼에 쓸린 손.\n{first} WORKER: 어머, 경찰이네. 대통령 아저씨.\n{first} WORKER: 무도장에서 시 읊어 주던 아저씨잖아. \"그대의 손은 정어리처럼 은빛으로 빛나고……\" 그거 시야, 욕이야?\n{first} 여자들이 웃는다. 당신은 그 시를 기억하지 못한다. 다행이다.\n* \"파업은 어떻소?\"\n  WORKER: 어떻긴. 배고프지. 그래도 버텨. 위원장님이 버티라니까.\n  WORKER: 3주째 월급이 없어. 기금에서 수프 나오고, 빵 조금 나오고. 애들은 괜찮아. 어른들이 덜 먹으면 돼.\n  WORKER: 근데 기금이 바닥이래. 칠판 봐 봐. 며칠 안 남았어. 그다음엔…… 몰라. 위원장님이 뭔가 생각이 있겠지.\n  ~ fund_low = 1\n* \"로사 이바라는 어떤 사람이오?\"\n  WORKER: 위원장님? 무서운 분이지. 그리고 우리 엄마 같은 분.\n  WORKER: 우리 할머니가 코뮌 때 위원장님이랑 같이 정어리 대가리를 쳤대. 위원장님이 제일 빨랐대. 1초에 하나. 지금도 뜨개질 속도 봐 봐. 무서워.\n  WORKER: 토마스 아저씨 장례식 때도 안 우셨어. 뜨개질만 하셨어. 관 옆에서. 그게 더 무서웠어.\n* {ines_heard || ines_known} \"이네스를 아시오?\"\n  여자들이 서로를 본다. 한 여자가 뜨개바늘을 멈춘다.\n  WORKER: 이네스? 알지. 어릴 때부터 여기서 컸어. 엄마가 일찍 가서 위원장님이 키웠어. 여기 공장 바닥에서. 컨베이어 밑에서 낮잠 자고.\n  WORKER: 요즘 누구 만나는 것 같았어. 일요일 공장 춤 모임에 안 나오고. 우리가 놀렸지. \"누구야, 누구야?\" 그랬더니 얼굴이 새빨개져서 그러더라. \"말하면 너희가 날 죽일 거야.\" 그래서 우린 회사 놈인 줄 알았어. 농담으로.\n  WORKER: ……농담이었는데.\n  그녀의 손이 뜨개바늘 위에서 멈춰 있다.\n  ~ ines_heard = 1\n  ~ ines_secret_lover = 1\n* {bobo_heard || bobo_met} \"보보는?\"\n  WORKER: 그 꼬마 악마? 요 며칠 집에 안 들어간대. 벌집 할머니들이 그러더라. 밤에 어디서 자는지 몰라. 자기 \"본부\"에서 잔대. 해적 본부.\n  WORKER: 아빠 잃고 누나도 없고. 불쌍하지. 위원장님이 챙기시는데, 위원장님은 바쁘시니까.\n  ~ bobo_sleeps_out = 1\n* \"크레인의 남자에 대해선?\"\n  공장 안이 조금 조용해진다. 옆자리의 여자들까지.\n  WORKER: 우린 몰라. 남자들 일이야.\n  WORKER: ……근데 그 사람, 한 번 여기 왔었어. 공장에. 3주 전쯤. 위원장님 만나러. 키 크고 안경 쓴 사람. 모자를 벗고 들어왔어. 회사 사람들은 절대 모자 안 벗거든.\n  WORKER: 위원장님 사무실에서 한 시간쯤 있다 갔어. 나올 때 위원장님이 처음으로 창문 밖을 내다보셨어. 그 사람 뒷모습을.\n  LOGIC: 피해자는 로사를 만났다. 3주 전. 솔레아에 도착하자마자.\n  ~ victim_met_rosa = 1\n-\n-> END\n\n=== cannery_soup\n솥 앞에 선 늙은 여자가 국자를 든다. 당신을 위아래로 본다.\nWORKER: 경찰도 배고프면 먹어. 여기선 배고픈 사람은 다 먹어. 협약 놈만 빼고.\n그녀가 양철 그릇에 수프를 떠 준다. 생선 뼈, 감자, 양파, 그리고 무언가 붉은 것. 뜨겁다.\n당신은 긴 의자 끝에 앉아 먹는다. 아이 하나가 당신 옆에 앉아 당신을 빤히 본다. 콧수염을.\nENDURANCE: 이거다. 이게 몸이 원하던 거다. 럼이 아니라.\n~ health +1\n~ morale +1\n~ soup_day = day\n~ time +15\n{met_yun} 윤 경위도 한 그릇을 받는다. 그녀는 줄 맨 끝에 서서 받았다. 먹기 전에 늙은 여자에게 고개를 숙인다. 그리고 가람식으로 두 손으로 그릇을 든다.\n-> END\n\n=== cannery_board\n칠판에 분필로 적힌 숫자들. 누군가 매일 지우고 다시 쓴다.\n**붉은 닻 파업 기금 — 남은 금액: 312솔도. 하루 소요: 94솔도.**\n그 밑에 작은 글씨로. \"수프: 400인분. 빵: 200개. 약값: 산모 셋, 노인 일곱.\"\n그 밑에 누군가 크게 적어 놓았다. \"버텨라!\"\nLOGIC: 312를 94로 나누면 3.3. 사흘. 사흘 뒤 이 공장의 솥이 빈다.\nLOGIC: 로사는 이 숫자를 매일 본다. 그녀에게는 사흘이 남았다. 사흘 안에 무언가를 해야 한다. 회사가 굴복하거나, 노조가 굴복하거나, 아니면 무언가 다른 것.\n{rosa_deal_rumor} LOGIC: 그레고르가 말한 한밤중의 협상. 이제 이해가 된다.\n~ fund_low = 1\n~ fund_board_seen = 1\n-> END\n\n=== cannery_portrait\n벽에 붉은 깃발이 걸려 있다. 빛바랜 붉은 비단, 가장자리가 해졌다. 가운데에 파도 위의 등불, 그 밑에 금실로 수놓은 글씨. \"우리는 잊지 않는다.\" 비단에 작은 구멍들이 뚫려 있다. 총알 구멍이다.\n깃발 옆에 목탄 초상화. 서른 살쯤 된 남자. 두꺼운 콧수염, 헝클어진 머리, 웃는 눈. 입이 반쯤 열려 있다. 무언가를 말하다가, 혹은 노래하다가 그려진 것처럼. 밑에 \"바르톨로메 이바라, 1주년 인민 무도회에서\".\nENCYCLOPEDIA[9]: 바르톨로메 이바라. 코뮌 부두 위원회 조직가. 아홉 날의 포격 때 부두 바리케이드를 지휘했다. 포로가 된 뒤 조수 요새에서 총살. 스물아홉 살. 그의 마지막 말은 기록되지 않았다. 기록할 사람이 남지 않았으니까.\n{rosa_history} EMPATHY: 이 남자가 로사의 남편이다. 로사는 매일 이 초상화 밑을 지나 유리 상자로 올라간다. 46년 동안.\n* <CONCEPT 9> 초상화를 그린 솜씨를 본다.\n  CONCEPT: 빠른 선이다. 5분쯤 걸렸을 것이다. 무도회장 구석에서, 춤추다 쉬는 사람을 누군가 몰래 그렸다. 그래서 살아 있다. 동상은 이런 걸 못 한다.\n  CONCEPT: 오른쪽 아래 구석에 서명이 있다. 아주 작게. \"E.S.\" 에르난 소토. 시인이 그림도 그렸다.\n* 깃발의 총알 구멍을 센다.\n  열한 개. 당신은 세다가 멈춘다. 몇 개인지가 중요한 게 아니다.\n  VOLITION: 이 깃발을 들고 있던 사람들이 있었다. 이 구멍들은 그 사람들을 지나서 여기 왔다.\n-\n~ thought tide_ghost\n-> END\n\n// ───────── 로사 이바라 ─────────\n\n=== rosa_hub\n{!rosa_met} -> rosa_first\n{rosa_final_ready} -> rosa_final_intro\n{!first} 로사는 뜨개질을 멈추지 않는다. 바늘 두 개가 딸각거린다. 붉은 실이 그녀의 무릎에서 바닥까지 흘러내린다.\n{!first} ROSA: 또 왔는가, 형사 양반.\n* {!body_down && !rosa_permission} \"크레인의 시신을 내려야겠소.\" -> rosa_permission_talk\n* {has.sealed_letter && active.t_rosa_letter} \"편지 말인데.\" -> rosa_letter_talk\n* \"그 남자는 누구였소?\" -> rosa_who\n* \"4번 크레인 사고에 대해 말해 주시오.\" -> rosa_crane4\n* {rosa_history} \"당신 남편 이야기를 들었소.\" -> rosa_husband\n* {ines_heard || ines_known} \"이네스는 어디 있소?\" -> rosa_ines\n* {bobo_met || bobo_heard} \"보보에 대해 묻고 싶소.\" -> rosa_bobo\n* {rosa_deal_rumor || letter_read} \"회사와 뒤에서 협상하고 있다던데.\" -> rosa_deal\n* {(postmortem_rope || found_bullet) && !rosa_dead_before} \"그 남자는 매달리기 전에 이미 죽어 있었소.\" -> rosa_dead_before_talk\n* \"코뮌에 대해 어떻게 생각하시오? 지금은.\" -> rosa_commune\n+ \"실례했소.\" -> END\n\n=== rosa_first\n~ rosa_met = 1\n~ rosa_named = 1\n철계단은 가파르고 좁다. 한 칸 오를 때마다 발밑의 공장이 조금씩 작아진다. 계단 끝, 유리 문. 문에 \"작업반장\"이라는 옛 글씨가 반쯤 벗겨져 있다. 그 위에 누군가 붉은 페인트로 \"위원회\"라고 덧썼다.\n{met_yun} 윤 경위가 계단 밑에서 멈춘다.\n{met_yun} YUN: 저는 여기 있을게요. 로사 이바라는 경찰 두 명보다 한 명을 더 잘 상대할 것 같아서요. 형사님이 그 한 명이에요.\n문 안은 좁다. 책상 하나, 전화기 하나, 서류 더미, 스탠드. 벽에는 부두 지도, 크레인 배치도, 날짜에 가위표를 친 달력. 창문 너머로 공장 바닥 전체가 내려다보인다. 컨베이어, 여공들, 수프 솥. 모든 것이.\n책상 뒤에 휠체어가 있다. 휠체어에 노부인이 앉아 있다.\n작다. 생각보다 훨씬 작다. 검은 숄을 두른 어깨가 새처럼 좁다. 강철색 머리는 뒤로 바짝 당겨 쪽을 쪘다. 얼굴은 주름이 깊다. 주름 하나하나가 결정의 흔적처럼 보인다. 무릎 위에서 붉은 뜨개질감이 자라고 있고, 손가락이 바늘을 움직인다. 쉬지 않고. 딸각, 딸각, 딸각.\n그녀가 당신을 본다. 눈은 검고, 작고, 조금도 늙지 않았다.\nROSA: 밤의   load("11_autopsy.tl", "// ─────────────────────────────────────────────\n// 11. 검시 — 죽은 남자는 말을 한다\n// ─────────────────────────────────────────────\n\n=== autopsy_start\n부두 콘크리트 위, 나무 화물 운반대에 그가 누워 있다. 방수포가 가슴까지 덮여 있다. 목에는 아직 밧줄이 느슨하게 감겨 있다.\n{met_yun} 윤 경위가 그 옆에 무릎을 꿇는다. 장갑을 벗고 얇은 고무장갑을 낀다. 사이드카 트렁크에서 꺼낸 것이다. 수첩을 무릎에 펴고, 몽당연필을 든다.\n{met_yun} YUN: 검시를 시작하죠. 사르가 시립 병원 검시관은 이틀 뒤에나 올 수 있대요. 이틀이면 늦어요. 우리가 할 수 있는 걸 하죠. 제가 기록할게요.\n{met_yun} YUN: 형사님이 보세요. 저는 적을게요.\n{!met_yun} 당신은 혼자다. 누군가 기록할 사람이 있으면 좋을 텐데.\n하역부들이 멀찍이 떨어져 선다. 담배를 피우며, 보지 않는 척 본다. 갈매기들이 크레인 위에서 기다린다.\n{pass(ESPRIT, 10)} ESPRIT: 당신의 손이 먼저 움직인다. 소매를 걷고, 몸을 낮추고, 시신의 발치부터 머리까지 한 번 훑는다. 전체를 먼저. 세부는 나중에. 20년 동안 수백 번 한 동작이다. 손은 기억한다.\n-> autopsy_hub\n\n=== autopsy_revisit\n방수포 밑에 그가 누워 있다. {{autopsy_done ? \"검시는 끝났지만, 다시 볼 수 있다. 놓친 게 있을지도.\" : \"\"}}\n-> autopsy_hub\n\n=== autopsy_hub @noecho\n+ {!ap_rope} 목과 밧줄을 조사한다. -> ap_rope\n+ {ap_rope && !ap_wound} 셔츠 칼라 밑을 본다. -> ap_wound\n+ {ap_wound && !found_bullet} 가슴 속의 탄두를 꺼낸다. -> ap_bullet\n+ {!ap_clothes} 옷과 주머니를 뒤진다. -> ap_clothes\n+ {!ap_shoe} 한 짝 남은 구두를 본다. -> ap_shoe\n+ {!ap_hands} 손을 본다. -> ap_hands\n+ {!ap_face} 얼굴을 본다. -> ap_face\n+ {!ap_time} 사망 시각을 추정한다. -> ap_time\n+ {!corpse_talked} <INLAND 11> 죽은 남자에게 말을 건다. -> ap_corpse\n+ {!autopsy_done && ap_count >= 3} 검시를 마친다. -> ap_end\n+ {autopsy_done} 방수포를 다시 덮는다. -> END\n+ {!autopsy_done && ap_count < 3} 잠시 물러선다. -> END\n\n// ───────── 목과 밧줄 ─────────\n\n=== ap_rope\n~ ap_rope = 1\n~ ap_count += 1\n당신은 목의 밧줄을 살핀다. 황갈색 마닐라삼, 세 가닥 꼬임, 검은 타르가 배어 있다. 손가락으로 만지면 끈적하다.\n{pass(ENCYCLOPEDIA, 8)} ENCYCLOPEDIA: 계선줄이다. 배를 부두에 묶는 밧줄. 솔레아 부두 어디에나 있다. 크레인에는 쓰지 않는다. 크레인은 쇠 케이블을 쓴다.\n매듭은 목 오른쪽에 있다. 교수형 매듭, 그 열세 번 감은 올가미가 아니다. 고리 두 개가 겹친 단순하고 튼튼한 매듭.\n* [VISUAL 8] 매듭의 구조를 읽는다.\n  ?+\n    VISUAL: 쌍고리 보울라인. 선원들이 사람을 들어 올릴 때 쓰는 매듭이다. 조여들지 않는다. 구조대가 물에 빠진 사람을 끌어올릴 때 이 매듭을 쓴다. 목을 조르려는 사람은 이 매듭을 쓰지 않는다. 이건 올가미가 아니다. 들어 올리는 고리다.\n    VISUAL: 이 매듭을 맨 사람은 목을 매달려던 게 아니다. 짐을 들어 올리려던 것이다. 무거운 짐을. 그리고 이 매듭을 맨 사람은 뱃사람이다. 손이 기억할 만큼 수천 번 맨 사람.\n    ~ rope_known = 1\n  ?-\n    VISUAL: 복잡한 매듭이다. 교수형 매듭은 아니다. 음. 그 이상은 모르겠다. 매듭은 뱃사람들의 언어다.\n    {met_yun} YUN: 쌍고리 보울라인이에요. 해군에서 배웠어요. 사람을 들어 올릴 때 쓰는 매듭이에요. 목을 조르지 않아요.\n    {met_yun} ~ rope_known = 1\n-\n당신은 밧줄을 풀어 목에서 벗긴다. 그리고 밧줄이 파고들었던 자리를 본다.\n* [PERCEPTION 10] 밧줄 자국을 자세히 본다. -> ap_rope_mark_ok | ap_rope_mark_fail\n* [PAIN 9] 당신이 아는 멍의 언어로 읽는다. -> ap_rope_pain_ok | ap_rope_mark_fail\n\n=== ap_rope_mark_ok\n밧줄 자국은 깊다. 갈색으로 파인 홈이 목을 반쯤 감고 있다. 그런데 이상하다. 홈의 가장자리가 깨끗하다. 붉지도, 푸르지도 않다. 피부가 눌린 자국일 뿐, 그 밑에 피가 몰린 흔적이 없다.\nPERCEPTION: 살아 있는 사람이 목을 매이면 밧줄 밑의 모세혈관이 터진다. 피하출혈. 붉은 띠. 이 사람에겐 그게 없다.\nLOGIC: 결론. 이 사람은 밧줄에 매달렸을 때 이미 심장이 멎어 있었다. 목을 맨 게 아니다. 목에 걸린 것이다. 교수형은 연출이다.\n{met_yun} YUN: ……적었어요. \"밧줄 자국에 생활반응 없음. 사후 교수.\"\n{met_yun} 그녀의 연필이 한 번 멈춘다.\n{met_yun} YUN: 그럼 이 사람은 어떻게 죽었을까요.\n~ postmortem_rope = 1\n~ xp 15\n~ item add ev_rope\n그리고 당신은 셔츠 칼라를 본다. 칼라가 목 위로 바짝 세워져, 안쪽에서 옷핀으로 고정되어 있다. 누군가 칼라를 올려서 무언가를 가렸다.\n-> autopsy_hub\n\n=== ap_rope_pain_ok\n당신은 멍을 안다. 당신의 몸이 수십 개의 멍을 거쳐 왔다. 주먹의 멍, 계단의 멍, 문틀의 멍. 멍은 피가 말하는 방식이다. 살아 있는 몸만 멍이 든다.\nPAIN: 이 목에는 멍이 없다. 홈만 있다. 밧줄이 죽은 살을 눌렀을 뿐이다. 살아 있었다면 이 자리가 보랏빛으로 부풀었을 것이다. 이 사람은 밧줄이 목에 닿았을 때 이미 아무것도 느끼지 못했다.\nPAIN: 부럽다. 조금.\n{met_yun} YUN: 생활반응 없음. 사후 교수. ……적었어요.\n~ postmortem_rope = 1\n~ xp 15\n~ item add ev_rope\n그리고 당신은 셔츠 칼라를 본다. 칼라가 목 위로 바짝 세워져, 안쪽에서 옷핀으로 고정되어 있다. 누군가 칼라를 올려서 무언가를 가렸다.\n-> autopsy_hub\n\n=== ap_rope_mark_fail\n밧줄 자국은 깊다. 갈색 홈. 목을 반쯤 감았다. 목을 맨 자국이다. 당연하게도.\n{met_yun} YUN: 잠깐만요.\n{met_yun} 그녀가 고무장갑 낀 손가락으로 홈의 가장자리를 가리킨다.\n{met_yun} YUN: 피하출혈이 없어요. 살아 있는 사람이 매달리면 여기가 붉게 부어올라야 해요. 교범 43쪽. 생활반응. 이 사람은 매달리기 전에 죽어 있었어요.\n{met_yun} ~ postmortem_rope = 1\n{met_yun} ~ yun_trust += 1\n{!met_yun} 무언가 이상한 것 같지만, 무엇이 이상한지 모르겠다. 머리가 아프다.\n~ item add ev_rope\n그리고 당신은 셔츠 칼라를 본다. 칼라가 목 위로 바짝 세워져, 안쪽에서 옷핀으로 고정되어 있다.\n-> autopsy_hub\n\n// ───────── 상처 ─────────\n\n=== ap_wound\n~ ap_wound = 1\n~ ap_count += 1\n당신은 옷핀을 뽑고 칼라를 내린다.\n왼쪽 쇄골 바로 위. 목이 어깨로 이어지는 움푹한 자리에 작고 둥근 구멍이 있다. 지름 8밀리미터쯤. 가장자리가 검게 그을렸고, 그 둘레로 피가 말라붙어 셔츠 안쪽을 갈색으로 물   load("12_hotel.tl", "// ─────────────────────────────────────────────\n// 12. 그랜드 메리디안 호텔 — 언덕 위의 협약\n// ─────────────────────────────────────────────\n\n=== hotel @location name=\"그랜드 메리디안 호텔 로비\" art=hotel travel=15\n{first} 언덕 꼭대기, 솔레아의 지붕들이 끝나는 곳에 호텔이 서 있다. 흰 대리석 정면, 금박 글씨, 회전문. 왕관 시대의 마지막 영광. 지금은 협약 사람들이 묵는 곳이다. 은행가, 해운 대리인, 보험 조사관, 영사관 직원. 언덕 아래 부두의 비린내는 여기까지 올라오지 않는다. 올라오지 못하게 설계되었다.\n{first} 회전문을 밀고 들어가자 공기가 바뀐다. 따뜻하고, 건조하고, 백합과 가구 광택제 냄새가 난다. 대리석 바닥이 거울처럼 빛나고, 그 위에 당신의 나팔바지가 비친다. 기둥 사이에 야자수 화분. 머리 위에는 거대한 샹들리에. 이 샹들리에에는 구두가 걸려 있지 않다.\n{first} COMPOSURE: 우리는 지금 여기 어울리지 않는다. 모두가 그걸 알아. 저 도어맨도, 저 소파의 노부인도, 저 야자수도.\n{first} 프런트 데스크 뒤에 남자가 서 있다. 대머리, 연필로 그은 듯한 콧수염, 목까지 채운 검은 연미복. 그는 당신이 회전문을 통과하는 순간부터 당신을 보고 있었다. 그의 눈이 앵무새 셔츠에 머문다. 아주 짧게. 아주 많이.\n{!first} 그랜드 메리디안의 로비. 대리석, 야자수, 샹들리에, 백합. 프런트의 무슈 필롱이 당신을 보고 아주 미세하게 한숨을 쉰다.\n+ 프런트의 컨시어지에게 간다. -> pilon_hub\n+ 유리 온실, 겨울 정원으로 간다. -> kruyf_hub\n+ 호텔 바 \"나침반 장미\"에 들어간다. -> rasmus_hub\n+ {has.hotel_key} 계단을 올라 305호로 간다. -> hotel_to_305\n+ {met_yun} 윤 경위와 이야기한다. -> yun_hub\n+ 언덕을 걸어 내려가 부두 거리로 간다. => quay 15\n+ {met_yun} 윤 경위의 사이드카로 부두 거리까지 내려간다. => quay 6\n\n=== hotel_to_305\n{pilon_allowed_305} -> hotel_up\n{!pilon_allowed_305} 당신이 계단 쪽으로 세 걸음쯤 갔을 때, 등 뒤에서 목소리가 당신을 멈춘다. 부드럽고, 정확하고, 무엇도 만지지 않는 목소리.\n{!pilon_allowed_305} PILON: 무슈. 실례합니다만, 투숙객이 아니신 분은 객실 층에 올라가실 수 없습니다.\n{!pilon_allowed_305} ~ pilon_named = 1\n{!pilon_allowed_305} -> pilon_305\n\n=== hotel_up\n붉은 카펫이 깔린 계단을 오른다. 2층, 3층. 복도는 조용하다. 벽에는 옛 사르가 함대의 그림들. 300호, 301호, 303호. 305호. 문고리에 \"방해하지 마시오\" 팻말이 걸려 있다. 닷새 동안 아무도 그 말을 어기지 않았다.\n=> room305 1\n\n// ─────────────────────────────────────────────\n// 무슈 필롱 — 컨시어지\n// ─────────────────────────────────────────────\n\n=== pilon_hub\n~ pilon_named = 1\n{first} PILON: 그랜드 메리디안에 오신 것을 환영합니다, 무슈. 무엇을 도와드릴까요.\n{first} 그의 목소리는 비단 장갑이다. 그의 눈은 그 장갑 속의 칼이다. 그 눈이 당신을 위에서 아래로 훑는다. 콧수염, 앵무새, 체크무늬, 구두.\n{first} PILON: 저희 호텔의 복장 규정을 알려 드려야 할 것 같군요. 앵무새는 동반 불가입니다. 셔츠에 그려진 것이라도.\n{!first} PILON: 또 오셨군요, 무슈. 앵무새들도 함께.\n* \"경비대요. t += 1\n~ rasmus_listens = 1\n-> rasmus_hub\n\n=== rasmus_plead_fail\nRASMUS: 매단 것도 범죄요. 협약 시민의 시신을 모욕하고, 나흘 동안 전시했소. 그것만으로도 충분하오.\nRASMUS: 그리고 매단 놈들은 누가 죽였는지 알 거요. 그들을 데려가면 알게 되겠지.\n-> rasmus_hub\n\n=== rasmus_self\nRASMUS: 협약 북해안의 어촌 출신이오. 아버지는 청어잡이. 열여섯에 해병대에 들어갔소. 24년. 두 번의 전쟁과 여섯 번의 \"치안 유지 작전\". 대위로 전역했소. 연금으로는 살 수 없어서 이 일을 하오.\nRASMUS: 사르가에도 왔었소. 젊을 때. 해병대로. 코뮌이 무너지고 10년쯤 뒤, 부두 폭동 때. 우리는 하역부들을 곤봉으로 때렸소. 명령이었으니까.\n그가 흉터를 만진다.\nRASMUS: 이건 그때 생겼소. 한 하역부가 갈고리를 휘둘렀지. 나는 그를 체포했소. 그는 요새에 갔소.\nEMPATHY[10]: 그는 이 부두를 기억한다. 그리고 이 부두도 그를 기억한다. 그는 정의를 원한다고 말한다. 어쩌면 그가 원하는 건 두 번째 기회다. 이번에는 옳은 편에 서는.\n~ rasmus_history = 1\n-> rasmus_hub\n\n// ─────────────────────────────────────────────\n// 최후통첩 이벤트\n// ─────────────────────────────────────────────\n\n=== ev_ultimatum @event when=\"(day >= 3 || (day >= 2 && hour >= 17)) && !ultimatum\" priority=80\n-> ev_ultimatum_scene\n\n=== ev_ultimatum_scene\n~ ultimatum = 1\n~ ultimatum_day = min(day, 2)\n~ crows_met = 1\n~ rasmus_named = 1\n{loc != \"hotel\"} 발소리. 무겁고 규칙적인, 여러 사람의 발소리. 당신이 돌아서자 회색 코트를 입은 남자 넷이 거리를 가로막고 서 있다. 그 가운데서 한 남자가 앞으로 나온다. 회색 수염, 윗입술의 흉터.\n{loc != \"hotel\"} RASMUS: 경비대. 찾고 있었소.\n{loc == \"hotel\"} 라스무센이 홍차 잔을 내려놓는다. 신문을 접는다. 네 번. 그리고 일어선다. 구석의 회색 코트들도 일어선다.\nRASMUS: 공식적으로 통보하겠소. 증인이 있는 자리에서.\n{met_yun} 그가 윤 경위를 본다. 그녀가 수첩을 편다.\nRASMUS: 협약 시민 얀 트로스트가 솔레아 부두에서 살해되고 모욕당했소. 사르가 시민 경비대는 나흘 동안 아무 조치도 취하지 않았소. 회색 까마귀는 협약 해외 시민 보호 규정 제7조에 따라 행동할 권리가 있소.\n{!body_down} RASMUS: 그리고 오늘 밤 안에 그를 크레인에서 내리시오. 닷새면 충분하오.\n{day < 3} RASMUS: 내일 해 질 녘까지 트로스트를 매단 자들을 넘기시오. 7번 크레인 아래로 데려오시오. 우리가 협약 해안경비대에 인계하겠소.\n{day >= 3} RASMUS: 오늘 해 질 녘까지 트로스트를 매단 자들을 넘기시오. 7번 크레인 아래로 데려오시오. 우리가 협약 해안경비대에 인계하겠소. 어제 경비대를 찾았지만 당신은 어디에도 없었소.\nRASMUS: 넘기지 않으면, 우리가 직접 가서 데려가겠소. 하역부들이 막는다면, 우리는 막는 사람들을 치우겠소.\nHALFLIGHT: 치운다. 치운다는 말을 이렇게 조용하게 할 수 있다니.\n* \"그건 학살이 될 거요.\"\n  RASMUS: 그렇게 되지 않기를 바라오. 그래서 하루를 주는 거요.\n* \"경비대의 수사를 방해하지 마시오.\"\n  RASMUS: 방해? 당신들이 수사를 하고 있소? 나흘 동안 무엇을 했소?\n  RASMUS: ……하루. 하루 안에 수사를 하시오.\n* \"내가 진짜 범인을 데려오면?\"\n  RASMUS: 그럼 그 사람을 데려가겠소. 누구든.\n  RASMUS: 당신 말을 믿을 이유를 주시오, 경비대. 내일 해 질 녘까지.\n  ~ rasmus_listens = 1\n-\n그가 돌아선다. 회색 코트들이 그를 따른다. 까마귀 떼처럼. 한 줄로.\n{met_yun} YUN: ……{{day < 3 ? \"내일\" : \"오늘\"}} 해 질 녘. 적었어요.\n{met_yun} 그녀가 수첩을 덮는다. 손가락 관절이 하얗다.\n{met_yun} YUN: 로사 이바라는 절대 하역부들을 넘기지 않을 거예요. 그리고 하역부들은 절대 물러서지 않을 거고요. {{day < 3 ? \"내일\" : \"오늘\"}} 저녁 7번 크레인 아래서 사람들이 죽을 거예요. 우리가 뭔가를 찾지 못하면.\n~ task add t_ultimatum\n-> END\n");
  load("13_room305.tl", "// ─────────────────────────────────────────────\n// 13. 그랜드 메리디안 305호 — 죽은 남자의 방\n// ─────────────────────────────────────────────\n\n=== room305 @location name=\"그랜드 메리디안 305호\" art=room305 travel=1\n{first} 열쇠가 부드럽게 돈다. 문이 열린다. 닷새 동안 닫혀 있던 방의 공기가 흘러나온다. 먼지, 풀 먹인 리넨, 잉크, 그리고 베르가못. 크레인 위의 그에게서 희미하게 나던 그 향.\n{first} 방은 정돈되어 있다. 지나치게. 침대는 호텔 방식으로 모서리를 접어 정리되어 있고, 닷새 동안 아무도 눕지 않았다. 창가에 책상, 책상 위에 휴대용 타자기와 서류철과 가지런한 연필 세 자루. 벽에는 금박 액자 속의 그림. 익사한 왕 아우렐리오 4세의 초상.\n{first} 그리고 바닥. 카펫을 걷어 낸 참나무 바닥에, 분필로 그린 발자국들이 있다. 수십 개. 번호가 매겨져 있다. 1, 2, 3, 4…… 어떤 것은 원을 그리고, 어떤 것은 X자로 교차한다. 오른발은 흰색, 왼발은 노란색 분필.\n{first} SAVOIR: 오초. 저건 오초야. 8자 스텝. 그리고 저쪽은 히로, 회전. 이 사람은 이 방에서 혼자 연습했어. 매일 밤. 분필로 발자국을 그려 놓고, 그 위를 밟으면서.\n{first} LIMBIC: 너도 혼자 췄지. 어젯밤. 누군가를 안고 있다고 믿으면서.\n{first} ~ jan_room_entered = 1\n{!first} 305호. 분필 발자국, 타자기, 익사한 왕의 초상. 죽은 남자가 남긴 질서.\n+ 책상을 살핀다. -> r305_desk\n+ 바닥의 분필 발자국을 본다. -> r305_floor\n+ 가방을 연다. -> r305_suitcase\n+ 익사한 왕의 초상화를 본다. -> r305_painting\n+ 침대 밑을 본다. -> r305_bed\n+ 창밖을 본다. -> r305_window\n+ {met_yun} 윤 경위와 이야기한다. -> yun_hub\n+ {pilon_alerted && !kruyf_came_305 && r305_count >= 2} 복도에서 발소리가 들린다. -> r305_kruyf\n+ 방을 나가 로비로 내려간다. -> r305_leave\n\n=== r305_leave\n{victim_named && !r305_summary} -> r305_summary_node\n=> hotel 2\n\n=== r305_summary_node\n~ r305_summary = 1\n{met_yun} 문을 닫기 전에 윤 경위가 방을 한 번 돌아본다. 분필 발자국들을. 타자기를.\n{met_yun} YUN: 얀 트로스트. 서른네 살. 보렐 앤드 파르의 손해사정인. 4번 크레인 청구 건. 그는 회사가 거짓말을 했다는 걸 알아냈어요.\n{met_yun} YUN: 그리고 레테의 댄서한테 탱고를 배웠어요. 이네스 이바라. 로사 이바라의 손녀.\n{met_yun} 그녀가 문을 닫는다. 조용히.\n{met_yun} YUN: 그는 적의 손녀를 사랑했어요. 아니, 적이 아니죠. 그는 그들 편이었어요. 그걸 아무도 몰랐고요.\n=> hotel 2\n\n// ───────── 책상 ─────────\n\n=== r305_desk\n~ r305_count += 1\n책상은 완벽하다. 연필 세 자루가 길이 순서대로 나란히. 서류철 두 개가 모서리를 맞춰 겹쳐 있다. 타자기 옆에 먹지 한 묶음, 흰 종이 한 묶음. 잉크병의 뚜껑이 닫혀 있다.\n{first} LOGIC: 이 사람은 질서를 사랑했다. 아니, 질서가 필요했다. 무질서한 세상에서 자기 책상만큼은.\n* {!victim_named} 서류철을 연다.\n  첫 번째 서류철. 표지에 타자로 친 글씨. \"보렐 & 파르 해상보험 — 청구 번호 SAR-4471 — 할바르-마리스 해운 — 4번 크레인\". 안에는 사진, 도면, 회사가 제출한 사고 보고서 사본, 그리고 명함 한 묶음이 클립에 끼워져 있다.\n  명함. \"얀 트로스트 — 손해사정인 — 보렐 & 파르 해상보험 — 반데르메르 본사 청구심사부.\"\n  이름이 생긴다. 크레인 위의 남자에게. 나흘 동안 이름이 없던 남자에게.\n  얀 트로스트.\n  ~ victim_named = 1\n  ~ task done t_identify\n  ~ task add t_ines\n  ~ xp 30\n  VOLITION: 얀 트로스트. 불러 봐. 이름은 부르라고 있는 거야.\n  * \"얀 트로스트.\"\n    당신은 이름을 소리 내어 말한다. 빈 방에. 방이 그 이름을 받아 준다.\n    {corpse_spoke || corpse_talked} INLAND: 어딘가에서, 얼음 창고의 어둠 속에서, 누군가 고개를 끄덕인다.\n    ~ morale +1\n  * 명함 한 장을 주머니에 넣는다.\n    당신은 명함 한 장을 셔츠 주머니에 넣는다. 반지 옆에. 이름 옆에 이름.\n  -\n  {adjuster_known} LOGIC: 수첩 첫날의 \"J. 트로…(?)\". 당신은 열하루 전 이 이름을 적었다. 그를 만나 볼 생각이었다. 만났다면, 모든 것이 달라졌을까.\n  {adjuster_known} ~ morale -1\n* 두 번째 서류철을 연다.\n  두 번째 서류철은 더 얇다. 표지에 손글씨. \"정비 기록 대조\". 안에는 표가 있다. 왼쪽 칸에 회사 정비 일지의 날짜와 내용, 오른쪽 칸에 무언가 다른 것. \"시몬 R. 보고서 #1: 소선 단선 다수\", \"시몬 R. 보고서 #2: 즉시 교체 요망\", \"시몬 R. 보고서 #3: 사용 중지 요망\". 그리고 같은 날짜의 회사 일지: \"점검 완료. 이상 없음.\" \"점검 완료. 이상 없음.\" \"점검 완료. 이상 없음.\"\n  마지막 줄. \"케이블 납품 기록: 최근 22개월간 4번 크레인용 권양 케이블 발주 없음(본사 구매부 확인).\"\n  LOGIC: 14개월이 아니다. 22개월 동안 케이블을 산 적이 없다. 그런데 매달 \"점검 완료\". 이건 실수가 아니다. 이건 조작이다.\n  서류철의 나머지는 비어 있다. 결론 부분, 보고서 본문은 여기 없다.\n  ~ crane4_logs_proof = 1\n  ~ crane4_known = 1\n  ~ xp 10\n* 타자기를 본다.\n  휴대용 타자기. 회색 금속 몸체에 \"메르쿠르 포터블\". 롤러에 종이가 없다. 리본 카트리지가 끼워져 있다. 검은 리본이 반쯤 감겨 있다.\n  * [PERCEPTION 11] 리본을 빼서 빛에 비춰 본다. -> r305_ribbon_ok | r305_ribbon_fail\n  * [INTERFACING 10] 리본을 조심스럽게 풀어 거꾸로 읽는다. -> r305_ribbon_ok | r305_ribbon_fail\n  * 타자기를 그대로 둔다.\n  -\n* {!has.ev_letter_draft} 먹지 밑에 깔린 편지지를 본다.\n  먹지 묶음 밑에 편지지 한 장이 있다. 타자기가 아니라 손으로 쓴. 꼼꼼하고, 조금 기울어진 글씨.\n  -> r305_letter\n+ 물러선다. -> END\n\n=== r305_ribbon_ok\n당신은 리본 카트리지를 빼서 창가로 가져간다. 리본을 조금씩 풀어 빛에 비춘다. 타자기 리본은 기억한다. 활자가 때린 자리마다 잉크가 빠져 나가, 리본에 거꾸로 된 글자의 흔적이 남는다.\n오래 걸린다. 한 글자씩, 거꾸로. 하지만 읽힌다.\n\"……결론. 할바르-마리스 해운은 4번 크레인의 권양 케이블 정비 기록을 최소 14개월간 허위로 작성하였음. 현장 기사의 교체 요청 보고서 3건이 묵살되었음. 사고 원인은 케이블의 피로 파단이며, 이는 정비 불이행의 직접적 결과임. 운전자 과실을 뒷받침하는 증거 없음. 본 청구의 기각을 권고함……\"\n\"……사본 2부 작성. 1부는 목요일 배편으로 본사 송부 예정. 1부는……\"\n그 뒤는 리본이 다시 감겨 겹쳐져서 읽을 수 없다.\nLOGIC: 사본 두 부. 하나는 목요일 배로 보낼 예정이었다. 보험사는 받지 못했다. 다른 하나는 누구에게?\n{found_bullet || ap_hands} LOGIC: 그의 주먹 속 찢어진 귀퉁이. 그는 보고서를 가지고 있었다. 죽는 순간에. 두 부 다? 한 부는 그의 손에서 빼앗겼다. 다른 한 부는?\n~ ribbon_read = 1\n~ report_exists_known = 1\n~ xp 15\n-> r305_desk\n\n=== r305_ribbon_fail\n당신은 리본을 풀어 빛에 비춘다. 검은 리본에 무언가 흔적이 있다. 글자다. 거꾸로 된. 겹쳐진. 당신의 눈이 그것을 따라가다 엉킨다. 리본이 손가락 사이에서 풀려 나가 바닥에 뒤엉킨다.\n당신은 그것을 다시 감으려 한다. 더 엉킨다.\nINTERFACING: ……이건 이제 읽을 수 없다. 리본은 한 번 엉키면 기억을 잃는다. 사람처럼.\n-> r305_desk\n\n=== r305_letter\n\"사랑하는 어머니께.\n여기 솔레아는 생각보다 춥고, 생각보다 따뜻합니다. 바람은 반데르메르보다 차갑지만, 사람들은 반데르메르보다 뜨거워요. 부두의 생선 튀김 파는 아주머니가 제 서툰 인사에 웃어 주셨어요. 호텔 컨시어지는 매일 아침 제 억양을 고쳐 줍니다. 무섭게 정중한 분이에요.\n일은 힘들어요. 제가 찾아낸 것이 누군가에게는 무척 불편할 거예요. 하지만 어머니가 늘 말씀하셨죠. 서류는 거짓말을 하지 않지만, 거짓말은 서류를 좋아한다고. 저는 이번에 그 거짓말을 찾았어요. 여섯 명이 그 거짓말 때문에 죽었어요.\n그리고 어머니, 믿지 않으시겠지만, 저 춤을 배우고 있어요. 탱고요. 제 발이 얼마나 서툰지 아시잖아요. 선생님은 매번 웃어요. 그 웃음을 들으려고 일부러 발을 밟는 것 같기도 해요. 아니, 그건 아니에요. 저는 정말로 서툴러요.\n선생님은……\"\n편지는 거기서 끝난다. \"선생님은\" 다음에 펜이 한참 멈춰 있었던 자국. 잉크가 작은 점으로 번졌다.\nEMPATHY: 그는 무엇이라고 쓰려고 했을까. 선생님은 아름다워요? 선생님은 슬퍼요? 선생님은 제가 지금까지 만난 사람 중에 가장…… 그는 그 문장을 끝낼 말을 찾지 못했다. 그리고 영영 찾지 못했다.\nLIMBIC: 너도 그런 편지를 썼지. 6년 전. 부치지 않았지만.\n~ item add ev_letter_draft\n~ morale -1\n~ xp 5\n-> r305_desk\n\n// ───────── 바닥의 분필 발자국 ─────────\n\n=== r305_floor\n~ r305_count += 1\n당신은 무릎을 꿇고 분필 발자국들을 본다. 흰 발, 노란 발. 번호. 1에서 시작해 38까지. 그 사이사이에 작은 글씨로 메모.\n\"4 — 여기서 체중 이동! 가슴 먼저!!\"\n\"11 — 오초: 그녀의 엉덩이가 돌 공간을 줄 것. 밀지 말 것.\"\n\"17 — 멈춤. 음악을 들을 것. 그녀가 가르쳐 준 대로: '숨을 같이 쉬어.'\"\n\"23 — 코르테. 앞으로 깊이 기울임. 그녀를 떨어뜨리지 말 것!!!\"\n\"38 — 끝. 인사. 발 밟으면 사과.\"\n그리고 방 한가운데, 발자국들이 모두 모이는 곳에 분필로 쓴 작은 글씨. \"7강 — 아브라소. 가슴으로 이끌고, 가슴으로 따른다.\"\n* [SAVOIR 9] 분필 발자국을 따라 걸어 본다.\n  ?+\n    당신은 일어선다. 1번 발자국에 오른발을 올린다. 2번에 왼발. 3, 4. 체중을 가슴으로. 5, 6, 7. 오초. 발이 알아서 원을 그린다. 11, 12. 17. 멈춤. 숨.\n    23. 코르테. 당신은 앞으로 깊이 기울인다. 허공을 안은 채로. 가슴이 누군가를 향해 내려간다.\n    그 순간 당신은 이해한다. 이 자세. 앞으로 깊이 기울어, 가슴을 숙이고, 목이 앞으로 나온. 이 자세에서라면, 위에서 날아온 무언가가 쇄골 위로 들어가 아래로 내려갈 것이다.\n    {found_wound} VISUAL: 탄도. 위에서 아래로 40도. 코르테. 그는 쓰러지기 직전 이 자세였다. 그녀를 안고, 앞으로 기울인 채. 그렇다면 쏜 사람은 반드시 더 로스트 씨 방에 계시다고 해서요. 걱정했습니다. 강도일까 봐. 트로스트 씨는 저희 회사의…… 비즈니스 파트너셨으니까요. 그분의 유품을 적절히 보관하는 것이 저희의 도리입니다.\n* \"경비대 수사 중이오. 나가시오.\"\n  KRUYF: 물론입니다, 물론입니다. 수사를 방해할 생각은 추호도 없습니다.\n  그는 나가지 않는다. 한 걸음 들어온다.\n  KRUYF: 혹시 트로스트 씨가 남긴 서류를 발견하시면, 저희에게 알려 주시겠습니까? 회사 기밀이 포함되어 있을 수 있어서요. 법적으로 저희 재산입니다.\n  {met_yun} YUN: 수사 증거는 경비대 재산이에요. 사르가 형사소송 규정 제3장. 나가 주세요.\n  {met_yun} 크루이프가 윤 경위를 본다. 처음으로. 그의 미소가 그녀에게는 조금 덜 넓다.\n  {met_yun} KRUYF: ……물론입니다, 경위님.\n  그가 물러난다. 문간에서 한 번 뒤돌아본다.\n  KRUYF: 500솔도의 감사는 여전히 유효합니다, 형사님. 기억해 주십시오.\n  ~ kruyf_offer_made = 1\n* [AUTHORITY 11] 그를 문밖으로 밀어낸다. \"나가.\"\n  ?+\n    당신은 그의 앞으로 걸어가 문간을 막는다. 그보다 머리 하나가 크다. 그의 약한 폐가 당신의 그림자 속에서 기침을 한다.\n    KRUYF: 형사님, 이건 좀……\n    당신은 문을 닫는다. 그의 얼굴 앞에서. 부드럽게, 확실하게.\n    AUTHORITY: 좋다. 아주 좋다. 저런 인간에게는 문이 최고의 대답이다.\n    {met_yun} YUN: ……\n    {met_yun} 그녀는 아무 말도 하지 않는다. 입꼬리가 아주 조금 움직였다가 멈춘다.\n    ~ kruyf_insulted = 1\n  ?-\n    당신이 한 걸음 다가서자 복도 끝의 회색 코트가 한 걸음 다가선다. 당신은 멈춘다.\n    KRUYF: 형사님, 저는 방해하러 온 게 아닙니다. 폭력은 누구에게도 이익이 되지 않습니다.\n    그가 미소 지으며 물러난다.\n* \"트로스트는 당신 회사에 불리한 보고서를 쓰고 있었소.\"\n  KRUYF: 보고서. 네, 조사관들은 늘 보고서를 쓰지요.\n  KRUYF: 형사님, 만약 그런 보고서가 있다면, 그리고 그것이 발견된다면, 그것은 고인의 비극적인 상황 속에서 작성된 미완성 문서일 겁니다. 법적 효력이 의심스러운. 회사 변호사들은 그렇게 볼 겁니다.\n  KRUYF: 그리고 회사는 그 문서를 적절히 보관하는 분에게 감사를 표할 겁니다. 500솔도의 감사를.\n  ~ kruyf_offer_made = 1\n-\n그가 떠난다. 복도의 회색 코트도 떠난다. 발소리가 계단 아래로 사라진다.\nLOGIC: 회사도, 용병도, 이 방을 지켜보고 있었다. 그들은 무언가를 찾고 있다. 보고서. 그리고 그 보고서는 이 방에 없다.\n-> END\n");
  load("14_pawn.tl", "// ─────────────────────────────────────────────\n// 14. 코스타 전당포 — 모든 것에는 값이 있다\n// ─────────────────────────────────────────────\n\n=== pawn @location name=\"코스타 전당포\" art=pawn travel=2\n{first} 부두 거리 14번지. 녹슨 간판에 금색 공 세 개. 문을 열자 머리 위에서 종이 딸랑거린다. 안은 어둡고, 좁고, 물건으로 가득하다. 천장까지 닿는 선반에 아코디언, 괘종시계, 웨딩드레스, 목발, 선원용 망원경, 박제된 갈매기, 은수저, 누군가의 틀니, 누군가의 결혼반지 수백 개. 모든 것에 꼬리표가 달려 있다. 숫자가 적힌.\n{first} 가장 안쪽에 쇠창살을 친 카운터. 창살 너머에 뚱뚱한 남자가 앉아 있다. 쉰 살쯤. 땀에 젖은 이마, 소매 고정 밴드, 금니 두 개. 그리고 코. 거대한 코. 당신 수첩의 캐리커처가 조금도 과장이 아니었다.\n{first} CESAR: 아이고, 대통령 각하! 또 오셨네! 이번엔 뭘 맡기시려고? 바지? 그 바지는 안 받아요. 수요가 없어서.\n{first} ~ cesar_named = 1\n{!first} 전당포. 박제된 갈매기가 유리 눈으로 당신을 본다. 체사르가 창살 너머에서 동전을 센다.\n{!first} CESAR: 각하! 오늘은 사러 오셨나, 팔러 오셨나?\n+ {!has.badge} 배지를 되찾고 싶다. -> cesar_badge\n+ {!suitcase_back} \"내 가방은 어디 있소?\" -> cesar_suitcase\n+ 물건을 산다. -> cesar_buy\n+ 물건을 판다. -> cesar_sell\n* {found_bullet} \"혹시 경비대 탄을 본 적 있소? 7.65mm.\" -> cesar_cartridge\n* \"이 가게는 얼마나 됐소?\" -> cesar_self\n* <INLAND 9> 박제된 갈매기를 본다. -> cesar_gull\n+ {met_yun} 윤 경위와 이야기한다. -> yun_hub\n+ 가게를 나간다. => quay 2\n\n// ───────── 배지 ─────────\n\n=== cesar_badge\n{!has.pawn_ticket} CESAR: 배지? 무슨 배지? 전당표 없으면 아무것도 안 돼요. 규칙이에요.\n{!has.pawn_ticket} -> END\n당신은 전당표를 창살 틈으로 내민다. 체사르가 그것을 집어 들고, 뒷면의 \"밤의 대통령\" 서명을 보고 웃는다. 금니가 번쩍인다.\nCESAR: 아, 이거. 휘장 한 점. 30솔도. 일주일 전이었나. 각하가 그러셨죠. \"이건 무거워. 이건 내 영혼이야. 30솔도에 팔겠다.\" 제가 그랬죠. 영혼 치고는 싸네요. 각하가 웃으셨어요.\n그가 카운터 밑 서랍을 연다. 무언가 금속이 반짝인다. 닻과 등불. 당신의 배지.\nCESAR: 원금 30에 이자 3. 33솔도.\nESPRIT: 저건 당신 거다. 신입 교육 마지막 날, 반장이 가슴에 달아 주던 그 무게. 저건 저 창살 너머에 있어서는 안 된다.\n+ {money >= 33} 33솔도를 낸다.\n  CESAR: 거래 완료! 각하는 정직한 고객이야. 드물어요.\n  ~ money -33\n  -> cesar_badge_back\n+ [AUTHORITY 11] \"경찰 배지를 전당 잡는 건 범죄요. 받는 것도. 사르가 형법 제211조. 당장 돌려주시오.\" -> cesar_badge_auth_ok | cesar_badge_auth_fail\n+ [RHETORIC 10] \"이자라니. 당신은 일주일 동안 경찰 배지를 가지고 있었소. 그게 얼마나 위험한 일인지 아시오? 오히려 내가 보관료를 받아야겠군.\" -> cesar_badge_rhet_ok | cesar_badge_rhet_fail\n+ {has.wedding_ring} 반지로 바꾸자고 한다.\n  당신은 셔츠 주머니에서 금반지를 꺼낸다. \"M에게, 영원히 — L.\" 창살 un} YUN: ……형사님. 여드레 전이면, 형사님 수첩 둘째 날이에요.\n-> END\n\n// ───────── 체사르, 갈매기 ─────────\n\n=== cesar_self\nCESAR: 우리 아버지가 코뮌 때 시작했어요. 코뮌은 전당포를 금지했거든요. 착취라고. 그래서 아버지가 지하에서 했어요. 코뮌 사람들도 급하면 왔어요. 결혼반지 맡기러. 혁명은 혁명이고 빵은 빵이니까.\nCESAR: 협약이 들어오고 나서 간판을 걸었죠. 이제 46년. 솔레아 사람들 반은 우리 가게에 뭔가 맡겨 본 적이 있어요. 나머지 반은 거짓말하는 거고.\nCESAR: 제가 나쁜 놈 같죠? 사람들 궁할 때 싸게 사서 비싸게 팔고. 맞아요. 근데 은행은 이 사람들한테 돈을 안 빌려줘요. 저는 빌려줘요. 담보만 있으면. 그게 차이예요. 저는 착한 착취자예요.\nRHETORIC[9]: 영세 자본가의 자기 정당화. 논리는 허술하지만 전부 틀리지는 않았다. 협약의 은행은 부두에 지점을 내지 않는다. 체사르가 그 빈자리를 채운다. 비싸게.\n~ al_ultralib += 1\n~ thought invisible_tango\n-> END\n\n=== cesar_gull\n선반 꼭대기의 박제된 갈매기. 날개를 반쯤 편 자세. 유리 눈알 하나가 조금 삐뚤어졌다.\nINLAND: 그 삐뚤어진 눈이 당신을 본다.\n{gull_attack} INLAND: 저놈이다. 아니, 저놈의 할아버지다. 갈매기들은 기억한다. 세대를 넘어서.\nCESAR: 그거요? 제가 잡은 거예요. 20년 전에. 제 점심을 훔쳐 간 놈. 빗자루로. 한 방에.\nCESAR: 그놈 친구들이 아직도 복수하려고 해요. 매일 아침 가게 앞에 똥을 싸요. 정확히 문 앞에. 20년 동안.\n{gull_attack} -> cesar_gull_bond\n-> END\n\n=== cesar_gull_bond\n* \"나도 당했소. 오늘.\"\n  CESAR: 아이고! 동지! 갈매기 피해자 동지!\n  그가 창살 너머로 손을 내민다. 당신은 그 손을 잡는다. 땀에 젖었다. 그래도 진심이다.\n  ~ cesar_gull_bond = 1\n* 아무 말도 하지 않는다.\n-\n-> END\n");
  load("15_church.tl", "// ─────────────────────────────────────────────\n// 15. 익사한 종의 교회 — 라디오 레테\n// ─────────────────────────────────────────────\n\n=== church @location name=\"익사한 종의 교회\" art=church travel=7\n{first} 운하 위의 돌다리를 건너면 솔레아가 조금 조용해진다. 다리 끝에 교회가 있다. 아니, 교회였던 것이.\n{first} 지붕의 절반이 없다. 아홉 날의 포격 때 날아갔다. 신랑(身廊)은 하늘로 열려 있고, 부서진 신도석 사이로 잡초가 자라고, 빗물이 대리석 바닥에 웅덩이를 만들었다. 제단 위에 촛불 수십 개가 녹아 붙어 있다. 누군가 아직 여기 온다.\n{first} 종탑만 멀쩡하다. 좁고 높은 돌탑. 꼭대기의 종루에 종은 없다. 대신 철사와 안테나가 거미줄처럼 얽혀 있고, 그 끝에 작은 붉은 등이 깜빡인다. 종루 창문에 손으로 쓴 천 한 장이 걸려 있다. \"라디오 레테 — 97.3\".\n{first} SHIVERS[9]: 이 교회에는 종이 없다. 80년 전 대홍수 때 종이 떨어져 운하로 굴러 들어갔다. 사람들은 아직도 밤이면 물 밑에서 종이 울린다고 말한다. 종이 울리면 누군가 무언가를 잊는다고.\n{!first} 익사한 종의 교회. 하늘로 열린 신랑, 녹아 붙은 촛불, 종탑의 붉은 등.\n{night} 종탑에서 음악이 흘러나온다. 지직거리는 탱고. 라디오 레테가 방송 중이다.\n+ 종탑의 나선 계단을 오른다. -> lina_hub\n+ 제단 위의 커다란 책을 본다. -> church_book\n+ 물에 잠긴 지하 납골당으로 내려간다. -> church_crypt\n+ 부서진 신랑을 둘러본다. -> church_nave\n+ {met_yun} 윤 경위와 이야기한다. -> yun_hub\n+ 다리를 건너 부두 거리로 돌아간다. => quay 7\n\n// ───────── 신랑 ─────────\n\n=== church_nave\n부서진 신도석 사이를 걷는다. 발밑에서 유리 조각이 부서진다. 색유리다. 한때 창문이었던 것. 파란 조각, 붉은 조각, 금색 조각. 어떤 조각에는 아직 그림의 일부가 남아 있다. 물고기의 꼬리. 누군가의 손. 종의 가장자리.\n벽에는 그라피티. 코뮌 시절의 구호 위에 협약 시절의 욕설, 그 위에 연인들의 이름, 그 위에 파업 구호. 네 겹의 역사.\n\"우리는 잊지 않는다\". \"빨갱이는 꺼져라\". \"M + R 영원히\". \"케이블은 거짓말하지 않는다\".\n{pass(ENCYCLOPEDIA, 9)} ENCYCLOPEDIA: 익사한 종의 교회는 원래 \"성 에우랄리아 선원 교회\"였다. 대홍수 때 종이 떨어진 뒤로 사람들이 이름을 바꿔 불렀다. 교단은 그 이름을 인정하지 않았다. 사람들은 교단을 인정하지 않았다. 코뮌 때 교회는 폐쇄되었고, 협약은 다시 열지 않았다. 폐허가 된 뒤로 오히려 사람이 더 많이 온다.\nCONCEPT[10]: 네 겹의 벽. 이 벽은 이 도시의 가장 정직한 역사책이다. 아무도 앞의 글을 지우지 않았다. 그냥 그 위에 덧썼다. 기억은 지워지지 않는다. 덮일 뿐이다.\n+ 물러선다. -> END\n\n// ───────── 망각의 책 ─────────\n\n=== church_book\n제단 위에 거대한 가죽 장부가 펼쳐져 있다. 표지에 누군가 칼로 새긴 글씨. \"잊히지 않을 이름들\".\n장부는 거의 꽉 찼다. 수천 개의 이름. 다양한 필체, 다양한 잉크. 연필, 목탄, 립스틱, 피처럼 보이는 것. 이름 옆에 짧은 말들. \"아빠, 보고 싶어요.\" \"코뮌 전사 호세 마르틴, 요새에서.\" \"우리 강아지 페페.\" \"나 자신 — 잊지 말 것.\"\n옆에 몽당연필이 끈에 묶여 있다.\n{first} EMPATHY: 사람들은 여기 와서 잊고 싶지 않은 이름을 적는다. 레테의 도시에서. 망각의 강 옆에서. 이건 저항이다. 가장 작은.\n{!wrote_book_si thing\n+ {!night} [PERCEPTION 9] 물속을 들여다본다.\n  ?+\n    검은 물 속, 계단 끝에서 몇 미터 떨어진 곳에 무언가 둥근 윤곽이 있다. 거대하다. 초록빛으로 녹슨 청동. 가장자리에 글씨가 새겨져 있다. 물에 흔들려 읽을 수 없다.\n    PERCEPTION: 종이다. 진짜로 있다. 운하로 굴러간 게 아니라, 여기 떨어져 있었다. 80년 동안.\n    ~ bell_seen = 1\n  ?-\n    물은 검다. 당신의 얼굴만 비친다. 흔들리는.\n+ 계단을 올라간다. -> END\n\n=== church_bell\n당신은 차가운 돌계단에 앉는다. 발끝이 물에 닿을 듯 말 듯. 눈을 감는다.\n둥…… 둥……\nBELL: 둥.\nINLAND: 종이 울린다. 물 밑에서. 운하의 조류가 종을 흔드는 것일 수도 있다. 아니면 종이 스스로 우는 것일 수도 있다. 여기서 둘은 같은 것이다.\nBELL: 한 가지를 잊고, 한 가지를 기억하라.\nBELL: 너는 무엇을 잊겠느냐.\n* \"두려움을.\"\n  BELL: 둥.\n  무언가가 가슴에서 빠져나간다. 작은 것. 아침부터 등에 붙어 있던 차가운 손 하나.\n  ~ morale +1\n  ~ bell_forgot = 1\n* \"그녀를.\"\n  BELL: 둥.\n  BELL: 그것은 네 것이 아니다. 잊을 수 있는 것만 잊을 수 있다.\n  BELL: 너는 그녀를 잊지 않을 것이다. 대신, 그녀를 기억하는 아픔의 모양을 잊을 것이다. 날카로운 모서리를.\n  LIMBIC: ……조금 덜 아프다. 이상해.\n  ~ morale +1\n  ~ bell_forgot = 2\n* \"아무것도 잊지 않겠다.\"\n  BELL: 둥.\n  BELL: 그렇다면 기억만 가져가라. 무겁게.\n  ~ bell_forgot = 3\n-\nBELL: 이제 기억하라.\n---\n물이 사라진다. 납골당이 사라진다. 당신은 부두에 서 있다. 밤. 비. 나트륨등. 당신은 취했다. 무척. 부두 가장자리에서 비틀거린다. 레테의 네온이 물 위에서 흔들린다.\n작은 손이 당신의 코트 자락을 잡아당긴다.\n\"아저씨! 대통령 아저씨! 진짜 경찰이에요? 총 있어요? 보여 줘요!\"\n당신의 목소리. 크고, 과장되고, 럼에 젖은. \"총? 총이라! 꼬마 선장, 너는 이 도시의 미래다!\" 당신의 손이 허리로 간다. 무언가 무거운 것을 잡는다.\n그리고 거기서 기억이 끊긴다. 물처럼. 손가락 사이로.\n---\n당신은 납골당 계단에 앉아 있다. 온몸이 떨린다. 물방울이 떨어진다. 똑. 똑.\nHALFLIGHT: 꼬마. 부두. 네 허리. 무거운 것.\nLOGIC: 이건 증거가 아니다. 종소리가 준 환각이다. 술 취한 기억의 파편이다. 법정에서는 아무 의미도 없다.\nLOGIC: ……그런데 수첩의 둘째 날 밤과 정확히 일치한다. \"꼬마 선장. 선물을 줬다. 나는 이제 가볍다.\"\n~ bell_heard = 1\n~ gun_memory_partial = 1\n~ bobo_suspect = 1\n~ xp 20\n-> END\n\n=== church_bell_shivers\nSHIVERS: 운하의 조류가 바뀐다. 밀물이 들어오면서 물이 납골당 벽 틈으로 밀려든다. 그 흐름이 종의 입술을 흔든다. 종의 추는 녹슬어 떨어졌지만, 물살에 굴러다니는 돌 하나가 종 안쪽을 친다. 둥.\nSHIVERS: 이 도시는 80년 동안 이 소리를 들었다. 그리고 그 소리에 의미를 붙였다. 도시는 그런 식으로 기억한다. 소리에 이야기를 붙여서.\n~ bell_heard = 1\n~ bell_explained = 1\n-> END\n\n=== church_bell_nothing\n둥…… 둥…… 소리는 멀어진다. 물이 조용해진다. 당신은 차가운 계단에 앉아 한참을 기다린다. 아무것도 오지 않는다.\n-> END\n\n// ─────────────────────────────────────────────\n// 리나 \"주파수\" — 라디오 레테\n// ────────────────────────────────   load("16_honeycomb.tl", "// ─────────────────────────────────────────────\n// 16. 벌집 공동주택 — 이바라 가족의 집\n// ─────────────────────────────────────────────\n\n=== honeycomb @location name=\"벌집 공동주택 안뜰\" art=honeycomb travel=4\n{first} 골목 끝의 아치를 지나면 사방이 벽인 안뜰이 나온다. 5층짜리 건물이 네모나게 둘러싸고, 층마다 좁은 발코니가 벌집의 칸처럼 이어져 있다. 발코니에서 발코니로 빨랫줄이 수십 가닥 가로지른다. 셔츠, 속치마, 기저귀, 작업복. 하늘은 빨래 사이로 조각조각 보인다.\n{first} 안뜰 한가운데에 녹슨 수동 펌프. 아이들이 그 둘레에서 뛰어논다. 문간마다 늙은 여자들이 등받이 없는 의자에 앉아 콩을 까거나 뜨개질을 하거나 그냥 앉아 있다. 모두가 모두를 본다. 이 안뜰에서 비밀은 한 시간을 못 넘긴다.\n{first} SHIVERS[9]: 벌집은 솔레아의 폐다. 하역부와 여공과 과부와 아이들 수백 명이 이 안에서 숨을 쉰다. 한 집에서 기침을 하면 네 집에서 들린다. 한 집에서 울면 안뜰 전체가 안다.\n{!first && !night} 벌집의 안뜰. 빨래, 펌프, 아이들, 문간의 할머니들. 모두가 당신을 본다.\n{!first && night} 밤의 벌집. 창문마다 불빛이 하나씩. 라디오 소리, 싸우는 소리, 아기 우는 소리. 빨래가 어둠 속에서 유령처럼 흔들린다.\n+ {!night} 비늘을 든 노파에게 간다. -> perpetua_hub\n+ {!night} 문간의 할머니들에게 말을 건다. -> hc_grannies\n+ 3층 이바라네 집으로 올라간다. -> hc_ibarra_door\n+ {!night} 펌프 둘레에서 노는 아이들을 본다. -> hc_kids\n+ 건물 뒤쪽 비상계단을 올라간다. -> hc_fireescape\n+ {met_yun} 윤 경위와 이야기한다. -> yun_hub\n+ 골목으로 나가 부두 거리로 간다. => quay 4\n+ 뒷골목으로 레테 뒷마당에 간다. => backyard 2\n\n// ───────── 할머니들 ─────────\n\n=== hc_grannies\n문간의 할머니 셋. 한 명은 콩을 까고, 한 명은 양말을 깁고, 한 명은 아무것도 안 한다. 셋이 동시에 당신을 본다.\nNEIGHBOR: 경찰이네.\nNEIGHBOR: 대통령 경찰이야. 무도장에서 노래 부르던.\nNEIGHBOR: 노래 못하던.\n* \"이바라 가족에 대해 아시오?\"\n  NEIGHBOR: 알지. 3층. 토마스네. 토마스가 죽고 나서 애들 둘만 살아. 엄마는 보보 낳고 1년 만에 갔고. 폐병으로.\n  NEIGHBOR: 로사가 공장에서 살고, 애들은 여기서 살아. 이네스가 동생을 키웠지. 이네스가 엄마고 아빠고 누나야.\n  NEIGHBOR: 그런데 요 닷새는 이네스가 없어. 새벽에 가방 하나 들고 나갔어. 닷새 전 새벽. 해 뜨기 전에. 나는 잠이 없어서 봤지. 창문으로.\n  ~ ines_left_dawn = 1\n* \"보보는 요즘 어떻소?\"\n  NEIGHBOR: 집에 안 들어와. 밤마다 어디서 자는지 몰라. \"본부\"래. 해적 본부.\n  NEIGHBOR: 로사가 사람들한테 그랬어. 보보가 아프니까 건드리지 말라고. 아버지 잃고 신경이 예민하다고. 그래서 우리도 안 건드려. 로사가 하는 말이니까.\n  NEIGHBOR: 근데 걔가 밤에 소리를 질러. 자다가. 누나 부르면서. 어디서 자는지는 몰라도 소리는 들려. 이 벌집에선 다 들려.\n  EMPATHY[9]: 아이는 매일 밤 악몽을 꾼다. 그리고 매일 아침 돌을 들고 크레인으로 간다.\n  ~ bobo_nightmares = 1\n* \"닷새 전 밤에 이상한 일은 없었소?\"\n  할머니 셋이 서로를 본다.\n  NEIGHBOR: ……이상한 일?\n  NEIGHBOR: 새벽 두 시쯤. 레테 뒷마당에서 사람 소리가 났어. 남자들 늘을 손톱으로 집어 든다. 빛에 비춘다.\nPERPETUA: 해골 위가 아니라 옆이오. 죽음이 당신을 스쳐 지나갔소. 이번엔. 다음번은 당신이 정하오.\n---\nPERPETUA: 마지막으로, 판 밖으로 떨어진 것이 하나 있소.\n그녀가 바닥을 가리킨다. 판에서 떨어진 비늘 하나가 자갈 위에서 반짝인다.\nPERPETUA: 판 밖의 비늘은 아무도 모르는 것이오. 비늘도 모르오. 당신이 정할 것이오. 끝에 가서.\nEMPATHY: 그녀는 이 대사를 수백 번 했을 것이다. 판 밖의 비늘은 늘 있다. 그래도, 이상하게, 가슴이 서늘하다.\n~ xp 10\n-> perpetua_hub\n\n=== perpetua_ines\n~ ines_where_perpetua = 1\nPERPETUA: 토마스의 딸. 사나운 아이.\n노파가 비늘을 한 줌 쥐고 판 위에 흩뿌린다. 하나가 판의 가장자리, 성벽처럼 그려진 선 위에 떨어진다.\nPERPETUA: 익사한 왕의 적들이 벽 앞에 섰던 곳. 마지막 산책의 끝. 물이 빠질 때만 걸어갈 수 있는 곳.\nPERPETUA: 그 아이는 거기 있소. 총보다 무거운 종이를 안고. 아버지의 비밀 장소에서. 추위에 떨면서.\n{pass(ENCYCLOPEDIA, 8)} ENCYCLOPEDIA: 마지막 산책의 끝. 조수 요새. 코뮌 전사들이 총살당한 섬. 썰물 때 개펄을 걸어서 건널 수 있다.\n~ ines_where = 1\n~ ines_where_count += 1\nPERPETUA: 서두르시오. 그 아이는 닷새째 거의 먹지 않았소. 그리고 물은 매일 조금씩 늦게 빠지오.\n-> perpetua_hub\n\n=== perpetua_killer_q\n~ perpetua_killer = 1\nPERPETUA: 누가 죽였냐고.\n노파는 비늘을 던지지 않는다. 대신 사발을 무릎 위에서 천천히 흔든다. 비늘들이 서로 부딪히며 사각거린다.\nPERPETUA: 사랑이 죽였소. 과녁을 잘못 본 사랑이.\nPERPETUA: 그리고 망각이 매달았소. 오래된 망각이. 늘 그렇듯이.\n* \"무슨 뜻이오?\"\n  PERPETUA: 비늘은 뜻을 말하지 않소. 뜻은 당신이 찾는 거요. 당신이 경찰이잖소.\n* \"이름을 말해 주시오.\"\n  PERPETUA: 이름은 비늘에 없소. 비늘은 바다의 기억이오. 바다는 이름을 모르오. 바다는 무게만 알지.\n-\n-> perpetua_hub\n\n=== perpetua_self\nPERPETUA: 나? 페르페투아. 어부의 딸, 어부의 아내, 어부의 어머니. 셋 다 바다가 가져갔소. 그래서 바다가 나한테 빚이 있지. 그 빚으로 비늘을 읽소.\nPERPETUA: 코뮌 때는 나를 미신 퍼뜨린다고 감옥에 넣었소. 협약 때는 나를 사기꾼이라고 벌금을 매겼소. 둘 다 틀렸소. 나는 미신도 사기도 아니오. 나는 그냥 늙은 여자요. 비늘을 좋아하는.\nPERPETUA: 사람들은 나한테 미래를 물으러 오오. 사실은 과거를 들으러 오는 거지. 미래는 과거의 비늘이 떨어지는 방향일 뿐이니까.\n~ perpetua_trust += 1\n-> perpetua_hub\n\n// ───────── 아이들 ─────────\n\n=== hc_kids\n펌프 둘레에서 아이들 대여섯이 원을 그리며 뛴다. 노래를 부르며. 한 아이가 가운데서 한 다리로 서서 눈을 감고 있다.\nKID: *잿빛 왜가리, 한 다리로 서서,*\nKID: *잊은 것을 세고 있네, 하나, 둘, 셋.*\nKID: *네가 뭘 잊었는지 왜가리는 알지,*\nKID: *눈 뜨면 잡아먹는다, 넷, 다섯, 여섯!*\n가운데 아이가 눈을 뜨고 뛰쳐나간다. 아이들이 비명을 지르며 흩어진다.\n{pass(ENCYCLOPEDIA, 9)} ENCYCLOPEDIA: \"재빛 왜가리\" 동요. 솔레아 아이들의 술래잡기 노래다. 레테 하구의 전설적인 새에 관한. 가사는 동네마다 조금씩 다르다. 어떤 동네에서는 왜가리가 잡아먹지 않고, 대신 잊은 것을 돌려준다.\n* 아이들에게 보보를 아느냐고 묻는다.\n  아이들이 멈춘다. 서로를 본다.\n  KID: 보보? 선장 속에서 이 집만 조용하다.\n+ 이네스의 방을 본다. -> hc_ines_room\n+ 보보의 구석을 본다. -> hc_bobo_corner\n+ 부엌을 본다. -> hc_kitchen\n+ 집을 나간다. -> END\n\n=== hc_ines_room\n작은 방. 좁은 침대, 옷장, 거울. 벽에 탱고 공연 포스터 몇 장. \"레테 무도장 — 이네스 이바라와 파코 에스피노사 오르케스타\". 포스터 속의 여자는 검은 드레스를 입고, 한쪽 다리를 파트너의 허리에 감고, 카메라를 노려본다. 화가 난 사람처럼. 아름답게.\n{pass(PERCEPTION, 8)} PERCEPTION: 옷장 문이 반쯤 열려 있다. 옷걸이 몇 개가 비었다. 급하게 몇 벌만 챙겼다. 겨울 코트는 가져갔다. 추운 곳에 갔다.\n* 거울을 본다.\n  거울 틀에 사진 몇 장이 끼워져 있다. 아버지와 찍은 것. 보보가 아기였을 때. 무도장 동료들과. 그리고 하나.\n  부두 사진관의 싸구려 배경 앞. 안경을 쓴 키 큰 남자가 뻣뻣하게 서 있다. 차렷 자세. 카메라가 무서운 사람처럼. 그리고 여자가 그의 넥타이를 잡아당기며 웃고 있다. 크게. 머리를 뒤로 젖히고.\n  {victim_named || autopsy_done} 얀 트로스트다. 크레인의 남자. 살아 있는 얼굴. 긴장하고, 어색하고, 행복한.\n  사진 뒤에 글씨. \"7강 끝난 날. 그는 내 발을 네 번 밟았다. 나는 네 번 웃었다.\"\n  EMPATHY: 포스터 속의 여자는 화가 나 있다. 사진 속의 여자는 웃고 있다. 같은 여자다. 그 사이에 한 남자가 있었다.\n  ~ item add ev_photo\n  ~ ines_known = 1\n  ~ ines_named = 1\n  ~ xp 10\n* 침대 밑과 베개 밑을 본다.\n  베개 밑에 편지 한 장. 접혀서, 여러 번 펼쳤다 접은 자국.\n  -> hc_jan_letter\n* 책상 서랍을 연다.\n  서랍 안에 연필로 그린 지도 한 장. 어린아이의 그림 위에 어른의 글씨가 덧쓰여 있다.\n  만의 섬. 네모난 요새. 요새 안쪽 한 곳에 X. 그 옆에 아이 글씨. \"우리 비밀 장소!\" 그리고 어른 글씨, 굵고 투박한. \"화약고. 썰물 때만. 아빠랑 이네스만 아는 곳. 절대 혼자 가지 말 것.\"\n  LOGIC: 조수 요새. 화약고. 토마스가 딸에게 보여 준 비밀 장소. 아버지와 딸만 아는.\n  EMPATHY: 그녀는 아버지를 잃었다. 그리고 사랑하는 사람을 잃었다. 그리고 아버지의 비밀 장소로 갔다. 그곳이 세상에서 유일하게 안전한 곳이니까.\n  ~ ines_where = 1\n  ~ ines_where_count += 1\n  ~ ines_map = 1\n  ~ xp 15\n+ 방을 나온다. -> hc_ibarra\n\n=== hc_jan_letter\n서툰 솔레아 방언. 철자가 틀린 곳이 여럿. 사전을 옆에 두고 한 단어씩 쓴 글씨.\n\"케리아.\n나는 이 말을 사전에서 찾았어요. 사랑하는 이. 부두에서는 케리아라고 발음한대요. 맞게 썼는지 모르겠어요.\n나는 당신의 말을 배우고 있어요. 당신의 춤도. 둘 다 서툴러요. 당신은 웃어요. 나는 당신이 웃는 게 좋아서 일부러 더 서툴게 하는 것 같아요. 아니에요. 나는 진짜로 서툴러요.\n보고서가 거의 끝났어요. 당신 아버지 잘못이 아니었어요. 나는 그걸 증명할 거예요. 종이로. 종이는 느리지만, 종이는 남아요.\n목요일 밤에 옥상에서. 7강. 발 안 밟을게요. 약속은 못 해요.\n— 당신의 서툰 학생, J.\"\n{pass(EMPATHY, 8)} EMPATHY: 그는 종이를 믿었다. 느리지만 남는 것을. 그리고 그 종이 때문에 옥상에 올라갔다.\nLIMBIC: 너도 편지를 썼지. 마리솔한테. 한 번도 부치지 않은. 이 사람은 부쳤어. 적어도 그건.\n~ jan_letter_read = 1\n~ ines_known = 1\n~ morale -1\n-> hc_ines_room\n\n=== hc_bobo_corner\n부엌 한쪽 구석에 해먹이 걸려 있다. 해먹 위에 담요가 개어져 있다. 닷새 동안 펴지지 않았다.\n벽에 붉은 천이 핀으로 꽂혀 있다. 해골 대신 등불이 그려진 해적 깃발. 크레용으로. \"혁명 해적단 — 선장 보보, 제독 이네스(누나)\".\n그 밑에 나무 상자. 장난감 배 몇 척, 조개껍데기, 녹슨 못, 코뮌 영웅 만화책 한 무더기. 표지에 붉은 깃발을 든 하역부들. \"바리케이드의 소년 영웅 — 제7권\".\n* 만화책을 넘겨 본다.\n  \"바리케이드의 소년 영웅\". 코뮌 시대의 선전 만화를 협약 시대에 몰래 다시 찍은 것. 열두 살 소년이 협약 해병대와 싸운다. 누나를 지키려고. 마지막 장면에서 소년은 할아버지의 총을 들고 해병을 쏜다. \"누나에게 손대지 마라!\" 해병이 쓰러진다. 누나가 소년을 안는다. \"나의 영웅!\"\n  HALFLIGHT: 누나에게 손대지 마라.\n  LOGIC: 만화다. 아이들은 만화를 읽는다. 이건 증거가 아니다.\n  LOGIC: 하지만 이 페이지만 손때가 까맣다. 수백 번 펼쳐 본 페이지다.\n  ~ comic_seen = 1\n  ~ bobo_suspect = 1\n* 공책을 본다.\n  나무 상자 밑에 학교 공책 한 권. \"보보 이바라 — 솔레아 제2초등학교 5학년\". 넘기면 받아쓰기, 산수, 그리고 글짓기 한 편. 삐뚤빼뚤한 글씨.\n  \"나의 꿈. 나는 커서 혁명 해적단 선장이 될 것이다. 협약 배를 털고 회사 놈들을 바다에 빠뜨리고 가난한 사람들한테 생선을 나눠 줄 것이다. 그리고 누나를 지킬 것이다. 아빠가 없으니까 이제 내가 누나를 지켜야 한다. 누나를 괴롭히는 놈은 내가 가만두지 않을 것이다. 끝.\"\n  선생님의 빨간 글씨. \"씩씩하구나! 그런데 해적은 좋은 직업이 아니란다.\"\n  EMPATHY: 날짜를 본다. 5주 전. 아버지가 죽고 1주일 뒤.\n  ~ bobo_essay = 1\n  ~ morale -1\n-\n+ 구석에서 물러난다. -> hc_ibarra\n\n=== hc_kitchen\n작은 부엌. 석유 풍로, 냄비 두 개, 양파 한 줄. 식탁 위의 마른 빵, 접시 두 개, 컵 두 개. 한 컵에는 우유가 말라붙었다. 아이 컵이다.\n벽에 달력. 날짜마다 연필로 X. 닷새 전 날짜에서 X가 멈췄다. 그 날짜 칸에 적힌 글씨. \"7강 — 옥상, 자정. 보보는 일찍 재울 것.\"\nLOGIC: \"보보는 일찍 재울 것.\" 이네스는 동생을 재우고 옥상에 가려 했다. 동생이 모르게.\nHALFLIGHT: 그런데 동생은 자지 않았다. 아니면 다른 곳에서 잤다. 본부에서. 지붕에서.\n~ calendar_seen = 1\n~ bobo_suspect = 1\n+ 부엌을 나온다. -> hc_ibarra\n\n// ───────── 비상계단과 지붕 다리 ─────────\n\n=== hc_fireescape\n벌집 뒤쪽의 비상계단은 레테 무도장 쪽으로 나 있다. 쇠 계단을 5층까지 오르면 평평한 지붕이다. 그리고 그 지붕 가장자리에서, 1미터 반쯤 떨어진 곳에 레테 무도장의 옥상이 있다.\n두 지붕 사이에 판자 하나가 걸쳐 있다. 두께 3센티미터, 폭 20센티미터. 한쪽 끝이 벽돌로 눌려 있다. 누군가 자주 건너는 다리다. 가벼운 누군가.\n{!plank_seen} VISUAL: 판자 아래로 5층. 약 16미터. 레테 뒷마당의 쓰레기통이 성냥갑처럼 작다.\n{!plank_seen} ~ plank_seen = 1\n+ [SAVOIR 9] 판자를 건넌다. 팔을 벌리고. -> hc_plank_ok | hc_plank_fail\n+ {met_yun} [COMPOSURE 8 +2 met_yun \"윤 경위가 판자 끝을 잡아 준다\"] 윤 경위가 판자를 붙잡는 동안, 아래를 보지 않고 건넌다. -> hc_plank_ok | hc_plank_fail\n+ {roof_open || fire_ladder_down} 판자는 그만두고, 다른 길로 가겠다. -> END\n+ 내려간다. -> END\n\n=== hc_plank_ok\n당신은 판자에 한 발을 올린다. 판자가 휜다. 두 번째 발. 팔을 벌린다. 한 걸음, 두 걸음. 바람이 셔츠를 부풀린다. 아래는 보지 않는다. 세 걸음, 네 걸음.\n그리고 레테의 옥상. 타르칠한 바닥이 발밑에서 부드럽다.\nSAVOIR: 봤지? 우리는 지붕 위의 탱고꾼이야.\n{met_yun} 윤 경위가 뒤따라 건넌다. 팔도 벌리지 않고. 갑판 위를 걷듯이.\n~ plank_crossed = 1\n=> roof 3\n\n=== hc_plank_fail\n당신은 판자에 한 발을 올린다. 판자가 휜다. 두 번째 발. 판자가 흔들린다. 당신은 아래를 본다.\n16미터 아래의 쓰레기통. 고양이 한 마리가 올려다본다.\n당신은 뒷걸음질 친다. 벌집 지붕으로. 무릎이 떨린다. 판자가 덜컹거리며 제자리로 돌아온다.\nHALFLIGHT: 안 돼. 안 돼. 거긴 우리가 갈 길이 아니야. 어른은 저기로 안 가. 아이만 가.\n~ morale -1\n-> END\n");
  load("17_roof.tl", "// ─────────────────────────────────────────────\n// 17. 레테 무도장 옥상 — 사건 현장\n// ─────────────────────────────────────────────\n\n=== roof @location name=\"레테 무도장 옥상\" art=roof travel=2\n{first} 옥상은 생각보다 넓다. 무도장 건물 전체를 덮는 평평한 지붕. 바닥은 검은 방수 타르로 칠해져 있고, 햇볕에 달아올랐다 식기를 반복해 곳곳이 물집처럼 부풀었다. 발을 디딜 때마다 조금 끈적하다.\n{first} 한쪽에 커다란 나무 물탱크가 네 다리로 서 있다. 그 옆에 판자로 지은 비둘기장. 사람 키만 한 높이의 받침대 위에 올라앉은, 작은 오두막 같은 것. 둥근 출입구들로 비둘기들이 드나든다. 비둘기장 문에 페인트로 삐뚤빼뚤한 글씨. \"출입 금지 — 해적만!\"\n{first} 반대편, 바다 쪽 가장자리에는 난간이 둘러진 작은 테라스. 화분 몇 개, 부서진 등나무 의자 하나. 무도장이 잘나가던 시절 여름밤 손님들이 바람을 쐬던 곳이다. 난간 너머로 부두와 크레인들이 한눈에 보인다. 일곱 번째 크레인이 바로 저기, 손을 뻗으면 닿을 듯이.\n{first} 그리고 발밑, 테라스 바닥에서 비둘기장 쪽을 향해, 네온사인의 뒷면이 거대한 철골 틀로 서 있다. L, E, T, H, E. 뒤에서 보면 글자들이 거꾸로다.\n{first} SHIVERS[10]: 여기다. 도시가 숨을 멈춘다. 이 지붕은 닷새 동안 비밀을 품고 있었다. 비둘기들이 그것을 안다. 타르가 그것을 안다. 바람이 이 지붕을 지날 때마다 조금 느려진다.\n{!first && !night} 레테의 옥상. 물탱크, 비둘기장, 테라스, 거꾸로 선 네온. 비둘기들이 구구거린다.\n{!first && night} 밤의 옥상. 네온사인의 붉은빛이 타르 바닥을 핏빛으로 물들인다. 비둘기장 안이 조용하다. 너무 조용하다.\n+ 테라스를 조사한다. -> roof_terrace\n+ {!roof_glasses} 테라스의 화분들 사이를 살핀다. -> roof_pots\n+ {!roof_shoe} 지붕 가장자리의 빗물받이를 따라 걷는다. -> roof_gutter\n+ 비둘기장을 본다. -> roof_loft\n+ 물탱크를 본다. -> roof_tank\n+ {roof_searched} [VISUAL 11] 그날 밤을 재구성한다. -> roof_recon_ok | roof_recon_fail\n+ 난간에 기대 크레인을 본다. -> roof_view\n+ {met_yun} 윤 경위와 이야기한다. -> yun_hub\n+ {roof_open} 계단 문으로 무도장에 내려간다. => hall 2\n+ 비상계단으로 뒷마당에 내려간다. -> roof_down_fire\n+ {plank_crossed} 판자를 건너 벌집 지붕으로 간다. => honeycomb 3\n\n=== roof_down_fire\n{!fire_ladder_down} 비상계단은 녹슨 철골이다. 한 층 내려갈 때마다 건물 전체가 조금씩 삐걱거린다. 맨 아래 층계참에서 접이식 사다리가 걸쇠에 걸린 채 공중에 들려 있다. 당신은 걸쇠를 풀고 사다리를 내린다. 끼이이익. 사다리 끝이 뒷마당 자갈에 닿는다.\n{!fire_ladder_down} LOGIC: 이제 아래에서도 올라올 수 있다. 닷새 전 새벽의 그 남자들처럼.\n~ fire_ladder_down = 1\n=> backyard 3\n\n// ───────── 테라스 ─────────\n\n=== roof_terrace\n~ roof_searched_count += 1\n테라스는 작다. 가로세로 5미터쯤. 타르 바닥, 낮은 난간, 화분 여섯 개. 부서진 등나무 의자.\n{first} PERCEPTION: 바닥의 타르에 무수한 긁힌 자국이 있다. 대부분은 오래되었다. 그런데 한가운데, 난간에서 두 걸음쯤 떨어진 곳에 새 자국들이 겹쳐 있다. 곡선. 반원. 8자. 가죽 밑창이 타르 위를 미끄러진 자국.\n{first} SAVOIR: 오초. 히로. 여기서 누군가 춤을 췄다. 두 사람이. 한 사람은 작은 굽, 한 사람은 가죽 밑창. 가죽 밑창은 가끔 엉뚱한 곳에 멈췄다. 초보자.\n{first && has.ev_tar} LOGIC: 얀 트로스트의 구두 밑창에 묻은 타르와 깃털. 여기다.\n* [PERCEPTION 9] 바닥을 무릎 꿇고 자세히 본다. -> roof_blood_ok | roof_blood_fail\n* {!roof_brush} 물탱크 옆의 양동이와 솔을 본다.\n  물탱크 다리 옆에 양철 양동이 하나와 뻣뻣한 솔 하나. 양동이 바닥에 물이 말라 갈색 테두리가 남았다. 솔의 털 사이에 무언가 검붉은 것이 끼어 있다.\n  LOGIC: 누군가 여기서 무언가를 씻었다. 박박 문질러서. 그리고 양동이를 치우는 걸 잊었다. 급했다. 혹은 무서웠다.\n  ~ roof_brush = 1\n* <SAVOIR 10> 바닥의 스텝 자국을 따라가 본다.\n  당신은 자국을 따라 걷는다. 가죽 밑창의 자국 위에 당신의 구두를 겹친다. 하나, 둘, 셋. 오초. 멈춤. 앞으로 깊이.\n  자국이 끝나는 곳에서 당신은 멈춘다. 난간 두 걸음 앞. 코르테의 자세로. 가슴을 앞으로 숙이고, 허공의 누군가를 안고.\n  당신의 등 뒤, 왼쪽 위로, 비둘기장이 있다. 받침대 위의 둥근 출입구들이 검은 눈처럼 당신을 본다.\n  HALFLIGHT: 등 뒤. 왼쪽 위. 저기서 보면 이 자세는 어떻게 보일까. 한 남자가 한 여자를 뒤로 꺾어 누르고 있는 것처럼. 여자의 목이 젖혀지고, 여자가 소리를 지르는 것처럼.\n  ~ corte_insight = 1\n  ~ loft_angle = 1\n+ 테라스에서 물러난다. -> END\n\n=== roof_blood_ok\n당신은 무릎을 꿇는다. 타르가 무릎에 들러붙는다. 바닥에 얼굴을 가까이 댄다.\n타르는 검다. 무엇이 묻어도 검다. 그런데 한 곳이 다르다. 난간 앞, 화분 하나가 놓인 자리 옆. 타르의 광택이 다르다. 주변보다 흐릿하고, 표면이 긁혀 있다. 누군가 여기를 세게, 오래 문질렀다. 그 둘레에 옅은 갈색 얼룩이 테를 그리고 있다. 물로 씻긴 피가 타르 틈에 스며들었다가 마른 자국.\n그리고 화분. 테라코타 화분 하나가 원래 자리에서 한 뼘쯤 밀려나 있다. 화분 밑바닥 자국이 타르에 동그랗게 남아 있다. 누군가 화분을 옮겨 얼룩을 가리려 했다. 그리고 원래 자리로 돌려놓지 않았다.\nLOGIC: 여기서 한 사람이 쓰러져 피를 흘렸다. 그리고 누군가 그것을 씻었다. 여기가 얀 트로스트가 죽은 곳이다.\n{lividity_known} VISUAL: 등과 엉덩이의 시반. 그는 여기 누워 있었다. 한두 시간. 평평한 타르 위에. 그다음에 옮겨졌다.\n~ roof_searched = 1\n~ roof_scene_known = 1\n~ task add t_truth\n~ xp 25\n{met_yun} 윤 경위가 무릎을 꿇고 당신 옆에서 얼룩을 본다. 장갑 낀 손가락으로 가장자리를 긁어 봉투에 담는다.\n{met_yun} YUN: 사망 장소. 레테 무도장 옥상 테라스. 적었어요.\n{met_yun} 그녀가 고개를 들어 비둘기장을 본다. 그리고 계단 문을 본다. 그리고 비상계단을 본다.\n{met_yun} YUN: 여기서 크레인까지 시신을 옮기려면 네 명은 있어야 해요. 비상계단으로. 새벽에.\n-> END\n\n=== roof_blood_fail\n당신은 무릎을 꿇고 바닥을 본다. 검다. 전부 검다. 타르는 모든 것을 삼킨다. 당신의 눈이 검은색 위에서 미끄러진다.\n{met_yun} YUN: 형사님. 여기요.\n{met_yun} 그녀가 화분 하나를 가리킨다. 원래 자리에서 한 뼘 밀려난 화분. 그 밑의 타르가 긁혀 있다.\n{met_yun} YUN: 누가 여길 문질렀어요. 세게. 그리고 화분으로 가렸고요.\n{met_yun} ~ roof_searched = 1\n{met_yun} ~ roof_scene_known = 1\n{met_yun} ~ task add t_truth\n{met_yun} ~ yun_trust += 1\n{met_yun} ~ xp 15\n-> END\n\n// ───────── 화분, 빗물받이, 물탱크 ─────────\n\n=== roof_pots\n~ roof_searched_count += 1\n화분 여섯 개. 제라늄이 네 개, 시든 로즈메리 하나, 흙만 남은 하나.\nLIMBIC: 제라늄. 빨간 제라늄. 누군가 창가에 이걸 길렀었지. 누구였더라.\n당신은 화분들 사이를 살핀다. 난간 밑, 화분과 벽 사이의 좁은 틈.\n그 틈에 무언가 반짝인다.\n안경. 둥근 철테. 한쪽 렌즈에 금이 거미줄처럼 가 있다. 다리 하나가 휘었다. 코받침에 아주 작은 갈색 얼룩.\n{spare_glasses} LOGIC: 305호의 예비 안경과 같은 테. 같은 도수일 것이다. 얀 트로스트의 안경이다.\n{!spare_glasses} LOGIC: 시신의 콧등에 있던 안경 자국. 이 안경이다.\nLOGIC: 쓰러질 때 떨어져서 화분 틈으로 튕겨 들어갔다. 현장을 치운 사람들은 이걸 못 봤다. 어두웠으니까.\n~ item add ev_glasses\n~ roof_glasses = 1\n~ xp 10\nEMPATHY: 그는 마지막 순간 이 안경을 통해 그녀를 봤다. 금 간 렌즈 너머로.\n-> END\n\n=== roof_gutter\n~ roof_searched_count += 1\n지붕 가장자리를 따라 함석 빗물받이가 둘러져 있다. 낙엽, 비둘기 깃털, 담배꽁초, 병뚜껑. 비상계단이 붙은 모서리 쪽으로 걷는다.\n모서리에서 빗물받이가 막혀 있다. 무언가 검고 반짝이는 것이 끼어 있다.\n구두. 검은 에나멜, 가느다란 끈이 발등을 X자로 감는. 새것. 오른쪽.\nLOGIC: 얀 트로스트의 다른 한 짝. 시신을 비상계단으로 옮길 때 발에서 벗겨졌다. 빗물받이로 굴러 떨어졌다. 아무도 몰랐다.\nLIMBIC: 너처럼. 너도 한 짝을 잃었었지. 너는 샹들리에에서 찾았어. 이 사람은 빗물받이에서.\n~ item add jan_shoe\n~ roof_shoe = 1\n~ xp 5\n{has.shoes_pair || has.shoe_right} INLAND: 당신은 당신의 한 켤레를 되찾았다. 그에게도 한 켤레를 돌려줄 수 있을 것이다.\n-> END\n\n=== roof_tank\n~ roof_searched_count += 1\n나무 물탱크. 판자 사이로 물이 조금씩 샌다. 다리 밑에 이끼가 끼었다. 사다리가 붙어 있고, 꼭대기에 뚜껑이 있다.\n물탱크 그늘에 무언가 쌓여 있다. 나무 궤짝을 쌓아 만든 벽. 그 뒤에 담요 한 장, 촛농이 굳은 촛대. 누군가 여기 앉아 있었다. 바람을 피해.\n{bobo_base_heard || bobo_base_roof} LOGIC: 해적 본부의 망루일까. 아니면 누군가 망을 보던 자리.\n그리고 궤짝 위에 돌멩이들이 가지런히 쌓여 있다. 부두의 둥근 조약돌. 스무 개쯤. 던지기 좋은 크기.\nHANDEYE: 투척용. 크레인 밑에서 보보가 던지던 돌과 같은 크기. 여기가 보급소다.\n~ bobo_stones = 1\n~ bobo_suspect = 1\n-> END\n\n=== roof_view\n난간에 기댄다. 솔레아가 발밑에 있다. 부두 거리, 경매장, 통조림 공장의 굴뚝, 벌집의 빨래, 교회의 종탑과 붉은 등. 그리고 크레인들. 일곱 번째 크레인이 바로 저기.\n{!body_down} 그리고 그 끝에 그 남자가. 여기서는 얼굴이 보인다. 아니, 보이지 않는다. 갈매기들이 그것을 가져갔다.\n{body_down} 그 끝의 갈고리가 비었다. 바람에 흔들린다.\n{pass(SHIVERS, 9)} SHIVERS: 닷새 전 밤, 이 난간에서 두 사람이 이 풍경을 봤다. 부두의 불빛, 검은 물, 멈춘 크레인들. 그들은 이 도시가 아름답다고 생각했다. 그 생각이 그들의 마지막 생각 중 하나였다. 한 사람에게는.\n{pass(VISUAL, 9)} VISUAL: 여기서 7번 크레인까지 직선거리 180미터. 비상계단, 뒷마당, 골목, 부두 거리. 담요에 싼 85킬로그램을 넷이 들고 가면 20분. 새벽 두 시에서 네 시 사이. 아우렐리오가 크레인 엔진 소리를 들은 게 네 시.\n-> END\n\n// ───────── 비둘기장 — 해적 본부 ─────────\n\n=== roof_loft\n비둘기장은 사람 키만 한 받침대 위에 있다. 판자를 이어 붙인 작은 오두막. 지붕은 함석, 벽에는 둥근 구멍이 여섯 개. 비둘기들이 드나드는 구멍. 받침대에 사다리가 붙어 있다. 오두막 앞쪽에 작은 문. 문에 페인트 글씨. \"출입 금지 — 해적만!\"\n{night && !bobo_away && !bobo_resolved} 오두막 안에서 소리가 난다. 작은 숨소리. 규칙적인. 누군가 잠들어 있다.\n{night && !bobo_away && !bobo_resolved} -> bobo_loft_night\n{!night || bobo_away || bobo_resolved} 오두막은 조용하다. 비둘기들만 구구거린다.\n+ {!loft_searched} 사다리를 올라가 문을 연다. -> roof_loft_inside\n+ {loft_searched} 다시 오두막 안을 본다. -> roof_loft_again\n+ [VISUAL 9] 오두막의 구멍에서 테라스까지의 각도를 잰다. -> roof_loft_angle_ok | roof_loft_angle_fail\n+ 물러선다. -> END\n\n=== roof_loft_angle_ok\nVISUAL: 비둘기장 바닥은 옥상 바닥에서 1.6미터 위. 오두막 앞면 오른쪽에서 두 번째 구멍, 지름 15센티미터. 거기서 테라스의 스텝 자국 끝까지, 난간 두 걸음 앞까지 직선거리 6.8미터.\nVISUAL: 그 구멍에 눈을 대면, 코르테 자세의 남자의 왼쪽 어깨 윗면이 정면으로 보인다. 목과 어깨가 만나는 움푹한 자리. 위에서 아래로 약 40도.\n{found_wound} VISUAL: 상처의 입사 각도와 일치한다. 이 구멍이다.\n~ loft_angle = 1\n~ bobo_suspect = 1\n~ xp 15\n-> roof_loft\n\n=== roof_loft_angle_fail\nVISUAL: 비둘기장. 테라스. 거리가 있다. 각도가 있다. 숫자들이 머릿속에서 서로 부딪힌다. 숙취가 계산기를 흔든다.\n-> roof_loft\n\n=== roof_loft_inside\n~ loft_searched = 1\n당신은 사다리를 오른다. 받침대가 삐걱거린다. 문은 잠겨 있지 않다. 문고리 대신 끈이 매여 있다. 끈을 풀고 문을 연다.\n비둘기 세 마리가 당신 얼굴 앞으로 날아 나간다. 깃털, 먼지, 비둘기 냄새.\n안은 좁다. 어른은 무릎을 꿇어야 한다. 벽을 따라 비둘기 둥지 칸들이 있고, 바닥 한가운데에 담요가 깔려 있다. 담요 위에 베개 대신 둘둘 만 스웨터. 촛농이 굳은 병. 코뮌 영웅 만화책 몇 권. 그리고 벽에 핀으로 꽂힌 크레용 그림들.\n-> roof_loft_items\n\n=== roof_loft_again\n당신은 다시 무릎을 꿇고 오두막 안을 본다. 담요, 촛농, 만화책, 크레용 그림들.\n-> roof_loft_items\n\n=== roof_loft_items\n+ {!has.ev_drawing} 벽의 그림들을 본다. -> roof_drawings\n+ {!holster_found} 담요 밑을 들춘다. -> roof_holster\n+ {!loft_tin} 구석의 양철 비스킷 상자를 연다. -> roof_tin\n+ 오두막 구멍으로 테라스를 내다본다. -> roof_loft_hole\n+ 오두막에서 나온다. -> END\n\n=== roof_drawings\n크레용 그림 다섯 장. 아이의 그림.\n첫 번째. 크레인과 남자. 남자는 크레인 운전실에 있다. 크게 웃는다. \"아빠\".\n두 번째. 무너진 크레인. 검은 크레용으로 마구 칠했다. 종이가 찢어질 만큼.\n세 번째. 긴 머리의 여자와 작은 남자아이. 손을 잡고 있다. 둘 다 해적 모자를 썼다. \"제독 누나와 선장 나\".\n네 번째. 망원경을 든 남자. 초록 재킷, 콧수염. 옆에 삐뚤삐뚤한   load("18_night.tl", "// ─────────────────────────────────────────────\n// 18. 밤 — 세 개의 꿈\n//   dream_1 : 1일차 밤 — 익사한 왕의 연회\n//   dream_2 : 2일차 밤 — 비둘기장\n//   dream_3 : 3일차 밤 — 마지막 탱고 → 4일차 새벽\n// ─────────────────────────────────────────────\n\n=== ev_dressed @event repeat on=end when=\"active.t_dress && wear.shirt_silk && wear.trousers_flare\" priority=5\n~ task done t_dress\n-> END\n\n// ═════════════════ 첫째 밤 ═════════════════\n\n=== dream_1\n~ art dream\n불을 끈다. 어둠이 방 안으로 물처럼 차오른다. 처음에는 발목까지, 그다음에는 무릎까지. 차갑지 않다. 체온과 같은 온도의 물. 당신은 그것이 물이라는 것을 한참 뒤에야 알아차린다.\n침대가 가라앉는다. 방이 가라앉는다. 레테 무도장 전체가 천천히, 아주 천천히, 강바닥으로 내려간다. 창밖으로 물고기들이 지나간다. 네온사인의 붉은 글자 L, E, T, H, E가 거품 속에서 깜빡인다.\nINLAND: 괜찮아. 숨 쉬어도 돼. 여기서는 모두가 물을 숨 쉰다.\n---\n당신은 긴 계단을 내려가고 있다. 대리석 계단. 한 칸마다 따개비가 붙어 있고, 난간에는 해초가 감겨 있다. 계단 끝에서 빛이 새어 나온다. 초록빛. 샹들리에의 빛이 물을 통과하면 그런 색이 된다.\n문이 열린다. 저절로.\n무도회장이다. 왕궁의 무도회장. 천장은 너무 높아서 보이지 않고, 샹들리에 수십 개가 조개껍데기로 뒤덮인 채 흔들린다. 바닥은 체스판 무늬 대리석. 그 위에서 수백 명이 춤을 추고 있다. 느리게. 물속에서만 가능한 속도로.\n그들은 모두 젖어 있다. 선원복, 연미복, 앞치마, 작업복. 머리카락이 해초처럼 떠올라 있다. 그들의 눈은 뜨여 있지만 아무것도 보지 않는다. 춤추는 사람들은 서로의 얼굴을 보지 않는다. 그들은 자기 이름도 모른다.\nSHIVERS: 이 사람들은 썰물을 건넌 배의 선원들이다. 그리고 레테에 몸을 던진 사람들. 그리고 그저 잊힌 사람들. 도시가 잊어버린 사람들은 모두 여기로 온다.\n---\n무도회장 끝, 연단 위에 긴 식탁이 있다. 식탁 위에는 음식이 차려져 있다. 은쟁반 위의 굴, 녹아내리는 케이크, 소금에 절인 레몬, 병째 놓인 럼. 모든 것이 물속에서 천천히 흔들린다.\n식탁 머리에 한 남자가 앉아 있다.\n왕관. 초록색으로 녹슨 청동 왕관. 흰 제복, 금색 견장, 가슴에 훈장들. 그의 소매 끝에서 물이 흘러내린다. 물속인데도. 그의 얼굴은 부어 있고 창백하지만 위엄이 있다. 그는 당신을 기다리고 있었다.\nKING: 늦었군, 경찰.\nKING: 앉게. 자네 자리는 늘 비워 두었네. 52년 동안.\n~ dream1 = 1\n* 앉는다.\n  당신은 의자를 당겨 앉는다. 의자가 무겁다. 물이 무릎을 누른다.\n* \"당신은 누구요?\"\n  KING: 아우렐리오. 네 번째이자 마지막. 한때 바다의 여왕이던 도시의 왕. 지금은 이 무도회의 주인.\n  KING: 나는 계단을 걸어 내려갔지. 왕궁 계단을. 하나, 둘, 셋. 물이 발목에, 무릎에, 가슴에. 백성들은 광장에서 노래를 불렀어. \"우리는 잊지 않으리.\" 그리고 그들은 잊었네. 나를. 금방.\n  ENCYCLOPEDIA: 익사한 왕. 조수 혁명의 마지막 날. 시신은 끝내 발견되지 않았다. 당연하다. 그는 여기 있으니까.\n* \"나는 경찰이 아니오. 나는…… 나는 모르겠소.\"\n  KING: 그래서 여기 온 걸세.\n-\nKING: 이곳에 오는 사람은 모두 무언가를 잊으러 오지. 이름을. 사랑을. 죄를. 레테의 물은 친절해. 다 가져가 주지.\nKING: 자네는 무엇을 잊으러 왔나?\n* \"내 이름.\"\n  KING: 이름.
