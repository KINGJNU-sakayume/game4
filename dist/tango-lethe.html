<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>탱고 레테</title>
<meta name="description" content="망각의 강 하구, 파업 중인 항구, 크레인에 매달린 남자. 기억을 잃은 형사의 텍스트 수사 RPG.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Poiret+One&family=Song+Myung&display=swap">
<style>
/* 탱고 레테 — 스타일
 * 한 가지 세계에 전념한 어두운 디자인: 솔레아 항구의 밤.
 * 젖은 아스팔트의 청록빛 검정, 나트륨 가로등의 호박색, 네 가지 속성 색.
 */
:root {
  color-scheme: dark;
  --ink: #0d1214;
  --ink-2: #131a1c;
  --ink-3: #1a2326;
  --ink-4: #232e30;
  --line: #2a3535;
  --line-2: #3a4847;
  --paper: #ddd5c4;
  --paper-2: #bdb4a2;
  --paper-dim: #8d877a;
  --paper-faint: #5f5b53;
  --sodium: #e39b3f;
  --sodium-2: #f0b865;
  --sodium-dim: #8f6530;
  --rust: #c9513d;
  --tide: #5f93bd;
  --int: #63aecb;
  --psy: #a08ad9;
  --fys: #d2604b;
  --mot: #d2b556;
  --red-check: #dc5b49;
  --white-check: #ece5d6;
  --ok: #8fbf7a;
  --bad: #d9674f;
  --font-body: 'Gowun Batang', 'Noto Serif KR', 'Nanum Myeongjo', 'AppleMyungjo', 'Batang', serif;
  --font-ui: 'IBM Plex Sans KR', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --font-display: 'Song Myung', 'Gowun Batang', 'Noto Serif KR', serif;
  --font-deco: 'Poiret One', 'Song Myung', serif;
  --fs: 17px;
  --gutter: clamp(16px, 3.6vw, 44px);
  --ease: cubic-bezier(.2, .7, .2, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: var(--fs);
  line-height: 1.78;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid var(--sodium);
  outline-offset: 2px;
}
[hidden] { display: none !important; }

#app { height: 100%; position: relative; }
.screen { height: 100%; }

/* ───────────── 공용 버튼 ───────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  background: transparent;
  border: 1px solid var(--line-2);
  color: var(--paper);
  font-family: var(--font-ui);
  font-size: .86rem;
  letter-spacing: .04em;
  padding: .55em 1.1em;
  cursor: pointer;
  transition: border-color .15s, color .15s, background .15s;
}
.btn:hover { border-color: var(--sodium); color: var(--sodium-2); }
.btn:disabled { opacity: .35; cursor: default; border-color: var(--line); color: var(--paper-dim); }
.btn.primary { border-color: var(--sodium); color: var(--sodium-2); }
.btn.primary:hover { background: rgba(227, 155, 63, .12); }
.btn.small { font-size: .76rem; padding: .35em .75em; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }

/* ───────────── 타이틀 화면 ───────────── */
#screen-title { position: relative; overflow: hidden; background: #070a0c; }
#title-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.title-inner {
  position: relative; z-index: 2; height: 100%;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding-inline: var(--gutter);
  padding-block: 8vh 7vh;
  max-width: 1100px;
}
.logo {
  font-family: var(--font-deco);
  font-weight: 400;
  font-size: clamp(3rem, 11vw, 8.6rem);
  line-height: .9;
  letter-spacing: .06em;
  margin: 0;
  color: #ffe9e4;
  text-shadow: 0 0 6px rgba(255, 110, 120, .9), 0 0 22px rgba(255, 70, 90, .55), 0 0 60px rgba(255, 60, 80, .35);
}
.logo .flick { animation: flicker 7s infinite steps(1); }
@keyframes flicker {
  0%, 18%, 22%, 62%, 64%, 100% { opacity: 1; }
  19%, 21%, 63% { opacity: .25; }
}
.logo-ko {
  font-family: var(--font-display);
  font-size: clamp(1.1rem, 2.6vw, 1.6rem);
  letter-spacing: .5em;
  color: var(--paper-2);
  margin: .9rem 0 0 .2em;
}
.title-quote {
  font-family: var(--font-body);
  color: var(--paper-dim);
  max-width: 34em;
  margin: 2.2rem 0 2.4rem;
  font-size: .95rem;
  line-height: 1.9;
}
.title-menu { display: flex; flex-wrap: wrap; gap: .6rem; }
.title-menu .btn { min-width: 9.5em; padding-block: .75em; background: rgba(8, 11, 13, .55); backdrop-filter: blur(2px); }
.title-foot {
  position: absolute; z-index: 2; right: var(--gutter); bottom: 2.2vh;
  font-family: var(--font-ui); font-size: .72rem; color: var(--paper-faint); letter-spacing: .08em;
}

/* ───────────── 캐릭터 생성 ───────────── */
#screen-create {
  overflow-y: auto;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(99, 174, 203, .08), transparent 55%),
    radial-gradient(ellipse at 90% 100%, rgba(227, 155, 63, .07), transparent 50%),
    var(--ink);
}
.create-inner { max-width: 1180px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 40px 60px; }
.create-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.6rem; }
.create-head h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.6rem, 3.4vw, 2.3rem); margin: 0; text-wrap: balance; }
.create-head p { margin: 0; color: var(--paper-dim); font-size: .92rem; max-width: 40em; }
.arch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: 14px; }
.arch {
  text-align: left; cursor: pointer;
  background: var(--ink-2);
  border: 1px solid var(--line);
  padding: 18px 18px 16px;
  display: flex; flex-direction: column; gap: .7rem;
  transition: border-color .15s, transform .2s var(--ease);
}
.arch:hover { border-color: var(--line-2); transform: translateY(-2px); }
.arch.sel { border-color: var(--sodium); box-shadow: inset 0 0 0 1px var(--sodium-dim); }
.arch-en { font-family: var(--font-ui); font-size: .7rem; letter-spacing: .22em; color: var(--paper-dim); }
.arch-name { font-family: var(--font-display); font-size: 1.55rem; line-height: 1.2; }
.arch-desc { font-size: .88rem; color: var(--paper-2); line-height: 1.7; flex: 1; }
.attr-bars { display: grid; gap: 5px; }
.attr-bar { display: grid; grid-template-columns: 3.4em 1fr 1.4em; align-items: center; gap: 8px; font-family: var(--font-ui); font-size: .74rem; }
.attr-bar .pips { display: flex; gap: 3px; }
.attr-bar .pip { flex: 1; height: 7px; background: var(--ink-4); }
.attr-bar .pip.on { background: currentColor; }
.attr-bar .num { text-align: right; font-variant-numeric: tabular-nums; }
.create-section { margin-top: 2.2rem; }
.create-section h3 { font-family: var(--font-ui); font-weight: 600; font-size: .8rem; letter-spacing: .18em; color: var(--paper-dim); margin: 0 0 .9rem; text-transform: uppercase; }
.custom-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.custom-attr { background: var(--ink-2); border: 1px solid var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: .5rem; }
.custom-attr .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.custom-attr .nm { font-family: var(--font-display); font-size: 1.25rem; }
.custom-attr .en { font-family: var(--font-ui); font-size: .66rem; letter-spacing: .2em; color: var(--paper-dim); }
.stepper { display: flex; align-items: center; gap: 6px; font-family: var(--font-ui); }
.stepper button { width: 2em; height: 2em; border: 1px solid var(--line-2); background: transparent; cursor: pointer; }
.stepper button:hover:not(:disabled) { border-color: var(--sodium); color: var(--sodium-2); }
.stepper button:disabled { opacity: .3; cursor: default; }
.stepper .val { min-width: 1.6em; text-align: center; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.custom-attr p { margin: 0; font-size: .8rem; color: var(--paper-dim); line-height: 1.6; }
.points-left { font-family: var(--font-ui); font-size: .85rem; color: var(--sodium-2); margin-bottom: .8rem; }
.sig-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.sig-col h4 { font-family: var(--font-ui); font-size: .72rem; letter-spacing: .2em; margin: 0 0 .5rem; }
.sig-list { display: grid; gap: 4px; }
.sig {
  display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
  text-align: left; cursor: pointer; background: var(--ink-2); border: 1px solid var(--line);
  padding: .5em .75em; font-family: var(--font-ui); font-size: .84rem;
}
.sig:hover { border-color: var(--line-2); }
.sig.sel { border-color: var(--sodium); background: rgba(227, 155, 63, .08); }
.sig .lv { font-variant-numeric: tabular-nums; color: var(--paper-dim); }
.sig-detail { margin-top: 1rem; background: var(--ink-2); border-left: 3px solid var(--sodium-dim); padding: 14px 18px; font-size: .9rem; color: var(--paper-2); white-space: pre-line; max-width: 60em; }
.create-foot { margin-top: 2.2rem; display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; justify-content: space-between; }
.create-summary { font-family: var(--font-ui); font-size: .82rem; color: var(--paper-dim); }

/* ───────────── 게임 화면 ───────────── */
#screen-game { display: grid; grid-template-columns: minmax(300px, 41%) 1fr; height: 100%; }
.scene { position: relative; overflow: hidden; background: #05080a; min-height: 0; }
.scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(5, 8, 10, .55) 0%, transparent 22%, transparent 62%, rgba(5, 8, 10, .85) 100%);
}
.place {
  position: absolute; z-index: 2; left: var(--gutter); right: var(--gutter); top: 22px;
  display: flex; flex-direction: column; gap: .15rem;
}
.place-name { font-family: var(--font-display); font-size: clamp(1.35rem, 2.4vw, 2rem); line-height: 1.2; text-shadow: 0 2px 12px rgba(0, 0, 0, .8); text-wrap: balance; }
.place-sub { font-family: var(--font-ui); font-size: .74rem; letter-spacing: .16em; color: var(--paper-2); text-shadow: 0 1px 6px #000; font-variant-numeric: tabular-nums; }
.hud {
  position: absolute; z-index: 2; left: var(--gutter); right: var(--gutter); bottom: 18px;
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px;
  font-family: var(--font-ui);
}
.vitals { display: grid; gap: 6px; }
.vital { display: flex; align-items: center; gap: 8px; font-size: .74rem; letter-spacing: .08em; }
.vital .lbl { width: 2.6em; color: var(--paper-2); }
.vital .pips { display: flex; gap: 4px; flex-wrap: wrap; max-width: 220px; }
.vital .pip { width: 13px; height: 13px; border: 1px solid; transform: rotate(45deg); }
.vital.h .pip { border-color: var(--rust); }
.vital.h .pip.on { background: var(--rust); box-shadow: 0 0 8px rgba(201, 81, 61, .6); }
.vital.m .pip { border-color: var(--tide); }
.vital.m .pip.on { background: var(--tide); box-shadow: 0 0 8px rgba(95, 147, 189, .6); }
.vital .pip.flash { animation: pipflash .8s ease 2; }
@keyframes pipflash { 50% { background: #fff; } }
.hud-right { display: grid; justify-items: end; gap: 4px; text-align: right; }
.money { font-size: .95rem; color: var(--sodium-2); font-variant-numeric: tabular-nums; letter-spacing: .04em; text-shadow: 0 1px 6px #000; }
.lvl { font-size: .72rem; color: var(--paper-2); letter-spacing: .08em; }
.lvl .pts { color: var(--sodium-2); animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { opacity: .45; } }
.tidechip { font-size: .68rem; letter-spacing: .12em; padding: 2px 8px; border: 1px solid var(--line-2); color: var(--paper-2); background: rgba(5, 8, 10, .5); }
.tidechip.low { border-color: #6f8c86; color: #b8d3cc; }

.ledger {
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
  background:
    linear-gradient(90deg, rgba(0, 0, 0, .35), transparent 30px),
    radial-gradient(ellipse at 100% 0%, rgba(227, 155, 63, .05), transparent 60%),
    var(--ink-2);
  border-left: 1px solid var(--line);
}
.toolbar {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end;
  padding: 10px var(--gutter);
  border-bottom: 1px solid var(--line);
  background: rgba(10, 14, 16, .6);
}
.toolbar .btn { font-size: .74rem; padding: .38em .8em; }
.toolbar .btn kbd { font-family: var(--font-ui); font-size: .64rem; color: var(--paper-faint); border: 1px solid var(--line); padding: 0 .35em; }
.toolbar .btn.has-points { border-color: var(--sodium); color: var(--sodium-2); }
.log {
  flex: 1; overflow-y: auto; min-height: 0;
  padding-inline: var(--gutter);
  padding-block: 26px 14px;
  scroll-behavior: smooth;
  overscroll-behavior: contain;
}
.log::-webkit-scrollbar, .choices::-webkit-scrollbar, .panel-body::-webkit-scrollbar { width: 8px; }
.log::-webkit-scrollbar-thumb, .choices::-webkit-scrollbar-thumb, .panel-body::-webkit-scrollbar-thumb { background: var(--line-2); }
.choices {
  padding-inline: var(--gutter);
  padding-block: 12px 18px;
  border-top: 1px solid var(--line);
  max-height: 46%;
  overflow-y: auto;
  display: grid; gap: 2px;
  background: rgba(8, 11, 13, .45);
}

/* 로그 항목 */
.e { margin: 0 0 1em; max-width: 44em; }
.e.fresh { animation: rise .45s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.e.nar { color: var(--paper); }
.e .who {
  font-family: var(--font-ui); font-weight: 600; font-size: .76em; letter-spacing: .08em;
  margin-right: .45em; color: var(--paper);
}
.e .tag { font-family: var(--font-ui); font-size: .7em; color: var(--paper-dim); margin-right: .45em; letter-spacing: .02em; }
.e .dash { color: var(--paper-faint); margin-right: .45em; }
.e.npc .who { color: #f1e9d8; }
.e.skill .txt { color: var(--paper); }
.e.skill.INT .who { color: var(--int); }
.e.skill.PSY .who { color: var(--psy); }
.e.skill.FYS .who { color: var(--fys); }
.e.skill.MOT .who { color: var(--mot); }
.e.voice .who, .e.object .who { font-style: normal; }
.e.voice .txt { font-style: italic; }
.e.object .txt { color: #d9d3e6; }
.e.you {
  color: var(--paper-2);
  padding-left: 1em;
  border-left: 2px solid var(--sodium-dim);
  margin-left: .2em;
}
.e.you .who { color: var(--sodium); }
.e.you .ck { font-family: var(--font-ui); font-size: .72em; margin-right: .45em; }
.e.you .ck.red { color: var(--red-check); }
.e.you .ck.white { color: var(--white-check); }
.e.note {
  font-family: var(--font-ui); font-size: .76em; letter-spacing: .03em;
  color: var(--paper-dim); margin: -.55em 0 .75em; display: flex; gap: .5em; align-items: baseline;
}
.e.note .ic { width: 1.1em; text-align: center; }
.e.note.xp .ic, .e.note.levelup { color: var(--sodium-2); }
.e.note.levelup { font-weight: 600; }
.e.note.item .ic, .e.note.itemloss .ic { color: #c9bfa6; }
.e.note.task, .e.note.taskdone { color: #cfc4a8; }
.e.note.taskfail { color: var(--bad); }
.e.note.thought .ic { color: var(--psy); }
.e.note.hurt, .e.note.heal { color: #e0826f; }
.e.note.hurtm, .e.note.healm { color: #8db6d9; }
.e.note.money .ic, .e.note.moneyloss .ic { color: var(--sodium-2); }
.e.note.info { color: var(--paper-2); }
.e.check {
  font-family: var(--font-ui); font-size: .78em;
  display: flex; flex-wrap: wrap; align-items: center; gap: .45em .7em;
  padding: .45em .8em; margin: -.3em 0 .9em;
  background: rgba(255, 255, 255, .025);
  border: 1px solid var(--line);
  width: fit-content; max-width: 100%;
}
.e.check .dice { font-size: 1.7em; line-height: 1; letter-spacing: .05em; }
.e.check .res { font-weight: 600; letter-spacing: .1em; }
.e.check.ok .res { color: var(--ok); }
.e.check.no .res { color: var(--bad); }
.e.check .sk { font-weight: 600; }
.e.check .math { color: var(--paper-dim); font-variant-numeric: tabular-nums; }
.e.check.red { border-color: rgba(220, 91, 73, .45); }
.e.loc {
  margin: 1.8em 0 1.3em;
  display: flex; align-items: center; gap: 1em;
  font-family: var(--font-display); color: var(--sodium-2); font-size: 1.1em;
}
.e.loc::before, .e.loc::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line-2), transparent); }
.e.loc .t { font-family: var(--font-ui); font-size: .64em; color: var(--paper-dim); letter-spacing: .14em; margin-left: .6em; }
.e.day {
  margin: 2.4em 0 1.6em; text-align: center;
  font-family: var(--font-deco); font-size: 2.1em; letter-spacing: .2em; color: #ffe2d8;
  text-shadow: 0 0 14px rgba(255, 80, 100, .35);
}
.e.day small { display: block; font-family: var(--font-ui); font-size: .32em; letter-spacing: .3em; color: var(--paper-dim); text-shadow: none; }
.e.sep { height: .6em; margin: 0 0 .6em; border-bottom: 1px dashed rgba(58, 72, 71, .5); max-width: 6em; }
.e.ambient { color: var(--paper-dim); font-style: italic; font-size: .92em; }
.e.thought {
  border: 1px solid rgba(160, 138, 217, .45);
  background: linear-gradient(135deg, rgba(160, 138, 217, .08), transparent 70%);
  padding: 14px 18px; white-space: pre-line;
}
.e.thought .th-k { font-family: var(--font-ui); font-size: .68em; letter-spacing: .24em; color: var(--psy); display: block; margin-bottom: .2em; }
.e.thought .th-n { font-family: var(--font-display); font-size: 1.35em; display: block; margin-bottom: .5em; }
.e.thought .th-b { font-family: var(--font-ui); font-size: .76em; color: var(--sodium-2); display: block; margin-top: .7em; }

/* 선택지 */
.choice {
  display: grid; grid-template-columns: 1.8em 1fr; gap: .2em;
  text-align: left; background: transparent; border: 0; cursor: pointer;
  padding: .42em .5em; color: var(--paper-2);
  font-family: var(--font-body); font-size: .98em; line-height: 1.6;
  border-left: 2px solid transparent;
  transition: color .12s, border-color .12s, background .12s;
}
.choice .n { font-family: var(--font-ui); font-size: .8em; color: var(--sodium-dim); padding-top: .15em; font-variant-numeric: tabular-nums; }
.choice:hover, .choice:focus-visible { color: #fff6e4; border-left-color: var(--sodium); background: rgba(227, 155, 63, .06); outline: none; }
.choice:hover .n { color: var(--sodium); }
.choice .ck { font-family: var(--font-ui); font-size: .78em; margin-right: .5em; white-space: nowrap; }
.choice.white .ck { color: var(--white-check); }
.choice.red .ck { color: var(--red-check); }
.choice .pct { font-family: var(--font-ui); font-size: .74em; color: var(--paper-dim); margin-left: .5em; white-space: nowrap; }
.choice .gate { font-family: var(--font-ui); font-size: .74em; font-weight: 600; margin-right: .5em; }
.choice.exit { color: var(--paper-dim); }
.choice.exit .txt::before { content: '→ '; color: var(--sodium-dim); }
.choice.locked { opacity: .45; cursor: not-allowed; }
.choice.locked:hover { background: transparent; border-left-color: transparent; color: var(--paper-2); }
.choice .lockmsg { display: block; font-family: var(--font-ui); font-size: .72em; color: var(--paper-dim); }
.choice.fresh { animation: rise .35s var(--ease) both; }
.continue {
  justify-self: start; margin: .3em 0 .1em;
  font-family: var(--font-ui); font-size: .8rem; letter-spacing: .3em;
  background: transparent; border: 1px solid var(--sodium); color: var(--sodium-2);
  padding: .6em 1.6em; cursor: pointer;
}
.continue:hover { background: rgba(227, 155, 63, .12); }
.continue.fresh { animation: rise .35s var(--ease) both; }

/* ───────────── 패널 ───────────── */
.panel {
  position: absolute; inset: 0; z-index: 30;
  background: rgba(4, 6, 7, .72);
  backdrop-filter: blur(3px);
  display: flex; align-items: stretch; justify-content: center;
  padding: clamp(0px, 2.5vw, 28px);
}
.panel-box {
  width: min(1180px, 100%);
  background: var(--ink-2);
  border: 1px solid var(--line-2);
  display: flex; flex-direction: column; min-height: 0;
  box-shadow: 0 20px 80px rgba(0, 0, 0, .6);
}
.panel-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 12px var(--gutter); border-bottom: 1px solid var(--line);
}
.panel-tabs { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
.tab {
  background: transparent; border: 0; border-bottom: 2px solid transparent; cursor: pointer;
  font-family: var(--font-ui); font-size: .82rem; letter-spacing: .08em; color: var(--paper-dim);
  padding: .5em .8em;
}
.tab:hover { color: var(--paper); }
.tab.on { color: var(--sodium-2); border-bottom-color: var(--sodium); }
.panel-body { flex: 1; overflow-y: auto; padding-inline: var(--gutter); padding-block: 20px 28px; min-height: 0; }
.panel h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; margin: 0 0 .3rem; text-wrap: balance; }
.panel .sub { font-family: var(--font-ui); font-size: .78rem; color: var(--paper-dim); letter-spacing: .06em; }
.split { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(260px, 1fr); gap: 22px; align-items: start; }
.detail {
  position: sticky; top: 0;
  background: var(--ink-3); border: 1px solid var(--line); padding: 16px 18px;
  font-size: .9rem; line-height: 1.75; white-space: pre-line; min-height: 8em;
}
.detail .d-k { font-family: var(--font-ui); font-size: .68rem; letter-spacing: .22em; color: var(--paper-dim); }
.detail .d-t { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.3; margin: .1em 0 .5em; }
.detail .d-m { font-family: var(--font-ui); font-size: .78rem; color: var(--sodium-2); margin-top: .8em; }
.detail .d-a { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 1em; }
.detail .d-q { color: var(--paper-2); }

/* 인물 */
.char-top { display: flex; flex-wrap: wrap; gap: 14px 30px; align-items: baseline; margin-bottom: 18px; }
.xpbar { width: 180px; height: 5px; background: var(--ink-4); position: relative; }
.xpbar i { position: absolute; inset: 0 auto 0 0; background: var(--sodium); }
.attrs4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.attrcol { background: var(--ink-3); border: 1px solid var(--line); padding: 12px 14px 10px; }
.attrcol-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.attrcol-h .an { font-family: var(--font-display); font-size: 1.2rem; }
.attrcol-h .av { font-family: var(--font-ui); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.skillrow {
  display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
  width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid rgba(42, 53, 53, .6);
  padding: .4em .1em; cursor: pointer; font-family: var(--font-ui); font-size: .84rem;
}
.skillrow:hover, .skillrow.on { background: rgba(255, 255, 255, .035); }
.skillrow .sn { display: flex; gap: .5em; align-items: baseline; }
.skillrow .sig { font-size: .64rem; color: var(--sodium); letter-spacing: .1em; border: 0; padding: 0; background: none; }
.skillrow .learned { display: flex; gap: 2px; }
.skillrow .learned i { width: 5px; height: 11px; background: var(--ink-4); }
.skillrow .learned i.on { background: currentColor; }
.skillrow .lv { font-size: 1.05rem; min-width: 1.6em; text-align: right; font-variant-numeric: tabular-nums; }
.skillrow .lv.up { color: var(--ok); }
.skillrow .lv.down { color: var(--bad); }
.plus {
  width: 1.7em; height: 1.7em; border: 1px solid var(--sodium); background: transparent; color: var(--sodium-2);
  cursor: pointer; font-family: var(--font-ui); line-height: 1;
}
.plus:disabled { visibility: hidden; }
.align-list { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--font-ui); font-size: .78rem; color: var(--paper-2); margin-top: 14px; }
.align-list b { color: var(--sodium-2); font-weight: 600; }

/* 사고 캐비닛 */
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 22px; }
.slot {
  min-height: 92px; border: 1px dashed var(--line-2); padding: 10px 12px; cursor: pointer; text-align: left;
  background: transparent; display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
  font-family: var(--font-ui); font-size: .8rem; color: var(--paper-dim);
}
.slot.filled { border-style: solid; border-color: rgba(160, 138, 217, .55); color: var(--paper); background: rgba(160, 138, 217, .06); }
.slot.done { border-color: var(--sodium-dim); background: rgba(227, 155, 63, .06); }
.slot .sn2 { font-family: var(--font-display); font-size: 1.02rem; line-height: 1.3; color: var(--paper); }
.slot .prog { height: 4px; background: var(--ink-4); position: relative; }
.slot .prog i { position: absolute; inset: 0 auto 0 0; background: var(--psy); }
.slot.buy { border-style: dotted; align-items: center; justify-content: center; text-align: center; }
.tlist { display: grid; gap: 6px; }
.titem {
  text-align: left; background: var(--ink-3); border: 1px solid var(--line); cursor: pointer;
  padding: .6em .9em; display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
  font-family: var(--font-ui); font-size: .84rem;
}
.titem:hover, .titem.on { border-color: var(--line-2); background: var(--ink-4); }
.titem .st { font-size: .7rem; color: var(--paper-dim); letter-spacing: .06em; white-space: nowrap; }
.titem .st.r { color: var(--psy); }
.titem .st.d { color: var(--sodium-2); }

/* 소지품 */
.slotgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 10px 0 22px; }
.eqslot {
  text-align: left; background: var(--ink-3); border: 1px solid var(--line); padding: .55em .8em; cursor: pointer;
  font-family: var(--font-ui); font-size: .8rem; min-height: 4.2em; display: flex; flex-direction: column; gap: .2em;
}
.eqslot .k { font-size: .66rem; letter-spacing: .18em; color: var(--paper-dim); }
.eqslot.empty { color: var(--paper-faint); border-style: dashed; }
.eqslot:hover, .eqslot.on { border-color: var(--line-2); }
.cat-h { font-family: var(--font-ui); font-size: .72rem; letter-spacing: .22em; color: var(--paper-dim); margin: 18px 0 8px; }
.itemgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.it {
  text-align: left; background: var(--ink-3); border: 1px solid var(--line); cursor: pointer;
  padding: .55em .8em; font-family: var(--font-ui); font-size: .82rem; display: flex; justify-content: space-between; gap: 6px;
}
.it:hover, .it.on { border-color: var(--line-2); background: var(--ink-4); }
.it .q { color: var(--paper-dim); font-variant-numeric: tabular-nums; }
.it.worn { border-color: var(--sodium-dim); }
.it.ev { border-left: 3px solid var(--int); }

/* 일지 */
.tasks { display: grid; gap: 10px; }
.task { background: var(--ink-3); border: 1px solid var(--line); padding: 12px 16px; }
.task.main { border-left: 3px solid var(--sodium); }
.task.done { opacity: .6; }
.task.failed { opacity: .6; border-left-color: var(--bad); }
.task .tn { font-family: var(--font-display); font-size: 1.12rem; }
.task .ts { font-family: var(--font-ui); font-size: .7rem; color: var(--paper-dim); letter-spacing: .1em; margin-left: .6em; }
.task p { margin: .3em 0 0; font-size: .9rem; color: var(--paper-2); }
.case { display: grid; gap: 12px; }
.case-item { border-left: 2px solid var(--line-2); padding: .2em 0 .2em 1em; }
.case-item .ct { font-family: var(--font-ui); font-size: .72rem; letter-spacing: .2em; color: var(--sodium-2); }
.case-item p { margin: .2em 0 0; font-size: .94rem; }
.empty-note { color: var(--paper-dim); font-size: .9rem; font-style: italic; }

/* 메뉴 */
.menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.saves { display: grid; gap: 6px; }
.saverow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; background: var(--ink-3); border: 1px solid var(--line); padding: .55em .8em; font-family: var(--font-ui); font-size: .8rem; }
.saverow .meta { color: var(--paper-dim); font-size: .72rem; }
.saverow .acts { display: flex; gap: 4px; }
.menu-grid textarea { width: 100%; min-height: 110px; background: var(--ink); color: var(--paper-2); border: 1px solid var(--line-2); font-family: var(--font-ui); font-size: .72rem; padding: 8px; resize: vertical; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: .5em 0; border-bottom: 1px solid var(--line); font-family: var(--font-ui); font-size: .84rem; }
.setting select { background: var(--ink); color: var(--paper); border: 1px solid var(--line-2); padding: .3em .5em; font-family: var(--font-ui); }
.msg { font-family: var(--font-ui); font-size: .78rem; color: var(--sodium-2); min-height: 1.4em; margin-top: 6px; }
.confirm-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-family: var(--font-ui); font-size: .8rem; color: var(--paper-2); }

/* ───────────── 결말 ───────────── */
.ending {
  position: absolute; inset: 0; z-index: 40;
  background: radial-gradient(ellipse at 50% 30%, rgba(40, 20, 26, .9), rgba(3, 4, 5, .97) 70%);
  display: flex; align-items: center; justify-content: center;
  padding-inline: var(--gutter); padding-block: 30px;
  overflow-y: auto;
}
.ending-box { max-width: 720px; width: 100%; text-align: center; animation: rise 1.2s var(--ease) both; }
.ending-k { font-family: var(--font-ui); font-size: .72rem; letter-spacing: .4em; color: var(--paper-dim); }
.ending-t { font-family: var(--font-deco); font-size: clamp(2.2rem, 7vw, 4.2rem); margin: .3em 0 .2em; color: #ffe6de; text-shadow: 0 0 20px rgba(255, 80, 100, .4); line-height: 1.1; }
.ending-s { font-family: var(--font-display); font-size: 1.2rem; color: var(--paper-2); margin-bottom: 1.6em; }
.ending-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 1.4em 0 2em; font-family: var(--font-ui); }
@media (max-width: 520px) { .ending-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ending-stats div { border: 1px solid var(--line); padding: .7em; }
.ending-stats b { display: block; font-size: 1.3rem; color: var(--sodium-2); font-variant-numeric: tabular-nums; }
.ending-stats span { font-size: .72rem; color: var(--paper-dim); letter-spacing: .1em; }
.ending-acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

.toast {
  position: absolute; z-index: 60; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--ink-3); border: 1px solid var(--sodium-dim); color: var(--paper);
  font-family: var(--font-ui); font-size: .82rem; padding: .6em 1.2em; max-width: calc(100% - 32px);
  animation: rise .3s var(--ease) both;
}

.fatal { padding: 30px var(--gutter); font-family: var(--font-ui); color: var(--bad); white-space: pre-wrap; }

/* ───────────── 반응형 ───────────── */
@media (max-width: 900px) {
  :root { --fs: 16px; }
  #screen-game { grid-template-columns: 1fr; grid-template-rows: minmax(150px, 30%) 1fr; }
  .ledger { border-left: 0; border-top: 1px solid var(--line); }
  .place { top: 12px; }
  .hud { bottom: 10px; }
  .vital .pip { width: 10px; height: 10px; }
  .split { grid-template-columns: 1fr; }
  .detail { position: static; }
  .attrs4 { grid-template-columns: 1fr; }
  .choices { max-height: 52%; }
}
@media (max-width: 520px) {
  .toolbar .btn kbd { display: none; }
  .toolbar { justify-content: space-between; }
  .toolbar .btn { flex: 1; padding-inline: .3em; }
  .title-menu .btn { flex: 1 1 40%; min-width: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; scroll-behavior: auto !important; }
}
body.no-anim .e.fresh, body.no-anim .choice.fresh, body.no-anim .continue.fresh { animation: none; }
body.fs-small { --fs: 15px; }
body.fs-large { --fs: 19px; }
body.fs-xlarge { --fs: 21px; }

</style>
</head>
<body>
<div id="app">
  <section id="screen-title" class="screen" aria-label="타이틀">
    <canvas id="title-canvas" aria-hidden="true"></canvas>
    <div class="title-inner">
      <h1 class="logo">T<span class="flick">A</span>NGO<br>LETH<span class="flick" style="animation-delay:3.1s">E</span></h1>
      <p class="logo-ko">탱고 레테</p>
      <p class="title-quote">레테 강 하구의 항구 지구 솔레아. 3주째 파업 중인 부두, 나흘째 크레인에 매달린 남자,
        그리고 무도장 2층에서 모든 것을 잊은 채 깨어난 한 형사. 탱고는 춤추는 슬픈 생각이다.</p>
      <nav class="title-menu" aria-label="메인 메뉴">
        <button class="btn primary" id="btn-continue" type="button" hidden>이어하기</button>
        <button class="btn" id="btn-new" type="button">새 게임</button>
        <button class="btn" id="btn-load" type="button">불러오기</button>
        <button class="btn" id="btn-about" type="button">이 게임에 대하여</button>
      </nav>
    </div>
    <div class="title-foot">솔레아 지구 · 협약 자유항 사르가</div>
  </section>

  <section id="screen-create" class="screen" hidden aria-label="형사 만들기"></section>

  <section id="screen-game" class="screen" hidden aria-label="게임">
    <aside class="scene" aria-label="장소">
      <canvas id="scene-canvas" aria-hidden="true"></canvas>
      <div class="place">
        <div class="place-name" id="place-name">어둠</div>
        <div class="place-sub" id="place-sub">1일차 · 09:40</div>
      </div>
      <div class="hud">
        <div class="vitals">
          <div class="vital h" title="체력 — 인내에 따라 정해진다. 0이 되면 죽는다."><span class="lbl">체력</span><span class="pips" id="hp-pips"></span></div>
          <div class="vital m" title="사기 — 의지에 따라 정해진다. 0이 되면 모든 것을 포기한다."><span class="lbl">사기</span><span class="pips" id="mp-pips"></span></div>
        </div>
        <div class="hud-right">
          <span class="tidechip" id="tide-chip">밀물</span>
          <span class="money" id="money">¤ 0.00</span>
          <span class="lvl" id="lvl">레벨 1</span>
        </div>
      </div>
    </aside>
    <main class="ledger">
      <nav class="toolbar" aria-label="도구">
        <button class="btn" type="button" data-panel="char" id="tb-char">인물 <kbd>C</kbd></button>
        <button class="btn" type="button" data-panel="thought" id="tb-thought">사고 <kbd>T</kbd></button>
        <button class="btn" type="button" data-panel="inv" id="tb-inv">소지품 <kbd>I</kbd></button>
        <button class="btn" type="button" data-panel="journal" id="tb-journal">일지 <kbd>J</kbd></button>
        <button class="btn" type="button" data-panel="menu" id="tb-menu">메뉴 <kbd>Esc</kbd></button>
      </nav>
      <div class="log" id="log" role="log" aria-live="polite"></div>
      <div class="choices" id="choices" role="group" aria-label="선택지"></div>
    </main>
  </section>

  <div class="panel" id="panel" hidden role="dialog" aria-modal="true" aria-label="패널">
    <div class="panel-box">
      <div class="panel-head">
        <div class="panel-tabs" id="panel-tabs"></div>
        <button class="btn small" type="button" id="panel-close">닫기</button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </div>
  </div>

  <div class="ending" id="ending" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div>
<script>
/* src/js/core.js */
/* 탱고 레테 — 코어: 네임스페이스, 유틸리티, 표현식 컴파일러 */
(function (root) {
  'use strict';
  const TL = root.TL = root.TL || {};
  TL.VERSION = '1.0.0';
  TL.SAVE_VERSION = 1;
  TL.content = TL.content || { nodes: Object.create(null), blocks: Object.create(null), files: [] };
  TL.data = TL.data || {};

  /* ---------------- 유틸리티 ---------------- */
  const U = TL.util = {};
  U.hash = function (str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h.toString(36);
  };
  U.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  U.fmtMoney = function (cents) {
    const neg = cents < 0;
    const c = Math.abs(Math.round(cents));
    return (neg ? '−' : '') + Math.floor(c / 100) + '.' + String(c % 100).padStart(2, '0');
  };
  U.fmtClock = function (min) {
    const m = ((Math.floor(min) % 1440) + 1440) % 1440;
    return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  };
  U.escapeHtml = function (s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  };
  /** 간단한 마크업: **굵게**, *기울임* */
  U.markup = function (s) {
    return U.escapeHtml(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>');
  };
  U.plain = function (s) {
    return String(s).replace(/\*\*(.+?)\*\*/g, '$1').replace(/\*(.+?)\*/g, '$1');
  };
  U.random = Math.random;
  U.roll = () => 1 + Math.floor(U.random() * 6);

  /* ---------------- 표현식 컴파일러 ----------------
   * 조건과 보간에 쓰는 작은 언어.
   *   식별자      → $.v("이름")  (변수, 특수 값, 기술 레벨)
   *   식별자(…)   → $.fn("이름")(…)
   *   18:30       → 1110 (자정부터의 분)
   *   and/or/not  → && || !
   */
  const TOKEN = /\s*(?:(\d{1,2}:\d{2})(?!\d)|(\d+(?:\.\d+)?)|("(?:[^"\\]|\\.)*")|([A-Za-z_][A-Za-z0-9_.]*)|(&&|\|\||==|!=|>=|<=|[-+*\/%<>!(),?:]))/y;
  const WORD_OPS = { and: '&&', or: '||', not: '!' };
  const LITERALS = { true: 'true', false: 'false', null: 'null' };
  const FUNCS = ['pass', 'chance', 'min', 'max', 'abs'];

  function tokenize(src) {
    const out = [];
    const s = src.trim();
    let pos = 0;
    while (pos < s.length) {
      TOKEN.lastIndex = pos;
      const m = TOKEN.exec(s);
      if (!m) throw new Error('표현식을 해석할 수 없음: «' + src + '» (위치 ' + pos + ')');
      pos = TOKEN.lastIndex;
      if (m[1] !== undefined) {
        const [h, mm] = m[1].split(':').map(Number);
        out.push({ k: 'num', v: String(h * 60 + mm) });
      } else if (m[2] !== undefined) out.push({ k: 'num', v: m[2] });
      else if (m[3] !== undefined) out.push({ k: 'str', v: m[3] });
      else if (m[4] !== undefined) out.push({ k: 'id', v: m[4] });
      else if (m[5] !== undefined) out.push({ k: 'op', v: m[5] });
      // 뒤따르는 공백만 남은 경우
      if (/^\s*$/.test(s.slice(pos))) break;
    }
    return out;
  }

  const cache = new Map();
  function compile(src) {
    let fn = cache.get(src);
    if (fn) return fn;
    const toks = tokenize(src);
    const parts = [];
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i];
      if (t.k === 'id') {
        const next = toks[i + 1];
        if (WORD_OPS[t.v]) parts.push(WORD_OPS[t.v]);
        else if (LITERALS[t.v]) parts.push(LITERALS[t.v]);
        else if (next && next.k === 'op' && next.v === '(') {
          if (FUNCS.indexOf(t.v) < 0) throw new Error('알 수 없는 함수: ' + t.v + ' in «' + src + '»');
          parts.push('$.fn(' + JSON.stringify(t.v) + ')');
        } else parts.push('$.v(' + JSON.stringify(t.v) + ')');
      } else parts.push(t.v);
    }
    const code = '"use strict"; return (' + parts.join(' ') + ');';
    try {
      fn = new Function('$', code);
    } catch (e) {
      throw new Error('표현식 문법 오류: «' + src + '» — ' + e.message);
    }
    cache.set(src, fn);
    return fn;
  }
  /** 표현식에 쓰인 식별자 목록 (검증용) */
  function identifiers(src) {
    const toks = tokenize(src);
    const ids = [];
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i];
      if (t.k !== 'id' || WORD_OPS[t.v] || LITERALS[t.v]) continue;
      const next = toks[i + 1];
      if (next && next.k === 'op' && next.v === '(') ids.push({ fn: t.v });
      else ids.push({ id: t.v });
    }
    return ids;
  }
  TL.expr = { compile, tokenize, identifiers, FUNCS };

  /* ---------------- 효과(~) 파서 ----------------
   * 세미콜론으로 구분. 따옴표 안의 세미콜론은 무시.
   */
  function splitEffects(s) {
    const out = [];
    let cur = '', q = false;
    for (const ch of s) {
      if (ch === '"') q = !q;
      if (ch === ';' && !q) { if (cur.trim()) out.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    if (cur.trim()) out.push(cur.trim());
    return out;
  }
  const NUM = '([+-]?\\d+(?:\\.\\d+)?)';
  const FX_RULES = [
    [/^set\s+([A-Za-z_]\w*)\s*$/, m => ({ op: 'set', name: m[1], expr: 'true' })],
    [/^set\s+([A-Za-z_]\w*)\s*=\s*(.+)$/, m => ({ op: 'set', name: m[1], expr: m[2] })],
    [/^unset\s+([A-Za-z_]\w*)$/, m => ({ op: 'unset', name: m[1] })],
    [new RegExp('^money\\s+' + NUM + '$'), m => ({ op: 'money', n: Math.round(parseFloat(m[1]) * 100) })],
    [/^money\s*(\+=|-=)\s*(.+)$/, m => ({ op: 'moneyx', mode: m[1], expr: m[2] })],
    [new RegExp('^health\\s+' + NUM + '(\\s+soft)?$'), m => ({ op: 'health', n: parseInt(m[1], 10), soft: !!m[2] })],
    [new RegExp('^morale\\s+' + NUM + '(\\s+soft)?$'), m => ({ op: 'morale', n: parseInt(m[1], 10), soft: !!m[2] })],
    [new RegExp('^xp\\s+' + NUM + '$'), m => ({ op: 'xp', n: parseInt(m[1], 10) })],
    [new RegExp('^time\\s+' + NUM + '$'), m => ({ op: 'time', n: parseInt(m[1], 10) })],
    [/^item\s+(add|remove|give|take|takeall)\s+([A-Za-z0-9_]+)$/, m => ({ op: 'item', mode: m[1], id: m[2] })],
    [/^(equip|unequip)\s+([A-Za-z0-9_]+)$/, m => ({ op: m[1], id: m[2] })],
    [/^thought\s+([A-Za-z0-9_]+)$/, m => ({ op: 'thought', id: m[1] })],
    [/^task\s+(add|done|fail)\s+([A-Za-z0-9_]+)$/, m => ({ op: 'task', mode: m[1], id: m[2] })],
    [/^buff\s+([A-Z_]+)\s+([+-]\d+)\s+(\d+)$/, m => ({ op: 'buff', skill: m[1], d: parseInt(m[2], 10), min: parseInt(m[3], 10) })],
    [/^notify\s+"(.*)"$/, m => ({ op: 'notify', text: m[1] })],
    [/^ending\s+([A-Za-z0-9_]+)$/, m => ({ op: 'ending', id: m[1] })],
    [/^sleep(?:\s+(\d{1,2}):(\d{2}))?$/, m => ({ op: 'sleep', wake: m[1] ? (+m[1] * 60 + +m[2]) : 480 })],
    [/^heal$/, () => ({ op: 'heal' })],
    [/^waittide$/, () => ({ op: 'waittide' })],
    [/^wait\s+(\d{1,2}):(\d{2})$/, m => ({ op: 'wait', at: +m[1] * 60 + +m[2] })],
    [/^loc\s+([A-Za-z0-9_]+)$/, m => ({ op: 'loc', id: m[1] })],
    [/^art\s+([A-Za-z0-9_]+)$/, m => ({ op: 'art', id: m[1] })],
    [/^ambient\s+"(.*)"$/, m => ({ op: 'ambient', text: m[1] })],
    [/^([A-Za-z_]\w*)\s*(\+=|-=|=)\s*(.+)$/, m => ({ op: 'assign', name: m[1], mode: m[2], expr: m[3] })],
  ];
  function parseEffects(src) {
    return splitEffects(src).map(part => {
      for (const [re, make] of FX_RULES) {
        const m = re.exec(part);
        if (m) return make(m);
      }
      throw new Error('알 수 없는 효과: «' + part + '»');
    });
  }
  TL.fx = { parse: parseEffects };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* src/js/parser.js */
/* 탱고 레테 — 스크립트(.tl) 파서
 *
 * 문법 요약 (자세한 설명은 docs/SCRIPTING.md)
 *   === node_id @location name="이름" art=quay     노드 시작
 *   // 주석
 *   서술 문장                                      내레이션
 *   YUN: 대사                                      화자 대사 (화자 ID는 대문자)
 *   LOGIC[10]: 대사                                 패시브 판정 (기술+6 ≥ 10일 때만 표시)
 *   {조건} 아무 줄                                   조건부
 *   ~ 효과; 효과                                    효과
 *   -> node / -> END                                이동 / 대화 종료
 *   => location                                     장소 이동
 *   ->> node / <<-                                  터널 호출 / 복귀
 *   ---                                             "계속" 대기
 *   * 선택지 -> 대상                                 1회용 선택지
 *   + 선택지                                         반복 선택지
 *   * {조건} [LOGIC 10] 선택지 -> 성공 | 실패          흰색 판정
 *   * [!LOGIC 10 #id +1 flag "이유"] 선택지           빨간색 판정 + 보정
 *   * <ENCYCLOPEDIA 10> 선택지                        패시브로 열리는 선택지
 *     들여쓴 줄들                                    선택지 본문
 *     ?+ / ?-                                        판정 선택지의 성공/실패 본문
 *   -                                               선택지 묶음 뒤의 합류점(gather)
 */
(function (TL) {
  'use strict';
  const C = TL.content;
  const U = TL.util;

  const HEADER = /^===\s*([A-Za-z0-9_]+)\s*(.*)$/;
  const SPEAKER = /^([A-Z][A-Z0-9_]*)(?:\[(\d+)\])?\s*:\s?(.*)$/;
  const CHECK = /^\[(!?)([A-Z][A-Z0-9_]*)\s+(\d+)((?:\s+[^\]]*)?)\]\s*/;
  const GATE = /^<([A-Z][A-Z0-9_]*)\s+(\d+)>\s*/;

  function measureIndent(raw) {
    let n = 0;
    for (const ch of raw) {
      if (ch === ' ') n += 1;
      else if (ch === '\t') n += 2;
      else break;
    }
    return n;
  }

  function parseAttrs(s) {
    const attrs = {};
    const re = /@([A-Za-z_]\w*)|([A-Za-z_]\w*)=("([^"]*)"|\S+)|([A-Za-z_]\w*)/g;
    let m;
    while ((m = re.exec(s))) {
      if (m[1]) attrs[m[1]] = true;
      else if (m[2]) attrs[m[2]] = m[4] !== undefined ? m[4] : m[3];
      else attrs[m[5]] = true;
    }
    return attrs;
  }

  function takeCond(s) {
    if (s[0] === '{' && s[1] !== '{') {
      const end = s.indexOf('}');
      if (end < 0) throw new Error('닫히지 않은 조건 괄호');
      return [s.slice(1, end).trim(), s.slice(end + 1).trim()];
    }
    return [null, s];
  }
  function andCond(a, b) {
    if (!a) return b;
    if (!b) return a;
    return '(' + a + ') && (' + b + ')';
  }

  function parseMods(s) {
    const res = { id: null, mods: [], perDay: false };
    if (!s) return res;
    if (/%day\b/.test(s)) { res.perDay = true; s = s.replace(/%day\b/, ''); }
    const re = /#([A-Za-z0-9_]+)|([+-]\d+)\s+(\([^)]*\)|[A-Za-z_][A-Za-z0-9_.]*)(?:\s+"([^"]*)")?/g;
    let m;
    while ((m = re.exec(s))) {
      if (m[1]) res.id = m[1];
      else res.mods.push({ v: parseInt(m[2], 10), cond: m[3].replace(/^\(|\)$/g, ''), label: m[4] || '' });
    }
    return res;
  }

  function parseChoice(text) {
    const ch = { t: 'choice', sticky: text[0] === '+', text: '' };
    let s = text.slice(1).trim();
    let cond;
    [cond, s] = takeCond(s);
    if (cond) ch.cond = cond;
    let m = CHECK.exec(s);
    if (m) {
      const mm = parseMods(m[4]);
      ch.check = { red: m[1] === '!', skill: m[2], diff: +m[3], mods: mm.mods, id: mm.id, perDay: mm.perDay };
      s = s.slice(m[0].length);
    }
    m = GATE.exec(s);
    if (m) {
      ch.gate = { skill: m[1], diff: +m[2] };
      s = s.slice(m[0].length);
    }
    [cond, s] = takeCond(s);
    if (cond) ch.cond = andCond(ch.cond, cond);
    const arrow = s.lastIndexOf('->');
    const fat = s.lastIndexOf('=>');
    if (fat >= 0 && fat > arrow) {
      const parts = s.slice(fat + 2).trim().split(/\s+/);
      ch.goto = parts[0];
      if (parts[1]) ch.cost = parseInt(parts[1], 10);
      s = s.slice(0, fat).trim();
    } else if (arrow >= 0) {
      const tgt = s.slice(arrow + 2).trim();
      s = s.slice(0, arrow).trim();
      if (tgt.indexOf('|') >= 0) {
        const [a, b] = tgt.split('|').map(x => x.trim());
        if (a) ch.okTarget = a;
        if (b) ch.failTarget = b;
      } else ch.target = tgt;
    }
    ch.text = s.trim();
    return ch;
  }

  function parseStmt(text) {
    let cond = null, c2;
    for (;;) {
      [c2, text] = takeCond(text);
      if (!c2) break;
      cond = andCond(cond, c2);
    }
    let st;
    if (text === '---') st = { t: 'pause' };
    else if (text === '-' || text.startsWith('- ')) st = { t: 'gather', rest: text.slice(1).trim() };
    else if (text.startsWith('->>')) st = { t: 'tunnel', target: text.slice(3).trim() };
    else if (text === '<<-') st = { t: 'return' };
    else if (text.startsWith('->')) st = { t: 'divert', target: text.slice(2).trim() };
    else if (text.startsWith('=>')) {
      const parts = text.slice(2).trim().split(/\s+/);
      st = { t: 'goto', target: parts[0] };
      if (parts[1]) st.cost = parseInt(parts[1], 10);
    }
    else if (text.startsWith('~')) st = { t: 'fx', src: text.slice(1).trim(), fx: TL.fx.parse(text.slice(1)) };
    else if (/^[*+]\s/.test(text)) st = parseChoice(text);
    else if (text === '?+' || text === '?-') st = { t: 'branch', ok: text === '?+' };
    else {
      const m = SPEAKER.exec(text);
      if (m) st = { t: 'line', who: m[1], diff: m[2] ? +m[2] : 0, text: m[3] };
      else st = { t: 'line', who: null, text };
    }
    if (cond) st.cond = andCond(st.cond, cond);
    return st;
  }

  function lastStmt(block) {
    return block.stmts.length ? block.stmts[block.stmts.length - 1] : null;
  }

  /**
   * 스크립트를 파싱해 TL.content에 노드와 블록을 등록한다.
   * @param {string} src
   * @param {string} file
   */
  TL.script = function (src, file) {
    file = file || '(inline)';
    C.files.push(file);
    const lines = src.split(/\r?\n/);
    let node = null, stack = null, lineNo = 0;
    const where = () => file + ':' + lineNo;
    const fail = (msg) => { throw new Error(where() + ' — ' + msg); };

    function newBlock(id, owner) {
      if (C.blocks[id]) fail('중복 블록 ID ' + id);
      const b = { id, node: owner, stmts: [] };
      C.blocks[id] = b;
      return b;
    }

    function finishNode() {
      // 비어 있는 선택지 본문 정리, 판정 선택지 검사
      const visit = (block) => {
        for (const st of block.stmts) {
          if (st.t !== 'choices') continue;
          for (const ch of st.items) {
            const body = C.blocks[ch.body];
            if (ch.check) {
              if (body && body.stmts.length) {
                lineNo = ch.line;
                fail('판정 선택지의 본문은 ?+ / ?- 로 나누어야 한다');
              }
              if (body) { delete C.blocks[ch.body]; ch.body = null; }
              if (ch.okBlock) visit(C.blocks[ch.okBlock]);
              if (ch.failBlock) visit(C.blocks[ch.failBlock]);
            } else if (body && !body.stmts.length) {
              delete C.blocks[ch.body];
              ch.body = null;
            } else if (body) visit(body);
          }
        }
      };
      visit(C.blocks[node.block]);
      // 장소 노드의 허브 인덱스
      const blk = C.blocks[node.block];
      node.hubIndex = -1;
      for (let i = 0; i < blk.stmts.length; i++) {
        if (blk.stmts[i].t === 'choices') { node.hubIndex = i; break; }
      }
    }

    for (const raw of lines) {
      lineNo++;
      const text = raw.trim();
      if (!text || text.startsWith('//')) continue;
      const indent = measureIndent(raw);
      const h = HEADER.exec(text);
      if (h) {
        if (node) finishNode();
        const id = h[1];
        if (C.nodes[id]) fail('중복 노드 ID ' + id + ' (먼저 정의: ' + C.nodes[id].file + ')');
        const attrs = parseAttrs(h[2]);
        const block = newBlock(id, id);
        node = { id, attrs, block: id, file, line: lineNo };
        C.nodes[id] = node;
        stack = [{ block, owner: -1, choice: null, kind: 'node' }];
        continue;
      }
      if (!node) fail('노드(===) 밖에 내용이 있음: ' + text.slice(0, 30));
      while (stack.length > 1 && indent <= stack[stack.length - 1].owner) stack.pop();
      const top = stack[stack.length - 1];
      let st;
      try { st = parseStmt(text); } catch (e) { fail(e.message); }
      st.line = lineNo;

      if (st.t === 'branch') {
        const ch = top.choice;
        if (!ch || !ch.check || top.kind !== 'body') fail('?+ / ?- 는 판정 선택지 본문 안에서만 쓸 수 있다');
        const bid = ch.body + (st.ok ? '+' : '-');
        if (C.blocks[bid]) fail('같은 판정에 ' + (st.ok ? '?+' : '?-') + ' 가 두 번 있음');
        const b = newBlock(bid, node.id);
        if (st.ok) ch.okBlock = bid; else ch.failBlock = bid;
        stack.push({ block: b, owner: indent, choice: null, kind: 'branch' });
        continue;
      }
      if (st.t === 'choice') {
        let grp = lastStmt(top.block);
        if (!grp || grp.t !== 'choices' || grp.closed) {
          grp = { t: 'choices', items: [], gather: false, line: lineNo };
          top.block.stmts.push(grp);
        }
        const gi = top.block.stmts.length - 1;
        const idx = grp.items.length;
        const key = st.text + '|' + (st.target || st.goto || st.okTarget || '') + '|' + (st.check ? st.check.skill + st.check.diff : '');
        let id = top.block.id + '#' + U.hash(key);
        while (grp.items.some(o => o.id === id)) id += '_';
        st.id = id;
        if (st.check && !st.check.id) st.check.id = id;
        st.body = top.block.id + '/' + gi + '.' + idx;
        grp.items.push(st);
        const body = newBlock(st.body, node.id);
        stack.push({ block: body, owner: indent, choice: st, kind: 'body' });
        continue;
      }
      if (st.t === 'gather') {
        const grp = lastStmt(top.block);
        if (!grp || grp.t !== 'choices') fail('합류점(-) 앞에 선택지 묶음이 없음');
        if (grp.gather) fail('합류점(-)이 두 번 연속됨');
        grp.gather = true;
        grp.closed = true;
        if (st.rest) {
          let s2;
          try { s2 = parseStmt(st.rest); } catch (e) { fail(e.message); }
          s2.line = lineNo;
          if (s2.t === 'choice' || s2.t === 'gather' || s2.t === 'branch') fail('합류점 뒤에는 일반 문장만 올 수 있다');
          top.block.stmts.push(s2);
        }
        continue;
      }
      const last = lastStmt(top.block);
      if (last && last.t === 'choices') last.closed = true;
      top.block.stmts.push(st);
    }
    if (node) finishNode();
  };

  /** 전체 콘텐츠 초기화 (테스트용) */
  TL.resetContent = function () {
    C.nodes = Object.create(null);
    C.blocks = Object.create(null);
    C.files = [];
  };
})(typeof window !== 'undefined' ? window.TL : globalThis.TL);

</script>

(function (TL) {

  }

  /* ───────── 지성 ───────── */
  skill('LOGIC', 'INT', '논리', 'LOGIC',
    '순수한 지적 능력을 휘두른다. 세계를 연역한다.',

  skill('RHETORIC', 'INT', '수사학', 'RHETORIC',

  skill('DRAMA', 'INT', '연극', 'DRAMA',

  skill('CONCEPT', 'INT', '개념화', 'CONCEPTUALIZATION',

  skill('EMPATHY', 'PSY', '공감', 'EMPATHY',

  skill('ESPRIT', 'PSY', '동료애', 'ESPRIT DE CORPS',

  skill('SUGGESTION', 'PSY', '암시', 'SUGGESTION',

  skill('PAIN', 'FYS', '고통 역치', 'PAIN THRESHOLD',

(function (TL) {

  thought('president_night', {

    problem: '당신은 모든 것을 잊었다. 이름, 나이, 직업, 왜 구두를 한 짝만 신고 있는지. 솔레아를 흐르는 강의 이름은 레테다. 옛 시인들은 죽은 자들이 이 강물을 마시고 전생을 잊는다고 썼다. 당신은 강물을 마신 기억이 없다. 물론, 그게 요점이겠지만.\n\n잃어버린 기억은 상처인가, 선물인가?',

  thought('hobocop', {

    problem: '빈 병 한 개에 10센티모. 백 개면 10솔도. 방값을 갚으려면 1,300개가 필요하다. 계산은 절망적이다. 하지만 이상하게도 병을 주울 때마다 마음이 편안해진다. 허리를 굽히고, 줍고, 가방에 넣는다. 단순하다. 정직하다.\n\n이것이 당신의 새로운 소명인가? 경찰과 넝마주이 사이 어딘가에 있는 무언가?',

    solution: '유령은 죽지 않는다. 그것이 유령의 정의다.\n\n조수 혁명은 실패했다. 코뮌은 여섯 해를 버텼고, 그중 두 해는 굶주렸고, 마지막 아홉 날은 불탔다. 그러나 실패한 혁명도 무언가를 남긴다. 부두 노동자들이 서로를 "동무"라고 부르는 습관. 할머니들이 부엌에서 흥얼거리는 찬가. 크레인 아래에서 담배를 나눠 피우며 "이건 원래 우리 거였어"라고 말하는 목소리.\n\n당신은 그 유령을 본다. 그것은 복수를 원하지 않는다. 그것은 단지 기억되기를 원한다. 우리는 잊지 않는다, 라고 그들은 외쳤다. 망각의 강 위에서. 당신은 이제 그들의 언어를 조금 알아듣는다. 착취라는 말, 연대라는 말, 그리고 그 말들 뒤에 있는 굳은살 박인 손들을.',

  thought('invisible_tango', {

    problem: '시장은 춤이다, 라고 아마데오 크루이프는 말했다. 수요가 이끌고 공급이 따른다. 가격은 두 사람 사이의 긴장이다. 아무도 스텝을 지시하지 않는데, 모든 것이 제자리를 찾는다.\n\n아름다운 이야기다. 하지만 춤추다 발을 밟힌 사람들은? 4번 크레인 밑에 깔린 여섯 명은? 그들도 춤의 일부인가?',

  thought('middle_course', {

    problem: '코뮌주의자들은 부두를 불태우고 싶어 한다. 회사는 부두를 팔아 치우고 싶어 한다. 왕당파는 부두에 왕좌를 다시 놓고 싶어 한다. 협약은? 협약은 부두가 조용하기를 원한다. 그것뿐이다. 조용한 부두, 제때 들어오는 배, 제때 나가는 화물.\n\n평범함은 비겁함인가, 지혜인가?',
    solution: '극단은 아름답다. 그것이 문제다. 혁명가의 붉은 깃발도, 왕당파의 금빛 문장도, 투자자의 반짝이는 계획도 아름답다. 아름다움은 사람을 죽인다.\n\n협약은 아름답지 않다. 그것은 회의록이고, 관세표고, 순찰정의 디젤 냄새다. 그것은 아무도 사랑하지 않는다. 그래서 아무도 그것을 위해 죽지 않는다. 당신은 그 회색의 지혜를 조금 이해한다. 오늘 하루를 무사히 넘기는 것. 내일도 무사히 넘기는 것. 그것이 쌓이면 평화가 된다. 지루한 평화.\n\n당신은 이제 극단의 목소리들 사이에서 조금 더 침착하고, 제복의 무게를 조금 더 편안하게 느낀다. 물론, 이 생각 역시 하나의 극단이라는 것을 당신은 안다. 가장 지루한 극단.',

  thought('drowned_king', {

    problem: '아우렐리오 4세는 왕궁 계단을 걸어 내려가 바다로 들어갔다. 시신은 발견되지 않았다. 솔레아의 늙은 어부들은 지금도 폭풍 치는 밤이면 바다 밑에서 왕관이 빛난다고 말한다. 사르가는 한때 세계의 여왕이었다. 지금은 외국 은행의 하녀다.\n\n위대함은 돌아올 수 있는가? 누가 그것을 되찾아 올 것인가?',
    solution: '당신은 가라앉은 왕관의 무게를 느낀다. 그것은 금의 무게가 아니라 기억의 무게다. 사르가의 함대가 바다를 덮던 시절, 이 도시의 이름만으로 먼 항구의 상인들이 모자를 벗던 시절.\n\n그 시절이 가난한 자들의 피로 세워졌다는 것을 당신은 안다. 그래도 그리움은 논리를 듣지 않는다. 그리움은 가슴을 펴게 하고, 턱을 들게 하고, 외국 순찰정을 볼 때마다 이를 악물게 한다. 이것은 위험한 생각이다. 위대함을 되찾자는 모든 목소리는 결국 누군가를 바다에 밀어 넣자고 말한다.\n\n당신은 그것을 안다. 그래도 오늘, 당신의 등은 조금 더 곧고 목소리는 조금 더 크다. 바다 밑 어딘가에서 늙은 왕이 웃는다. 아니, 우는지도 모른다.',

    solution: '탱고에는 정해진 순서가 없다. 이끄는 사람은 가슴으로 제안하고, 따르는 사람은 가슴으로 대답한다. 한 걸음, 멈춤, 또 한 걸음. 음악이 멈추면 춤도 멈춘다. 그것이 전부다.\n\n당신은 춤을 추면서 이해했다. 슬픔은 혼자 짊어지면 짐이지만, 두 사람이 나누어 걸으면 춤이 된다는 것을. 당신의 몸은 모든 것을 기억하고 있었다. 누군가의 등에 얹었던 손바닥의 온기, 무도장 바닥의 송진 냄새, 반도네온이 숨을 들이쉬는 순간의 정적. 머리가 잊은 것을 발은 잊지 않았다.\n\n당신은 이제 조금 더 우아하게 걷고, 조금 더 깊이 사람을 안는다. 그리고 음악이 들리면, 발끝이 먼저 대답한다.',
  });

  thought('ebb_theory', {
    name: '썰물 이론', time: 420,

(function (TL) {
  'use strict';
  TL.data.endings = {
    death: { title: '레테의 바닥', sub: '물은 차갑고, 깊고, 조용하다. 여기서는 아무것도 기억할 필요가 없다.' },
