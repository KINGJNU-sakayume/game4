<script>
/* src/js/engine.js */
/* 탱고 레테 — 실행 엔진 (DOM 독립)
 * 게임 상태, 스크립트 실행, 선택지, 판정, 시간, 아이템, 사고, 과제, 저장/불러오기.
 */
(function (TL) {
  'use strict';
  const C = TL.content;
  const U = TL.util;

  const DIFFS = [[6, '사소함'], [8, '쉬움'], [10, '보통'], [12, '도전적'], [13, '어려움'], [14, '전설적'], [15, '영웅적'], [16, '신적'], [18, '불가능']];
  function diffName(d) {
    let n = DIFFS[0][1];
    for (const [v, nm] of DIFFS) if (d >= v) n = nm;
    return n;
  }
  function chanceOf(bonus, diff) {
    let ok = 0;
    for (let a = 1; a <= 6; a++) {
      for (let b = 1; b <= 6; b++) {
        if (a === 1 && b === 1) continue;
        if ((a === 6 && b === 6) || a + b + bonus >= diff) ok++;
      }
    }
    return ok / 36;
  }
  TL.diffName = diffName;
  TL.chanceOf = chanceOf;

  const MAX_STEPS = 20000;

  function newState(opts) {
    return {
      v: TL.SAVE_VERSION,
      archetype: opts.archetype || 'custom',
      attrs: Object.assign({ INT: 3, PSY: 3, FYS: 3, MOT: 3 }, opts.attrs || {}),
      learned: {},
      signature: opts.signature || null,
      xp: 0, level: 1, points: 0,
      hLoss: 0, mLoss: 0,
      money: 0,
      day: 1, min: 0,
      loc: null, art: 'void',
      vars: {},
      items: [], equip: {},
      thoughts: {}, slots: 3,
      tasks: {},
      checks: {},
      used: {},
      visits: {},
      events: {},
      buffs: [],
      stats: { checks: 0, checksOk: 0, deaths: 0, started: Date.now() },
    };
  }

  class Game {
    constructor() {
      this.s = null;
      this.log = [];
      this.seq = 0;
      this.prompt = null;
      this.cur = null;
      this.frames = [];
      this.halted = false;
      this.lastCheck = null;
      this.listeners = [];
      const g = this;
      this.fns = {
        pass: (lvl, diff) => lvl + 6 >= diff,
        chance: (p) => U.random() * 100 < p,
        min: Math.min, max: Math.max, abs: Math.abs,
      };
      this.api = {
        v: (name) => g.value(name),
        fn: (name) => g.fns[name],
      };
    }

    /* ---------- 이벤트 ---------- */
    on(fn) { this.listeners.push(fn); return () => { this.listeners = this.listeners.filter(f => f !== fn); }; }
    notify(type, data) { for (const f of this.listeners) f(type, data); }

    emit(e) {
      e.n = ++this.seq;
      this.log.push(e);
      if (this.log.length > 800) this.log.splice(0, this.log.length - 600);
      this.notify('entry', e);
    }
    note(kind, text) { this.emit({ k: 'note', kind, text }); }

    /* ---------- 새 게임 / 저장 ---------- */
    newGame(opts) {
      opts = opts || {};
      this.s = newState(opts);
      this.s.money = opts.money != null ? opts.money : 0;
      this.s.min = opts.startMin != null ? opts.startMin : 9 * 60 + 40;
      this.log = [];
      this.seq = 0;
      this.frames = [];
      this.halted = false;
      this.prompt = null;
      this.lastCheck = null;
      for (const id of (opts.items || [])) if (!this.s.items.includes(id)) this.s.items.push(id);
      for (const id of (opts.equip || [])) this.equip(id, true);
      if (opts.vars) Object.assign(this.s.vars, opts.vars);
      this.jumpNode(opts.start || 'intro');
      this.run();
      this.notify('update');
    }

    serialize() {
      return JSON.stringify({
        v: TL.SAVE_VERSION,
        game: 'tango-lethe',
        s: this.s,
        cur: this.cur,
        frames: this.frames,
        waiting: this.prompt ? this.prompt.type : null,
        ending: this.prompt && this.prompt.type === 'ending' ? this.prompt.id : null,
        log: this.log.slice(-160),
        seq: this.seq,
        when: Date.now(),
      });
    }

    load(data) {
      const d = typeof data === 'string' ? JSON.parse(data) : data;
      if (!d || d.game !== 'tango-lethe' || !d.s) throw new Error('탱고 레테 저장 파일이 아닙니다.');
      this.s = d.s;
      // 이전 버전 저장 호환
      const base = newState({});
      for (const k in base) if (this.s[k] === undefined) this.s[k] = base[k];
      this.cur = d.cur;
      this.frames = d.frames || [];
      this.log = d.log || [];
      this.seq = d.seq || this.log.length;
      this.halted = false;
      this.prompt = null;
      this.lastCheck = null;
      if (!this.cur || !C.blocks[this.cur.b]) {
        // 콘텐츠가 바뀌어 커서를 잃었다면 현재 장소로 복귀
        this.frames = [];
        const loc = C.nodes[this.s.loc];
        if (!loc) throw new Error('저장된 위치를 찾을 수 없습니다.');
        this.cur = { b: loc.block, i: loc.hubIndex };
      }
      if (d.waiting === 'continue') this.prompt = { type: 'continue' };
      else if (d.waiting === 'ending') { this.halted = true; this.prompt = { type: 'ending', id: d.ending }; }
      else this.run();
      this.notify('scene');
      this.notify('update');
    }

    /* ---------- 값 조회 ---------- */
    absTime() { return (this.s.day - 1) * 1440 + this.s.min; }
    clockMin() { return ((this.s.min % 1440) + 1440) % 1440; }
    hour() { return Math.floor(this.clockMin() / 60); }
    curNodeId() { const b = this.cur && C.blocks[this.cur.b]; return b ? b.node : null; }

    isLowTide(min) {
      if (min === undefined) min = this.s.min;
      const h = (((min % 1440) + 1440) % 1440) / 60;
      const shift = Math.max(0, this.s.day - 1);
      return (h >= 5 + shift && h < 10 + shift) || (h >= 17 + shift && h < 21 + shift);
    }
    /** 지금 썰물이 끝날 때까지 남은 분 (썰물이 아니면 0) */
    minutesLeftLowTide() {
      let n = 0;
      while (this.isLowTide(this.s.min + n) && n < 1440) n += 5;
      return n;
    }
    /** 다음 썰물이 시작될 때까지 남은 분 (지금이 썰물이면 0) */
    minutesToLowTide() {
      let n = 0;
      while (!this.isLowTide(this.s.min + n) && n < 1440) n += 5;
      return n;
    }

    value(name) {
      const s = this.s;
      switch (name) {
        case 'money': return s.money / 100;
        case 'day': return s.day;
        case 'hour': return this.hour();
        case 'min': case 'time': return this.clockMin();
        case 'clock': return s.min;
        case 'abstime': return this.absTime();
        case 'health': return this.health();
        case 'morale': return this.morale();
        case 'healthMax': return this.healthMax();
        case 'moraleMax': return this.moraleMax();
        case 'level': return s.level;
        case 'xp': return s.xp;
        case 'points': return s.points;
        case 'first': return (s.visits[this.curNodeId()] || 0) <= 1;
        case 'lowtide': return this.isLowTide();
        case 'tideleft': return this.minutesLeftLowTide();
        case 'tidewait': return this.minutesToLowTide();
        case 'night': { const h = this.hour(); return h >= 20 || h < 6; }
        case 'loc': return s.loc;
        case 'archetype': return s.archetype;
        case 'signature': return s.signature;
      }
      const dot = name.indexOf('.');
      if (dot > 0) {
        const pre = name.slice(0, dot), rest = name.slice(dot + 1);
        switch (pre) {
          case 'visits': return s.visits[rest] || 0;
          case 'seen': return (s.visits[rest] || 0) > 0;
          case 'has': return s.items.indexOf(rest) >= 0;
          case 'count': return s.items.filter(x => x === rest).length;
          case 'wear': return Object.values(s.equip).indexOf(rest) >= 0;
          case 'thought': return !!(s.thoughts[rest] && s.thoughts[rest].st === 'done');
          case 'known': return !!s.thoughts[rest];
          case 'researching': return !!(s.thoughts[rest] && s.thoughts[rest].st === 'research');
          case 'task': return s.tasks[rest] ? s.tasks[rest].st : '';
          case 'done': return !!(s.tasks[rest] && s.tasks[rest].st === 'done');
          case 'active': return !!(s.tasks[rest] && s.tasks[rest].st === 'active');
          case 'skill': return this.level(rest);
          case 'attr': return s.attrs[rest] || 0;
          case 'check': return !!(s.checks[rest] && s.checks[rest].ok);
          case 'failed': return !!(s.checks[rest] && !s.checks[rest].ok);
          case 'tried': return !!s.checks[rest];
          case 'event': return !!s.events[rest];
          case 'used': return !!s.used[rest];
        }
        throw new Error('알 수 없는 접두사: ' + name);
      }
      if (TL.data.skills && TL.data.skills[name]) return this.level(name);
      const v = s.vars[name];
      return v === undefined ? 0 : v;
    }

    test(cond) {
      if (!cond) return true;
      return !!TL.expr.compile(cond)(this.api);
    }
    eval(expr) { return TL.expr.compile(expr)(this.api); }

    interp(text) {
      if (text.indexOf('{{') < 0) return text;
      return text.replace(/\{\{(.+?)\}\}/g, (_, e) => {
        const expr = e.trim();
        const v = this.eval(expr);
        if (expr === 'money') return U.fmtMoney(Math.round(v * 100));
        if (typeof v === 'number') return String(Math.round(v * 100) / 100);
        return String(v);
      });
    }

    /* ---------- 기술 ---------- */
    skillDef(sk) { return TL.data.skills[sk]; }
    baseLevel(sk) {
      const def = this.skillDef(sk);
      if (!def) return 0;
      const s = this.s;
      return (s.attrs[def.attr] || 0) + (s.learned[sk] || 0) + (s.signature === sk ? 1 : 0);
    }
    cap(sk) {
      const def = this.skillDef(sk);
      return (this.s.attrs[def.attr] || 0) + (this.s.signature === sk ? 1 : 0);
    }
    modSources(sk) {
      const s = this.s, out = [];
      for (const slot in s.equip) {
        const it = TL.data.items[s.equip[slot]];
        if (it && it.mods && it.mods[sk]) out.push({ v: it.mods[sk], label: it.name });
      }
      for (const id in s.thoughts) {
        const t = s.thoughts[id], def = TL.data.thoughts[id];
        if (!def) continue;
        if (t.st === 'research' && def.research && def.research[sk]) out.push({ v: def.research[sk], label: def.name + ' (연구 중)' });
        if (t.st === 'done' && def.bonus && def.bonus[sk]) out.push({ v: def.bonus[sk], label: def.name });
      }
      const now = this.absTime();
      for (const b of s.buffs) if (b.skill === sk && b.until > now) out.push({ v: b.d, label: b.label || '일시 효과' });
      return out;
    }
    level(sk) {
      if (!this.skillDef(sk)) return 0;
      let v = this.baseLevel(sk);
      for (const m of this.modSources(sk)) v += m.v;
      return Math.max(1, v);
    }
    canLearn(sk) {
      return this.s.points > 0 && (this.s.learned[sk] || 0) < this.cap(sk);
    }
    learn(sk) {
      if (!this.canLearn(sk)) return false;
      this.s.learned[sk] = (this.s.learned[sk] || 0) + 1;
      this.s.points -= 1;
      this.note('level', this.skillDef(sk).name + ' 레벨이 ' + this.level(sk) + '(으)로 올랐다.');
      this.keepAlive();
      this.refreshPrompt();
      return true;
    }
    buySlot() {
      if (this.s.points <= 0 || this.s.slots >= 10) return false;
      this.s.points -= 1;
      this.s.slots += 1;
      this.note('thought', '사고 캐비닛에 새 칸이 열렸다. (' + this.s.slots + '칸)');
      this.notify('update');
      return true;
    }

    /* ---------- 체력 / 사기 ---------- */
    extraMax(key) {
      let v = 0;
      for (const id in this.s.thoughts) {
        const t = this.s.thoughts[id], def = TL.data.thoughts[id];
        if (def && t.st === 'done' && def.extra && def.extra[key]) v += def.extra[key];
      }
      return v;
    }
    healthMax() { return Math.max(1, this.level('ENDURANCE') + 2 + this.extraMax('health')); }
    moraleMax() { return Math.max(1, this.level('VOLITION') + 2 + this.extraMax('morale')); }
    health() { return this.healthMax() - this.s.hLoss; }
    morale() { return this.moraleMax() - this.s.mLoss; }
    keepAlive() {
      // 장비/기술 변경만으로 죽지 않게 한다
      if (this.health() < 1) this.s.hLoss = this.healthMax() - 1;
      if (this.morale() < 1) this.s.mLoss = this.moraleMax() - 1;
    }
    damage(kind, n, soft) {
      const s = this.s;
      // soft: 이야기의 감정적 타격 — 죽음에 이르지는 않는다 (1에서 버틴다)
      if (soft && n < 0) {
        const cur = kind === 'h' ? this.health() : this.morale();
        n = Math.max(n, 1 - cur);
        if (n >= 0) {
          this.note(kind === 'h' ? 'hurt' : 'hurtm', (kind === 'h' ? '체력' : '사기') + '이 바닥에서 버틴다 (1/' + (kind === 'h' ? this.healthMax() : this.moraleMax()) + ')');
          return;
        }
      }
      if (kind === 'h') {
        const before = this.health();
        s.hLoss = U.clamp(s.hLoss - n, 0, 99);
        const after = this.health();
        if (after !== before) this.note(n < 0 ? 'hurt' : 'heal', '체력 ' + (after > before ? '+' : '−') + Math.abs(after - before) + ' (' + Math.max(0, after) + '/' + this.healthMax() + ')');
        if (after <= 0) this.die('health');
      } else {
        const before = this.morale();
        s.mLoss = U.clamp(s.mLoss - n, 0, 99);
        const after = this.morale();
        if (after !== before) this.note(n < 0 ? 'hurtm' : 'healm', '사기 ' + (after > before ? '+' : '−') + Math.abs(after - before) + ' (' + Math.max(0, after) + '/' + this.moraleMax() + ')');
        if (after <= 0) this.die('morale');
      }
      this.notify('update');
    }
    die(kind) {
      if (this.dying) return;
      this.dying = true;
      this.s.stats.deaths++;
      this.frames = [];
      const node = C.nodes['death_' + kind];
      if (node) this.jumpNode(node.id);
      else this.finish('death');
    }

    /* ---------- 경험치 ---------- */
    gainXp(n) {
      const s = this.s;
      s.xp += n;
      this.note('xp', '경험치 +' + n);
      const lvl = Math.floor(s.xp / 100) + 1;
      if (lvl > s.level) {
        const gained = lvl - s.level;
        s.level = lvl;
        s.points += gained;
        this.note('levelup', '레벨 업! 레벨 ' + lvl + ' — 기술 포인트 +' + gained);
      }
    }

    /* ---------- 시간 ---------- */
    advance(n) {
      if (!n || n <= 0) return;
      this.s.min += n;
      this.progressThoughts(n);
      const now = this.absTime();
      this.s.buffs = this.s.buffs.filter(b => b.until > now);
      this.notify('time');
    }
    sleep(wake) {
      const s = this.s;
      let delta = (1440 + wake) - s.min;
      if (delta < 60) delta = 60;
      s.day += 1;
      s.min = wake;
      this.progressThoughts(delta);
      s.buffs = [];
      s.hLoss = Math.max(0, s.hLoss - 2);
      s.mLoss = Math.max(0, s.mLoss - 2);
      this.emit({ k: 'day', day: s.day, clock: U.fmtClock(s.min) });
      this.notify('time');
      this.notify('update');
    }

    /* ---------- 아이템 ---------- */
    itemDef(id) {
      const it = TL.data.items[id];
      if (!it) throw new Error('없는 아이템: ' + id);
      return it;
    }
    addItem(id, quiet) {
      const it = this.itemDef(id);
      if (this.s.items.indexOf(id) >= 0 && !it.stack) return;
      this.s.items.push(id);
      if (!quiet) this.note('item', '획득: ' + it.name);
      this.notify('update');
    }
    removeItem(id, quiet) {
      const i = this.s.items.indexOf(id);
      if (i < 0) return;
      this.s.items.splice(i, 1);
      if (this.s.items.indexOf(id) < 0) {
        for (const slot in this.s.equip) if (this.s.equip[slot] === id) delete this.s.equip[slot];
      }
      this.keepAlive();
      if (!quiet) this.note('itemloss', '잃음: ' + this.itemDef(id).name);
      this.notify('update');
    }
    countItem(id) { return this.s.items.filter(x => x === id).length; }
    equip(id, quiet) {
      const it = this.itemDef(id);
      if (!it.slot) return false;
      if (this.s.items.indexOf(id) < 0) this.s.items.push(id);
      this.s.equip[it.slot] = id;
      if (!quiet) this.note('item', '착용: ' + it.name);
      this.keepAlive();
      this.refreshPrompt();
      return true;
    }
    unequip(id) {
      for (const slot in this.s.equip) if (this.s.equip[slot] === id) delete this.s.equip[slot];
      this.keepAlive();
      this.refreshPrompt();
    }
    useItem(id) {
      const it = this.itemDef(id);
      if (!it.use || this.halted || this.s.items.indexOf(id) < 0) return false;
      if (!it._fx) it._fx = TL.fx.parse(it.use);
      this.emit({ k: 'note', kind: 'use', text: it.name + ' — 사용' });
      if (it.useLine) this.emit(this.lineEntry(it.useLine[0], it.useLine[1], null));
      if (it.consumable !== false) {
        const i = this.s.items.indexOf(id);
        this.s.items.splice(i, 1);
      }
      this.applyFx(it._fx);
      if (this.dying && !this.halted) { this.prompt = null; this.run(); }
      else if (!this.halted) this.refreshPrompt();
      this.notify('update');
      return true;
    }

    /* ---------- 사고 캐비닛 ---------- */
    thoughtDef(id) {
      const t = TL.data.thoughts[id];
      if (!t) throw new Error('없는 사고: ' + id);
      return t;
    }
    discoverThought(id) {
      const def = this.thoughtDef(id);
      if (this.s.thoughts[id]) return;
      this.s.thoughts[id] = { st: 'known', t: 0 };
      this.note('thought', '새로운 사고: 「' + def.name + '」 — 사고 캐비닛에서 내면화할 수 있다.');
    }
    slotsUsed() {
      let n = 0;
      for (const id in this.s.thoughts) if (this.s.thoughts[id].st !== 'known') n++;
      return n;
    }
    research(id) {
      const t = this.s.thoughts[id];
      if (!t || t.st !== 'known' || this.slotsUsed() >= this.s.slots) return false;
      t.st = 'research';
      t.t = 0;
      this.note('thought', '「' + this.thoughtDef(id).name + '」 내면화를 시작했다.');
      this.keepAlive();
      this.refreshPrompt();
      return true;
    }
    cancelResearch(id) {
      const t = this.s.thoughts[id];
      if (!t || t.st !== 'research') return false;
      t.st = 'known';
      t.t = 0;
      this.keepAlive();
      this.refreshPrompt();
      return true;
    }
    forgetThought(id) {
      const t = this.s.thoughts[id];
      if (!t || t.st !== 'done' || this.s.points <= 0) return false;
      this.s.points -= 1;
      t.st = 'known';
      t.t = 0;
      this.note('thought', '「' + this.thoughtDef(id).name + '」을(를) 잊었다.');
      this.keepAlive();
      this.refreshPrompt();
      return true;
    }
    progressThoughts(n) {
      for (const id in this.s.thoughts) {
        const t = this.s.thoughts[id];
        if (t.st !== 'research') continue;
        t.t += n;
        const def = this.thoughtDef(id);
        if (t.t >= def.time) {
          t.st = 'done';
          this.emit({ k: 'thought', id, name: def.name, text: def.solution, bonus: def.bonusText || '' });
          this.keepAlive();
        }
      }
    }

    /* ---------- 과제 ---------- */
    taskDef(id) {
      const t = TL.data.tasks[id];
      if (!t) throw new Error('없는 과제: ' + id);
      return t;
    }
    task(mode, id) {
      const def = this.taskDef(id);
      const cur = this.s.tasks[id];
      if (mode === 'add') {
        if (cur) return;
        this.s.tasks[id] = { st: 'active', day: this.s.day };
        this.note('task', '새 과제: ' + def.name);
      } else if (mode === 'done') {
        if (cur && cur.st === 'done') return;
        this.s.tasks[id] = { st: 'done', day: this.s.day };
        this.note('taskdone', '과제 완료: ' + def.name);
        if (def.xp) this.gainXp(def.xp);
      } else if (mode === 'fail') {
        if (cur && cur.st !== 'active') return;
        this.s.tasks[id] = { st: 'failed', day: this.s.day };
        this.note('taskfail', '과제 실패: ' + def.name);
      }
      this.notify('update');
    }

    /* ---------- 효과 ---------- */
    applyFx(list) {
      const s = this.s;
      for (const f of list) {
        switch (f.op) {
          case 'set': s.vars[f.name] = this.eval(f.expr); break;
          case 'unset': delete s.vars[f.name]; break;
          case 'assign': {
            const val = this.eval(f.expr);
            const cur = s.vars[f.name] || 0;
            s.vars[f.name] = f.mode === '+=' ? cur + val : f.mode === '-=' ? cur - val : val;
            break;
          }
          case 'money': {
            const before = s.money;
            s.money = Math.max(0, s.money + f.n);
            const d = s.money - before;
            if (d) this.note(d > 0 ? 'money' : 'moneyloss', (d > 0 ? '+' : '−') + U.fmtMoney(Math.abs(d)) + ' 솔도 (소지금 ' + U.fmtMoney(s.money) + ')');
            break;
          }
          case 'moneyx': {
            const val = Math.round(this.eval(f.expr) * 100);
            this.applyFx([{ op: 'money', n: f.mode === '+=' ? val : -val }]);
            break;
          }
          case 'health': this.damage('h', f.n, f.soft); break;
          case 'morale': this.damage('m', f.n, f.soft); break;
          case 'xp': this.gainXp(f.n); break;
          case 'time': this.advance(f.n); break;
          case 'item':
            if (f.mode === 'add') this.addItem(f.id);
            else if (f.mode === 'give') this.addItem(f.id, true);
            else if (f.mode === 'take') this.removeItem(f.id, true);
            else if (f.mode === 'takeall') { while (this.s.items.indexOf(f.id) >= 0) this.removeItem(f.id, true); }
            else this.removeItem(f.id);
            break;
          case 'equip': this.equip(f.id); break;
          case 'unequip': this.unequip(f.id); break;
          case 'thought': this.discoverThought(f.id); break;
          case 'task': this.task(f.mode, f.id); break;
          case 'buff': {
            const sk = this.skillDef(f.skill);
            if (!sk) throw new Error('없는 기술: ' + f.skill);
            s.buffs.push({ skill: f.skill, d: f.d, until: this.absTime() + f.min, label: '일시 효과' });
            this.note('buff', sk.name + ' ' + (f.d > 0 ? '+' : '') + f.d + ' (' + f.min + '분)');
            break;
          }
          case 'notify': this.note('info', this.interp(f.text)); break;
          case 'ending': this.finish(f.id); return;
          case 'sleep': this.sleep(f.wake); break;
          case 'heal': s.hLoss = 0; s.mLoss = 0; this.notify('update'); break;
          case 'waittide': this.advance(this.minutesToLowTide()); break;
          case 'wait': {
            const cur = this.clockMin();
            if (f.at > cur) this.advance(f.at - cur);
            break;
          }
          case 'loc': s.loc = f.id; this.notify('scene'); break;
          case 'art': s.art = f.id; this.notify('scene'); break;
          case 'ambient': this.emit({ k: 'ambient', text: this.interp(f.text) }); break;
          default: throw new Error('처리할 수 없는 효과: ' + f.op);
        }
        if (this.halted || this.dying) return;
      }
    }

    finish(id) {
      this.halted = true;
      this.prompt = { type: 'ending', id };
      this.notify('ending', id);
      this.notify('update');
    }

    /* ---------- 화자 ---------- */
    speaker(who) {
      if (!who) return null;
      const sk = TL.data.skills[who];
      if (sk) return { name: sk.name, attr: sk.attr, kind: 'skill' };
      const sp = TL.data.speakers[who];
      if (!sp) return { name: who, kind: 'npc' };
      const name = typeof sp.name === 'function' ? sp.name(this.api) : sp.name;
      return { name, kind: sp.kind || 'npc', color: sp.color || null };
    }
    lineEntry(who, text, tag) {
      const sp = this.speaker(who);
      return { k: 'line', who, name: sp ? sp.name : null, attr: sp ? sp.attr : null, sk: sp ? sp.kind : null, color: sp ? sp.color : null, text: this.interp(text), tag };
    }
    say(st) {
      const lc = this.lastCheck;
      this.lastCheck = null;
      if (st.who && st.diff) {
        if (this.level(st.who) + 6 < st.diff) return;
        this.emit(this.lineEntry(st.who, st.text, '[' + diffName(st.diff) + ': 성공]'));
        return;
      }
      let tag = null;
      if (st.who && lc && lc.skill === st.who) tag = '[' + lc.dname + ': ' + (lc.ok ? '성공' : '실패') + ']';
      this.emit(this.lineEntry(st.who, st.text, tag));
    }

    /* ---------- 흐름 제어 ---------- */
    jumpNode(id) {
      const n = C.nodes[id];
      if (!n) throw new Error('없는 노드로 이동: ' + id);
      this.s.visits[id] = (this.s.visits[id] || 0) + 1;
      if (n.attrs.art && !n.attrs.location) { this.s.art = n.attrs.art; this.notify('scene'); }
      this.cur = { b: n.block, i: 0 };
    }
    divert(target) {
      if (target === 'END' || target === 'HUB') { this.endDialogue(); return; }
      while (this.frames.length && this.frames[this.frames.length - 1].k !== 'u') this.frames.pop();
      this.jumpNode(target);
    }
    isHubPos(pos) {
      const blk = C.blocks[pos.b];
      if (!blk) return false;
      const n = C.nodes[blk.node];
      return !!(n && (n.attrs.location || n.attrs.noecho) && n.block === pos.b);
    }
    endDialogue() {
      this.frames = [];
      this.dying = false;
      if (this.checkEvents('end')) return;
      const loc = C.nodes[this.s.loc];
      if (!loc) throw new Error('대화가 끝났지만 돌아갈 장소가 없다 (현재 노드: ' + this.curNodeId() + ')');
      if (loc.hubIndex < 0) throw new Error('장소 노드에 선택지가 없음: ' + loc.id);
      const art = loc.attrs.art || loc.id;
      if (this.s.art !== art) { this.s.art = art; this.notify('scene'); }
      this.emit({ k: 'sep' });
      this.cur = { b: loc.block, i: loc.hubIndex };
    }
    travel(id, cost) {
      const n = C.nodes[id];
      if (!n || !n.attrs.location) throw new Error('장소가 아닌 곳으로 이동: ' + id);
      this.frames = [];
      this.advance(cost != null ? cost : (n.attrs.travel ? parseInt(n.attrs.travel, 10) : 4));
      this.s.loc = id;
      this.s.art = n.attrs.art || id;
      this.emit({ k: 'loc', id, name: n.attrs.name || id, day: this.s.day, clock: U.fmtClock(this.s.min) });
      this.notify('scene');
      this.notify('arrive', id);
      if (this.checkEvents('arrive')) return;
      this.jumpNode(id);
    }
    eventNodes() {
      if (!this._events || this._eventsCount !== Object.keys(C.nodes).length) {
        this._events = Object.values(C.nodes).filter(n => n.attrs.event)
          .sort((a, b) => (parseInt(b.attrs.priority || 0, 10)) - (parseInt(a.attrs.priority || 0, 10)));
        this._eventsCount = Object.keys(C.nodes).length;
      }
      return this._events;
    }
    checkEvents(trigger) {
      for (const n of this.eventNodes()) {
        if (!n.attrs.repeat && this.s.events[n.id]) continue;
        if (n.attrs.on && n.attrs.on !== trigger) continue;
        if (n.attrs.at && n.attrs.at.split(',').indexOf(this.s.loc) < 0) continue;
        if (n.attrs.notat && n.attrs.notat.split(',').indexOf(this.s.loc) >= 0) continue;
        if (n.attrs.when && !this.test(n.attrs.when)) continue;
        this.s.events[n.id] = (this.s.events[n.id] || 0) + 1;
        this.frames = [];
        this.jumpNode(n.id);
        return true;
      }
      return false;
    }
    blockEnd() {
      const f = this.frames.pop();
      if (!f) { this.endDialogue(); return; }
      if (f.k === 'c') this.cur = { b: f.b, i: f.g ? f.i + 1 : f.i };
      else if (f.k === 'u') this.cur = { b: f.b, i: f.i };
      else if (f.k === 't') this.divert(f.target);
    }

    checkKey(check) { return check.perDay ? check.id + '@' + this.s.day : check.id; }
    listChoices(grp) {
      const items = [];
      for (const ch of grp.items) {
        if (ch.cond && !this.test(ch.cond)) continue;
        if (ch.gate && this.level(ch.gate.skill) + 6 < ch.gate.diff) continue;
        if (!ch.sticky && !ch.check && this.s.used[ch.id]) continue;
        let disabled = false, info = null;
        if (ch.check) {
          const rec = this.s.checks[this.checkKey(ch.check)];
          if (rec && (rec.ok || ch.check.red)) continue;
          info = this.checkInfo(ch.check);
          if (rec && this.level(ch.check.skill) <= rec.lvl) { disabled = true; info.locked = rec.lvl; }
        }
        items.push({ ch, text: this.interp(ch.text), disabled, info, gate: ch.gate || null, exit: !!ch.goto });
      }
      return items;
    }
    checkInfo(check) {
      const lvl = this.level(check.skill);
      let mod = 0;
      const mods = [];
      for (const m of check.mods) {
        if (this.test(m.cond)) { mod += m.v; mods.push({ v: m.v, label: m.label || m.cond }); }
      }
      return {
        skill: check.skill, red: check.red, diff: check.diff, dname: diffName(check.diff),
        lvl, mod, mods, chance: chanceOf(lvl + mod, check.diff),
      };
    }
    roll(check) {
      const info = this.checkInfo(check);
      const d1 = U.roll(), d2 = U.roll();
      let ok;
      if (d1 === 1 && d2 === 1) ok = false;
      else if (d1 === 6 && d2 === 6) ok = true;
      else ok = d1 + d2 + info.lvl + info.mod >= check.diff;
      this.s.checks[this.checkKey(check)] = { ok, lvl: info.lvl };
      this.s.stats.checks++;
      if (ok) this.s.stats.checksOk++;
      this.emit({
        k: 'check', skill: check.skill, name: this.skillDef(check.skill).name, attr: this.skillDef(check.skill).attr,
        diff: check.diff, dname: info.dname, red: check.red, d1, d2, lvl: info.lvl, mod: info.mod, mods: info.mods, ok,
        total: d1 + d2 + info.lvl + info.mod,
      });
      this.lastCheck = { skill: check.skill, ok, dname: info.dname };
      if (ok) this.gainXp(check.red ? 10 : 5);
      return ok;
    }

    run() {
      let steps = 0;
      this.dying = this.dying && !this.halted ? this.dying : false;
      while (!this.halted) {
        if (++steps > MAX_STEPS) throw new Error('무한 루프 의심 — 블록 ' + (this.cur && this.cur.b));
        const blk = C.blocks[this.cur.b];
        if (!blk) throw new Error('없는 블록: ' + this.cur.b);
        if (this.cur.i >= blk.stmts.length) { this.blockEnd(); continue; }
        const st = blk.stmts[this.cur.i];
        if (st.cond && !this.test(st.cond)) { this.cur.i++; continue; }
        switch (st.t) {
          case 'line':
            this.say(st);
            this.cur.i++;
            break;
          case 'fx': {
            const before = this.cur;
            this.applyFx(st.fx);
            if (this.halted) return;
            if (this.cur === before) this.cur.i++;
            break;
          }
          case 'pause':
            this.cur.i++;
            this.prompt = { type: 'continue' };
            this.notify('prompt', this.prompt);
            return;
          case 'divert':
            this.divert(st.target);
            break;
          case 'goto':
            this.travel(st.target, st.cost);
            break;
          case 'tunnel':
            this.frames.push({ k: 'u', b: this.cur.b, i: this.cur.i + 1 });
            this.jumpNode(st.target);
            break;
          case 'return': {
            while (this.frames.length && this.frames[this.frames.length - 1].k !== 'u') this.frames.pop();
            const f = this.frames.pop();
            if (!f) this.endDialogue();
            else this.cur = { b: f.b, i: f.i };
            break;
          }
          case 'choices': {
            const items = this.listChoices(st);
            const enabled = items.filter(x => !x.disabled).length;
            if (enabled === 0) {
              if (this.isHubPos(this.cur)) throw new Error('장소에 고를 수 있는 선택지가 없음: ' + this.cur.b);
              this.cur.i++;
              break;
            }
            this.prompt = { type: 'choices', items };
            this.notify('prompt', this.prompt);
            return;
          }
          default:
            throw new Error('알 수 없는 문장 종류: ' + st.t);
        }
      }
    }

    refreshPrompt() {
      if (this.prompt && this.prompt.type === 'choices' && !this.halted) {
        this.prompt = null;
        this.run();
      }
      this.notify('update');
    }

    choose(index) {
      if (!this.prompt || this.prompt.type !== 'choices') return false;
      const item = this.prompt.items[index];
      if (!item || item.disabled) return false;
      const ch = item.ch;
      const pos = { b: this.cur.b, i: this.cur.i };
      const grp = C.blocks[pos.b].stmts[pos.i];
      this.prompt = null;
      const hub = this.isHubPos(pos);
      if (!ch.sticky && !ch.check) this.s.used[ch.id] = 1;
      if (!hub && !ch.goto) {
        this.emit({ k: 'you', text: item.text, check: ch.check ? item.info : null, gate: ch.gate ? { skill: ch.gate.skill, name: this.skillDef(ch.gate.skill).name, attr: this.skillDef(ch.gate.skill).attr } : null });
        this.advance(2);
      }
      const back = { k: 'c', b: pos.b, i: pos.i, g: grp.gather };
      if (ch.check) {
        const ok = this.roll(ch.check);
        const blk = ok ? ch.okBlock : ch.failBlock;
        const tgt = ok ? ch.okTarget : ch.failTarget;
        if (blk) {
          this.frames.push(tgt ? { k: 't', target: tgt } : back);
          this.cur = { b: blk, i: 0 };
        } else if (tgt) this.divert(tgt);
        else if (ch.target) this.divert(ch.target);
        else this.cur = { b: pos.b, i: grp.gather ? pos.i + 1 : pos.i };
      } else if (ch.goto) {
        this.travel(ch.goto, ch.cost);
      } else if (ch.body) {
        this.frames.push(ch.target ? { k: 't', target: ch.target } : back);
        this.cur = { b: ch.body, i: 0 };
      } else if (ch.target) {
        this.divert(ch.target);
      } else {
        this.cur = { b: pos.b, i: grp.gather ? pos.i + 1 : pos.i };
      }
      if (!this.halted) this.run();
      this.notify('update');
      return true;
    }

    cont() {
      if (!this.prompt || this.prompt.type !== 'continue') return false;
      this.prompt = null;
      this.run();
      this.notify('update');
      return true;
    }
  }

  TL.Game = Game;
  TL.newState = newState;
})(typeof window !== 'undefined' ? window.TL : globalThis.TL);

</script>
<script>
/* src/js/content.bundle.js */
/* 자동 생성 파일 — content/*.tl 에서 tools/build.mjs 가 만들었다. 직접 고치지 말 것. */
(function (TL) {
  'use strict';
  TL.contentErrors = TL.contentErrors || [];
  function load(file, src) { try { TL.script(src, file); } catch (e) { TL.contentErrors.push(e.message); } }
  load("00_intro.tl", "// ─────────────────────────────────────────────\n// 00. 서막 — 강바닥의 어둠, 죽음, 공용 이벤트\n// ─────────────────────────────────────────────\n\n=== intro art=void\n물이다.\n위에도 물, 아래에도 물. 빛은 없다. 소리도 없다. 오직 무게만 있다. 따뜻하고 검은 무게가 사방에서 당신을 누른다.\nREPTILE: 아무것도 없다. 아무것도 없어도 된다.\nREPTILE: 여기는 강바닥이다. 레테의 바닥. 모든 것이 결국 가라앉는 곳. 잃어버린 반지, 녹슨 닻, 이름들. 여기서는 아무것도 기억할 필요가 없다. 기억할 사람이 없으니까.\n* \"……누구야?\"\n  REPTILE: 누구도 아니다. 그게 이 장소의 좋은 점이지.\n  REPTILE: 너도 누구도 아니다. 좋지 않은가? 이름이 없으면 빚도 없다. 약속도 없다. 아침도 없다.\n* \"여기가 어디지?\"\n  REPTILE: 바닥이다. 더 내려갈 데가 없는 곳. 그러니 떨어질 걱정도 없다.\n  REPTILE: 위를 보지 마라. 위에는 빛이 있고, 빛에는 날이 서 있다.\n* [아무 말도 하지 않는다.]\n  REPTILE: 그래. 그거다. 말은 거품이 되어 올라갈 뿐이다. 거품은 수면에서 터지고, 누군가 그 소리를 듣는다. 그러면 너는 찾아진다.\n  REPTILE: 찾아지지 마라.\n-\n멀리서, 아주 멀리서, 무언가가 흔들린다. 음악이다. 물에 잠긴 반도네온 같은 소리. 한 소절이 끝없이 되풀이된다. 올비도, 올비도, 올비도.\nLIMBIC: 아, 들리는구나.\nLIMBIC: 저 노래. 너는 저 노래를 알지. 몸이 먼저 알아. 가슴 한가운데가 오그라드는 거 느껴져? 그게 나야. 나는 네가 잊은 것들이 사는 곳이야.\n* \"넌 또 누구야?\"\n  LIMBIC: 네 아픈 데. 네 오래된 멍. 이 녀석은 너를 재우려 하고, 나는 너를 깨우려 해. 누가 더 친절한지는 네가 정해.\n  REPTILE: 깨우는 것은 친절이 아니다.\n* \"노래를 꺼 줘.\"\n  LIMBIC: 네가 틀었잖아. 어젯밤에. 열일곱 번째 전화를 끊고 나서.\n  LIMBIC: 아니, 아직 기억하지 마. 천천히. 천천히 올라오는 거야. 너무 빨리 올라오면 피가 끓어.\n* \"무슨 노래지?\"\n  LIMBIC: 「올비도」. 망각이라는 뜻이야. 웃기지? 너는 잊으려고 그 노래를 틀고, 그 노래는 네가 잊으려는 것만 떠올리게 해.\n-\nREPTILE: 올라가지 마라. 저 위에는 몸이 있다. 몸은 아프다. 저 위에는 방이 있다. 방은 부서져 있다. 저 위에는 사람들이 있다. 그들은 네게 무언가를 원한다.\nLIMBIC: 그리고 저 위에는 크레인에 매달린 남자가 있지. 나흘째. 바람에 흔들리면서. 그 사람도 누군가를 기다리고 있어.\n* [가라앉는다.]\n  REPTILE: 그래. 더 깊이. 진흙은 부드럽다. 진흙은 묻지 않는다.\n  당신은 조금 더 가라앉는다. 따뜻한 진흙이 등을 받친다. 음악이 멀어진다. 아주 조금.\n  LIMBIC: 소용없어. 몸이 숨을 쉬고 싶어 해. 몸은 늘 이겨.\n  ~ sank_once = 1\n  -> intro_rise\n* [떠오른다.]\n  -> intro_rise\n* <VOLITION 8> \"아니. 나는 올라간다.\"\n  VOLITION: 그래. 거기 있었구나. 오랜만이야.\n  VOLITION: 이 녀석들 말 듣지 마. 아래는 편하지만, 아래에는 아무도 없어. 위로 가자. 아프겠지만, 올라가는 길에 내가 옆에 있을게.\n  ~ morale +1\n  ~ xp 5\n  -> intro_rise\n\n=== intro_rise\n검은 물이 회색이 된다. 회색이 흰색이 된다. 흰색은 날카롭다.\n빛이 당신의 두개골 안쪽을 긁는다. 물이 코와 목에서 빠져나가고, 그 자리를 공기가 채운다. 공기는 먼지와 럼과 오래된 향수 냄새가 난다.\n---\n그리고, 몸이 돌아온다.\n처음엔 한 번에 오지 않는다. 조각조각 도착한다. 왼쪽 뺨이 차갑고 딱딱한 것에 눌려 있다는 감각. 입안에 무언가 쓰고 끈적한 것. 오른손의 손가락 관절이 욱신거린다는 신호. 발이 하나는 따뜻하고 하나는 차갑다는 이상한 비대칭.\nENDURANCE: 심장. 아직 뛴다. 불규칙하지만 뛴다. 간은 파업 중이다. 신장은 조합에 가입할까 고민 중이다. 그래도 살아 있다. 축하한다.\nPAIN[8]: 머리. 머리가 문제다. 누군가 당신의 이마 안쪽에서 망치로 종을 치고 있다. 한 번, 두 번. 종소리가 귀 뒤로 퍼진다. 아름다운 고통이다. 거의 음악 같다.\nPERCEPTION[9]: 뺨 밑은 나무 바닥이다. 니스가 벗겨진 참나무. 바닥 틈새에서 오래된 먼지와 송진 냄새가 올라온다. 무도장 바닥 냄새다.\n* 눈을 뜬다.\n  -> wake_eyes\n* 조금만 더 누워 있는다.\n  REPTILE: 그래, 그래. 바닥은 친구다. 바닥은 너를 떨어뜨리지 않는다.\n  당신은 조금 더 누워 있는다. 바닥의 결이 뺨에 새겨진다. 아래층 어딘가에서 의자 끄는 소리. 갈매기. 멀리서 배의 고동이 두 번 울린다.\n  ~ time +20\n  LIMBIC: 누가 기다리고 있어. 아래층에서. 아침 일곱 시부터.\n  -> wake_eyes\n\n=== wake_eyes art=room\n빛이 쏟아진다.\n천장. 높고, 누렇고, 금이 간 천장. 석고 장식이 테두리를 따라 포도덩굴처럼 기어간다. 그 한가운데에 샹들리에가 매달려 있다. 유리 물방울 절반은 떨어져 나갔고, 나머지 절반은 햇빛을 받아 벽에 작은 무지개들을 흩뿌리고 있다.\n그리고 그 샹들리에에, 구두 한 짝이 걸려 있다.\n흰 가죽, 밤색 코. 끈이 유리 가지에 얽혀 있다. 구두는 천천히, 아주 천천히 돌고 있다. 창문 틈으로 들어온 바람 때문에.\nVISUAL[8]: 바닥에서 샹들리에까지 약 3.2미터. 구두는 던져져서 올라간 게 아니다. 발에 신긴 채로 차올려졌다. 궤적이 그렇게 말한다. 아주 높은 발차기. 아주 유연한 무릎. 믿기 어렵지만.\nSAVOIR[10]: 볼레오(boleo). 탱고의 발차기. 파트너의 회전을 받아 다리를 채찍처럼 휘두르는 동작이다. 누군가, 어젯밤, 이 방에서 아주 훌륭한 볼레오를 했다. 구두가 날아갈 만큼.\nLIMBIC: 누구랑 췄을까? 이 방에는 너밖에 없는데.\n* 몸을 일으킨다.\n  -> wake_up\n* <ENCYCLOPEDIA 9> 샹들리에의 양식을 분석한다.\n  ENCYCLOPEDIA: 왕관 시대 후기의 \"눈물방울\" 양식. 약 80년 전 사르가의 유리 공방들이 해외 수출용으로 대량 생산하던 것이다. 원래는 촛불용이었으나 나중에 전기 배선이 추가되었다. 배선 상태로 보아 누전 위험이 높다.\n  ENCYCLOPEDIA: 참고로, 구두 한 짝의 무게는 약 400그램. 이 샹들리에의 하중 한계는 알 수 없다. 기억해 둘 만한 정보는 아니다. 하지만 나는 기억한다. 그게 내 일이니까.\n  -> wake_up\n\n=== wake_up\n당신은 팔꿈치로 몸을 받쳐 일으킨다. 방이 한 번 기울었다가 제자리로 돌아온다.\n그리고 당신은 당신 자신을 본다.\n속옷. 헐렁한 흰 사각팬티 하나. 왼발에는 투톤 구두 한 짝. 오른발은 맨발이고, 발가락 사이에 유리 조각이 하나 박혀 있다. 배는 크고 둥글고 창백하다. 가슴에는 회색이 섞인 털. 팔뚝에는 오래된 문신이 있다. 닻과 등불. 그 밑에 번진 숫자.\nPHYSICAL[8]: 형님. 이 몸은 한때 대단했어. 저 어깨 봐. 저 팔뚝 봐. 문을 부수고 범인을 넘어뜨리던 몸이야. 지금은, 음, 휴가 중이지. 긴 휴가. 걱정 마, 근육은 기억해.\nESPRIT[10]: 닻과 등불. 사르가 시민 경비대 문장이다. 신입 교육 마지막 날 밤, 동기 열두 명이 부둣가 문신 가게에 몰려가 똑같은 걸 새겼다. 그중 세 명은 이제 없다. 한 명은 순직했고, 두 명은 그만뒀다. 문신은 남았다.\n* 문신을 들여다본다.\n  번진 숫자는 이렇게 읽힌다. \"9-04—\". 나머지는 오래된 흉터가 먹어 버렸다.\n  LOGIC[9]: 숫자는 무언가의 번호다. 부대, 배지, 분서. \"9\"가 맨 앞에 있다. 당신은 9라는 숫자와 관련된 조직에 속해 있었다. 혹은 지금도.\n  ~ tattoo_seen = 1\n  -> wake_up_2\n* 발가락 사이의 유리 조각을 뽑는다.\n  당신은 조각을 잡아 뽑는다. 피가 한 방울, 두 방울 바닥에 떨어진다. 작고 선명한 붉은 점들.\n  PAIN[6]: 좋다. 아주 좋다. 이 작은 통증이 저 큰 통증에서 주의를 돌려 준다. 고통으로 고통을 다스리는 것. 이것이 고통의 경제학이다.\n  -> wake_up_2\n* 일어선다.\n  -> wake_up_2\n\n=== wake_up_2\n당신은 일어선다. 무릎이 소리를 낸다. 방이 다시 한 번 기울고, 이번에는 당신도 함께 기운다. 당신은 벽을 짚는다. 벽지는 짙은 포도주색에 금색 줄무늬가 있다. 손바닥 밑에서 벽지가 약간 끈적하다.\n방은 부서져 있다.\n거울은 금이 가 거미줄이 되었다. 의자 하나는 다리가 부러진 채 옆으로 누워 있다. 욕조는 방 한쪽 구석에 발 달린 짐승처럼 웅크리고 있는데, 물이 반쯤 차 있고, 그 위에 무언가 초록색이 떠 있다. 침대 매트리스는 반쯤 바닥으로 흘러내렸다. 창가의 작은 탁자 위에서 축음기가 돌아간다. 바늘이 한 홈에 걸려, 같은 소절을 되풀이한다.\nRECORD: ……올비도, 올비도, 올비……\n그리고 벽에, 창문 옆 벽에, 붉은 립스틱으로 크게 휘갈겨 쓴 글씨. **아침을 폐지한다 — 밤의 대통령**\nDRAMA[8]: 나리! 이것은 선언문이옵니다! 혁명의 벽보! 누가 이토록 대담한 문장을 썼단 말입니까?\nLOGIC[7]: 립스틱은 이 방에 있는 물건이다. 글씨는 오른손으로, 높이 약 170센티미터에서 쓰였다. 당신의 오른손 검지에 붉은 얼룩이 있다.\nDRAMA[8]: ……아. 나리께서.\n~ task add t_dress\n~ task add t_shoe\n~ task add t_name\n=> room7 0\n\n// ─────────────────────────────────────────────\n// 죽음\n// ─────────────────────────────────────────────\n\n=== death_health art=void\n몸이 멈춘다.\n처음에는 무릎이, 그다음에는 손이, 마지막으로 심장이. 거창한 일은 아니다. 오래된 기계가 한 번 덜컹거리고, 조용해지는 것뿐이다.\nENDURANCE: 미안하다. 정말로 미안하다. 나는 할 만큼 했다. 6년 동안 매일 밤 네가 부순 것들을 다시 붙였다. 오늘은, 붙일 조각이 없다.\n---\nREPTILE: 돌아왔구나.\nREPTILE: 걱정 마라. 여기는 따뜻하다. 여기에는 크레인도, 시체도, 빚도 없다. 여기에는 아무도 너를 부르지 않는다.\nLIMBIC: 그 남자는 여전히 매달려 있을 거야. 크레인 위에서. 이제 두 사람이 기다리는 셈이네. 그 사람도, 아래층의 그 여자도.\nREPTILE: 쉿. 가라앉아라.\n~ ending death\n\n=== death_morale art=void\n당신 안에서 무언가가 조용히 내려놓아진다.\n그것은 큰 소리를 내지 않는다. 창문을 닫는 것처럼, 편지를 접는 것처럼, 등불을 끄는 것처럼. 당신은 더 이상 일어날 이유를 찾지 못한다. 이유를 찾을 이유도.\nVOLITION: 나는…… 여기 있었어. 끝까지. 네가 그걸 알았으면 좋겠어.\n---\n당신은 경비대에 전화를 걸지 않는다. 배지를 찾지 않는다. 크레인의 남자를 내리지 않는다. 당신은 가장 가까운 술집의 가장 어두운 구석에 앉아, 레테 럼을 한 병, 또 한 병 주문한다.\n사흘 뒤, 12분서에서 온 경위는 혼자 솔레아를 떠난다. 그녀의 보고서에는 이렇게 적혀 있다. \"9분서 소속 형사는 수사를 수행할 수 없는 상태임. 사건은 미결로 분류함.\"\n강은 계속 흐른다. 레테는 모든 것을 가져간다. 당신도.\n~ ending death\n\n// ─────────────────────────────────────────────\n// 공용 이벤트\n// ─────────────────────────────────────────────\n\n=== ev_passout @event repeat when=\"clock >= 1620\" priority=50\n시계가 새벽 세 시를 넘긴다.\n당신의 몸은 더 이상 협상하지 않는다. 다리가 먼저 사라지고, 그다음에 바닥이 올라온다. 마지막으로 본 것은 어딘가의 가로등, 그 불빛 속에서 춤추는 나방 한 마리다.\nENDURANCE: 이건 잠이 아니야. 이건 정전이야.\n~ health -1\n~ morale -1\n~ sleep 10:00\n~ passouts += 1\n-> passout_wake\n\n=== passout_wake\n당신은 7호실 침대에서 깨어난다. 신발은 신은 채고, 이불은 누군가 목까지 덮어 주었다. 어떻게 돌아왔는지 기억나지 않는다.\n{passouts == 1 && met_yun} 문간에 윤 경위가 서 있다. 팔짱을 끼고. 그녀의 얼굴에는 표정이 없다. 표정이 없는 것이 표정이다.\n{passouts == 1 && met_yun} YUN: 부두 한가운데서 쓰러져 계셨습니다. 제가 사이드카에 실어 왔어요. 계단은 마테오 씨가 도와줬고요. 경비대 복무 규정 제14조, \"근무 중 공공장소에서의 취침 금지\". 적어 두겠습니다.\n{passouts == 1 && met_yun} ~ yun_trust -= 1\n{passouts == 1 && !met_yun} 협탁 위에 쪽지가 있다. 가지런한 글씨. \"부두에서 주무시고 계셨습니다. 방까지 옮겨 드렸습니다. 아래층에서 기다리겠습니다. — 12분서\"\n{passouts > 1} 기억나지 않는 것에는 이제 익숙하다. 그게 더 무섭다.\n{passouts > 1 && met_yun} YUN: (문 너머에서) 형사님. 일어나셨으면 노크 두 번 하세요. 아니면 제가 들어갑니다.\n=> room7 0\n");
  load("01_room7.tl", "// ─────────────────────────────────────────────\n// 01. 7호실 — 부서진 방\n// ─────────────────────────────────────────────\n\n=== room7 @location name=\"레테 무도장 · 7호실\" art=room travel=1\n{visits.room7 > 1 && !night} 7호실. 금 간 거울, 욕조, 립스틱 글씨. 창밖으로 크레인들의 긴 목이 보인다. 아래층에서 의자 끄는 소리와 잔 부딪는 소리가 올라온다.\n{visits.room7 > 1 && night} 밤의 7호실. 네온사인의 붉은빛이 창문을 통해 들어와 천장에 번진다. L, E, T, H, E. 글자 하나가 가끔 깜빡인다. 아래층에서 반도네온 소리가 올라온다.\n{visits.room7 == 1} 방이 당신을 둘러싼다. 무엇부터 할까.\n+ {!has.shoe_right && !has.shoes_pair} 샹들리에의 구두를 올려다본다 -> r7_chandelier\n+ 금 간 거울 앞에 선다 -> r7_mirror\n+ 축음기를 살핀다 -> r7_phono\n+ 욕조를 들여다본다 -> r7_tub\n+ 창밖을 내다본다 -> r7_window\n+ 벽의 립스틱 글씨를 본다 -> r7_wall\n+ 침대 주변을 뒤진다 -> r7_bed\n+ {night} 잠자리에 든다 -> r7_sleep\n+ 계단을 내려간다 => hall 1\n\n// ───────── 샹들리에 ─────────\n\n=== r7_chandelier\n구두는 여전히 샹들리에에 매달려 천천히 돈다. 한 바퀴, 멈춤, 반 바퀴. 끈이 유리 가지에 두 번 감겨 있다. 바닥에서 3미터가 넘는다. 까치발을 해도 손끝이 닿지 않는다.\n{first} LIMBIC: 너 어젯밤에 누구랑 춤췄어? 아무도 없었지. 넌 혼자 췄어. 레코드랑. 그 노래랑.\n* [SAVOIR 10] 도움닫기를 해서 뛰어올라 낚아챈다. -> r7_shoe_jump_ok | r7_shoe_jump_fail\n* [HANDEYE 9] 왼쪽 구두를 벗어 던져 떨어뜨린다. -> r7_shoe_throw_ok | r7_shoe_throw_fail\n* [PHYSICAL 9] 침대 머리판을 밟고 올라가 잡아당긴다. -> r7_shoe_climb_ok | r7_shoe_climb_fail\n* {has.broom} 에밀의 빗자루로 쳐서 떨어뜨린다. -> r7_shoe_broom\n* <INLAND 9> 구두에게 내려오라고 부탁한다.\n  SHOE: 싫어.\n  INLAND: 구두가 말을 한다. 아니, 구두가 말을 하는 것처럼 느껴진다. 둘 사이에 큰 차이는 없다.\n  SHOE: 여기서는 모든 게 보여. 네 정수리의 원형 탈모도. 부서진 의자도. 욕조 속의 재킷도. 저 아래 바닥에 누워 있던 너도. 나는 올라온 뒤로 한 번도 내려가고 싶었던 적이 없어.\n  * \"너는 내 구두야. 내 발에 있어야 해.\"\n    SHOE: 네 발? 네 발은 지난 열흘 동안 나를 어디로 끌고 다녔지? 부두의 토사물 위로, 럼 웅덩이 속으로, 새벽 네 시의 계단으로. 나는 무도장을 위해 만들어졌어. 반짝이는 바닥, 송진 가루, 한 바퀴 반의 회전. 너는 나를 한 번도 거기 데려가지 않았어. 어젯밤을 빼면.\n    SHOE: 어젯밤. 그건 좋았어. 네가 처음으로 제대로 췄거든. 그래서 나는 날아올랐지.\n    ~ shoe_talked = 1\n  * \"거기서 뭐가 보이지? 창밖에.\"\n    SHOE: 크레인. 일곱 번째 크레인. 거기 누가 매달려 있어. 나처럼. 그 사람도 구두가 한 짝이야.\n    SHOE: 우리는 서로를 알아봐. 매달린 것들은.\n    ~ shoe_talked = 1\n    ~ body_glimpsed = 1\n  * \"……미안하다.\"\n    SHOE: 뭐가?\n    SHOE: 아, 전부 다? 그래. 전부 다 미안하겠지. 그런데 미안하다는 말은 나를 끌어내리지 못해. 줄을 끊어야 해. 아니면 발돋움을 하든지. 네가 늘 하던 대로 해 봐. 무작정 뛰어올라.\n    ~ cop_sorry += 1\n    ~ shoe_talked = 1\n  -\n  INLAND: 구두는 더 이상 말이 없다. 원래 구두는 말이 없다.\n  ~ thought single_shoe\n+ 그냥 둔다. -> END\n\n=== r7_shoe_jump_ok\n당신은 방의 반대편 벽까지 물러난다. 숨을 한 번 들이쉬고, 세 걸음, 네 걸음, 도약.\n시간이 느려진다. 당신의 몸이, 이 크고 망가진 몸이, 믿을 수 없을 만큼 가볍게 떠오른다. 오른손이 공중에서 구두끈을 낚아챈다. 샹들리에가 비명을 지르며 흔들리고, 유리 물방울 세 개가 떨어져 바닥에서 부서진다. 당신은 착지한다. 구두를 쥔 채로. 한쪽 발로. 무릎을 살짝 굽히고.\nSAVOIR: 봤어? 방금 봤어? 저건 도약이 아니라 춤이었어. 착지의 무릎 각도 좀 봐. 반도네온만 있었으면 완벽했을 텐데.\n~ cop_tango += 1\n-> r7_got_shoe\n\n=== r7_shoe_jump_fail\n당신은 방의 반대편 벽까지 물러난다. 숨을 한 번 들이쉬고, 세 걸음, 네 걸음, 도약.\n발이 바닥을 떠나는 순간, 한 짝뿐인 구두의 가죽 밑창이 니스 칠한 바닥 위에서 미끄러진다. 당신은 앞으로 날아간다. 옆으로. 아래로. 샹들리에는 까마득히 위에서 무심하게 돈다. 바닥이 당신을 맞이한다. 턱으로.\nSAVOIR: ……이건 기록에 남기지 말자.\nPAIN: 턱뼈에서 귀까지 번개가 친다. 이가 몇 개인지 혀로 세어 본다. 다 있다. 운이 좋다.\n~ health -1\n-> END\n\n=== r7_shoe_throw_ok\n당신은 왼쪽 구두를 벗어 손에 쥔다. 무게를 가늠한다. 400그램 남짓. 뒤꿈치 쪽이 무겁다. 손목을 한 번 튕긴다.\n구두가 회전하며 날아올라, 매달린 짝의 코를 정확히 때린다. 얽혀 있던 끈이 풀린다. 두 짝의 구두가 함께 떨어진다. 한 짝, 또 한 짝. 투둑.\nHANDEYE: 깔끔하다. 포물선의 정점에서 충돌. 오차 2센티미터.\nHANDEYE: 이 손은 아직 기억한다. 무엇을 던지고, 무엇을 겨누었는지.\n-> r7_got_shoe\n\n=== r7_shoe_throw_fail\n당신은 왼쪽 구두를 벗어 손에 쥔다. 무게를 가늠한다. 손목을 튕긴다.\n구두가 날아올라, 샹들리에를 스치고, 천장을 때리고, 수직으로 떨어진다. 당신의 정수리 위로. 뒤꿈치부터.\nHANDEYE: 음. 손목에 술이 남아 있다. 아직.\nPAIN: 두개골이 종처럼 울린다. 원래 울리던 종과 새 종이 화음을 이룬다. 불협화음이지만.\n당신은 떨어진 구두를 주워 다시 신는다. 매달린 짝은 여전히 거기서 돈다. 약 올리듯이.\n~ health -1\n-> END\n\n=== r7_shoe_climb_ok\n당신은 부서지지 않은 침대 머리판에 한쪽 발을 올리고, 다른 발로 매트리스 모서리를 딛고, 체중을 위로 밀어 올린다. 침대가 신음한다. 오크 나무가 버틴다. 당신도 버틴다. 손이 샹들리에의 청동 가지를 붙잡고, 다른 손이 구두끈을 풀어낸다.\nPHYSICAL: 그렇지, 형님! 봤지? 등 근육이 살아 있어! 이제 내려와. 천천히. 샹들리에 말고 침대를 믿어.\n-> r7_got_shoe\n\n=== r7_shoe_climb_fail\n당신은 침대 머리판에 한쪽 발을 올리고, 체중을 위로 밀어 올린다. 침대가 신음한다. 오크 나무가 버틴다. 당신의 발목은 버티지 못한다.\n당신은 옆으로 기운다. 손이 허공을 긁는다. 무언가 잡힌다. 샹들리에다. 샹들리에가 천장에서 한 뼘 내려온다. 석고 가루가 눈처럼 쏟아진다. 당신은 샹들리에를 놓고 매트리스 위로 떨어진다. 매트리스는 바닥으로 미끄러진다. 당신도 함께.\nPHYSICAL: 괜찮아, 형님. 근육은 있었어. 균형이 없었을 뿐이지.\n구두는 여전히 매달려 있다. 샹들리에는 조금 더 기울어졌다.\n~ health -1\n-> END\n\n=== r7_shoe_broom\n당신은 빗자루를 거꾸로 쥐고, 손잡이 끝 d hairpin\n  바지다. 겨자색과 갈색의 굵은 체크무늬. 무릎 아래가 종처럼 벌어지는 나팔바지.\n  COMPOSURE: 오. 오, 안 돼.\n  SAVOIR: 오, 좋아! 이건 춤을 위한 바지야. 회전할 때 이게 어떻게 휘날리는지 상상해 봐.\n  COMPOSURE: 이건 범죄 현장에 입고 갈 바지가 아니야.\n  SAVOIR: 모든 곳이 무도장이야, 친구.\n  당신은 바지를 입는다. 선택의 여지가 없다. 뒷주머니에서 무언가 바스락거린다.\n  구겨진 노란 종이. \"코스타 전당포 — 솔레아 부두 거리 14번지. 물품: 금속제 휘장 1점. 대부액: 30솔도. 기한: 30일.\" 서명란에는 휘갈김과 함께 \"밤의 대통령\".\n  LOGIC: 금속제 휘장. 배지다. 당신은 경찰 배지를 전당포에 맡겼다. 30솔도에.\n  AUTHORITY: 그럴 리가 없어. 경찰이 배지를? 그건 영혼을 파는 거야.\n  LOGIC: 30솔도에.\n  ~ item add trousers_flare\n  ~ equip trousers_flare\n  ~ item add pawn_ticket\n  ~ task add t_badge\n  ~ badge_pawned_known = 1\n* {!has.shirt_silk} 침대 기둥의 셔츠를 걷는다.\n  실크 셔츠다. 에메랄드색 앵무새들이 주홍색 정글 위를 날아다닌다. 겨드랑이에 땀자국이 있고, 가슴에는 럼 얼룩이 지도처럼 번져 있다. 단추 두 개가 없다.\n  COMPOSURE: 이 셔츠는 어떤 사람이 입는 셔츠지? 휴가 온 밀수업자?\n  ELECTRO: 행복한 사람이 입는 셔츠지. 우리가 행복했던 적이 있다는 증거야.\n  당신은 셔츠를 입는다. 실크가 등에 서늘하게 닿는다. 단추를 채우다가, 가슴 주머니에 무언가 딱딱한 것이 있다는 걸 느낀다.\n  작은 금반지. 가느다랗고, 새것처럼 반짝인다. 안쪽에 글자가 새겨져 있다. \"M에게, 영원히 — L.\"\n  LIMBIC: 한 번도 끼워지지 않은 반지야. 6년 동안 한 번도.\n  * 반지를 주머니에 넣는다.\n    당신은 반지를 다시 셔츠 주머니에 넣는다. 심장 바로 위에. 거기가 원래 자리였던 것처럼.\n    ~ item add wedding_ring\n  * 반지를 창밖으로 던진다.\n    당신은 반지를 쥔다. 창가로 간다. 팔을 들어 올린다.\n    그리고 멈춘다. 오래. 팔이 저려 올 때까지.\n    VOLITION: 아직은 아니야. 아직 그게 무슨 의미인지도 모르잖아. 버리는 건 알고 나서 해도 늦지 않아.\n    당신은 반지를 주머니에 넣는다.\n    ~ item add wedding_ring\n    ~ morale -1\n  -\n  ~ item add shirt_silk\n  ~ equip shirt_silk\n* {!has.tie_red} 전등갓의 넥타이를 푼다.\n  빨간 실크 넥타이. 매듭이 반쯤 풀린 채 굳어 있다. 전등갓 위에서 올가미 모양으로 늘어져 있었다.\n  HALFLIGHT[9]: 올가미. 누가 이걸 올가미로 만들었지? 왜 전등에 걸려 있지? 저 크레인의 남자처럼……\n  LOGIC: 진정해. 넥타이는 넥타이다. 술 취한 사람은 넥타이를 아무 데나 던진다. 전등갓은 흔한 착지점이다.\n  당신은 넥타이를 목에 건다. 매듭을 다시 맨다. 손이 기억하는 대로. 윈저 매듭. 완벽하다. 손은 모든 걸 기억한다.\n  ~ item add tie_red\n  ~ equip tie_red\n* {!has.key_room7} 협탁의 열쇠를 챙긴다.\n  황동 열쇠에 빨간 술, \"레테 — 7\"이라고 새겨진 나무 패. 당신의 방 열쇠다. 당신이 부순 방의.\n  ~ item add key_room7\n* {!read_booklet} 협탁 서랍을 연다.\n  서랍 안에는 얇은 소책자가 하나 있다. 표지에 물속의 종 그림. 「익사한 종의 기도서 — 솔레아 교구」.\n  책장 사이에 말린 꽃이 끼워져 있다. 작고 하얀 꽃. 누렇게 바랬다.\n  ENCYCLOPEDIA[8]: 망각초. 레테 강 하구의 습지에만 피는 꽃이다. 옛날 솔레아 사람들은 장례식 때 이 꽃을 관에 넣었다. 죽은 자가 이승의 슬픔을 잊고 편히 가라고. 지금은 거의 멸종되었다.\n  당신은 기도서를 펼친다. 첫 장에 이렇게 적혀 있다.\n  \"종은 가라앉았으나 울리기를 멈추지 않았다. 물 밑에서 울리는 종소리를 들은 자는 한 가지를 잊고, 한 가지를 기억하리라. 무엇을 잊고 무엇을 기억할지는 종이 정한다.\"\n  INLAND[9]: 종소리. 들어 본 적이 있다. 물 밑에서 울리는 소리. 어젯밤? 아니면 오늘 아침, 그 어둠 속에서?\n  ~ read_booklet = 1\n  ~ xp 5\n* {!saw_ines_flyer} 매트리스 밑을 더듬는다.\n  매트리스와 침대 틀 사이에 종이 한 장이 끼어 있다. 구겨진 전단지다.\n  \"레테 무도장 — 탱고 개인 강습. 초보자 환영. 가슴으로 이끌고, 가슴으로 따르세요. 문의: 이네스 (저녁 여덟 시 이후, 무도장에서).\"\n  전단지 여백에 당신의 필체로 뭔가 적혀 있다. \"배워 볼까? 그녀가 좋아했으니까.\" 그리고 그 밑에 줄이 그어져 있다. 두 줄.\n  EMPATHY: 당신은 탱고를 배우려 했다. 누군가를 위해. 그리고 마음을 바꿨다. 아니면 용기가 없었거나.\n  ~ saw_ines_flyer = 1\n+ 물러선다. -> END\n\n// ───────── 잠 ─────────\n\n=== r7_sleep\n{!night} 아직 잠들 시간이 아니다. 몸은 원하지만, 아래층에서 누군가 기다리고 있다.\n{!night} -> END\n당신은 매트리스를 침대 위로 끌어올리고, 구겨진 시트를 편다. 재킷을 의자에 걸고, 구두를 벗는다.\n{day == 1} -> dream_1\n{day == 2} -> dream_2\n{day >= 3} -> dream_3\n");
  load("02_hall.tl", "// ─────────────────────────────────────────────\n// 02. 레테 무도장 — 1층\n// ─────────────────────────────────────────────\n\n=== hall @location name=\"레테 무도장\" art=hall travel=1\n{!night && visits.hall > 1} 낮의 레테 무도장은 무대 화장을 지운 늙은 배우 같다. 높은 창에서 먼지 섞인 빛기둥이 내려와 뒤집힌 의자들의 다리를 비춘다. 한가운데에서 분수가 혼잣말을 하듯 졸졸거린다.\n{night && visits.hall > 1} 밤의 레테는 살아 있다. 담배 연기가 샹들리에 아래 구름처럼 떠 있고, 무대 위에서 반도네온이 숨을 쉰다. 분수 주위로 남녀가 한 몸처럼 돈다. 붉은빛, 금빛, 땀, 향수, 럼. 모두가 무언가를 잊으러 왔다.\n{night && !seen_hall_night} SHIVERS[9]: 이 도시의 밤은 여기로 모인다. 부두의 하역부들, 통조림 공장의 여공들, 협약 순찰정의 휴가 나온 수병들, 누구의 아내이거나 누구의 남편이었던 사람들. 그들은 여기서 한 곡 동안만 다른 사람이 된다.\n{night} ~ seen_hall_night = 1\n+ 마담 오를라에게 간다 -> orla_hub\n+ 바의 에밀에게 간다 -> emile_hub\n+ {!night} 무대 가장자리의 파코 영감에게 간다 -> paco_hub\n+ {night} 무대 위에서 연주하는 파코 영감을 본다 -> paco_hub\n+ 분수를 들여다본다 -> hall_fountain\n+ 전화 부스에 들어간다 -> hall_phone\n+ {night} 춤추는 사람들 사이로 나간다 -> tango_floor\n+ {met_yun} 윤 경위와 이야기한다 -> yun_hub\n+ 무대 뒤 계단, 옥상으로 가는 문을 살핀다 -> hall_roofdoor\n+ 계단을 올라 7호실로 간다 => room7 1\n+ 뒷문으로 나간다 => backyard 1\n+ 정문으로 나간다 -> hall_exit\n\n=== hall_exit\n{met_yun && !orla_debt_told} -> orla_intercept\n=> quay 2\n\n// ───────── 윤 경위와의 첫 만남 ─────────\n\n=== ev_meet_yun @event on=arrive at=hall when=\"!met_yun\" priority=90\n계단이 삐걱거린다. 한 칸 내려갈 때마다 머릿속의 종이 한 번씩 울린다.\n레테 무도장의 1층은 넓고, 높고, 어둑하다. 높은 아치형 창에서 먼지 섞인 빛기둥이 비스듬히 내려온다. 의자들은 테이블 위에 거꾸로 올려져, 죽은 곤충처럼 다리를 하늘로 뻗고 있다. 홀 한가운데에는 대리석 분수가 있다. 물 항아리를 기울인 여인상. 항아리에서 흘러나온 물이 둥근 수반에 떨어지며 끝없이 속삭인다.\n무대에는 붉은 벨벳 커튼이 반쯤 쳐져 있다. 그 가장자리에, 반도네온 가방을 무릎에 올린 백발의 노인이 고개를 떨군 채 졸고 있다.\n바 뒤에서는 둥근 안경을 쓴 젊은 남자가 잔을 닦고 있다. 그리고 바의 끝, 금전 등록기 옆에는 검은 옷을 입은 여자가 두꺼운 장부를 펼쳐 놓고 앉아 있다. 은빛이 섞인 검은 머리를 높이 틀어 올렸고, 긴 궐련 물부리 끝에서 연기가 가늘게 올라간다. 그녀가 고개를 든다. 당신을 본다. 입꼬리가 한쪽만 올라간다.\nORLA: 어머나. 대통령 각하께서 기침하셨네.\n---\n그리고 분수 옆 작은 테이블에서, 한 여자가 일어선다.\n작고 단단한 체구의 30대 후반. 낡은 갈색 가죽 비행 재킷 아래 경비대 지급 셔츠, 검은 바지를 오토바이 부츠에 넣어 신었다. 턱선에서 일자로 자른 짧은 검은 머리. 이마 위로 밀어 올린 오토바이 고글. 턱을 따라 가늘고 흰 흉터가 하나 있다.\n테이블 위에는 철제 보온병 하나, 몽당연필이 꽂힌 작은 수첩, 그리고 완벽하게 평행으로 놓인 가죽 장갑 한 켤레.\n그녀가 당신을 본다. 머리부터 \nORLA: 7호실. 거울, 40솔도. 의자, 12솔도. 샹들리에 유리 방울 세 개, 개당 6솔도, 18솔도. 벽지 한 폭, 25솔도. 립스틱은 안 지워져요. 내가 해 봤거든.\nORLA: 그리고 새벽 네 시에 「올비도」를 열일곱 번 틀고 따라 부른 것에 대한 다른 투숙객들의 정신적 피해 보상, 30솔도. 이건 할인해 준 거예요. 노래를 정말 못하시더라.\nORLA: 합계 125솔도. 반올림해서 130.\n* \"반올림은 왜 하오?\"\n  ORLA: 수고비죠. 내가 이걸 계산하느라 아침 잠을 설쳤거든. 각하 덕분에.\n* \"방값은 따로요?\"\n  ORLA: 방값은 내셨어요. 첫날에 14박 선불로. 각하께서 솔레아에서 하신 유일하게 책임감 있는 행동이었죠. 전 그때 감동했어요. 정말로. 이 사람은 다르구나, 했죠.\n  ORLA: 다음 날 저녁에 각하께서 무대에 올라가셨어요.\n* \"나는 그 방에 들어간 기억이 없소.\"\n  ORLA: 방은 각하를 기억하던데요.\n-\nORLA: 지금 당장 내라는 건 아니에요. 난 괴물이 아니거든. 솔레아를 떠나기 전까지만 주세요. 안 그러면 각하네 분서에 편지를 쓸 거예요. 아름다운 편지를. 난 편지를 잘 써요.\n{met_yun} 윤 경위가 수첩에 무언가를 적는다. \"130솔도.\" 밑줄 두 개.\n~ debt = 130\n~ orla_debt_told = 1\n~ task add t_debt\n* [RHETORIC 10] \"거울은 이미 금이 가 있었소. 오래된 거울이오. 40솔도는 과하지.\"\n  ?+\n    ORLA: ……\n    그녀는 장부를 다시 본다. 궐련을 한 모금 빤다.\n    ORLA: 그 거울은 할머니 때부터 있던 거예요. 왕관 시대 베네치아산.\n    RHETORIC: 거짓말이다. 저 거울의 틀은 협약 시대 공장제 금박이다. 뒷면에 \"반데르메르 유리 공업\"이라는 도장이 찍혀 있을 거라는 데 걸겠다.\n    당신이 그렇게 말한다. 그녀가 웃는다. 목구멍 깊은 곳에서 나오는, 금 간 첼로 같은 웃음.\n    ORLA: 좋아요. 영리한 각하시네. 25솔도로 해 드리죠. 합계 110. 반올림해서……\n    그녀가 입을 다문다. 당신을 본다. 반올림하려던 숫자가 목에 걸린 얼굴이다.\n    ORLA: ……110.\n    ~ debt = 110\n    ~ al_ultralib += 1\n  ?-\n    ORLA: 그 거울은 할머니 때부터 있던 거예요. 왕관 시대 베네치아산. 제 할머니가 그 거울 앞에서 사르가 최고의 탱고 가수가 되는 연습을 했죠. 각하는 그 거울을 주먹으로 깨셨고요.\n    ORLA: 40솔도는 싸게 드린 거예요.\n    RHETORIC: 그녀가 이겼다. 할머니가 나오면 이길 수 없다.\n* [EMPATHY 9] \"……정말 미안하오, 마담. 진심이오.\"\n  ?+\n    그녀는 당신을 오래 본다. 짙은 콜 화장 밑의 눈이 조금 가늘어진다.\n    ORLA: 진심이라. 이 무도장에서 그 단어를 들은 게 몇 년 만인지.\n    ORLA: 좋아요. 정신적 피해 보상은 빼 드리죠. 다른 투숙객들도 사실 각하 노래를 좀 좋아했어요. 끔찍해서. 100솔도.\n    EMPATHY: 그녀는 오래전에 누군가에게 같은 말을 들었다. 진심이라고. 그리고 그 사람은 떠났다. 그녀는 당신에게 속는 셈 치기로 했다. 한 번만.\n    ~ debt = 100\n    ~ cop_sorry += 1\n  ?-\n    ORLA: 진심. 좋죠. 진심으로 130솔도를 주세요.\n    EMPATHY: 그녀의 마음은 장부처럼 닫혀 있다. 40년 동안 수천 명의 취객이 그녀에게 진심을 맹세했다. 진심은 이 무도장에서 가장 싼 통화다.\n* {money >= 130} 130솔도를 지금 낸다.\n  ORLA: 오.\n  그녀가 지폐를 센다. 두 번. 불빛에 비춰 본다.\n  ORLA: 대통령 각하께서 국고를 푸셨네. 영수증 드릴까요?\n  ~ money -130\n  ~ debt = 0\n  ~ task done t_debt\n* \"갚겠소. 반드시.\"\n  ORLA: 다들 그렇게 말하죠.\n-\nORLA: 자, 이제 가세요. 국정이 기다리잖아요.\nORLA: 아, 그리고 각하. 나가시기 전에 그 셔츠 단추는 좀 채우세요. 앵무새들이 추워 보여요.\n-> END\n");
  load("03_orla_emile.tl", "// ─────────────────────────────────────────────\n// 03. 마담 오를라와 바텐더 에밀\n// ─────────────────────────────────────────────\n\n=== orla_hub\n{!orla_debt_told} -> orla_first\n{night} 마담 오를라는 정문 옆에 서서 손님들을 맞는다. 은색 스팽글 드레스, 검은 깃털 목도리, 입술은 피처럼 붉다. 들어오는 사람마다 이름을 부르고, 나가는 사람마다 외상을 기억한다.\n{!night} 마담 오를라는 금전 등록기 옆에서 장부를 넘기고 있다. 궐련 물부리 끝의 재가 길게 매달려 있다가, 떨어지기 직전에 재떨이로 옮겨진다. 한 번도 실패하지 않는다.\nORLA: {{night ? \"오늘 밤엔 춤추러 오셨나, 각하?\" : \"또 무슨 일이신가, 각하?\"}}\n* \"지난 열흘 동안 내가 뭘 했소?\" -> orla_tendays\n* \"어젯밤에 무슨 일이 있었소?\" -> orla_lastnight\n* \"내 이름을 아시오?\" -> orla_name\n* \"크레인에 매달린 남자에 대해 아는 게 있소?\" -> orla_crane\n* \"이 무도장은 어떤 곳이오?\" -> orla_history\n* {orla_history_done} \"당신은 누구요, 마담?\" -> orla_self\n* {saw_ines_flyer || ines_heard || ines_known} \"이네스라는 댄서를 아시오?\" -> orla_ines\n+ {(found_tar || tried_roofdoor) && !has.roof_key && !roof_open} \"옥상 열쇠가 필요하오.\" -> orla_roofkey\n+ {debt > 0} \"빚 얘기를 합시다.\" -> orla_pay\n+ \"나중에 봅시다.\" -> END\n\n=== orla_first\nORLA: 아, 각하. 마침 잘 오셨어요. 결재하실 서류가 있거든요.\n~ orla_named = 1\n-> orla_bill\n\n=== orla_tendays\nORLA: 열흘 전 오후 세 시였어요.\n그녀가 궐련을 빤다. 연기를 천장으로 길게 내뿜는다. 기억을 무대에 올리는 사람처럼.\nORLA: 각하는 가방 하나를 들고 저 문으로 들어오셨죠. 회색 정장에 넥타이를 단정하게 매고, 구두는 반짝반짝했어요. 배지를 보여 주셨죠. \"4번 크레인 사고 조사 때문에 왔소. 조용한 방이 필요하오.\" 그래서 7호실을 드렸어요. 우리 집에서 제일 조용한 방.\nORLA: 첫날 밤 각하는 바에 앉아서 레몬수를 드셨어요. 레몬수! 이 무도장에서 레몬수를 주문한 사람은 12년 만에 처음이었어요. 에밀이 레몬을 사러 뛰어나갔죠. 각하는 서류를 읽으셨어요. 무척 진지하게. 밑줄을 그어 가면서.\nORLA: 둘째 날 밤, 파코가 「올비도」를 연주했어요.\n그녀가 잠시 멈춘다.\nORLA: 각하는 레몬수 잔을 내려놓고 럼을 주문하셨죠. 그리고 그 곡이 끝날 때까지 한 번도 숨을 안 쉬시는 것 같았어요.\nEMPATHY[9]: 그녀는 그 장면을 기억한다. 무도장 주인으로서가 아니라, 한 여자로서. 노래 한 곡에 무너지는 남자를 그녀는 전에도 본 적이 있다. 어쩌면 거울 속에서.\nORLA: 셋째 날엔 가방을 파셨어요. 체사르네 전당포에. 넷째 날 밤엔 무대에 올라가서 대통령이 되셨고. 다섯째 날부터는…… 각하도 아시다시피.\n그녀가 손을 펼친다. 반지 여섯 개가 빛난다.\nORLA: 아, 모르시지.\n* \"대통령이 됐다는 게 무슨 소리요?\"\n  ORLA: 무대에 올라가서 파코한테 팡파르를 청하셨어요. 파코는 착해서 해 줬죠. 그리고 각하는 연설을 하셨어요. 이 도시는 너무 오래 아침에게 지배당했다고. 아침은 협약보다 더 나쁜 점령군이라고. 오늘부로 밤의 공화국을 선포한다고.\n  ORLA: 사람들이 환호했어요. 진짜로. 부두 사람들은 연설을 좋아하거든요. 특히 공짜 럼이 따라오는 연설은.\n  ORLA: 각하는 그날 밤 모든 테이블에 한 병씩 돌리셨어요. 그 돈이 어디서 났는지는 묻지 않았죠. 가방 판 돈이었을 거예요.\n  ~ thought president_night\n* \"내가 누구랑 어울렸소?\"\n  ORLA: 모두랑, 아무하고도. 하역부들이랑 팔씨름을 하셨고요. 여공들한테 시를 읊어 주셨고. 벌집 공동주택 꼬마들이 각하를 졸졸 따라다녔어요. 각하가 부두에서 연설을 하면 애들이 박수를 쳤거든요. 이상한 인기였죠.\n  ORLA: 그리고 파코. 파코랑은 매일 밤 이야기를 나누셨어요. 무대 끝에 나란히 앉아서. 눈먼 늙은이랑 눈 뜬 장님이.\n  ~ heard_kids_followed = 1\n* \"그 서류는 어디 있소? 4번 크레인 서류.\"\n  ORLA: 가방 안에 있었겠죠. 가방은 체사르한테 갔고요. 체사르는 서류 같은 건 버렸을 거예요. 종이는 돈이 안 되니까. 아니면 생선 싸는 데 썼거나.\n  LOGIC: 조사 자료를 잃었다. 전당포에 가 볼 이유가 하나 더 생겼다.\n  ~ suitcase_known = 1\n-\nORLA: 부두에서 비를 맞으며 크레인한테 연설을 하신 적도 있대요. 마르가리타가 봤대요. 분수에 들어가서 동전을 주워 모두에게 한 잔씩 돌리신 적도 있고. 인기가 좋으셨어요. 돈을 쓰는 동안은.\n-> orla_hub\n\n=== orla_lastnight\nORLA: 어젯밤.\n그녀가 장부를 덮는다. 처음으로, 그녀의 얼굴에서 연극이 조금 빠진다.\nORLA: 각하는 밤 열 시에 내려오셨어요. 에밀한테 전화용 토큰을 한 움큼 사셨죠. 그리고 저 부스에 들어가셨어요. 전화를 거셨어요. 한 번. 끊고 나와서 파코한테 「올비도」를 청하셨죠. 곡이 끝나면 다시 부스로. 또 한 번. 또 「올비도」.\nORLA: 열일곱 번. 에밀이 셌어요.\nORLA: 열일곱 번째에는 오래 통화하셨어요. 아무 말도 안 하시면서. 듣기만. 그러고는 수화기를 아주 천천히 내려놓으셨어요. 잠든 아기를 눕히는 것처럼.\nORLA: 그다음에 바에 오셔서 맨손으로 잔을 깨셨어요. 에밀이 손을 붕대로 감아 드렸죠. 각하는 고맙다고 하셨어요. 아주 정중하게. 그리고 위층으로 올라가셨어요.\nORLA: 그 뒤는 소리로만 알아요. 거울. 의자. 쿵. 쿵. 새벽 네 시엔 레코드. 열일곱 번 더. 그리고 조용해졌죠.\n* \"……올라와 보지 그랬소.\"\n  ORLA: 죽은 사람은 장사에 안 좋아요. 그런데 남의 방문을 여는 건 더 안 좋아요. 문을 열면 책임이 생기거든요.\n  그녀가 당신을 본다.\n  ORLA: 난 30년 동안 그 원칙으로 이 가게를 지켰어요. 그리고 어젯밤, 그 원칙이 처음으로 부끄러웠어요. 됐어요?\n  EMPATHY: 그녀는 새벽 네 시에 계단 밑에 서 있었다. 레코드 소리가 멈췄을 때. 한참을. 그리고 결국 올라가지 않았다. 그녀는 그것을 아직 용서하지 못했다. 자기 자신을.\n  ~ orla_confessed = 1\n* \"누구한테 전화했는지 아시오?\"\n  ORLA: 번호는 몰라요. 부스 벽을 보세요. 각하가 열쇠로 뭔가를 긁어 놓으셨더라고요. 나무 벽에. 내 벽에.\n  ORLA: 그리고 각하가 매번 수화기에 대고 부르던 이름은 알아요. 온 무도장이 다 알아요.\n  ORLA: 마리솔.\n  LIMBIC: 그 이름. 그 이름이 또.\n  ~ knows_marisol = 1\n  ~ thought marisol\n* \"고맙소, 마담.\"\n  ORLA: 뭐가요?\n  ORLA: ……됐어요. 가세요.\n-\n-> orla_hub\n\n=== orla_name\nORLA: 숙박부에 각하는 \"밤의 대통령\"이라고 서명하셨어요. 난 이름을 묻지 않아요. 이름은 장사에 안 좋거든요. 사람들은 이름을 잊으러 레테에 오니까.\nORLA: 하지만 가방에 이름표가 달려 있었죠. 가죽 이름표. 머리글자만. \"L. M.\"\n{has.jacket_velvet || has.jacket_wet} ORLA: 그리고 그 벨벳 재킷. 안감에 수가 놓여 있을걸요. 누가 선물한 거겠죠. 그런 옷은 자기 돈으로 안 어 올린다. 닻 문양이 깨지지 않고 한 덩어리로 떨어진다. 봉투가 열린다.\n-> letter_contents\n\n=== letter_steam_fail\n증기가 밀랍을 녹인다. 너무 많이. 붉은 밀랍이 흘러내려 봉투에 번진다. 닻 문양이 뭉개진다. 당신은 손가락으로 모양을 되살리려 한다. 지문이 찍힌다.\nINTERFACING: ……이건 티가 날 거야. 받는 사람이 눈이 있다면.\n~ letter_resealed = 1\n-> letter_contents\n\n=== letter_contents\n~ letter_read = 1\n두꺼운 편지지 세 장. 손글씨. 가늘고 곧은 글씨, 한 획도 떨리지 않는다. 뜨개바늘 같은 글씨.\n\"할바르-마리스 해운 협상 대표 A. 크루이프 귀하.\n붉은 닻은 다음 세 조건이 받아들여지면 48시간 안에 파업을 끝내고 새 크레인 도입에 반대하지 않겠소.\n하나. 4번 크레인 사망자 여섯 가족에게 가구당 2,000솔도.\n둘. 채용 사무소는 노조가 계속 운영한다. 새 크레인의 기사도 솔레아 사람으로.\n셋. 회사는 보험 청구서에서 토마스 이바라의 이름을 삭제하고, 운전자 과실 주장을 철회한다.\"\n그리고 세 번째 장, 한 줄 띄고.\n\"그리고 한 가지. 7번 크레인의 일은 양쪽 모두 잊는다. 회사는 첩자를 보낸 적이 없고, 노조는 첩자를 만난 적이 없다. 그렇게 하지 않는다면, 7번 크레인은 첫 번째일 뿐 마지막이 아닐 것이오.\n— 로사 이바라, 붉은 닻 위원장\"\nLOGIC: 로사는 파업을 끝내려 한다. 새 크레인을 받아들이고. 대가는 돈, 채용권, 그리고 아들의 이름.\nLOGIC: 그리고 마지막 줄. \"7번 크레인의 일은 양쪽 모두 잊는다.\" 크레인의 남자는 협상 카드다. 동시에 협박이다. 다음은 회사 사람 차례일 수도 있다는.\nRHETORIC: 코뮌주의자가 쓴 문서가 아니다. 이건 사업가의 문서다. 아니, 전쟁을 여러 번 겪은 사람의 문서다. 이길 수 없는 싸움에서 가장 많이 건지는 법을 아는.\nEMPATHY: \"토마스 이바라의 이름.\" 세 조건 중 그것만 명령형이 아니다. \"삭제하고, 철회한다.\" 그녀는 거기서 펜을 한 번 멈췄다. 잉크가 조금 진하다.\n{letter_resealed} ~ item take sealed_letter\n{letter_resealed} ~ item give opened_letter\n당신은 편지를 접어 봉투에 넣는다. {{letter_resealed ? \"밀랍이 뭉개진 채로.\" : \"밀랍 덩어리를 제자리에 대고 따뜻한 칼등으로 눌러 붙인다. 감쪽같다.\"}}\n-> END\n");
  load("04_hall_more.tl", "// ─────────────────────────────────────────────\n// 04. 파코, 분수, 전화 부스, 옥상 문, 뒷마당, 밤의 무도장\n// ─────────────────────────────────────────────\n\n=== paco_hub\n{!night} 무대 가장자리에 백발의 노인이 앉아 있다. 어깨까지 내려오는 흰 머리, 둥근 검은 안경, 무두질한 가죽처럼 갈라진 얼굴. 무릎 위에 반도네온이 잠든 짐승처럼 놓여 있다. 크고 섬세한 손이 그 위에 얹혀 있다.\n{night} 파코 영감은 무대 한가운데 의자에 앉아 연주하고 있다. 반도네온이 그의 무릎 위에서 폈다 접혔다 한다. 숨을 쉬는 폐처럼. 곡과 곡 사이, 그가 고개를 당신 쪽으로 돌린다.\n{first} PACO: 그 발걸음. 오른쪽이 조금 무겁고, 가죽 밑창이 한 짝은 송진을 묻혔고 한 짝은 안 묻혔고. 7호실의 대통령이군.\n{first && has.shoes_pair} PACO: 아니지, 이제 둘 다 묻혔군. 구두를 찾았구먼.\n{!first} PACO: 대통령. 또 왔나.\n* {!paco_named} \"누구시오?\"\n  PACO: 파코. 파코 에스피노사. 이 무대에서 52년째 반도네온을 켜고 있지. 코뮌 때부터. 협약 때도. 은행 때도. 오를라 때도.\n  PACO: 자네는 열흘 동안 매일 밤 내 옆에 앉아서 이 질문을 했어. 괜찮아. 늙은이는 같은 대답을 하는 걸 좋아하거든.\n  ~ paco_named = 1\n* \"탱고에 대해 말해 주시오.\" -> paco_tango\n* {(has.record_olvido || heard_olvido || record_wants_paco) && !paco_olvido_done} \"「올비도」를 들었소.\" -> paco_olvido\n* \"코뮌 시절 이야기를 듣고 싶소.\" -> paco_commune\n* {paco_named} \"눈은 어떻게 된 거요?\" -> paco_eyes\n* {(found_tar || found_bullet || roof_lessons_known || ines_known) && !paco_testimony} \"닷새 전 밤, 무슨 소리를 듣지 않았소?\" -> paco_that_night\n* {paco_named && !task.t_paco} \"필요한 게 있소, 영감?\" -> paco_request\n* {active.t_paco && has.score_commune} \"악보를 찾았소.\" -> paco_score_done\n+ \"쉬시오, 영감.\" -> END\n\n=== paco_tango\nPACO: 탱고라.\n그의 손가락이 반도네온의 단추 위를 소리 없이 훑는다. 음을 누르지 않고, 기억만 누른다.\nPACO: 옛날 옛적 바다 건너 어느 항구의 시인이 이렇게 말했지. 탱고는 춤추는 슬픈 생각이라고.\nPACO: 사람들은 탱고를 정열의 춤이라고 해. 틀렸어. 정열은 빨리 타고 빨리 꺼져. 탱고는 느려. 탱고는 기다려. 한 걸음 내딛기 전에, 두 사람은 한 박자를 같이 숨 쉬지. 그 숨 안에 모든 게 들어 있어.\nPACO: 이끄는 사람은 가슴으로 묻고, 따르는 사람은 가슴으로 대답해. 손이 아니야. 발도 아니야. 가슴이야. 그래서 탱고는 가슴을 맞대고 추는 거야. 거짓말을 할 수가 없으니까.\n* \"나도 탱고를 출 줄 아오?\"\n  PACO: 자네 발이 알지. 어젯밤 무대 앞에서 혼자 추는 걸 들었어. 볼레오까지 하더군. 파트너 없이 볼레오를 하는 놈은 처음 봤어. 미친놈이거나 누군가를 안고 있다고 믿는 놈이지.\n  LIMBIC: 누군가를 안고 있었어. 그 사람이 거기 없었을 뿐.\n  ~ cop_tango += 1\n* \"슬픈 생각이라니. 왜 슬픈 걸 춤으로 추지?\"\n  PACO: 슬픈 걸 혼자 들고 있으면 무거워. 둘이 나눠 들면 걸을 수 있어. 걸을 수 있으면 춤출 수 있고.\n  PACO: 부두 놈들이 왜 밤마다 여기 오는 줄 아나? 크레인에 깔려 죽은 친구, 협약에 빼앗긴 아버지, 떠나 버린 여자. 그걸 다 가슴에 얹고 와서, 모르는 여자하고 가슴을 맞대. 그러면 3분 동안은 그게 조금 가벼워지거든.\n  EMPATHY: 그는 이 말을 수천 번 했을 것이다. 그리고 수천 번 진심이었을 것이다.\n  ~ paco_bond = 1\n* \"반도네온은 어떤 악기요?\"\n  PACO: 원래는 교회 악기였어. 오르간 대신 쓰라고 만든 거지. 가난한 시골 교회에서. 그러다 뱃사람들이 배에 싣고 바다를 건넜어. 항구의 술집에서 신이 아니라 여자를 위해 울기 시작했지.\n  PACO: 이놈은 숨을 쉬어. 폈다가 접었다가. 사람처럼. 그리고 사람처럼 늙어. 내 거는 예순 살이야. 나보다 조금 젊지.\n  ENCYCLOPEDIA[8]: 반도네온의 단추는 71개. 폈을 때와 접을 때 같은 단추가 다른 음을 낸다. 즉, 142개의 음. 세계에서 가장 배우기 어려운 악기 중 하나다. 제1차 반도네온 논쟁에서 한 주교는 이것을 \"악마의 폐\"라고 불렀다.\n-\n-> paco_hub\n\n=== paco_olvido\nPACO: 「올비도」.\n그의 손이 반도네온 위에서 멈춘다.\nPACO: 내가 만든 곡이야. 서른넷에. 루시아라는 여자가 선원하고 도망간 해에. 레코드로도 나왔지. 오르케스타 레테. 한철 유행했어. 솔레아의 모든 무도장에서.\nPACO: 그 뒤로 몇 번이나 켰는지 몰라. 만 번? 이만 번? 처음엔 루시아 생각을 하면서 켰지. 백 번째쯤엔 루시아 얼굴이 흐려졌어. 천 번째쯤엔 이 곡을 들으며 우는 다른 사람들 생각을 하면서 켰고.\nPACO: 이제 이 곡은 루시아 거가 아니야. 이걸 듣고 운 모든 사람 거지.\n* {heard_olvido} \"위층에서 레코드로 들었소. 끝까지. ……울었소.\"\n  노인은 한동안 아무 말도 하지 않는다. 검은 안경 너머로 무엇을 보는지 알 수 없다.\n  PACO: 서른 해가 지났는데도 누군가 울었다라.\n  PACO: 좋군. 그럼 아직 살아 있는 거야. 그 곡은.\n  그가 당신 쪽으로 손을 뻗는다. 당신의 팔뚝을 찾아 두 번 두드린다.\n  PACO: 고맙네, 대통령.\n  ~ morale +1\n  ~ paco_bond = 1\n* {has.record_olvido} 레코드를 그의 손에 쥐여 준다.\n  그의 손가락이 셸락의 가장자리를 따라 돈다. 그리고 흠집에서 멈춘다.\n  PACO: 여기. 초승달 모양. 손톱이군.\n  PACO: 누군가 이 곡을 너무 사랑했거나, 너무 미워했어. 둘은 같은 거지만.\n  그가 레코드를 돌려준다.\n  PACO: 간직하게. 레코드는 자기를 망가뜨린 사람을 제일 잘 기억해.\n  ~ paco_bond = 1\n* {record_wants_paco} \"그 레코드가…… 당신에게 전해 달라고 했소. 30년이 지나도 누군가는 그 노래를 듣고 운다고.\"\n  PACO: 레코드가.\n  그는 웃지 않는다. 비웃지도 않는다. 오래된 사람들은 사물이 말을 한다는 것을 안다.\n  PACO: 그놈이 그렇게 말했나. 건방진 놈. 나보다 오래 살 거면서.\n  그의 목소리가 조금 갈라진다.\n  PACO: ……고맙다고 전해 주게.\n  ~ paco_bond = 1\n  ~ morale +1\n-\n~ paco_olvido_done = 1\n~ thought sad_thought_danced\n~ xp 10\n-> paco_hub\n\n=== paco_commune\nPACO: 코뮌.\n그가 반도네온을 조금 펼친다. 소리 없이. 바람만 들어간다.\nPACO: 여기가 인민 무도장이던 시절. 매일 밤 공짜 탱고. 하역부, 통조림 여공, 선원, 학생, 시인. 모두 같은 바닥에서. 왕이 목욕하던 욕탕 위에서 노동자들이 춤췄어. 그게 혁명이었어. 대포나 연설보다 그게.\nPACO: 로사하고 바르톨로메가 여기서 처음 만났지. 로사는 열여덟이었어. 생선 공장 여공. 바르톨로메는 부두 조직가. 그놈은 춤을 못 췄어. 로사가 가르쳤지. 석 달 만에 그놈이 제일 잘 추게 됐어. 사랑이란 그런 거야.\nPACO: 에르난 소토가 「우리는 잊지 않으리」를 써서 여기 가져왔을 때, 내가 처음으로 반주를 붙였어. 오를라가 불렀지. 열일곱 살짜리가. 포격 전날 밤에.\n* \"바르톨로메는 어떻게 됐소?\"\n  PACO: 요새 벽 앞에서. 코뮌이 무너지고 나흘째 날. 협약은 코뮌 전사들을 스무 명씩 묶어서 썰물 때 개펄로 걸어가게 했어. 요새까지. 우리는 그걸 \"마지막 산책\"이라고 불러.\n  PACO: 로사는 스물다섯이었어. 배 속에 토마스가 있었고. 그 애는 방파제에서 그걸 봤어. 쌍안경도 없이.\n  PACO: 그리고 6주 전에 토마스가 4번 크레인 밑에 깔렸지. 로사한테 뭐가 남았겠나. 손주 둘하고, 노조하고, 분노.\n  ~ rosa_history = 1\n* \"코뮌은 왜 무너졌소?\"\n  PACO: 대포 때문에. 굶주림 때문에. 우리끼리 싸워서. 전부 다.\n  PACO: 아니, 진짜 이유는 하나야. 사람들은 6년 동안 계속 혁명을 할 수 없어. 사람들은 결국 그냥 살고 싶어 해. 춤추고, 먹고, 자고. 혁명은 그걸 위해 한 건데, 혁명이 그걸 못 하게 했지.\n  RHETORIC[9]: 흥미롭다. 코뮌에 대한 향수와 비판이 한 문장 안에 공존한다. 진짜 참전자들의 말투다. 선전물은 절대 이렇게 말하지 않는다.\n  ~ al_moralist += 1\n* \"그 시절이 그립소?\"\n  PACO: 젊었던 게 그립지. 눈이 보이던 게 그립고.\n  PACO: 혁명이 그립냐고? ……매일 밤. 이 무대에서. 한 곡이 끝나고 다음 곡이 시작되기 전, 그 조용한 순간에. 그 순간엔 여기가 아직 인민 무도장이야.\n  ~ al_communard += 1\n-\n~ thought tide_ghost\n-> paco_hub\n\n=== paco_eyes\nPACO: 포격 사흘째. 포탄이 이 건물 뒷벽에 떨어졌어. 나는 무대 위에 있었지. 창유리가 전부 안으로 쏟아졌어. 빛의 폭포처럼.\nPACO: 마지막으로 본 건 오를라 얼굴이었어. 노래하고 있었지. 포탄이 떨어지는 중에도. 입을 벌리고, 눈을 감고. 그다음은 하얀 빛. 그다음은 이것.\n그가 검은 안경을 톡 두드린다.\nPACO: 나쁘지 않은 마지막 장면이야. 사람들은 대개 더 나쁜 걸 보고 멀지.\nEMPATHY: 그는 불평하지 않는다. 46년 동안 한 번도 불평하지 않았을 것이다. 그것이 그의 방식이다. 그리고 그 방식에는 무언가 무서운 것이 있다.\n-> paco_hub\n\n=== paco_that_night\nPACO: 닷새 전 밤.\n그는 잠시 아무 말도 하지 않는다. 반도네온의 가죽 주름을 손가락으로 쓸어내린다.\n{!paco_bond} PACO: 아무것도 못 들었어. 나는 늙고 눈먼 늙은이야. 밤엔 잠을 자지.\n{!paco_bond} -> paco_that_night_closed\nPACO: ……자네한테는 말하지. 자네는 「올비도」를 듣고 운 사람이니까.\n-> paco_that_night_open\n\n=== paco_that_night_closed\n{pass(DRAMA, 10)} DRAMA: 나리, 거짓이옵니다. 저 노인은 매일 밤 새벽까지 무대에 남아 연습한다고 오를라가 말했사옵니다. 잠을 잔다니, 새빨간 거짓말이옵니다.\n* [EMPATHY 11] \"영감. 무언가를 들었다면, 그건 영감 탓이 아니오. 들은 걸 말하는 건 배신이 아니오.\"\n  ?+\n    노인의 어깨가 한 번 오르내린다. 긴 숨.\n    PACO: ……배신이 아니라고. 자네는 로사를 몰라.\n    PACO: 좋아. 말하지.\n    ~ paco_bond = 1\n    -> paco_that_night_open\n  ?-\n    PACO: 배신이 뭔지는 내가 자네보다 잘 알아. 52년을 이 부두에서 살았어. 돌아가게, 대통령.\n* \"알겠소.\"\n-\n-> paco_hub\n\n=== paco_that_night_open\nPACO: 영업이 끝나고 나는 여기 남아서 연습을 했어. 나는 잠을 잘 안 자. 이 건물은 오래됐어. 지붕이 얇지. 무대 바로 위가 옥상이야. 위에서 나는 소리가 이받는다.\n  ?+\n    당신은 두 계단 아래로 물러났다가 어깨부터 문에 몸을 던진다. 쿵. 문틀이 쪼개지고 걸쇠째 문이 바깥으로 튕겨 나간다. 햇빛, 바람, 날아오르는 비둘기 수십 마리.\n    ~ roof_open = 1\n    ~ orla_door_broken = 1\n  ?-\n    당신은 두 계단 아래로 물러났다가 어깨부터 문에 몸을 던진다. 쿵. 문은 꿈쩍도 하지 않는다. 당신의 어깨가 꿈쩍한다. 많이.\n    PAIN: 쇄골. 쇄골이 말을 한다. 그 말은 비명이다.\n    ~ health -1\n+ 계단을 내려간다. -> END\n\n// ─────────────────────────────────────────────\n// 뒷마당\n// ─────────────────────────────────────────────\n\n=== backyard @location name=\"레테 뒷마당\" art=backyard travel=1\n{first} 뒷문을 열자 좁고 축축한 마당이 나온다. 무도장의 뒷벽과 벌집 공동주택의 옆벽 사이, 하늘이 긴 띠처럼 보이는 틈. 머리 위로 빨랫줄이 수십 가닥 가로지르고, 그 위에서 셔츠와 속치마와 기저귀가 깃발처럼 펄럭인다.\n{first} 쓰레기통 세 개, 빈 병 상자 몇 개, 부엌에서 나온 생선 뼈와 감자 껍질 냄새. 무도장 벽을 따라 녹슨 비상계단이 옥상까지 지그재그로 올라간다. 가장 아래 사다리는 걷어 올려져 있어서, 지상에서 3미터쯤 위에 매달려 있다.\n{!first} 레테의 뒷마당. 빨래, 쓰레기통, 빈 병, 그리고 비상계단. 도시의 뒷면.\n{first} SHIVERS[10]: 이곳은 도시의 뒤꿈치다. 사람들이 보여 주고 싶지 않은 것들이 모이는 곳. 버려진 병, 몰래 피우는 담배, 울러 나온 여급. 벽들은 모든 걸 듣고, 아무 말도 하지 않는다.\n+ {bottles_day != day} 빈 병 상자를 뒤진다. -> by_bottles\n+ 쓰레기통 위의 고양이를 본다. -> by_cat\n+ 비상계단을 올려다본다. -> by_fireescape\n+ {met_yun} 윤 경위와 이야기한다. -> yun_hub\n+ 뒷문으로 무도장에 들어간다. => hall 1\n+ 벌집 공동주택 안뜰로 간다. => honeycomb 2\n+ 골목을 따라 부두로 나간다. => quay 3\n\n=== by_bottles\n빈 병 상자는 무도장 부엌에서 내놓은 것이다. 대부분은 에밀이 회수해 가지만, 그가 놓친 것들이 상자 밑바닥과 쓰레기통 옆에 굴러다닌다.\n당신은 허리를 굽힌다. 줍는다. 레테 럼, 사르가 맥주, 이름 모를 포도주. 초록, 갈색, 투명.\n~ item add bottle_empty\n~ item give bottle_empty\n~ item give bottle_empty\n{day >= 2} ~ item give bottle_empty\n~ bottles_day = day\n~ cop_hobo += 1\n{cop_hobo >= 3} ~ thought hobocop\n빈 병 {{count.bottle_empty}}개. 에밀이 한 병에 10센티모씩 쳐준다.\n{met_yun && !yun_bottle_comment} YUN: ……형사님.\n{met_yun && !yun_bottle_comment} YUN: 아닙니다. 계속하세요. 경비대 월급이 석 달째 밀렸으니까요. 저도 이해합니다.\n{met_yun && !yun_bottle_comment} ~ yun_bottle_comment = 1\n-> END\n\n=== by_cat\n찌그러진 쓰레기통 뚜껑 위에 커다란 수고양이가 앉아 있다. 줄무늬가 있는 회갈색, 한쪽 귀는 반쯤 잘려 나갔고, 한쪽 눈은 하얗게 멀었다. 남은 눈 하나가 노랗게 당신을 본다. 감정이 없다. 판결을 내리는 눈이다.\n* 손을 내민다.\n  고양이는 당신의 손가락 냄새를 맡는다. 럼, 립스틱, 욕조의 회색 물, 분수의 동전. 고양이의 수염이 한 번 떨린다. 그리고 고양이는 고개를 돌린다. 경멸하며.\n  EMPATHY: 괜찮다. 고양이들은 원래 그렇다. 적어도 할퀴지는 않았다.\n* <INLAND 10> 고양이의 눈을 들여다본다.\n  노란 눈 속에 무언가 비친다. 밤. 비상계단. 달빛.\n  INLAND: 고양이는 모든 걸 봤어. 닷새 전 밤. 새벽 두 시쯤.\n  INLAND: 남자 넷이 비상계단을 내려왔어. 길고 무거운 자루를 들고. 아니, 자루가 아니야. 사람이야. 담요에 싸인. 남자들한테서 생선 냄새하고 겁 냄새가 났어. 가장 덩치 큰 놈이 자루의 머리 쪽을 들었어. 울고 있었어.\n  INLAND: 그리고 그들보다 먼저, 훨씬 먼저, 작은 그림자 하나가 배수관을 타고 내려왔어. 원숭이처럼. 소리 없이.\n  고양이가 하품을 한다. 날카로운 이빨이 보인다. 대화는 끝났다.\n  LOGIC: 고양이의 증언은 법정에서 채택되지 않는다. 하지만 수사관의 머릿속에서는 채택된다. 시신은 옥상에서 비상계단으로 옮겨졌다. 네 명. 그리고 \"작은 그림자\".\n  ~ cat_testimony = 1\n  ~ roof_scene_known = 1\n  ~ xp 10\n* [AUTHORITY 9] \"비켜라, 고양이. 경찰이다.\"\n  ?+\n    고양이가 당신을 본다. 당신이 고양이를 본다. 10초. 20초.\n    고양이가 천천히, 아주 천천히 쓰레기통에서 내려온다. 그리고 당신 다리 사이를 지나 사라진다. 꼬리를 세우고.\n    AUTHORITY: 이겼다. 우리가 이겼다. 고양이를 상대로.\n  ?-\n    고양이는 움직이지 않는다. 대신 하품을 한다. 그리고 앞발을 핥는다. 당신이라는 존재가 이 우주에서 가장 지루한 현상이라는 듯이.\n    AUTHORITY: ……고양이는 권위를 인정하지 않는다. 고양이는 무정부주의자다.\n    ~ morale -1\n-\n-> END\n\n=== by_fireescape\n녹슨 철제 비상계단이 무도장 벽을 따라 옥상까지 올라간다. 가장 아래 사다리는 걷어 올려져 있다. 지상에서 3미터쯤 위, 손이 닿지 않는 곳에서 사다리 끝이 흔들린다.\n비상계단 바로 옆으로 무쇠 배수관이 하나 지붕까지 뻗어 있다.\n* {!drainpipe_seen} [PERCEPTION 9] 배수관과 벽을 자세히 본다.\n  ?+\n    배수관의 녹 위에 반들반들하게 닳은 자국들이 있다. 일정한 간격으로. 손과 발을 디딘 자국이다. 누군가 이 배수관을 자주 오르내린다. 가볍고 작은 누군가. 어른의 무게였다면 이 오래된 고정쇠가 버티지 못했을 것이다.\n    배수관 밑의 진흙에 작은 고무 밑창 자국이 찍혀 있다. 아이 신발. 밑창에 별 모양 무늬.\n    ~ drainpipe_seen = 1\n    ~ child_print_yard = 1\n  ?-\n    배수관은 배수관이다. 녹슬고, 차갑고, 비둘기 똥이 묻었다.\n* [SAVOIR 12] 도약해서 사다리 끝을 잡아 끌어내린다.\n  ?+\n    당신은 두 걸음 도움닫기를 하고 뛰어오른다. 손끝이 사다리의 마지막 가로대를 잡는다. 체중이 실리자 사다리가 끼익 소리를 내며 미끄러져 내려온다. 당신은 사다리와 함께 우아하게 착지한다. 거의.\n    SAVOIR: 봤지? 이 도시의 모든 사다리는 우리 거야.\n    ~ fire_ladder_down = 1\n  ?-\n    당신은 뛰어오른다. 손끝이 가로대에 닿는다. 미끄러진다. 당신은 쓰레기통 위로 떨어진다. 고양이가 비명을 지르며 달아난다.\n    ~ health -1\n* {met_yun} [PHYSICAL 9 +2 met_yun \"윤 경위가 발판이 되어 준다\"] 윤 경위에게 발판을 부탁한다.\n  ?+\n    YUN: ……발판이요.\n    그녀는 한숨을 쉬지 않는다. 대신 무릎을 굽히고 두 손을 깍지 낀다. 당신이 그 손을 밟자 그녀가 한 번에 밀어 올린다. 작은 몸에서 나오는 놀라운 힘. 당신의 손이 사다리를 잡는다.\n    YUN: 해군에서 배웠어요. 갑판원들을 돛대에 올려 보낼 때.\n    ~ fire_ladder_down = 1\n    ~ yun_trust += 1\n  ?-\n    YUN: ……발판이요.\n    그녀가 무릎을 굽히고 손을 깍지 낀다. 당신이 그 손을 밟는다. 그녀가 밀어 올린다. 당신은 무게 중심을 잃는다. 둘 다 쓰레기통 사이로 넘어진다.\n    YUN: ……\n    YUN: 다음엔 몸무게를 좀 줄이고 오세요.\n    ~ health -1\n+ {fire_ladder_down} 비상계단을 타고 옥상까지 올라간다. => roof 4\n+ 물러선다. -> END\n\n// ─────────────────────────────────────────────\n// 밤의 무도장 — 탱고\n// ─────────────────────────────────────────────\n\n=== tango_floor\n{!night} -> END\n당신은 테이블 사이를 지나 무대 앞의 무도장으로 나간다. 반짝이는 참나무 바닥 위에 송진 가루가 하얗게 뿌려져 있다. 스무 쌍쯤의 남녀가 분수 주위를 반시계 방향으로 천천히 돈다. 강물처럼. 하나의 흐름 안에서 각자 다른 소용돌이를 그리며.\n무대 위에서 파코의 반도네온이 숨을 들이쉰다. 바이올린 한 대, 낡은 피아노 한 대가 그 숨을 따라간다.\n{danced_day != day} SAVOIR: 여기다. 여기가 우리 자리야. 발이 먼저 알아. 느껴져?\n{danced_day == day} 오늘 밤은 이미 한 곡 추었다. 다리가 기분 좋게 뻐근하다.\n+ {danced_day != day && (orla_trust >= 1 || debt <= 110)} 마담 오를라에게 춤을 청한다.\n  -> tango_orla\n+ {danced_day != day} 벽에 기대 선 여공에게 춤을 청한다.\n  -> tango_stranger\n+ {danced_day != day} 혼자 춘다. 어젯밤처럼.\n  -> tango_alone\n* {!asked_olvido} 파코에게 「올비도」를 청한다.\n  -> tango_olvido\n+ 춤추는 사람들을 구경만 한다.\n  당신은 분수 가장자리에 앉아 춤추는 사람들을 본다. 부두 하역부의 두꺼운 팔이 여공의 가는 등을 감싼다. 협약 수병이 늙은 과부를 조심스럽게 이끈다. 두 청년이 서로를 안고 연습한다. 어느 커플도 서로를 보지 않는다. 눈을 감거나, 어깨 너머 허공을 본다. 가슴과 가슴만 대화한다.\n  EMPATHY[9]: 저기 저 커플. 저 남자는 3주째 일을 못 했다. 저 여자는 오늘 남편 묘지에 다녀왔다. 둘은 서로 모른다. 3분 동안, 둘은 서로의 슬픔을 들어 준다. 그리고 곡이 끝나면 고개를 숙이고 헤어진다. 이름도 묻지 않고.\n  ~ time +15\n  -> END\n+ 물러선다. -> END\n\n=== tango_orla\n~ danced_with_orla = 0\n마담 오를라는 정문에서 당신을 본다. 눈썹 하나가 올라간다. 그녀는 궐련을 에밀에게 맡기고, 스팽글 드레스의 옷자락을 한 번 털고, 무도장으로 걸어 나온다.\nORLA: 대통령 각하께서 춤을 청하시네. 목소리는 없어도 발은 있죠.\n그녀가 당신 앞에 선다. 가까이. 그녀의 향수: 오래된 장미, 담배, 분.\nORLA: 가슴으로 해요. 손으로 끌면 발등을 밟을 거예요. 내가.\n~ danced_with_orla = 1\n~ danced_alone = 0\n-> tango_dance\n\n=== tango_stranger\n벽에 기대 선 젊은 여자. 통조림 공장 앞치마를 벗어 팔에 걸었고, 손끝이 생선 소금에 거칠어져 있다. 그녀는 당신을 위아래로 훑어본다. 앵무새 셔츠, 나팔바지, 콧수염.\nWORKER: 대통령 아저씨네. 저번에 무대에서 연설하던.\nWORKER: ……좋아요. 한 곡만. 발 밟으면 끝이에요.\n~ danced_with_orla = 0\n~ danced_alone = 0\n-> tango_dance\n\n=== tango_alone\n당신은 무도장 가장자리, 사람들의 흐름에서 조금 떨어진 곳에 선다. 눈을 감는다. 팔을 들어 올린다. 허공을 안는다.\n사람들이 웃는다. 몇몇은. 대부분은   load("05_yun.tl", "// ─────────────────────────────────────────────\n// 05. 윤 세하 경위\n// ─────────────────────────────────────────────\n\n=== yun_hub\n{first} 윤 경위는 반 걸음 뒤에 서 있다. 언제나 반 걸음 뒤. 당신이 돌아보면 수첩에서 눈을 들고, 연필을 귀에 꽂는다.\n{!first && yun_trust < 0} YUN: 네.\n{!first && yun_trust >= 0 && yun_trust < 4} YUN: 네, 형사님.\n{!first && yun_trust >= 4} YUN: 네, 형사님. 말씀하세요.\n{night && !yun_night_line} YUN: 벌써 이렇게 늦었네요. 솔레아의 밤은 일찍 와요. 안개 때문에.\n{night} ~ yun_night_line = 1\n+ \"지금까지 알아낸 걸 정리해 봅시다.\" -> yun_case\n+ \"다음엔 뭘 해야 할까?\" -> yun_next\n* \"당신에 대해 알고 싶소.\" -> yun_about\n* \"나에 대해 들은 게 있소?\" -> yun_about_me\n* {yun_about_done} \"가람 제도는 어떤 곳이오?\" -> yun_garam\n* \"그 오토바이 말이오.\" -> yun_bike\n* \"정치에 대해선 어떻게 생각하오?\" -> yun_politics\n+ {coffee_day != day} \"커피 좀 있소?\" -> yun_coffee\n* {!has.flashlight} \"손전등 있소?\" -> yun_flashlight\n* {has.pulp_mallow} \"이 책…… 당신이 좋아한다던데.\" -> yun_pulp\n* {has.notebook && notebook_read_all && !yun_notebook_done} \"내 수첩을 같이 봐 주시오.\" -> yun_notebook\n* {found_bullet && !has.gun_ravn && !yun_gun_talk} \"그 탄두 말인데.\" -> yun_gun_talk\n* {yun_trust >= 4 && yun_about_done && !yun_lecture} \"혹시, 나를 전에 본 적이 있소?\" -> yun_lecture\n* {name_known && !yun_name_told} \"내 이름을 알아냈소. 라자로 몬테로.\"\n  YUN: 라자로 몬테로.\n  그녀가 수첩을 펴고 한 페이지를 넘긴다. \"알바로(?)\", \"페드로(?)\" 같은 것들이 적힌 페이지다. 그녀는 그 위에 깔끔하게 줄을 긋고, 밑에 쓴다. \"라자로 몬테로 경위. 9분서.\"\n  YUN: \"로\"로 끝나긴 하네요. 제 추리가 틀리진 않았어요.\n  YUN: 반갑습니다, 몬테로 경위님. 이제야 제대로 인사드리네요.\n  ~ yun_name_told = 1\n  ~ yun_trust += 1\n+ \"됐소. 가 봅시다.\" -> END\n\n// ───────── 사건 정리 ─────────\n\n=== yun_case\n그녀가 수첩을 편다. 몽당연필 끝으로 줄을 짚어 가며 읽는다. 목소리는 보고서처럼 평평하다.\nYUN: 정리해 보죠.\n{!body_seen} YUN: 솔직히 아직 정리할 게 없어요. 우리는 현장도 안 봤습니다. 7번 크레인은 부두 거리 끝에 있어요.\n{body_seen && !body_down} YUN: 신원 미상의 남성이 7번 크레인 지브 끝 갈고리에 목이 매달려 있습니다. 나흘째. 크레인은 파업 중인 붉은 닻 노조가 막고 있어요.\n{body_seen && !body_down && !rosa_permission} YUN: 시신을 내리려면 노조 위원장 로사 이바라의 허락이 필요하다고 하더군요. 노조 본부는 통조림 공장이에요.\n{rosa_permission && !simon_agrees && !body_down} YUN: 로사는 허락했어요. 이제 크레인을 움직일 사람이 필요해요. 크레인 기사 시몬   load("06_quay.tl", "// ─────────────────────────────────────────────\n// 06. 부두 거리 — 솔레아의 심장\n// ─────────────────────────────────────────────\n\n=== quay @location name=\"솔레아 부두 거리\" art=quay travel=3\n{first} 레테 무도장의 정문을 나서자 바람이 뺨을 때린다. 소금, 디젤, 생선 내장, 석탄 연기, 그리고 강물의 흙냄새.\n{first} 부두 거리는 솔레아의 등뼈다. 자갈 깔린 길이 물가를 따라 1킬로미터쯤 휘어지고, 한쪽으로는 창고와 선술집과 통조림 공장의 벽돌 벽이, 다른 쪽으로는 검은 물과 계류 기둥과 크레인들이 늘어서 있다. 크레인들은 여덟 대. 모두 멈춰 있다. 철골의 새들이 긴 목을 바다 쪽으로 뻗은 채 꼼짝하지 않는다.\n{first} 그리고 부두 끝에서 두 번째, 일곱 번째 크레인. 지브 끝에서 무언가가 흔들린다. 검고 길고 무거운 것. 이 거리 어디서든 보인다. 이 거리 사람들은 그것을 보지 않으려고 걷는 방향을 바꾼다.\n{first} SHIVERS[9]: 솔레아가 숨을 쉰다. 3주째 파업. 부두는 멈췄지만 도시는 멈추지 않는다. 멈출 수가 없다. 통조림 공장의 식은 보일러, 문 닫은 생선 경매장, 할 일 없이 선술집 앞에 모인 하역부들. 모두가 무언가를 기다린다. 그리고 모두가 저 크레인을 등지고 기다린다.\n{first} ESPRIT[10]: 이 거리에 경비대 초소가 있었다. 저기, 선술집 옆 녹슨 파란 문. 12년 전에 문을 닫았다. 예산. 이제 솔레아에서 경찰은 당신과 윤 경위뿐이다. 이 거리가 경찰을 마지막으로 본 게 언제였을까.\n{!first && !night} 부두 거리. 멈춘 크레인들, 문 닫은 경매장, 생선 튀김 기름 냄새. 일곱 번째 크레인 쪽에서 구호 소리가 바람을 타고 온다.\n{!first && night} 밤의 부두 거리. 나트륨등이 자갈 위에 호박색 웅덩이를 만들고, 그 사이는 어둡다. 레테의 네온사인이 멀리서 붉게 깜빡인다. 선술집에서 누군가 노래를 부른다. 일곱 번째 크레인의 형체는 밤하늘보다 조금 더 검다.\n{!body_down && !first} 일곱 번째 크레인의 지브 끝에서 그것이 여전히 흔들린다.\n{body_down && !quay_body_gone_seen} 일곱 번째 크레인의 지브 끝이 비어 있다. 케이블만 바람에 흔들린다. 거리 사람들이 처음으로 그쪽을 쳐다본다. 오래.\n{body_down} ~ quay_body_gone_seen = 1\n+ 일곱 번째 크레인 쪽을 바라본다. -> quay_view\n+ {!night || hour < 22} 생선 튀김 노점의 여자에게 간다. -> marga_hub\n+ {!night} 헌책 노점을 둘러본다. -> ignacio_hub\n+ 생선 상자 위에 앉은 종이 왕관의 남자에게 간다. -> aurelio_hub\n+ {!night} 비둘기에게 모이를 주는 벤치의 노인에게 간다. -> gregor_hub\n+ {met_yun} 윤 경위와 이야기한다. -> yun_hub\n+ 부두 끝, 7번 크레인으로 간다. => crane 3\n+ 통조림 공장(붉은 닻 노조 본부)으로 간다. => cannery 4\n+ 코스타 전당포에 들어간다. => pawn 2\n+ 벌집 공동주택 쪽 골목으로 간다. => honeycomb 4\n+ 운하 다리를 건너 익사한 종의 교회로 간다. => church 7\n+ 방파제와 등대 쪽으로 걷는다. => breakwater 8\n+ 언덕 위 그랜드 메리디안 호텔까지 걸어 올라간다. => hotel 18\n+ {met_yun} 윤 경위의 사이드카를 타고 언덕 위 호텔로 간다. -> quay_sidecar\n+ 레테 무도장으로 돌아간다. => hall 2\n\n=== quay_sidecar\n윤 경위가 오토바이에 올라 시동을 건다. 나비 32가 기침을 두 번 하고, 낮고 규칙적으로 그르렁거리기 시작한다. 당신은 사이드카에 몸을 ed = 1\n{!first} MARGA: 또 왔수? 배고프지? 얼굴이 딱 배고픈 얼굴이네.\n+ {money >= 0.5} \"생선 튀김 하나 주시오.\" (0.5솔도) -> marga_fish\n* \"요즘 장사는 어떻소?\" -> marga_business\n* \"크레인에 매달린 남자에 대해 아시오?\" -> marga_body\n* \"로사 이바라라는 사람에 대해 들었소.\" -> marga_rosa\n* {ines_heard || ines_known} \"이네스라는 아가씨를 아시오?\" -> marga_ines\n* {marga_ines_done || bobo_met} \"보보라는 꼬마를 아시오?\" -> marga_bobo\n* {!task.t_marga} \"도울 일이 있소?\" -> marga_job\n* {active.t_marga} \"얼음 상자는 어디 있소?\" -> marga_crates\n* \"바다 건너 저 회색 배는 뭐요?\" -> marga_ship\n+ \"또 봅시다.\" -> END\n\n=== marga_fish\n그녀가 커다란 국자로 기름 속에서 황금빛 덩어리를 건져 올린다. 기름을 털고, 신문지 한 장을 원뿔로 말아 담고, 굵은 소금을 한 줌 뿌린다.\nMARGA: 대구요. 얼음 창고에 남은 마지막 대구. 파업 끝날 때까지 이게 끝이야. 다음 주부턴 감자만 튀겨요.\n~ money -0.5\n~ item add fish_fried\n{!gull_attack && hour >= 10} -> marga_gull\n-> marga_hub\n\n=== marga_gull\n당신이 신문지 원뿔을 받아 드는 순간, 머리 위로 그림자가 지나간다.\n* [REACTION 10] 몸을 틀어 피한다! -> marga_gull_ok | marga_gull_fail\n\n=== marga_gull_ok\n당신의 몸이 생각보다 먼저 움직인다. 반 걸음 옆으로, 팔을 끌어당겨 가슴에 붙인다. 커다란 갈매기가 부리로 허공을 쪼고, 날개로 당신의 뺨을 한 번 때리고, 빈손으로 날아오른다. 분노에 찬 울음소리.\nMARGA: 어머나! 잘 피하셨네! 저놈이 이 거리에서 백 번은 성공한 놈이야. 대통령 나리가 처음 이긴 거야!\nREACTION: 보셨습니까. 반사 신경은 기억을 필요로 하지 않는다.\n~ gull_attack = 1\n~ gull_win = 1\n~ thought gull_phobia\n-> marga_hub\n\n=== marga_gull_fail\n희고 거대한 무언가가 당신의 손 앞으로 내리꽂힌다. 노란 부리, 노란 눈, 비린내, 날갯짓. 신문지 원뿔이 손에서 뜯겨 나간다. 갈매기는 대구 튀김을 통째로 물고 크레인 쪽으로 날아간다. 뒤에서 다른 갈매기 세 마리가 비명을 지르며 쫓아간다.\n당신의 손에는 빈 신문지 조각만 남았다. 검지 끝에 작은 상처. 부리가 스친 자리.\nMARGA: 아이고! 그놈이야! 그 대가리 흰 놈! 저놈이 이 거리에서 백 번은 성공한 놈이야!\nHALFLIGHT: 그 눈을 봤어? 노랗고, 텅 비고, 태고의 공룡처럼 무자비한 눈. 저놈들은 알아. 우리가 약하다는 걸. 저놈들은 크레인 위의 남자도 먹었어. 저놈들은 기다리고 있어.\n~ item take fish_fried\n~ gull_attack = 1\n~ thought gull_phobia\nMARGA: 됐어요, 됐어. 하나 더 줄게. 공짜로. 갈매기 세금이라고 생각해요.\n~ item add fish_fried\n-> marga_hub\n\n=== marga_business\nMARGA: 장사? 장사가 어디 있어. 파업 3주째야. 배가 안 들어오니 생선이 없고, 하역부들이 돈을 못 버니 사 먹을 사람이 없고. 나는 얼음 창고에 남은 대구를 튀겨서 반값에 팔아요. 외상도 줘요. 외상 장부가 이만큼이야.\n그녀가 손가락 두 개로 두께를 보여 준다. 두껍다.\nMARGA: 그래도 괜찮아. 파업이 이기면 다 갚을 거야. 로사가 이긴다고 했어. 로사는 약속을 지켜. 적어도 우리한테는.\n* \"파업이 지면?\"\n  M
