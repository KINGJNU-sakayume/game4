  load("19_breakwater.tl", "// ─────────────────────────────────────────────\n// 19. 방파제와 등대 — 벨로소 부부, 볼크 하사, 재빛 왜가리\n// ─────────────────────────────────────────────\n\n=== breakwater @location name=\"방파제와 등대\" art=breakwater travel=8\n{first} 부두 거리가 끝나고, 모래밭이 끝나고, 돌이 시작된다. 방파제다. 바다 쪽으로 곧게 뻗은 화강암의 팔. 한 세기 전 해양 왕관이 쌓은 것이다. 거대한 돌덩이마다 초록 이끼와 따개비가 붙었고, 돌 틈에서 게들이 달아난다. 길이 1킬로미터가 넘는다. 끝이 안개 속에 잠겨 있다.\n{first} 안개 속에서 등대가 떠오른다. 붉은 줄과 흰 줄이 번갈아 칠해진 원통형의 탑. 줄무늬는 바래서 분홍과 회색이 되었다. 꼭대기의 등롱은 불이 꺼져 있다. 대신 탑 아래쪽 작은 집의 굴뚝에서 연기가 가늘게 올라간다. 누군가 산다.\n{first} 방파제 안쪽, 잔잔한 물 위에 회색 순찰정 한 척이 묶여 있다. 뱃머리에 흰 글씨 \"PB-7\". 고물에 협약의 깃발. 푸른 바탕에 원을 이룬 다섯 개의 별. 깃발이 축축하게 늘어져 있다.\n{first} 그리고 방파제 바깥쪽, 만(灣)의 한가운데에, 검은 섬 하나. 별 모양으로 각진 성벽, 반쯤 무너진 탑. 탑 꼭대기에서 작은 불빛이 규칙적으로 깜빡인다. 조수 요새.\n{first} SHIVERS: 저 섬은 이 도시가 삼킨 가장 큰 기억이다. 46년 동안 사르가는 저 섬을 보지 않으려고 고개를 돌렸다. 그래서 저 섬은 늘 거기 있다. 모든 창문의 구석에.\n{first && lowtide} 물이 빠져 있다. 방파제 뿌리에서 요새까지 회갈색 개펄이 드러났다. 끝없이 평평하게, 젖어 번들거리며. 물골들이 은색 혈관처럼 개펄을 가로지른다.\n{first && !lowtide} 물이 차 있다. 방파제와 요새 사이는 회색 바다다. 잔물결. 갈매기들. 이 바다 밑에 길이 있다는 것을 아무도 믿지 않을 것이다.\n{!first && lowtide && !night} 방파제. 물이 빠졌다. 개펄이 요새까지 이어져 있다. 등대 굴뚝의 연기, 순찰정의 깃발.\n{!first && !lowtide && !night} 방파제. 물이 차 있다. 요새가 바다 한가운데 떠 있다. 등대 굴뚝의 연기, 순찰정의 깃발.\n{!first && night} 밤의 방파제. 요새 꼭대기의 협약 등표가 깜빡인다. 3초마다 한 번. 그 사이의 어둠이 길다. 등대 창문에 노란 불빛 하나.\n{tideleft > 0 && tideleft <= 60} MARIA: (등대 쪽에서 외치는 소리) 물 들어온다! 한 시간도 안 남았어!\n+ 등대로 간다. -> lh_door\n+ 순찰정의 협약 하사에게 간다. -> volk_hub\n+ 방파제 끝까지 걸어가 말뚝들을 본다. -> bw_stakes\n+ 방파제 뿌리의 게시판을 본다. -> bw_board\n+ {lowtide} 돌계단을 내려가 개펄로 나간다. => flats 5\n+ {!lowtide} 개펄로 내려가는 돌계단을 본다. -> bw_steps_high\n+ {has.rowboat_pass} 방파제 아래 매어 둔 나룻배 '마리아'를 저어 요새로 간다. => fort 25\n+ {met_yun} 윤 경위와 이야기한다. -> yun_hub\n+ 부두 거리로 돌아간다. => quay 8\n\n// ───────── 게시판과 계단 ─────────\n\n=== bw_board\n방파제 뿌리에 비바람에 삭은 나무 게시판이 서 있다. 유리가 깨진 진열장 안에 종이가 몇 장. 항만 규칙, 익사 사고 경고, 협약 세관 공고, 코뮌 기념일에 누군가 붙였다가 반쯤 뜯긴 전단. 그리고 등사판으로 찍은 조수표.\n\"솔레아 만 조수표 — 썰물: 새벽 5시경, 저녁 5시경. 매일 약 한 시간씩 늦어짐. 썰물은 약 네 시간 지속. 개펄 통행 시 익사에 유의. 물은 걷는 사람보다 빨리 돌아옵니다.\"\nLOGIC: 오늘은 {{day}}일째. 그렇다면 오늘 썰물은 {{4 + day}}시부터 {{9 + day}}시까지, 그리고 {{16 + day}}시부터 {{20 + day}}시까지.\n{lowtide} LOGIC: 지금은 썰물이다. 개펄이 닫히기까지 약 {{tideleft}}분.\n{!lowtide} LOGIC: 지금은 물이 차 있다. 다음 썰물까지 약 {{tidewait}}분.\n조수표 여백에 누군가 볼펜으로 새를 그려 놓았다. 목이 길고, 부리가 길고, 한 다리로 서 있다. 그 밑에 작은 글씨. \"보았는가? — L.V.\"\n+ {!has.tide_table} 여분의 조수표 한 장을 떼어 간다.\n  진열장 밑에 같은 조수표가 몇 장 더 꽂혀 있다. 누군가 필요한 사람이 가져가라고. 당신은 한 장을 접어 주머니에 넣는다.\n  ~ item add tide_table\n  -> END\n+ 물러선다. -> END\n\n=== bw_steps_high\n방파제 옆구리에 이끼 낀 돌계단이 아래로 나 있다. 계단은 여섯 칸 내려가다가 회색 물속으로 사라진다. 물 밑에서 일곱 번째, 여덟 번째 칸이 흐릿하게 보인다. 그 아래는 안 보인다.\n{has.tide_table} LOGIC: 조수표에 따르면 다음 썰물까지 약 {{tidewait}}분.\n{!has.tide_table} LOGIC: 언제 물이 빠질까. 방파제 뿌리의 게시판에 조수표가 있을 것이다.\n+ 방파제에 앉아 물이 빠지기를 기다린다. -> bw_wait\n+ 물러선다. -> END\n\n=== bw_wait\n당신은 방파제 돌 위에 앉는다. 돌이 차갑고 축축하다. 바다를 본다.\n기다림은 이상한 일이다. 처음 십 분은 길다. 그다음 삼십 분은 짧다. 그다음은 시간이 사라진다. 물결이 온다. 물결이 간다. 갈매기가 앉았다 난다. 요새의 등표가 깜빡인다. 당신은 아무것도 하지 않는다. 아무것도 하지 않는 것이 이렇게 어려운 일이었나.\n{pass(INLAND, 10)} INLAND: 너는 기다리는 법을 잊었어. 술이 그걸 가져갔지. 술은 모든 기다림을 없애 줘. 기다릴 필요가 없게 만들어 줘. 지금 이건, 6년 만에 처음 해 보는 기다림이야.\n~ waittide\n그리고 어느 순간, 물이 물러나 있다. 돌계단의 일곱 번째 칸, 여덟 번째 칸, 그리고 그 아래로 번들거리는 진흙. 개펄이 숨을 쉬듯 드러난다.\n{!known.heron_patience} HALFLIGHT: 이상하다. 조금도 지루하지 않았다.\n-> END\n\n// ───────── 말뚝 ─────────\n\n=== bw_stakes\n방파제 끝. 등대를 지나 더 걸어가면 돌이 끝나고, 녹슨 쇠 난간이 끝나고, 바다가 시작된다.\n그 바다 위에 말뚝들이 줄지어 서 있다. 왕관 시대에 배를 묶던 계선 말뚝. 굵은 참나무 기둥에 타르를 먹이고 쇠띠를 둘렀다. 지금은 대부분 썩어서 부러지고 기울었다. 바다 쪽으로 한 줄로, 점점 멀어지며.\n누군가 말뚝마다 흰 페인트로 번호를 써 놓았다. 1, 2, 3…… 16. 페인트가 벗겨져 희미하다.\n그리고 16번 너머, 조금 떨어진 곳에, 말뚝이 하나 더 있다. 번호가 없다. 다른 말뚝들보다 가늘다. 회색이다. 타르의 검은색이 아니라, 재의 회색. 위쪽이 조금 굽었다. 물음표처럼.\n{lowtide} 물이 빠져서 말뚝들의 밑동이 드러났다. 진흙에 박힌 검은 기둥들. 그런데 마지막 회색 말뚝의 밑동은 이상하게 가늘다. 진흙 위에 서 있는 것이 아니라, 진흙을 딛고 서 있는 것처럼.\n{pass(PERCEPTION, 11)} PERCEPTION: 저 말뚝에는 따개비가 없다. 16개의 말뚝은 모두 따개비와 해초로 뒤덮여 있는데. 저것만 깨끗하다.\n{pass(SHIVERS, 11)} SHIVERS: 바람이 분다. 16개의 말뚝은 바람을 맞는다. 17번째는 바람을 느낀다.\n+ {has.binoculars && !heron_glimpse} 로렌초의 쌍안경으로 17번째 말뚝을 본다. -> bw_binoculars\n+ {!has.binoculars} [VISUAL 12] 맨눈으로 17번째 말뚝의 형태를 분석한다. -> bw_stake_eye_ok | bw_stake_eye_fail\n+ 말뚝을 향해 소리친다. -> bw_shout\n+ 물러선다. -> END\n\n=== bw_stake_eye_ok\nVISUAL: 거리 약 90미터. 높이 수면 위 1.6미터. 위쪽 3분의 1 지점에서 앞으로 굽었다가 다시 위로. S자. 나무는 이렇게 자라지 않는다. 사람이 깎아도 이렇게 깎지 않는다.\nVISUAL: 그리고 맨 위의 끝이 뾰족하다. 너무 뾰족하다. 부러진 나무의 끝이 아니라 무언가의 끝.\nVISUAL: 쌍안경이 있으면 확실히 알 수 있을 것이다.\n~ stake_suspect = 1\n-> bw_stakes\n\n=== bw_stake_eye_fail\nVISUAL: 회색 말뚝. 바다. 안개. 눈이 아프다. 숙취 속의 원근법은 믿을 게 못 된다.\n-> bw_stakes\n\n=== bw_shout\n당신은 두 손을 입에 모으고 외친다. 바다를 향해. 말뚝을 향해.\n{!night} 갈매기들이 날아오른다. 16개의 말뚝 위에서, 한꺼번에. 17번째 말뚝 위에는 갈매기가 앉아 있지 않았다. 처음부터.\n{night} 어둠 속으로 목소리가 사라진다. 대답은 없다. 등표가 깜빡인다. 그 3초의 빛 속에서, 17번째 말뚝이 조금, 아주 조금, 방향을 바꾼 것 같다.\n{pass(HALFLIGHT, 10)} HALFLIGHT: 넌 방금 무언가에게 들켰어. 아니, 무언가가 이미 오래전부터 너를 보고 있었다는 걸 네가 방금 알았어.\nMARIA: (등대 쪽에서) 이봐요! 소리 지르지 마! 우리 영감 심장 나가!\n-> END\n\n=== bw_binoculars\n당신은 로렌초의 쌍안경을 눈에 댄다. 왼쪽 렌즈의 금이 시야를 두 조각으로 나눈다. 초점 나사를 돌린다. 16번 말뚝. 따개비. 해초. 쇠띠의 녹. 그리고 그 너머.\n{!(hour >= 5 && hour < 8) && !(hour >= 17 && hour < 20)} 회색 말뚝이 보인다. 가까이서 봐도 회색이다. 나뭇결이 보이지 않는다. 대신 무언가 겹겹이 포개진 결이 보인다. 비늘처럼. 깃털처럼. 하지만 움직이지 않는다. 전혀.\n{!(hour >= 5 && hour < 8) && !(hour >= 17 && hour < 20)} LOGIC: 로렌초의 말로는 새벽과 해 질 녘. 빛이 낮게 들어올 때. 그때 다시 봐야 한다.\n{!(hour >= 5 && hour < 8) && !(hour >= 17 && hour < 20)} -> END\n해가 낮다. 빛이 바다를 비스듬히 가로질러 말뚝들의 그림자를 길게 늘인다. 16개의 그림자. 그리고 17번째.\n당신은 숨을 참는다.\n17번째 말뚝의 꼭대기에, 작은 점이 있다. 노란 점. 둥근. 그것이 한 번, 아주 느리게, 닫혔다가 열린다.\n눈이다.\n그것은 당신을 보고 있다. 90미터 너머에서. 쌍안경의 금 간 렌즈 너머에서. 40년의 고요 너머에서.\n그리고 다시 말뚝이 된다. 노란 점이 사라진다. 회색. 나뭇결 없는 회색.\n* [PERCEPTION 12] 쌍안경을 내리지 않는다. 계속 본다. -> bw_glimpse_ok | bw_glimpse_fail\n* 쌍안경을 내린다. 손이 떨린다.\n  VOLITION: 괜찮아. 봤어. 넌 봤어. 그걸로 충분할지도 몰라.\n  ~ heron_glimpse = 1\n  ~ xp 15\n  -> END\n\n=== bw_glimpse_ok\n당신은 쌍안경을 내리지 않는다. 눈이 시리다. 눈물이 고인다. 참는다.\n그리고 본다. 말뚝의 위쪽 3분의 1, S자로 굽은 부분이 아주 조금 부풀었다가 가라앉는 것을. 숨이다. 느리고 깊은. 1분에 한 번쯤.\n그리고 바람이 불 때, 말뚝의 표면에서 무언가가 한 올 들린다. 깃털 끝이. 재처럼 가볍게. 그리고 다시 눕는다.\nPERCEPTION: 그것은 새다. 사람만 한 새. 한 다리로 서서, 목을 S자로 접고, 부리를 하늘로 향한 채, 말뚝인 척하고 있다. 40년 동안. 아니, 어쩌면 더.\nSHIVERS: 이 도시에서 가장 오래 깨어 있던 존재. 혁명을 보았고, 포격을 보았고, 요새 벽 앞의 스무 발을 보았다. 크레인들이 세워지는 것을 보았고 무너지는 것을 보았다. 닷새 전 밤, 레테 옥상의 섬광도 보았을 것이다.\n~ heron_glimpse = 1\n~ heron_breath = 1\n~ xp 25\n-> END\n\n=== bw_glimpse_fail\n눈이 시리다. 눈물이 고인다. 당신은 눈을 깜빡인다. 딱 한 번.\n다시 봤을 때, 그것은 말뚝이다. 회색 나무 기둥. 확실히 나무다. 아마도.\nVOLITION: 그래도 봤어. 그 노란 눈. 네가 본 걸 의심하지 마.\n~ heron_glimpse = 1\n~ xp 10\n-> END\n\n// ─────────────────────────────────────────────\n// 등대 — 벨로소 부부\n// ─────────────────────────────────────────────\n\n=== lh_door\n{!velosos_named} 등대 아래 작은 집. 흰 회벽에 푸른 창틀. 창턱마다 제라늄 화분. 문 옆에 그물과 부표가 걸려 있고, 문 앞의 벤치에 한 노부인이 앉아 뜨개질을 한다. 회색 털실. 뜨개질감이 벤치에서 흘러내려 돌바닥 위에 길게 쌓여 있다. 몇 미터나 되는 목도리. 아니, 목도리라고 하기엔 너무 길다.\n{!velosos_named} 노부인이 바늘을 멈추지 않고 당신을 올려다본다. 둥근 안경, 짧게 자른 흰머리, 햇볕에 그을린 얼굴. 손가락 마디가 굵다. 평생 그물을 기운 손이다.\n{!velosos_named} MARIA: 경찰이구먼. 걸음걸이가 경찰이야. 아니면 술꾼이거나. 둘 다인가?\n{velosos_named} 마리아 벨로소가 벤치에서 뜨개질을 하고 있다. 회색 목도리가 조금 더 길어졌다.\n{velosos_named && !night} 등대 꼭대기 난간에서 쌍안경의 렌즈가 햇빛에 번쩍인다. 로렌초다.\n-> maria_hub\n\n=== maria_hub\n+ {!velosos_named} \"경비대요. 당신들은 누구요?\" -> maria_who\n+ {velosos_named && !maria_scarf} \"무엇을 뜨고 있소?\" -> maria_scarf_talk\n+ {velosos_named && !maria_fort} \"요새에 대해 아시오?\" -> maria_fort_talk\n+ {velosos_named && maria_fort && !maria_execution} \"코뮌 사람들이 저기서 총살당하던 날, 당신들도 여기 있었소?\" -> maria_execution_talk\n+ {velosos_named && !maria_tide} \"개펄을 건너려면 어떻게 해야 하오?\" -> maria_tide_talk\n+ {velosos_named && !maria_lights} \"요새에 요즘 누가 있소?\" -> maria_lights_talk\n+ {velosos_named && !maria_night} \"닷새 전 밤, 무슨 소리 못 들었소?\" -> maria_night_talk\n+ {velosos_named && !maria_lorenzo} \"남편 분은 저 위에서 무엇을 보고 있소?\" -> maria_lorenzo_talk\n+ {velosos_named} 등대 계단을 올라가 로렌초를 만난다. -> lorenzo_hub\n+ \"실례했소.\" -> END\n\n=== maria_who\n~ velosos_named = 1\nMARIA: 마리아 벨로소. 저 위에 있는 건 내 영감 로렌초. 우린 이 등대 지기야. 아니, 지기였지.\nMARIA: 10년 전에 협약이 요새 꼭대기에 자동 등표를 세웠어. 저기 깜빡이는 거. 사람이 필요 없는 등대. 그래서 이 등대는 불을 껐지. 우리한테는 나가라고 했고.\nMARIA: 우리는 안 나갔어. 44년을 여기서 살았는데 어딜 가. 협약 항만청이 편지를 세 번 보냈어. 영감이 세 번 다 등롱에 태웠지. 지금은 우리를 ────────────────────────────────\n\n=== volk_hub\n{!volk_named} 순찰정 PB-7은 작다. 길이 12미터쯤. 회색 강철, 뱃머리에 기관총 거치대 — 기관총은 없다. 방수포가 덮여 있다. 조타실 지붕에 앉아 한 남자가 낚싯대를 드리우고 있다. 협약 해안순찰대의 푸른 작업복, 단추를 두 개 풀었다. 모자를 얼굴에 덮고 있다. 발치에 싸구려 소설책 한 권이 엎어져 있다.\n{!volk_named} 당신이 다가가자 그가 모자를 조금 들어 올린다. 한쪽 눈만 보인다. 회색이다. 지루하다.\n{!volk_named} VOLK: 경비대. 냄새로 알아요. 싸구려 럼하고 절망.\n{volk_named} 볼크 하사가 조타실 지붕에서 낚시를 한다. 아무것도 낚이지 않는다. 그는 그걸 개의치 않는다.\n+ {!volk_named} \"협약 순찰대요? 여기서 무엇을 하시오?\" -> volk_who\n+ {volk_named && !volk_accord} \"협약은 이 사건을 어떻게 보고 있소?\" -> volk_accord_talk\n+ {volk_named && !volk_crows} \"회색 까마귀에 대해 아시오?\" -> volk_crows_talk\n+ {volk_named && !volk_night} \"닷새 전 밤에 무엇을 봤소?\" -> volk_night_talk\n+ {volk_named && !volk_fort} \"요새에 자주 가시오?\" -> volk_fort_talk\n+ {volk_named && !volk_book} \"무슨 책을 읽고 있소?\" -> volk_book_talk\n+ {volk_named && has.ev_report && !report_sent} \"이 서류를 협약 본토로 보낼 수 있소?\" -> volk_report\n+ {volk_named && !volk_ride && !has.rowboat_pass} \"요새까지 태워 줄 수 있소?\" -> volk_ride_talk\n+ \"실례했소.\" -> END\n\n=== volk_who\n~ volk_named = 1\nVOLK: 볼크. 하사. 협약 해안순찰대 솔레아 분견대. 분견대라고 해 봤자 나하고 이 배하고, 저 안에서 자고 있는 기관사 한 명이에요.\nVOLK: 임무는 밀수 단속, 등표 관리, 해상 치안 유지. 실제로는 사흘에 한 번 요새에 가서 등표에 기름 붓고, 나머지 시간엔 낚시해요. 밀수꾼들은 내가 어디서 낚시하는지 알아요. 나도 그들이 어디로 다니는지 알고. 서로 방해 안 하죠. 그게 평화예요.\nVOLK: 베스트말 출신이에요. 협약 북쪽 끝. 거기선 1년에 해가 여든 날 떠요. 여기 발령 났을 때 다들 부러워했죠. 남쪽 항구, 탱고, 오렌지. 3년째인데 아직 오렌지는 못 먹어 봤어요. 비싸서.\n{pass(RHETORIC, 9)} RHETORIC: 모든 문장이 투덜거림이다. 그런데 이상하게 편안하다. 그는 아무것도 팔려고 하지 않는다.\n-> volk_hub\n\n=== volk_accord_talk\n~ volk_accord = 1\nVOLK: 협약이요?\n그가 낚싯줄을 감는다. 미끼만 사라졌다.\nVOLK: 협약은 아무것도 안 봐요. 협약은 눈이 없어요. 협약은 서류예요. 다섯 개 공화국이 서로 안 싸우려고 만든 거대한 서류. 관세표, 항로도, 분쟁 조정 절차. 그게 다예요.\nVOLK: 이 사건에서 협약이 원하는 건 딱 하나예요. 부두가 다시 돌아가는 것. 배가 제때 들어오고 제때 나가는 것. 누가 누구를 죽였든, 누가 누구를 매달았든, 파업이 끝나고 화물이 움직이면 협약은 만족해요.\nVOLK: 그래서 토요일 정오에 해안경비대 수사관들이 와요. 사건을 인수하러. 그 사람들은 진실에 관심 없어요. 해결에 관심 있죠. 누군가를 기소하고, 파업을 불법으로 선언하고, 부두를 재개하고. 사흘이면 끝나요.\n* \"그게 옳다고 생각하시오?\"\n  VOLK: 옳다?\n  그가 웃는다. 소리 없이.\n  VOLK: 옳은 거하고 조용한 거 중에 하나를 고르라면 난 조용한 걸 골라요. ION 10] \"당신은 뭔가 봤군. 그리고 못 본 척했지. 그게 협약식 평화 아니오?\" -> volk_fort_ok | volk_fort_fail\n* 더 묻지 않는다.\n  VOLK: 고마워요.\n  -> volk_hub\n\n=== volk_fort_ok\nVOLK: ……하하.\nVOLK: 맞아요. 협약식 평화.\nVOLK: 사흘 전에 기름 넣으러 갔을 때, 화약고 문이 안에서 잠겨 있었어요. 원래 안 잠기는 문이에요. 그리고 문틈으로 오렌지 냄새가 났어요. 오렌지. 나는 3년 동안 못 먹어 본 거.\nVOLK: 나는 등표에 기름을 넣고, 일지에 \"이상 없음\"이라고 쓰고 돌아왔어요. 여자 목소리가 노래를 흥얼거리는 게 들렸지만, 해상 위협은 아니었으니까.\n~ volk_fort_woman = 1\n~ ines_where = 1\n~ xp 10\n-> volk_hub\n\n=== volk_fort_fail\nVOLK: 협약식 평화는 말이죠, 경비대, 입을 다무는 것도 포함해요.\n-> volk_hub\n\n=== volk_book_talk\n~ volk_book = 1\n그가 발치의 책을 집어 표지를 보여 준다. 트렌치코트를 입은 남자가 부두 크레인 위에서 누군가와 주먹다짐을 한다.\nVOLK: 「말로우 경감의 모험 12권 — 크레인 위의 결투」. 쓰레기죠. 말로우는 매 권마다 법을 어겨요. 증거를 조작하고, 용의자를 때리고, 상관한테 욕하고.\nVOLK: 그리고 매 권마다 진짜 범인을 잡아요. 그게 제일 비현실적인 부분이죠.\n{yun_pulp_given || has.pulp_mallow} HALFLIGHT: 윤 경위도 이 시리즈를 읽는다. 이 도시의 규칙을 지키는 사람들은 모두 규칙을 어기는 경감 이야기를 몰래 읽는다.\n* {met_yun} \"내 파트너도 그 시리즈를 좋아하오.\"\n  VOLK: 경비대에? 말로우 팬이? 12권 있냐고 물어봐요. 13권하고 바꾸자고. 13권은 진짜 쓰레기예요. 말로우가 쌍둥이 형을 만나요.\n  ~ volk_yun_book = 1\n* \"진짜 범인은 늘 잡히오?\"\n  VOLK: 소설에서는요. 매번 마지막 장에서.\n  VOLK: 현실에서는 마지막 장이 없어요. 그냥 토요일 정오가 와요.\n-\n-> volk_hub\n\n=== volk_report\n당신은 얀 트로스트의 보고서를 꺼낸다. 피 묻은 모서리. 타자기 글씨. 서명.\n볼크가 책을 내려놓는다. 조타실 지붕에서 내려와 보고서를 받는다. 읽는다. 끝까지. 입술이 조금 움직인다.\nVOLK: ……\"정비 일지를 최소 14개월간 조작\". \"운전자 과실의 증거 없음\".\nVOLK: 이거 폭탄이네요.\nVOLK: 할바르-마리스 보험금 무효. 배상 책임. 협약 해운청 조사. 파업은 정당. 까마귀들은 철수. 아마 크루이프라는 친구는 반데르메르로 소환될 거고.\nVOLK: 이걸 협약 우편으로 보렐 & 파르 본사에 보내 달라는 거죠?\n* \"그렇소. 이건 원래 거기 가야 할 서류요. 그가 보내려 했던 곳.\"\n  -> volk_report_send\n* \"……아니. 좀 더 생각해 보겠소.\"\n  VOLK: 현명하네요. 폭탄은 던지기 전에 오래 생각해야죠.\n  그가 보고서를 돌려준다.\n  -> volk_hub\n\n=== volk_report_send\nVOLK: 음.\n그가 보고서를 들고 바다를 본다. 요새 쪽을.\nVOLK: 이걸 보내면, 부두가 조용해질까요, 시끄러워질까요?\n* [RHETORIC 11] \"처음엔 시끄러워지겠지. 그리고 조용해질 거요. 진짜로. 거짓말 위에 세운 조용함은 오래 안 가오.\" -> volk_send_ok | volk_send_fail\n* [AUTHORITY 12] \"경비대가 공식으로 요청하는 거요. 협약 관측자로서 거부할 이유가 있소?\" -> volk_send_ok | volk_send_fail\n* {has.cig_astra} 아스트라 담배 한 갑을 건넨다. \"북쪽 사람은 이걸 좋아한다던데.\"\n  VOLK: ……뇌물이네요.\n  VOLK: 좋아요. 뇌물은   load("20_flats_fort.tl", "// ─────────────────────────────────────────────\n// 20. 레테 개펄과 조수 요새 — 이네스\n// ─────────────────────────────────────────────\n\n=== flats @location name=\"레테 개펄\" art=flats travel=5\n{first} 돌계단의 마지막 칸에서 발을 내리자 발목까지 빠진다. 차갑고, 미끈하고, 살아 있는 것처럼 발을 빨아들인다. 당신은 발을 뽑는다. 쩍, 하는 소리. 개펄이 아쉬워한다.\n{first} 눈앞에 회갈색 평원이 펼쳐진다. 요새까지 1.5킬로미터. 평평하다. 너무 평평해서 원근감이 사라진다. 요새가 가까워 보였다가 멀어 보였다가 한다. 젖은 표면이 하늘을 비춘다. 당신은 하늘 위를 걷고 있다.\n{first} 물골들이 은빛 혈관처럼 개펄을 가로지른다. 작은 게들이 수천 마리, 당신의 발소리에 일제히 구멍 속으로 사라진다. 소리가 난다. 개펄 전체가 조그맣게 딸깍거린다. 수천 개의 작은 문이 닫히는 소리.\n{first} 개펄 한가운데에 배 한 척이 비스듬히 박혀 있다. 녹슨 철판, 부러진 굴뚝, 갑판에 거치된 채 녹아내린 대포. 뱃머리에 흰 페인트로 쓴 글씨가 반쯤 남아 있다. \"……MEMORIA\".\n{first} 냄새. 유황과 소금과 썩은 해초와 무언가 오래된 것. 바다가 물러나면서 두고 간 모든 것의 냄새.\n{first} SHIVERS: 이곳은 하루에 두 번 태어나고 하루에 두 번 죽는다. 너는 지금 그 짧은 삶 한가운데에 서 있다. 바다가 돌아오면, 네가 걸은 자국은 하나도 남지 않는다.\n{!first && lowtide} 레테 개펄. 젖은 하늘. 게들의 딸깍거림. 비스듬히 박힌 포함 '메모리아'. 요새가 멀리 있다.\n{tideleft > 0 && tideleft <= 45} 물골에서 소리가 난다. 졸졸. 처음보다 조금 커졌다. 물골의 물이 반대 방향으로 흐르기 시작했다. 바다 쪽에서 육지 쪽으로.\n{tideleft > 0 && tideleft <= 45} HALFLIGHT: 돌아온다. 돌아오고 있어. 약 {{tideleft}}분.\n{tideleft > 45 && has.tide_table} LOGIC: 조수표에 따르면 개펄이 닫히기까지 약 {{tideleft}}분.\n+ {lowtide && wear.boots_rubber} 고무장화를 신고 요새까지 성큼성큼 걷는다. => fort 12\n+ {lowtide && !wear.boots_rubber} 요새를 향해 걷는다. 진흙이 발을 붙잡는다. => fort 18\n+ 포함 '메모리아'의 잔해를 살핀다. -> flats_wreck\n+ {!heron_print} 개펄 위에 찍힌 자국들을 살핀다. -> flats_tracks\n+ 서쪽 수평선을 본다. -> flats_horizon\n+ {!flats_digger_done} 멀리서 개펄을 파는 노인에게 간다. -> flats_digger\n+ {met_yun} 윤 경위와 이야기한다. -> yun_hub\n+ 방파제로 돌아간다. => breakwater 6\n\n// ───────── 물이 돌아온다 ─────────\n\n=== ev_flats_tide @event repeat at=flats when=\"!lowtide\" priority=95\n~ tide_caught += 1\n발밑이 차갑다. 갑자기.\n내려다보면, 물이 있다. 발목을 핥고 지나가는 얇은 물의 혀. 방금 전까지 없었던 것. 물골들이 넘친다. 은빛 혈관들이 부풀어 서로 합쳐진다. 개펄의 낮은 곳부터 반짝이는 물이 번져 온다. 소리 없이. 빠르게.\nHALFLIGHT: 뛰어. 지금. 생각하지 말고.\n{met_yun} YUN: 형사님! 물이요!\n+ [ENDURANCE 10] 방파제까지 전력으로 달린다. -> flats_run_bw_ok | flats_run_bw_fail\n+ [PHYSICAL 11] 요새 쪽이 더 가깝다. 요새까지 달린다. -> fl 으로 작은 노란빛이 샌다.\n{!lowtide && !has.rowboat_pass} HALFLIGHT: 물이 차 있다. 이 섬에서 나갈 길이 없다. 썰물이 올 때까지.\n+ 총알 자국의 벽 앞에 선다. -> fort_wall\n+ 성벽 위로 올라간다. -> fort_rampart\n+ 등표 탑을 본다. -> fort_beacon\n+ 화약고로 간다. -> fort_magazine\n+ {met_yun} 윤 경위와 이야기한다. -> yun_hub\n+ {lowtide && wear.boots_rubber} 고무장화를 신고 개펄을 건너 돌아간다. => flats 12\n+ {lowtide && !wear.boots_rubber} 개펄을 걸어서 돌아간다. => flats 18\n+ {has.rowboat_pass} 나룻배 '마리아'를 저어 방파제로 돌아간다. => breakwater 25\n+ {!lowtide && !has.rowboat_pass} 성문 앞 계단에 앉아 썰물을 기다린다. -> fort_wait\n\n=== fort_wait\n당신은 성문 앞 돌계단에 앉는다. 바다가 발밑에서 찰랑거린다. 건너편에 솔레아가 보인다. 크레인들, 교회 종탑, 레테의 지붕. 멀다. 헤엄쳐 갈 수 없을 만큼.\n{ines_met} 화약고 쪽에서 이네스가 나와 당신 옆에 앉는다. 무릎을 끌어안고. 둘은 아무 말 없이 바다를 본다.\n{ines_met} INES: 저는 닷새 동안 이렇게 앉아 있었어요. 매일. 물이 빠지면 나갈 수 있는데, 안 나갔어요. 물이 빠질 때마다 \"다음 썰물에\"라고 생각했어요.\n{ines_met} INES: 물이 차 있으면 이유가 있잖아요. 못 나가는 이유.\n~ waittide\n시간이 흐른다. 등표가 수천 번 깜빡인다. 그리고 물이 물러난다. 계단이 한 칸씩 드러난다. 그 아래 개펄이 번들거린다.\n-> END\n\n// ───────── 벽 ─────────\n\n=== fort_wall\n당신은 벽 앞에 선다.\n길이 30미터. 높이 4미터. 검은 현무암. 가슴 높이에 총알 자국들. 가까이서 보면 구멍 하나하나가 다르다. 깊은 것, 얕은 것, 돌을 쪼개 놓은 것, 스쳐 간 것. 일부 구멍에는 아직 납이 박혀 있다. 녹색으로 산화된.\n구멍들 아래, 무릎 높이에 이름들이 새겨져 있다. 칼로, 못으로, 돌로. 서툰 글씨, 반듯한 글씨, 반쯤 지워진 글씨. 백스무 개.\n그리고 벽 위쪽, 사람 키보다 높은 곳에 흐려진 붉은 페인트. 한 사람의 키로는 닿을 수 없는 높이. 누군가 누군가의 어깨를 밟고 썼다.\nNO OLVIDAREMOS.\n{first} ESPRIT: 너는 경찰이다. 이 벽은 경찰이 만든 것이 아니다. 협약 해병대가 만들었다. 하지만 그날 아침 요새 문 밖에서 줄을 서서 배를 기다린 사람들 중에 사르가 시민 경비대원도 있었다. 코뮌 편에 섰던 경비대원들. 경비대의 역사책은 그 이름들을 싣지 않는다.\n{first} ~ fort_wall_seen = 1\n+ 이름들을 읽는다. -> fort_wall_names\n+ [SHIVERS 11] 총알 자국에 손을 댄다. -> fort_wall_touch_ok | fort_wall_touch_fail\n+ {!fort_flowers} 벽 밑의 꽃을 본다. -> fort_wall_flowers\n+ {!fort_salute} 벽 앞에서 경례한다. -> fort_wall_salute\n+ 물러선다. -> END\n\n=== fort_wall_names\n당신은 쪼그려 앉아 이름들을 읽는다. 한 줄씩.\n\"A. 페냐 — 하역부.\" \"M. 로블레스 — 시인.\" \"파울리나 가르세스, 19세.\" \"코뮌 만세.\" \"엄마 미안해.\" \"J. 오르티스, 경비대.\" \"우리는 잊지 않는다.\" \"E. 소토.\"\nENCYCLOPEDIA: 에르난 소토. 「우리는 잊지 않으리」의 작사가. 그도 여기 섰다. 자기가 쓴 노래를 부르며.\n그리고 세 번째 줄, 가운데쯤.\n\"B. 이바라 — 붉은 닻. 로사, 춤을 가르쳐 줘서 고마워.\"\n{rosa un} ~ yun_trust += 1\n~ al_communard += 1\n~ thought soul_of_watch\n~ morale 1\n-> fort_wall\n\n// ───────── 성벽, 등표 ─────────\n\n=== fort_rampart\n좁은 돌계단을 올라 성벽 위로 나간다. 바람이 세다. 갈매기들이 머리 위를 스치며 항의한다. 둥지를 밟지 않으려고 조심한다.\n성벽 위에서 보면 만 전체가 보인다. 솔레아. 크레인들. 방파제와 줄무늬 등대. 언덕 위의 호텔. 그리고 레테 강 하구가 바다로 열리는 곳. 강물의 갈색과 바다의 회청색이 만나는 선.\n{lowtide} 개펄이 요새에서 방파제까지 이어진 회갈색 길이 되어 있다. 그 위를 걷는 작은 점들. 조개 캐는 노인들. 갈매기들.\n성벽의 모서리, 바다를 향해 튀어나온 망루에 녹슨 대포 한 문이 있다. 왕관 시대의 청동 대포. 포신에 코뮌 사람들이 새긴 글씨. \"이 대포는 인민을 향해 쏘지 않는다.\"\n+ {!has.ev_feather} [PERCEPTION 9] 망루 주변의 돌 틈을 살핀다. -> fort_feather_ok | fort_feather_fail\n+ {has.binoculars} 쌍안경으로 솔레아를 본다. -> fort_binoculars\n+ 대포를 본다. -> fort_cannon\n+ 내려간다. -> END\n\n=== fort_feather_ok\n망루의 돌 틈. 갈매기 깃털, 마른 해초, 조개껍데기가 끼어 있다. 그리고 그 사이에, 틈 깊숙이, 회색의 무언가.\n당신은 그것을 조심스럽게 빼낸다. 길다. 계속 나온다. 당신 팔 길이만 하다.\n깃털이다. 깃대는 손가락만큼 굵고, 깃은 연기처럼 부드럽다. 색은 회색. 아니, 회색이 아니다. 재의 색. 무언가 불타고 남은 것의 색. 바람이 불자 깃털의 한 올 한 올이 따로 흔들린다.\nLOGIC: 갈매기 깃털의 열 배. 이 세상에 이런 깃털을 가진 새는 없다. 백과사전에 따르면.\nENCYCLOPEDIA: ……백과사전은 이 문제에 대해 언급을 삼가겠다.\n{active.t_heron} LOGIC: 로렌초가 말한 곳. 그날 아침 그것이 서 있던 곳. 첫 번째 증거.\n~ item add ev_feather\n~ xp 15\n-> fort_rampart\n\n=== fort_feather_fail\n돌 틈에는 갈매기 깃털과 마른 해초뿐이다. 갈매기 한 마리가 당신 뒤통수를 쪼고 날아간다.\n~ health -1\n-> fort_rampart\n\n=== fort_binoculars\n당신은 로렌초의 쌍안경을 눈에 댄다. 솔레아가 가까워진다.\n7번 크레인. 드럼통 불가. 통조림 공장의 창문. 휠체어의 실루엣이 창가에 있다. 뜨개바늘이 움직인다.\n{rosa_met} HALFLIGHT: 로사. 그녀는 창가에 앉아 이 섬을 본다. 매일. 46년 동안.\n레테 무도장의 지붕. 비둘기장. 테라스. 그리고 방파제 끝의 말뚝들. 16개. 그리고 17번째.\n{!heron_glimpse} 17번째 말뚝이 이쪽을 향해 조금 기울어 있다. 아까는 반대쪽이었던 것 같은데.\n~ xp 5\n-> fort_rampart\n\n=== fort_cannon\n청동 대포. 포신 길이 3미터. 녹청이 피어 초록색이다. 포구는 바다를 향한다. 해적을 향해. 해적은 한 번도 오지 않았다.\n\"이 대포는 인민을 향해 쏘지 않는다.\"\n그 밑에 다른 손으로. \"협약 함대를 향해서도 못 쐈다. 포탄이 없어서.\"\n그 밑에 또 다른 손으로. 최근의 것. 크레용. \"혁명 해적단 대포 — 선장 보보.\"\n{bobo_met} EMPATHY: 그 아이는 여기까지 와서 이 대포에 이름을 적었다. 누나를 지키는 요새의 대포에.\n-> fort_rampart\n\n=== fort_beacon\n탑 꼭대기로 올라가는 철사다리는 협약이 새로 달았다. 반짝이는 아연 도금. 탑의 낡은 돌과 어울리지 않는다.\n꼭대기에는 자동 등표가 있다. 유리 돔 안에 아세틸렌 불꽃, 태엽 장치, 회전하는 반사경. 째깍, 번쩍. 째깍, 번쩍. 옆에 가스통 두 개, 기름통, 공구 상자.\n공구 상자 뚜껑 안쪽에 연필 글씨가 빼곡하다. 날짜와 \"이상 없음\", \"이상 없음\", \"이상 없음\". 그리고 가끔 다른 글씨.\n\"S.V. 여기 있었음. 오렌지 먹고 싶다.\"\n\"S.V. 여기 있었음. 오늘도 갈매기가 모자에 똥 쌈. 협약은 갈매기에 대한 규정이 없다.\"\n\"S.V. 화약고에서 노래 소리. 이상 없음.\"\n{volk_named} HALFLIGHT: 볼크. S.V. 그의 이름이 S로 시작하는 걸 처음 안다. 세르게이? 스벤? 어쨌든 그는 여기서 외롭다.\n{pass(INTERFACING, 9)} INTERFACING: 태엽 장치의 톱니 하나가 닳았다. 한두 달 뒤면 등표가 멈출 것이다. 그러면 밤에 만으로 들어오는 배들이 이 섬을 못 본다. 볼크에게 말해 줘야 할까. 그는 아마 알고 있을 것이다. 그리고 \"이상 없음\"이라고 적었을 것이다.\n-> END\n\n// ─────────────────────────────────────────────\n// 화약고 — 이네스\n// ─────────────────────────────────────────────\n\n=== fort_magazine\n{bobo_fled && !gun_found && !standoff_done && abstime >= bobo_fled_at + 240} -> bobo_fort\n{ines_met} -> ines_hub\n화약고는 성벽에 반쯤 묻힌 둥근 돌집이다. 지붕에 흙이 덮였고 흙 위에 풀이 자랐다. 입구는 반지하. 돌계단 세 칸 아래에 참나무 문. 철띠를 두른 두꺼운 문이다.\n문은 닫혀 있다. 문틈으로 가느다란 빛이 샌다. 촛불. 그리고 냄새. 촛농, 오렌지 껍질, 젖은 담요.\n당신이 계단을 내려서자, 안에서 무언가가 움직이는 소리가 멈춘다. 완전한 정적.\n그리고 목소리. 여자의 목소리. 낮고, 쉬었고, 떨리지 않으려고 애쓰는.\nINES: 거기 서요.\nINES: 한 발짝만 더 오면 쏠 거예요. 신호탄 총이에요. 요새 창고에서 찾았어요. 사람한테 쏘면 불이 붙어요. 알아요?\n{met_yun} 윤 경위가 당신의 팔을 잡는다. 그리고 속삭인다.\n{met_yun} YUN: 신호탄 총은 사거리가 짧아요. 하지만 이 거리면 충분해요. 조심하세요.\n~ ines_door = 1\n-> ines_door_hub\n\n=== ines_door_hub\n* \"경비대요. 얀 트로스트 사건을 수사하고 있소.\" -> ines_door_police\n+ {dream1} \"그가 전해 달라고 했소. 네 번은 밟았지만 다섯 번째는 안 밟았다고.\" -> ines_door_dream\n+ {has.ev_lesson_card} \"자정, 위에서. I. 당신이 이 카드에 쓴 글씨요?\" -> ines_door_card\n+ {has.ev_photo} 사진을 문틈으로 밀어 넣는다. -> ines_door_photo\n+ [EMPATHY 11] \"닷새 동안 혼자였소. 누군가는 당신 말을 들어야 하오.\" -> ines_door_empathy_ok | ines_door_empathy_fail\n+ {bobo_met || bobo_heard} [SUGGESTION 10] \"보보 일로 왔소. 그 아이가 위험하오.\" -> ines_door_bobo_ok | ines_door_bobo_fail\n+ [AUTHORITY 12] \"문을 여시오. 경비대의 명령이오.\" -> ines_door_auth_ok | ines_door_auth_fail\n+ {met_yun} 윤 경위에게 맡긴다. -> ines_door_yun\n+ 물러선다. -> END\n\n=== ines_door_police\n~ ines_door_police_n += 1\nINES: 경비대.\n그녀가 웃는다. 웃음이 아니다.\nINES: 경비대가 나흘 동안 뭘 했는데요? 그 사람을 크레인에 매달아 두고, 갈매기가 쪼아 먹는 걸 구경했잖아요.\nINES: 아, 알아요. 당신이 누군지. 레테 7호실의 밤의 대통령. 아침을 폐지하겠다던. 당신이 그 나흘 동안 뭘 했는지 온 솔레아가 알아요.\nHALFLIGHT: 그녀 말이 맞다. 그리고 그녀는 문을 열지 않을 것이다. 이 말로는.\n{ines_door_police_n == 1} ~ morale -1 soft\n-> ines_door_hub\n\n=== ines_door_dream\n안에서 아무 소리도 나지 않는다. 오래.\n그리고 문 너머에서 무언가가 바닥에 떨어진다. 쇠붙이. 신호탄 총이다.\nINES: ……뭐라고요?\n당신은 다시 말한다. 네 번은 밟았지만, 다섯 번째는 안 밟았다고. 거의 다 배웠다고.\nINES: 그 말……\nINES: 그 말은 저만 알아요. 그 사람이 마지막에…… 그 사람이 마지막에 한 말이에요. \"안 밟았어요.\" 그게 다였어요. 아무도 몰라요. 할머니도, 보보도.\nINES: 어떻게 알아요? 어떻게……\n* \"꿈에서 들었소.\"\n  INES: 꿈.\n  INES: ……미친 경찰.\n  빗장이 벗겨지는 소리.\n* \"나도 모르겠소. 그냥 알았소.\"\n  빗장이 벗겨지는 소리.\n-\n~ ines_trust += 2\n~ ines_dream_told = 1\n-> ines_open\n\n=== ines_door_card\n당신은 탱고 강습 카드를 문틈에 댄다. \"레테 무도장 — 개인 강습. 제7강: 포옹. 가슴으로 이끌고, 가슴으로 따른다.\" 뒷면. \"자정, 위에서. — I.\"\n안에서 숨소리가 멈춘다.\nINES: ……그 사람 셔츠 주머니에 있었죠. 그거.\nINES: 제가 썼어요. 강습 끝나고. 그 사람이 보고서를 보여 주겠다고 해서. 사람들 없는 데서. 그래서 위에서. 옥상에서.\nINES: 제가 쓴 카드가 그 사람을 거기로 데려갔어요.\n빗장이 벗겨지는 소리. 느리게.\n~ ines_trust += 1\n-> ines_open\n\n=== ines_door_photo\n당신은 사진을 문틈으로 밀어 넣는다. 부두 사진관의 싸구려 배경. 뻣뻣하게 선 안경 쓴 남자. 그의 넥타이를 잡아당기며 웃는 여자.\n사진이 안쪽으로 빨려 들어간다. 누군가 잡아당겼다.\n오래 조용하다. 그리고 문 너머에서 작은 소리가 난다. 우는 소리를 참는 소리.\nINES: ……제 방에 들어갔군요. 거울에서 뺐어요?\nINES: 그 사람은 사진 찍는 걸 싫어했어요. 제가 억지로 데려갔어요. 7강 끝난 날. 그 사람은 사진사가 \"웃으세요\" 하니까 더 굳었어요. 그래서 제가 넥타이를 당겼어요. 그랬더니 이렇게.\n빗장이 벗겨지는 소리.\n~ ines_trust += 1\n~ item remove ev_photo\n~ ines_photo_returned = 1\n-> ines_open\n\n=== ines_door_empathy_ok\nINES: ……\nINES: 누구 말을 들어요? 제 말을? 경찰이?\nINES: 제가 무슨 말을 할 줄 알고요.\nEMPATHY: 그녀는 말하고 싶다. 닷새 동안 오렌지 껍질과 촛불하고만 이야기했다. 말이 목까지 차올라 있다. 그녀가 두려워하는 건 당신이 아니다. 자기가 할 말이다.\n당신은 기다린다. 아무 말도 하지 않고.\n빗장이 벗겨지는 소리.\n~ ines_trust += 1\n-> ines_open\n\n=== ines_door_empathy_fail\nINES: 혼자인 게 좋아요. 혼자면 아무도 안 죽어요.\n-> ines_door_hub\n\n=== ines_door_bobo_ok\nINES: 보보?\n문 너머에서 무언가가 넘어진다. 그녀가 문에 바짝 붙는 소리.\nINES: 보보가 왜요? 무슨 일이에요? 오늘 아침에도 왔었어요. 빵 가져왔어요. 괜찮았어요. 괜찮았다고요.\nINES: 무슨 일이에요!\n빗장이 거칠게 벗겨진다.\n~ ines_scared_bobo = 1\n-> ines_open\n\n=== ines_door_bobo_fail\nINES: 보보한테 가까이 가지 마요. 경고하는 거예요. 그 애한테 가까이 가면, 당신이 누구든.\nINES: ……당신이 누구든.\n-> ines_door_hub\n\n=   load("21_bobo.tl", "// ─────────────────────────────────────────────\n// 21. 보보 — 비둘기장의 밤, 늙은 경찰의 총\n// ─────────────────────────────────────────────\n\n=== bobo_loft_night\n~ bobo_named = 1\n{bobo_loft_met} -> bobo_loft_again\n~ bobo_loft_met = 1\n당신은 사다리를 오른다. 가로대가 삐걱거린다. 받침대가 흔들린다. 비둘기들이 뒤척이며 불평한다.\n문 앞. 끈으로 묶인 문고리. 당신은 끈을 푼다. 천천히. 문을 연다. 한 뼘.\n안은 어둡다. 레테의 네온이 벽의 둥근 구멍들로 붉은 동전 같은 빛을 흘려 넣는다. 그 빛 속, 담요 위에 작은 몸이 웅크리고 있다. 선원 모자를 쓴 채로. 스웨터를 둘둘 말아 베고.\n문이 열리는 순간 아이가 깬다. 잠에서 깨어나는 게 아니다. 튀어 오른다. 스프링처럼. 오래전부터 그렇게 자 온 몸처럼.\n아이의 두 손이 스웨터 밑으로 들어갔다가 나온다.\n총이다.\n커다란 리볼버. 아이의 손에는 터무니없이 크다. 두 손으로 손잡이를 감싸 쥐었다. 검지 두 개가 겹쳐서 방아쇠울 안에 들어가 있다. 총구가 당신의 가슴을 향한다. 떨린다. 붉은 빛 속에서 총구가 작은 원을 그린다.\nBOBO: 누구야!\nREACTION: 움직이지 마. 아무것도. 숨도 크게 쉬지 마. 저 손가락들은 이미 반쯤 당겨져 있다.\n{gun_memory} LIMBIC: 네 총이야. 호두나무 손잡이. 네 손가락 모양으로 닳은 홈. 지금 그 홈에 아이 손가락이 들어가 있어.\n{!gun_memory} LOGIC: 라븐 7.65mm. 경비대 지급 리볼버. 경비대. 지급.\n{!gun_memory && found_bullet} LOGIC: 얀 트로스트의 가슴에서 나온 탄두. 같은 구경. 같은 강선.\n{!gun_memory && found_bullet} ~ bobo_suspect = 1\n{met_yun} 등 뒤, 사다리 위에서 윤 경위가 멈추는 소리가 난다. 당신의 어깨 너머로 그녀도 보았다. 가죽이 스치는 소리. 그녀의 손이 자기 허리의 권총집으로 간다.\n{met_yun} -> bobo_yun_hand\n-> bobo_loft_recognize\n\n=== bobo_yun_hand\n* 뒤돌아보지 않고, 등 뒤로 손바닥을 펴 보인다. 멈추라는 신호.\n  가죽 소리가 멈춘다. 한 박자. 그리고 그녀의 손이 권총집에서 떨어지는 소리. 아주 작은.\n  YUN: (속삭임) ……네.\n  ~ yun_trust += 1\n  ~ bobo_calm += 1\n* 아무 신호도 보내지 않는다.\n  찰칵. 권총집의 똑딱단추가 열리는 소리. 작은 소리다. 비둘기장 안에서는 크다.\n  아이가 그 소리를 듣는다. 총구가 당신의 어깨 너머로, 윤 경위 쪽으로 움직인다. 그리고 다시 당신에게. 다시 그녀에게. 어디를 겨눠야 할지 모른다.\n  BOBO: 총 넣어! 총 넣어, 까마귀야! 쏠 거야! 진짜로!\n  * \"윤 경위. 총 넣으시오. 지금.\"\n    YUN: ……\n    똑딱단추가 닫히는 소리.\n    YUN: 넣었어요. 넣었어, 꼬마야. 봐.\n    ~ bobo_calm -= 1\n  -\n-\n-> bobo_loft_recognize\n\n=== bobo_loft_recognize\n아이가 눈을 가늘게 뜬다. 붉은 빛 속에서 당신의 얼굴을 본다.\nBOBO: ……대통령 아저씨?\n총구가 조금 내려간다. 당신의 가슴에서 배로. 여전히 당신을 향해 있다.\n{bobo_met} BOBO: 여긴 어떻게 알았어요? 해적 본부는 비밀인데. 아무도 몰라요. 누나만 알아요.\n{!bobo_met} BOBO: 저 몰라요? 보보요! 혁명 해적단 선장! 부두에서 만났잖아요. 맨날. 아저씨가 크레인한테 연설할 때.\n{!bobo_met} ~ bobo_met = 1\nEMPATHY: 아이의 목소리가 떨린다. 반가움과 공포가 반씩. 그리고 그 밑에, 아주 밑에, 무언가 다른 것. 안도? 누군가 드디어 왔다는.\n-> bobo_loft_talk\n\n=== bobo_loft_again\n{!night} -> END\n당신은 다시 사다리를 오른다. 문을 연다.\n이번에는 아이가 깨어 있다. 담요 위에 양반다리로 앉아, 무릎 위에 총을 올려놓고. 두 손을 총 위에 얹고. 밤새 그렇게 앉아 있었던 것 같다.\nBOBO: ……또 왔어요, 대통령 아저씨.\nBOBO: 나 안 자요. 이제. 자면 비둘기 꿈 꿔요.\n-> bobo_loft_talk\n\n// ───────── 비둘기장의 대화 ─────────\n\n=== bobo_loft_talk\n* \"보보. 나야. 괜찮아. 아무도 너를 해치러 오지 않았어.\"\n  BOBO: ……진짜요?\n  BOBO: 까마귀들이 온다고 했어요. 해 질 녘에. 삼촌들 잡으러. 그리고 나도 잡으러 올 거예요. 알아요.\n  총구가 무릎으로 내려간다. 손은 여전히 손잡이를 쥐고 있다.\n  ~ bobo_calm += 1\n* \"여기서 뭐 하니? 왜 집에서 안 자?\"\n  BOBO: 집엔 할머니가 있어요. 할머니는 밤새 안 자요. 창가에서 뜨개질해요. 딸각딸각딸각. 요새 쪽을 보면서.\n  BOBO: 그 소리 들으면 잠이 안 와요. 그리고 할머니가 자꾸 저를 봐요. 뜨개질하면서. 제가 자는지 안 자는지.\n  BOBO: 여긴 비둘기들이 있어요. 비둘기들은 아무것도 안 물어봐요.\n  {bobo_nightmares} HALFLIGHT: 벌집의 이웃이 말했지. 밤마다 우는 소리가 난다고.\n  ~ bobo_calm += 1\n* {!gun_memory} \"그 총…… 어디서 났니?\" -> bobo_gun_origin\n* {gun_memory && !bobo_gun_asked} \"그 총. 내가 너한테 줬지. 부두에서.\" -> bobo_gun_remember\n* \"누나는 어디 있니?\" -> bobo_sister\n* \"닷새 전 밤 이야기를 하자, 보보.\" -> bobo_that_night\n+ {!gun_found} \"그 총을 내려놓으렴, 보보.\" -> bobo_disarm\n+ {!gun_found} \"……잘 자라, 선장. 내일 다시 올게.\" -> bobo_leave_armed\n\n=== bobo_gun_origin\n~ bobo_gun_asked = 1\nBOBO: 어디서 났냐고요?\n아이가 당신을 본다. 믿을 수 없다는 듯이.\nBOBO: 아저씨가 줬잖아요!\nBOBO: 기억 안 나요? 진짜? 부두에서! 비 오는 밤에! 아저씨가 크레인들한테 연설하고 있었잖아요. 제가 진짜 경찰이냐고, 총 보여 달라고 했더니, 아저씨가……\n아이가 총을 무릎에 내려놓고, 한 손을 들어 경례를 한다. 당신이 했던 것처럼. 비틀거리는 흉내까지.\nBOBO: \"가져라, 꼬마 선장! 나는 이제 총 따위는 끝났다! 나는 밤의 대통령이다! 미래는 너희 거다! 혁명 해적단 만세!\"\n아이가 당신의 목소리를 흉내 낸다. 너무 정확하게.\n---\n그리고, 기억이 온다.\n밤. 비. 부두 가장자리. 나트륨등 불빛이 물 위에 호박색 기둥을 세운다. 레테의 네온이 흔들린다. 당신은 취했다. 몹시. 당신은 크레인들에게 연설을 하고 있다.\n작은 손이 코트 자락을 잡아당긴다. 너무 큰 선원 모자. 나무칼. 붉은 완장.\n당신은 권총집의 버클을 푼다. 벨트째로. 무게가 허리에서 빠져나간다. 당신은 그것을 아이의 목에 걸어 준다. 훈장처럼.\n그리고 당신은 가볍다. 무척 가볍다. 6년 만에 처음으로.\n---\n~ gun_memory = 1\n{found_bullet} ~ thought old_cop_gun\n~ morale -2 soft\n~ xp 30\nLIMBIC: 네가 줬어. 장전된 총을. 열한 살 아이의 목에. 연설을 하면서.\nVOLITION: 숨 쉬어. 지금 무너지면 안 돼. 지금은 안 돼. 저 아이 손에 아직 그게 있어.\n{met_yun} 등 뒤에서 윤 경위가 숨을 들이쉬는 소리. 그리고 내쉬지 않는 소리.\nBOBO: ……아저씨? 괜   load("22_standoff.tl", "// ─────────────────────────────────────────────\n// 22. 해 질 녘의 7번 크레인 — 대치\n//   standoff_claim : 1 아이 / 2 내 총 / 3 매단 자들 / 4 개들이 죽였다 / 5 회사 / 6 모른다 / 7 떠남\n//   standoff_result: 1 평화 / 2 부분 유혈 / 3 참사\n// ─────────────────────────────────────────────\n\n=== ev_standoff @event at=crane when=\"ultimatum && day > ultimatum_day && clock >= 18:00 && !standoff_done\" priority=90\n-> standoff_begin\n\n=== ev_standoff_call @event notat=crane when=\"ultimatum && day > ultimatum_day && clock >= 19:00 && !standoff_done && !standoff_call_done\" priority=92\n~ standoff_call_done = 1\n{met_yun} 윤 경위가 당신의 소매를 잡아당긴다. 세게. 그녀의 얼굴이 하얗다.\n{met_yun} YUN: 형사님. 해가 졌어요. 시작됐어요. 7번 크레인이요.\n{met_yun} YUN: 까마귀들이 부두 거리를 막았대요. 하역부들은 바리케이드를 쳤고요. 로사 이바라가 그 한가운데 있대요.\n{!met_yun} 누군가 당신을 향해 달려온다. 앞치마에 기름 얼룩. 마르가리타다. 숨이 턱에 닿았다.\n{!met_yun} MARGA: 경찰! 경찰 양반! 크레인! 까마귀들이 왔어! 애들이 다 거기 있어! 로사도!\nHALFLIGHT: 늦었다. 늦었어. 넌 늘 늦었다. 6년 동안. 오늘도.\n{loc == \"fort\" || loc == \"flats\" || loc == \"breakwater\"} 바다 쪽에서 디젤 엔진 소리가 다가온다. 회색 순찰정 PB-7이 물보라를 일으키며 뱃머리를 댄다. 조타실 지붕에서 볼크 하사가 손짓한다.\n{loc == \"fort\" || loc == \"flats\" || loc == \"breakwater\"} VOLK: 타요! 7번 크레인 앞바다로 가는 길이에요. 협약 관측자가 늦으면 안 되잖아요!\n* \"간다. 지금.\"\n  ~ standoff_late = 1\n  {loc == \"fort\" || loc == \"flats\" || loc == \"breakwater\"} ~ volk_observer = 1\n  당신은 달린다. {{met_yun ? \"사이드카의 엔진이 비명을 지른다. 윤 경위가 부두 거리의 자갈길을 인도 위로 달린다. 노점 차양들이 당신의 머리를 스친다.\" : \"다리가 말을 듣지 않는다. 폐가 불탄다. 그래도 달린다.\"}}\n  => crane 12\n* \"……나는 가지 않겠소.\"\n  -> standoff_missed\n\n// ───────── 시작 ─────────\n\n=== standoff_begin\n~ art crane\n~ standoff_started = 1\n~ sway = rasmus_respect + rasmus_listens\n~ heat = 2\n{dogs_confessed && !dogs_lie_exposed} ~ heat += 1\n{standoff_late} ~ heat += 1\n{rosa_respect >= 2} ~ heat -= 1\n해가 요새 뒤로 떨어지고 있다. 하늘이 붉다. 만 전체가 붉다. 크레인들의 그림자가 부두 콘크리트 위로 길게, 길게 늘어진다. 일곱 번째 크레인의 그림자가 가장 길다.\n크레인 다리 사이에 바리케이드가 서 있다. 생선 상자, 화물 운반대, 기름 드럼통, 뒤집힌 손수레. 그 위에 붉은 닻 깃발. 바리케이드 뒤에 하역부 쉰 명쯤. 갈고리, 쇠지렛대, 밧줄. 얼굴들이 드럼통 불빛에 붉다.\n그리고 바리케이드 한가운데, 면 너도 쏠 거야!\n---\n열두 개의 카빈총이 올라간다. 한 번에. 금속성의 소리 하나로. 열두 개의 총구가 6미터 위의 열한 살 아이를 향한다.\n{sway >= 3} RASMUS: 사격 대기! 대기! 아이다!\n{sway >= 3} 라스무센이 두 팔을 벌리고 까마귀들 앞으로 나선다. 자기 부하들의 총구 앞으로.\n{sway < 3} RASMUS: 무기 내려라, 꼬마! 지금!\n{sway < 3} 라스무센의 목소리는 명령하는 목소리다. 아이에게 명령하는 목소리가 아니다.\nROSA: 보보! 보보야!\n{ines_arrived} INES: 보보!\n아이의 손이 떨린다. 총구가 떨린다. 라스무센에서, 까마귀들로, 하늘로, 다시 라스무센으로.\nREACTION: 3초. 어쩌면 5초. 누군가의 손가락이, 저 위에서든 여기서든, 움직이기 전까지.\n* [!EMPATHY 11 +2 ines_arrived \"누나가 여기 있다\" +1 bobo_loft_met \"비둘기장에서 이야기했다\" +1 (bobo_calm >= 1) \"보보가 너를 믿는다\" +1 (sway >= 3) \"라스무센이 사격을 막고 있다\"] 사다리 밑으로 걸어간다. 올려다본다. \"보보. 나 봐. 대통령 아저씨야.\" -> st_bobo_ok | st_bobo_fail\n* [!AUTHORITY 12 +2 (sway >= 3) \"라스무센이 이미 망설인다\" +1 volk_observer \"협약 관측자가 보고 있다\" +1 has.badge \"배지\"] 까마귀들을 향해 돌아선다. \"사격 중지! 협약 관측자 앞에서 아이를 쏠 거요?\" -> st_bobo_crows_ok | st_bobo_fail\n* [!REACTION 13 +1 (health >= 3) \"몸이 버틴다\"] 사다리로 달려가 뛰어오른다. -> st_bobo_ok | st_bobo_fail\n* {ines_arrived} 이네스를 본다. 고개를 끄덕인다.\n  -> st_bobo_ines\n* {met_yun && yun_trust >= 4} 윤 경위를 본다.\n  -> st_bobo_yun\n\n=== st_bobo_ines\n이네스가 달린다. 두 줄 사이를 가로질러, 크레인 다리로, 사다리로. 코트를 벗어 던진다. 사다리를 오른다. 댄서의 팔로. 빠르게.\n아이가 누나를 본다. 총구가 흔들린다.\nINES: 보보. 보보, 나야.\nINES: 제독 명령이야.\nINES: 무기 내려놔, 선장.\n{ines_trust >= 3} -> st_bobo_ok\n{ines_trust < 3} * [!EMPATHY 9 +2 bobo_loft_met \"비둘기장에서 이야기했다\"] 사다리 밑에서 외친다. \"보보! 누나 말 들어!\" -> st_bobo_ok | st_bobo_fail\n\n=== st_bobo_yun\n윤 경위가 당신을 본다. 그리고 고개를 끄덕인다. 아주 작게.\n그녀가 걸어간다. 까마귀들의 총구와 크레인 사다리 사이로. 천천히. 두 팔을 옆으로 벌리고. 손바닥을 펴서. 까마귀들을 등지고, 아이를 향해.\n열두 개의 총구 앞에 작은 여자 하나. 가죽 재킷. 등에 \"12분서\".\nYUN: 꼬마야. 나 기억해? 경위 아줌마.\nYUN: 저 사람들은 나를 먼저 쏴야 해. 그리고 저 사람들은 경비대를 쏘지 않아. 규정이 있거든. 협약에도 규정이 있어.\nYUN: 그러니까 넌 이제 총을 들고 있을 필요가 없어. 내가 여기 있으니까.\n아이가 그녀를 본다.\n* [!EMPATHY 10 +2 (bobo_custody == 5) \"윤 경위를 안다\" +1 (yun_trust >= 6) \"윤 경위를 믿는다\"] 사다리 밑에서 외친다. \"보보! 윤 경위님 말이 맞아!\" -> st_bobo_ok | st_bobo_yun_shot\n\n=== st_bobo_yun_shot\n아이의 손가락이 움찔한다. 떨림이 방아쇠에 닿는다.\n탕.\n윤 경위의 몸이 뒤로 돈다. 반 바퀴. 그녀가 콘크리트에 무릎을 꿇는다. 왼손이 오른쪽 어깨를 누른다. 손가락 사이로 검붉은 것이 흘러나온다.\n카빈총들이 조준을 고친다. 열두 개.\nRASMUS: 쏘지 마! 쏘지 마! 사격 중지!\n라스무센이 부하 한 명의 총신을 손으로 쳐 올린다. 총소리. 총알이 크레인의 지브에 맞아 불꽃을 튀긴다.\n그리고 조용해진다.\n아이가 사다리 위에서 총을 떨어뜨린다. 총이 콘크리트에 떨어져 튄다. 아이가 비명을 지른다. 끝없이.\nYUN: (무릎을 꿇은 채로, 이를 악물고) ……괜찮아. 괜찮아요. 어깨예요. 해군에서도…… 해군에서도 한 번 맞아 봤어요.\nYUN: 형사님. 총. 총 주우세요. 증거물이에요.\n~ yun_shot = 1\n~ bobo_crisis = 2\n~ gun_found = 1\n~ item add gun_ravn\n~ task done t_gun\n~ morale -2 soft\n-> standoff_after_bobo\n\n=== st_bobo_crows_ok\n당신은 까마귀들을 향해 돌아선다. 열두 개의 총구를 등지는 대신, 마주 본다. 아이를 등 뒤에 두고.\n당신의 목소리가 부두를 찢는다.\n{volk_observer} 순찰정 쪽에서 확성기가 울린다. VOLK: 협약 관측자 확인! 사격 시 협약 군사 법정 회부! 반복한다, 협약 군사 법정!\nRASMUS: 총 내려! 전원! 지금!\n카빈총들이 하나씩 내려간다. 마지막 한 명이 망설인다. 라스무센이 그의 총신을 손으로 누른다.\n그리고 아이가 운다. 사다리 위에서. 총을 가슴에 끌어안고.\n{ines_arrived} 이네스가 사다리를 오른다. 아이를 안는다. 총을 받아 내린다.\n{!ines_arrived} 마테오가 사다리를 오른다. 커다란 손이 아이를 감싼다. 총을 받아 내린다. 그리고 당신에게 던진다. 당신은 받는다.\n-> st_bobo_ok_end\n\n=== st_bobo_ok\n아이가 당신을 본다. {{ines_arrived ? \"그리고 누나를.\" : \"\"}}\n총구가 내려간다. 천천히. 아이의 팔이 떨린다. 너무 오래 들고 있어서.\n그리고 아이가 운다.\n사다리 위에서, 6미터 위에서, 붉은 하늘을 배경으로, 너무 큰 모자를 쓴 아이가 운다. 소리 내서. 부두 전체가 들을 만큼. 라디오 레테의 마이크가 그 소리를 도시 전체로 보낸다.\n{ines_arrived} 이네스가 사다리를 오른다. 아이를 안는다. 총을 받아 당신에게 내린다.\n{!ines_arrived} 당신이 사다리를 오른다. 아이가 총을 내민다. 손잡이를 먼저. 당신은 받는다. 아이를 안는다. 아니, 아이가 당신 목에 매달린다. 둘 다 사다리에서 떨어지지 않은 게 기적이다.\n-> st_bobo_ok_end\n\n=== st_bobo_ok_end\n~ bobo_crisis = 1\n~ gun_found = 1\n~ item add gun_ravn\n~ task done t_gun\n~ xp 50\n열두 개의 카빈총이 내려간다.\n라스무센이 모자를 벗는다. 무언가 말하려다가, 말하지 않는다.\nRASMUS: ……아이.\nRASMUS: 협약은 아이를 매달지 않소. 적어도 내가 있는 동안은.\n-> standoff_after_bobo\n\n=== st_bobo_fail\n아이의 손가락이 움찔한다.\n탕.\n총알이 어디로 갔는지 아무도 모른다. 라스무센의 발밑 콘크리트가 튄다. 한 뼘 옆.\n그리고 까마귀 한 명이 쏜다. 반사적으로. 훈련된 대로.\n{sway >= 4} 라스무센이 그 총신을 손으로 쳐 올린다. 총알이 하늘로 간다. 크레인의 지브에 맞아 불꽃이 튄다.\n{sway >= 4} RASMUS: 사격 중지! 사격 중지!\n{sway >= 4} -> st_bobo_fail_partial\n라스무센의 손이 늦는다.\n라우로가 바리케이드에서 뛰어내린다. 크레인 사다리 쪽으로. 아이를 향해. 아무도 그가 그렇게 빨리 움직일 수 있는 줄 몰랐다. 늘 졸린 눈의 라우로가.\n두 번째 총소리.\n라우로가 사다리 밑에서 멈춘다. 이상하게 멈춘다. 그리고 앉는다. 사다리에 등을 기대고. 가슴에 손을 댄다. 손을 본다. 놀란 얼굴로.\nLAURO: ……어.\n그리고 부두가 폭발한다.\n-> st_bobo_disaster\n\n=== st_bobo_fail_partial\n카빈총들이 멈춘다. 하지만 바리케이드는 멈추지 않는다. 총소리가 부두를 찢었다. 하역부들이 넘어온다. 갈고리와 쇠파이프. 까마귀들이 개머리판을 휘두른다.\n삼십 초. 어쩌면 일 분.\n그리고 로사의 목소리가 모든 것 위로 올라온다. 쉬었지만, 쇠 같은.\nROSA: 그만! 그만! 그만해!\n멈춘다. 천천히. 하역부 셋이 머리에서 피를 흘린다. 까마귀 하나가 팔이 부러져 주저앉아 있다. 마테오의 다리에 피. 개머리판이 무릎을 부쉈다.\n사다리 위에서 아이가 총을 떨어뜨렸다. 총이 콘크리트 위에 놓여 있다. 당신이 줍는다.\n~ bobo_crisis = 2\n~ mateo_hurt = 1\n~ gun_found = 1\n~ item add gun_ravn\n~ task done t_gun\n~ morale -1 soft\n-> standoff_after_bobo\n\n=== st_bobo_disaster\n그다음 일 분은 조각으로만 기억난다.\n갈고리가 드럼통을 긁는 소리. 카빈총의 노리쇠 소리. 누군가 \"엎드려!\"라고 외치는 소리. 그게 당신이었을 수도 있다.\n{met_yun} 윤 경위가 당신을 밀어 쓰러뜨린다. 그리고 그녀가 쓰러진다. 당신 위로.\n{met_yun} ~ yun_shot = 1\n총소리. 여러 발. 비명. 붉은 닻 깃발이 드럼통 불 속으로 떨어진다.\n그리고 라스무센의 목소리. 로사의 목소리. 둘이 동시에. 같은 말을. 다른 언어로.\n그만.\n---\n조용해졌을 때, 부두 콘크리트 위에 사람들이 누워 있다.\n라우로 \"졸음\". 크레인 사다리 밑에. 눈을 뜬 채로. 처음으로 졸리지 않은 눈으로.\n까마귀 한 명. 바리케이드 앞에. 갈고리에 목을 맞았다. 스무 살쯤. 회색 코트가 검어졌다.\n마테오가 피 흘리는 다리를 끌며 라우로에게 기어간다. 라우로의 머리를 무릎에 올린다. 황소가 운다. 소리 없이.\n사다리 위에서 아이가 총을 떨어뜨렸다. 아이는 사다리를 붙잡고 있다. 움직이지 않는다. 소리도 내지 않는다.\n{ines_arrived} 이네스가 사다리를 오른다. 아이를 안는다. 아이는 누나에게 안겨서도 사다리를 놓지 않는다.\n당신은 총을 줍는다. 손이 떨린다. 오래.\n~ bobo_crisis = 3\n~ lauro_dead = 1\n~ crow_dead = 1\n~ mateo_hurt = 1\n~ gun_found = 1\n~ item add gun_ravn\n~ task done t_gun\n~ morale -3 soft\n-> standoff_disaster\n\n=== standoff_after_bobo\n~ bobo_public = 1\n{bobo_crisis == 1} 부두가 조용하다. 라디오들에서 리나가 흐느끼는 소리가 들린다. 마이크를 끄는 걸 잊었다.\n{bobo_crisis == 1} ~ standoff_accepted = 1\n{bobo_crisis == 2} 부두가 조용하다. 피 냄새. 화약 냄새. 드럼통 불이 탁탁 튄다.\n{bobo_crisis == 1} -> standoff_peace\n-> standoff_blood\n\n=== standoff_bobo_unarmed\n~ bobo_unarmed_seen = 1\n그때, 바리케이드 뒤에서 작은 형체가 튀어나온다. 하역부들의 다리 사이를 빠져나와, 운반대를 기어올라, 로사의 휠체어 옆에 선다.\n너무 큰 선원 모자. 붉은 완장. 빈손.\nBOBO: 내가 쐈어요!\n부두 전체가 아이를 본다.\nBOBO: 삼촌들 아니에요! 제가 쐈어요! 비둘기장에서! 누나가 그 사람이랑 춤추고 있었는데, 저는 몰랐어요! 누나가 소리 지르는 줄 알았어요! 웃는 거였는데!\nBOBO: 얀이요! 그 사람 이름 얀이에요! 제가 얀을 쐈어요! 삼촌들 데려가지 마요!\nROSA: 보보……!\n로사가 아이의 팔을 잡는다. 아이가 뿌리치지 않는다. 그냥 서 있다. 울지도 않고. 다 말해 버린 사람의 얼굴로.\nRASMUS: ……\n라스무센이 당신을 본다.\nRASMUS: 사실이오?\n* \"사실이오. 사고였소. 그리고 그 총은 내 것이었소.\"\n  ~ det_responsible = 1\n  ~ bobo_public = 1\n  RASMUS: ……\n  RASMUS: 협약은 아이를 쫓지 않소. 내 까마귀들도.\n  라스무센이 손을 든다. 까마귀들의 총구가 내려간다.\n  ~ standoff_accepted = 1\n  -> standoff_judge\n* \"아이가 삼촌들을 지키려고 지어낸 말이오.\"\n  라스무센이 아이를 본다. 오래. 그리고 당신을 본다.\n  RASMUS: 당신은 거짓말을 잘 못하는군, 경위.\n  RASMUS: 하지만 그 거짓말이 무엇을 지키려는지는 알겠소.\n  {standoff_claim == 2 || sway >= 3} RASMUS: ……아이의 말은 듣지 않은 것으로 하겠소.\n  {standoff_claim == 2 || sway >= 3} ~ standoff_accepted = 1\n  {standoff_claim != 2 && sway < 3} ~ bobo_public = 1\n  -> standoff_judge\n\n// ─────────────────────────────────────────────\n// 판정\n// ─────────────────────────────────────────────\n\n=== standoff_judge\n{standoff_accepted && heat < 5} -> standoff_peace\n{standoff_accepted && heat >= 5} -> standoff_violence\n-> standoff_violence\n\n=== standoff_violence\n~ violence_seen = 1\n바리케이드가 흔들린다. 뒤쪽에서 누군가 밀었다. 앞줄의 하역부들이 운반대 위에서 비틀거리다 콘크리트로 뛰어내린다. 갈고리를 든 채로.\n까마귀들의 카빈총이 어깨에 붙는다. 조준. 열두 개의 총구. 노리쇠 소리.\nRASMUS: 대기! 대기!\n하역부들이 한 걸음 더 나온다. 까마귀들 중 한 명의 총구가 떨린다. 젊은 얼굴. 스무 살쯤.\n두 줄 사이의 거리가 열 걸음이 된다. 여덟 걸음.\nREACTION: 지금이다. 지금 아니면 없다.\n* [!AUTHORITY 12 +1 (sway >= 3) \"라스무센이 망설인다\" +1 has.badge \"배지\" +1 wear.coat_watch \"경비대 우비\" +1 (met_yun && yun_trust >= 5) \"윤 경위가 옆에 선다\" +1 rosa_stood_down \"로사가 한 번 멈췄다\"] 두 줄 사이로 뛰어든다. \"멈춰! 모두! 사르가 시민 경비대다!\" -> st_violence_ok | st_violence_fail\n* [!PHYSICAL 12 +1 (health >= 4) \"몸이 버틴다\" +1 wear.jacket_union \"붉은 닻 작업복\"] 맨 앞의 하역부를 온몸으로 막아선다. -> st_violence_body_ok | st_violence_fail\n* 아무것도 하지 않는다. 할 수 있는 게 없다.\n  -> st_violence_fail\n\n=== st_violence_ok\n당신은 두 줄 사이로 뛰어든다. 여덟 걸음의 콘크리트 한가운데로. 두 팔을 벌리고. 한쪽에는 갈고리, 한쪽에는 총구.\n당신의 목소리가 나온다. 어디서 나왔는지 모르는 목소리. 이 도시의 모든 교차로에서 비를 맞고 서 있던 경찰들의 목소리.\n{met_yun} 윤 경위가 당신 등 뒤에 선다. 등과 등을 맞대고. 당신은 하역부들을, 그녀는 까마귀들을 본다.\n멈춘다.\n하역부들이 멈춘다. 까마귀들이 멈춘다. 그 사이에서 당신이 숨을 헐떡인다.\nRASMUS: ……총 내려.\nROSA: 갈고리 내려.\n두 목소리가 동시에. 다른 언어로. 같은 말을.\n~ heat = 2\n~ xp 30\n~ cop_boring += 1\n-> standoff_peace\n\n=== st_violence_body_ok\n당신은 맨 앞의 고 조용해진다. 아주 오래.\n{standoff_result == 2} 그리고 고함 소리. 그리고 조용해진다.\n---\n{standoff_result == 3} 한 시간 뒤, 라디오 레테가 말한다. 리나의 목소리가 떨린다. \"……7번 크레인. 사망 둘. 하역부 라우로 벨트란, 스물두 살. 회색 까마귀 대원 한 명. 총을 든 아이가 크레인에 올라갔고, 누군가 쐈습니다. 누가 먼저였는지는……\"\n{standoff_result == 2} 한 시간 뒤, 라디오 레테가 말한다. \"……7번 크레인. 부상 여럿. 사망자는 없습니다. 회색 까마귀가 하역부 네 명을 연행했습니다. 경비대는 현장에 없었습니다. 반복합니다. 경비대는 현장에 없었습니다……\"\n{met_yun && standoff_result == 3} 그리고 그날 밤 늦게, 레테의 카운터에 쪽지 한 장. 가지런한 글씨. \"성 마르타 구호소. 어깨. 괜찮습니다. — 윤\"\n{met_yun && standoff_result == 3} ~ yun_shot = 1\n~ morale -3 soft\n-> END\n");
  load("23_finale.tl", "// ─────────────────────────────────────────────\n// 23. 마지막 밤과 새벽 — 로사, 라디오, 왜가리, 발데스\n// ─────────────────────────────────────────────\n\n// ═════════════════ 로사 이바라와의 마지막 대면 ═════════════════\n\n=== rosa_final_intro\n{rosa_final_done} -> rosa_final_after\n~ art cannery\n통조림 공장의 작업장은 불이 반만 켜져 있다. 컨베이어 벨트가 멈춘 채로 어둠 속까지 이어진다. 생선 비늘이 바닥에서 반짝인다.\n{lauro_dead} 작업장 한가운데, 생선 손질대 위에 누군가 누워 있다. 붉은 닻 깃발이 덮여 있다. 발만 나와 있다. 맨발. 여공 셋이 그 발을 씻고 있다. 대야의 물이 촛불에 흔들린다. 아무도 말하지 않는다.\n{lauro_dead} LIMBIC: 라우로. 졸린 눈의 라우로. 매일 밤 안경 쓴 남자 꿈을 꾸던.\n{lauro_dead} ~ morale -1 soft\n{mateo_hurt} 철계단 밑에 마테오가 앉아 있다. 다리에 붕대. 갈고리를 무릎에 올려놓고. 그가 당신을 본다. 그리고 계단 위를 턱으로 가리킨다. 올라가라고.\n{dogs_taken} 드럼통 불가가 비어 있다. 네 개의 자리가.\n여공들이 당신을 본다. 당신이 지나가는 동안 내내. 아무도 막지 않는다.\n철계단. 유리문. \"위원회\".\n---\n로사 이바라가 창가에 있다. 휠체어를 창 쪽으로 돌려놓고. 창밖으로 만이 보인다. 어둠 속의 요새. 3초마다 깜빡이는 등표.\n그녀의 무릎 위에 붉은 실 뭉치. 다시 감겨 있다. 단단하게. {{ines_arrived ? \"이네스가 감았을 것이다.\" : \"누군가 감아 놓았다.\"}}\n책상 위에 작은 잔 두 개와 병 하나. 아니스 술. 투명한. 냄새가 방 안에 가득하다. 감초와 불.\n{ines_arrived} 방 구석, 서류 캐비닛 옆 의자에 이네스가 앉아 있다. 회색 코트를 입은 채로. 할머니와 당신 사이, 어느 쪽도 아닌 자리에.\nROSA: 앉게.\n그녀가 돌아보지 않고 말한다.\nROSA: 한잔하게. 부두 사람들은 이런 밤에 이걸 마셔. 장례식 전날 밤에. 파업이 끝나는 밤에. 그리고 경찰이 찾아오는 밤에.\nELECTRO: 아니스! 불과 감초! 한 잔. 딱 한 잔. 오늘은 특별한 밤이잖아. 너는 오늘 전쟁을 멈췄어. 아니면 못 멈췄거나. 어느 쪽이든 한 잔은 필요해.\n* 잔을 든다. 마신다.\n  목이 탄다. 감초의 단맛이 뒤따른다. 불이 배 속으로 내려가 퍼진다. 사흘 만의 술. 몸이 기억한다. 모든 세포가 환호한다. 그리고 그 환호가 무섭다.\n  ROSA: ……그래. 경찰은 마셔야 말을 하지.\n  ~ rosa_drank = 1\n  ~ morale 1\n  ~ health -1 soft\n  ~ buff ELECTRO +1 120\n  ~ buff COMPOSURE -1 120\n* {pass(VOLITION, 9)} 잔을 밀어 놓는다. \"나는 괜찮소.\"\n  로사가 처음으로 돌아본다. 당신을, 그리고 밀어 놓은 잔을.\n  ROSA: ……안 마시는군.\n  ROSA: 사흘 전만 해도 자네는 이 부두의 모든 병을 비우던 사람이었는데. 사람이 사흘 만에 변하나.\n  ROSA: 아니. 안 변해. 참는 거지. 참는 게 변하는 것보다 어려워. 알아.\n  ~ rosa_respect += 1\n  ~ sober_rosa = 1\n  VOLITION: 잘했어. 진짜로. 이건 누구한테도 말 안 할게. 나만 알게.\n* 잔을 든다. 마시지 않고 창가에 놓는다. 요새를 향해.\n  로사가 그 잔을 본다. 창턱 위에서 요새의 등표가 3초마다 잔을 비춘다.\n  ROSA: ……바르톨로메 몫인가. 아니면 라우로. 아니면 그 보험 회사 남자.\n  ROSA: 누구 몫이든, 좋아.\n  ~ rosa_respect += 1\n  ~ gla <script>
/* src/js/ui.js */
/* 탱고 레테 — 사용자 인터페이스 */
(function (TL) {
  'use strict';
  const U = TL.util;
  const D = TL.data;

  const $ = (s, r) => (r || document).querySelector(s);
  function h(tag, attrs) {
    const e = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') e.className = v;
        else if (k === 'html') e.innerHTML = v;
        else if (k === 'text') e.textContent = v;
        else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v === true ? '' : v);
      }
    }
    for (let i = 2; i < arguments.length; i++) {
      const kid = arguments[i];
      const list = Array.isArray(kid) ? kid : [kid];
      for (const x of list) {
        if (x == null || x === false) continue;
        e.appendChild(typeof x === 'string' ? document.createTextNode(x) : x);
      }
    }
    return e;
  }
  function safeJSON(s) { try { return s ? JSON.parse(s) : null; } catch (e) { return null; } }

  const Store = {
    key: k => 'tangolethe.v1.' + k,
    get(k) { try { return localStorage.getItem(this.key(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(this.key(k), v); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(this.key(k)); } catch (e) { /* 무시 */ } },
  };

  const DICE = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
  const NOTE_ICON = {
    xp: '✦', levelup: '✦', level: '▲', item: '◆', itemloss: '◇', task: '▣', taskdone: '▣', taskfail: '▣',
    thought: '◎', hurt: '✚', heal: '✚', hurtm: '◈', healm: '◈', money: '¤', moneyloss: '¤', buff: '↑', info: '·', use: '◆',
  };
  const ALIGN = [
    ['al_communard', '코뮌주의'], ['al_ultralib', '초자유주의'], ['al_moralist', '협약주의'], ['al_crown', '왕당·국수주의'],
  ];
  const COPS = [
    ['cop_sorry', '사과하는 형사'], ['cop_star', '스타 형사'], ['cop_apoc', '종말론 형사'],
    ['cop_boring', '모범 형사'], ['cop_hobo', '부랑 형사'], ['cop_tango', '탱고 형사'],
  ];
  const PHASE_KO = { dawn: '새벽', day: '낮', dusk: '황혼', night: '밤' };
  const SLOT_NAMES = {};
  for (const [k, v] of D.slots) SLOT_NAMES[k] = v;

  function attrColor(attr) { return D.attrs[attr] ? D.attrs[attr].color : '#ccc'; }
  function modText(mods) {
    const parts = [];
    for (const k in mods || {}) {
      const sk = D.skills[k];
      parts.push((sk ? sk.name : k) + ' ' + (mods[k] > 0 ? '+' : '−') + Math.abs(mods[k]));
    }
    return parts.join(', ');
  }
  function josaIga(word) {
    const c = word.charCodeAt(word.length - 1);
    if (c < 0xac00 || c > 0xd7a3) return '이(가)';
    return (c - 0xac00) % 28 ? '이' : '가';
  }
  function fmtDuration(min) {
    min = Math.max(0, Math.round(min));
    const hh = Math.floor(min / 60), mm = min % 60;
    if (!hh) return mm + '분';
    return hh + '시간' + (mm ? ' ' + mm + '분' : '');
  }

  class UI {
    constructor() {
      this.game = new TL.Game();
      this.settings = Object.assign({ fs: 'normal', anim: true }, safeJSON(Store.get('settings')) || {});
      this.pending = [];
      this.panelKind = null;
      this.panelTab = null;
      this.sel = {};
      this.screen = 'title';
      this.sceneDirty = true;
      this.game.on((type, data) => {
        if (type === 'entry') this.pending.push(data);
        else if (type === 'scene') this.sceneDirty = true;
        else if (type === 'arrive') this.wantAutosave = true;
      });
    }

    /* ─────────── 부팅 ─────────── */
    init(hotData) {
      this.el = {
        title: $('#screen-title'), create: $('#screen-create'), gameScr: $('#screen-game'),
        log: $('#log'), choices: $('#choices'),
        placeName: $('#place-name'), placeSub: $('#place-sub'),
        hp: $('#hp-pips'), mp: $('#mp-pips'), money: $('#money'), lvl: $('#lvl'), tide: $('#tide-chip'),
        panel: $('#panel'), panelTabs: $('#panel-tabs'), panelBody: $('#panel-body'),
        ending: $('#ending'), toast: $('#toast'),
      };
      this.applySettings();
      this.painter = new TL.Painter($('#scene-canvas'));
      this.titlePainter = new TL.Painter($('#title-canvas'));

      $('#btn-new').addEventListener('click', () => this.showCreate());
      $('#btn-continue').addEventListener('click', () => this.loadSlot('auto'));
      $('#btn-load').addEventListener('click', () => this.openPanel('load'));
      $('#btn-about').addEventListener('click', () => this.openPanel('about'));
      $('#panel-close').addEventListener('click', () => this.closePanel());
      this.el.panel.addEventListener('click', (e) => { if (e.target === this.el.panel) this.closePanel(); });
      for (const b of document.querySelectorAll('.toolbar [data-panel]')) {
        b.addEventListener('click', () => this.openPanel(b.getAttribute('data-panel')));
      }
      document.addEventListener('keydown', (e) => this.onKey(e));
      let rt = null;
      window.addEventListener('resize', () => {
        clearTimeout(rt);
        rt = setTimeout(() => {
          if (this.screen === 'game') this.paintScene(true);
          if (this.screen === 'title') this.paintTitle();
        }, 180);
      });
      document.addEventListener('visibilitychange', () => { if (document.hidden) this.autosave(); });
      window.addEventListener('pagehide', () => this.autosave());

      if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
        try {
          window.claude.hot.snapshot(() => ({ save: this.game.s && this.screen === 'game' ? this.game.serialize() : null }));
        } catch (e) { /* 무시 */ }
      }

      if (hotData && hotData.save) {
        try { this.game.load(hotData.save); this.enterGame(); return; } catch (e) { /* 타이틀로 */ }
      }
      this.showTitle();
    }

    applySettings() {
      document.body.classList.toggle('no-anim', !this.settings.anim);
      document.body.classList.remove('fs-small', 'fs-large', 'fs-xlarge');
      if (this.settings.fs !== 'normal') document.body.classList.add('fs-' + this.settings.fs);
      Store.set('settings', JSON.stringify(this.settings));
    }

    showScreen(name) {
      this.screen = name;
      this.el.title.hidden = name !== 'title';
      this.el.create.hidden = name !== 'create';
      this.el.gameScr.hidden = name !== 'game';
      this.el.ending.hidden = true;
    }

    showTitle() {
      this.showScreen('title');
      $('#btn-continue').hidden = !Store.get('auto');
      requestAnimationFrame(() => this.paintTitle());
    }
    paintTitle() {
      try { this.titlePainter.paint('title', { hour: 23, v: () => 0 }, true); } catch (e) { /* 캔버스 실패는 무시 */ }
    }

    toast(msg) {
      const t = this.el.toast;
      t.textContent = msg;
      t.hidden = false;
      clearTimeout(this.toastT);
      this.toastT = setTimeout(() => { t.hidden = true; }, 2600);
    }

    fatal(err) {
      console.error(err);
      this.el.log.appendChild(h('div', { class: 'fatal', text: '스크립트 오류가 발생했습니다.\n' + (err && err.message ? err.message : String(err)) + '\n\n메뉴에서 저장을 불러오거나 타이틀로 돌아가세요.' }));
      this.el.log.scrollTop = this.el.log.scrollHeight;
    }

    /* ─────────── 캐릭터 생성 ─────────── */
    showCreate() {
      this.showScreen('create');
      this.cr = { arch: D.archetypes[0].id, attrs: Object.assign({}, D.archetypes[0].attrs), sig: D.archetypes[0].signature, custom: { INT: 3, PSY: 3, FYS: 3, MOT: 3 } };
      this.renderCreate();
    }
    renderCreate() {
      const cr = this.cr;
      const root = this.el.create;
      root.innerHTML = '';
      const inner = h('div', { class: 'create-inner' });
      inner.appendChild(h('div', { class: 'create-head' },
        h('h2', { text: '당신은 어떤 형사였는가' }),
        h('p', { text: '기억은 없다. 하지만 몸과 머리는 무언가를 기억한다. 네 가지 속성이 당신의 기술들을 떠받친다. 원형을 고르거나 직접 배분하고, 가장 자신 있는 기술 하나를 대표 기술로 정하라.' })));

      const grid = h('div', { class: 'arch-grid', role: 'radiogroup', 'aria-label': '원형' });
      const archs = D.archetypes.concat([{ id: 'custom', name: '직접 만들기', en: 'CUSTOM', desc: '12점을 네 속성에 직접 나눈다. 각 속성은 1에서 6까지. 약점이 없는 형사는 없다. 약점을 고르는 것이 곧 성격을 고르는 것이다.', attrs: cr.custom }]);
      for (const a of archs) {
        const sel = cr.arch === a.id;
        const card = h('button', { class: 'arch' + (sel ? ' sel' : ''), type: 'button', role: 'radio', 'aria-checked': sel ? 'true' : 'false' },
          h('span', { class: 'arch-en', text: a.en }),
          h('span', { class: 'arch-name', text: a.name }),
          h('span', { class: 'arch-desc', text: a.desc }),
          this.attrBars(a.id === 'custom' ? cr.custom : a.attrs));
        card.addEventListener('click', () => {
          cr.arch = a.id;
          if (a.id === 'custom') cr.attrs = cr.custom;
          else { cr.attrs = Object.assign({}, a.attrs); cr.sig = a.signature; }
          this.renderCreate();
        });
        grid.appendChild(card);
      }
      inner.appendChild(grid);

      if (cr.arch === 'custom') {
        const sec = h('div', { class: 'create-section' }, h('h3', { text: '속성 배분' }));
        const used = D.attrOrder.reduce((s, k) => s + cr.custom[k], 0);
        const left = D.customPoints - used;
        sec.appendChild(h('div', { class: 'points-left', text: '남은 점수: ' + left }));
        const box = h('div', { class: 'custom-box' });
        for (const k of D.attrOrder) {
          const at = D.attrs[k];
          const minus = h('button', { type: 'button', 'aria-label': at.name + ' 내리기', text: '−' });
          const plus = h('button', { type: 'button', 'aria-label': at.name + ' 올리기', text: '+' });
          minus.disabled = cr.custom[k] <= D.attrMin;
          plus.disabled = cr.custom[k] >= D.attrMax || left <= 0;
          minus.addEventListener('click', () => { cr.custom[k]--; cr.attrs = cr.custom; this.renderCreate(); });
          plus.addEventListener('click', () => { cr.custom[k]++; cr.attrs = cr.custom; this.renderCreate(); });
          const card = h('div', { class: 'custom-attr' },
            h('div', { class: 'top' },
              h('div', null, h('div', { class: 'nm', text: at.name, style: 'color:' + at.color }), h('div', { class: 'en', text: at.en })),
              h('div', { class: 'stepper' }, minus, h('span', { class: 'val', text: String(cr.custom[k]) }), plus)),
            h('p', { text: at.desc }));
          box.appendChild(card);
        }
        sec.appendChild(box);
        inner.appendChild(sec);
      }

      const sigSec = h('div', { class: 'create-section' }, h('h3', { text: '대표 기술 — 레벨 +1, 배움 한도 +1' }));
      const sg = h('div', { class: 'sig-grid' });
      for (const k of D.attrOrder) {
        const col = h('div', { class: 'sig-col' }, h('h4', { text: D.attrs[k].name + ' · ' + D.attrs[k].en, style: 'color:' + D.attrs[k].color }));
        const list = h('div', { class: 'sig-list' });
        for (const sk of D.skillOrder[k]) {
          const s = D.skills[sk];
          const lv = (cr.attrs[k] || 0) + (cr.sig === sk ? 1 : 0);
          const b = h('button', { class: 'sig' + (cr.sig === sk ? ' sel' : ''), type: 'button', title: s.tag },
            h('span', { text: s.name }), h('span', { class: 'lv', text: String(lv) }));
          b.addEventListener('click', () => { cr.sig = sk; this.renderCreate(); });
          list.appendChild(b);
        }
        col.appendChild(list);
        sg.appendChild(col);
      }
      sigSec.appendChild(sg);
      if (cr.sig) {
        const s = D.skills[cr.sig];
        sigSec.appendChild(h('div', { class: 'sig-detail' }, h('strong', { text: s.name + ' — ' + s.tag }), '\n' + s.desc));
      }
      inner.appendChild(sigSec);

      const used = D.attrOrder.reduce((s, k) => s + (cr.attrs[k] || 0), 0);
      const valid = cr.sig && (cr.arch !== 'custom' || used === D.customPoints);
      const hp = (cr.attrs.FYS || 0) + (cr.sig === 'ENDURANCE' ? 1 : 0) + 1;
      const mp = (cr.attrs.PSY || 0) + (cr.sig === 'VOLITION' ? 1 : 0) + 1;
      const startBtn = h('button', { class: 'btn primary', type: 'button', text: '깨어난다' });
      startBtn.disabled = !valid;
      startBtn.addEventListener('click', () => this.startNew());
      inner.appendChild(h('div', { class: 'create-foot' },
        h('div', { class: 'create-summary', text: '체력 ' + hp + ' · 사기 ' + mp + (cr.arch === 'custom' && used !== D.customPoints ? ' · 점수를 모두 배분하세요 (' + used + '/' + D.customPoints + ')' : '') }),
        h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
          h('button', { class: 'btn', type: 'button', text: '돌아가기', onclick: () => this.showTitle() }),
          startBtn)));
      root.appendChild(inner);
    }
    attrBars(attrs) {
      const box = h('div', { class: 'attr-bars' });
      for (const k of D.attrOrder) {
        const pips = h('span', { class: 'pips' });
        for (let i = 1; i <= 6; i++) pips.appendChild(h('i', { class: 'pip' + (i <= attrs[k] ? ' on' : '') }));
        box.appendChild(h('div', { class: 'attr-bar', style: 'color:' + D.attrs[k].color },
          h('span', { text: D.attrs[k].name }), pips, h('span', { class: 'num', text: String(attrs[k]) })));
      }
      return box;
    }

    startNew() {
      const cr = this.cr;
      this.pending = [];
      this.showScreen('game');
      this.el.log.innerHTML = '';
      this.el.choices.innerHTML = '';
      try {
        this.game.newGame({
          attrs: Object.assign({}, cr.attrs), signature: cr.sig, archetype: cr.arch,
          items: ['shoe_left'], equip: ['shoe_left'], money: 0, startMin: 9 * 60 + 40, start: 'intro',
        });
      } catch (e) { this.fatal(e); return; }
      this.sceneDirty = true;
      this.after();
    }

    /* ─────────── 게임 화면 ─────────── */
    enterGame() {
      this.showScreen('game');
      this.pending = [];
      this.rebuildLog();
      this.sceneDirty = true;
      requestAnimationFrame(() => {
        this.paintScene(true);
        this.updateHud();
        this.renderPrompt();
        if (this.game.prompt && this.game.prompt.type === 'ending') this.showEnding(this.game.prompt.id);
      });
    }

    rebuildLog() {
      const log = this.el.log;
      log.innerHTML = '';
      const frag = document.createDocumentFragment();
      for (const e of this.game.log) {
        const node = this.renderEntry(e);
        if (node) frag.appendChild(node);
      }
      log.appendChild(frag);
      log.scrollTop = log.scrollHeight;
    }

    act(fn) {
      if (this.busy) return;
      try { fn(); } catch (e) { this.fatal(e); this.pending = []; return; }
      this.after();
    }

    after() {
      const entries = this.pending;
      this.pending = [];
      const log = this.el.log;
      this.el.choices.innerHTML = '';
      const anim = this.settings.anim && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const step = anim ? Math.max(18, Math.min(80, 1400 / Math.max(1, entries.length))) : 0;
      let first = null, i = 0, gotDay = false;
      const frag = document.createDocumentFragment();
      for (const e of entries) {
        if (e.k === 'day') gotDay = true;
        const node = this.renderEntry(e);
        if (!node) continue;
        if (anim) { node.classList.add('fresh'); node.style.animationDelay = (i * step) + 'ms'; }
        if (!first) first = node;
        frag.appendChild(node);
        i++;
      }
      const prevHeight = log.scrollHeight;
      log.appendChild(frag);
      while (log.childElementCount > 520) log.removeChild(log.firstElementChild);
      this.scrollLog(first, prevHeight);
      this.updateHud();
      if (this.sceneDirty) this.paintScene();
      const total = anim ? i * step + 120 : 0;
      this.busy = total > 0;
      clearTimeout(this.promptT);
      this.promptT = setTimeout(() => {
        this.busy = false;
        this.renderPrompt();
        const p = this.game.prompt;
        if (p && p.type === 'ending') this.showEnding(p.id);
      }, total);
      if (this.wantAutosave || gotDay) { this.wantAutosave = false; this.autosave(); }
      if (this.panelKind) this.renderPanel();
    }

    scrollLog(first, prevHeight) {
      const log = this.el.log;
      if (!first) return;
      const added = log.scrollHeight - (prevHeight || 0);
      let top;
      if (added > log.clientHeight * .85) top = first.offsetTop - 18;
      else top = log.scrollHeight;
      log.scrollTo({ top, behavior: this.settings.anim ? 'smooth' : 'auto' });
    }

    renderEntry(e) {
      switch (e.k) {
        case 'line': {
          const cls = ['e', 'line'];
          if (!e.who) cls.push('nar');
          else if (e.sk === 'skill') cls.push('skill', e.attr);
          else if (e.sk === 'voice') cls.push('voice');
          else if (e.sk === 'object') cls.push('object');
          else cls.push('npc');
          const p = h('p', { class: cls.join(' ') });
          if (e.who) {
            const who = h('span', { class: 'who', text: e.name });
            if (e.color) who.style.color = e.color;
            if (e.sk === 'skill' && D.skills[e.who]) who.title = D.skills[e.who].tag;
            p.appendChild(who);
            if (e.tag) p.appendChild(h('span', { class: 'tag', text: e.tag }));
            p.appendChild(h('span', { class: 'dash', text: '—' }));
          }
          p.appendChild(h('span', { class: 'txt', html: U.markup(e.text) }));
          return p;
        }
        case 'you': {
          const p = h('p', { class: 'e you' });
          p.appendChild(h('span', { class: 'who', text: '당신' }));
          p.appendChild(h('span', { class: 'dash', text: '—' }));
          if (e.gate) p.appendChild(h('span', { class: 'ck', style: 'color:' + attrColor(e.gate.attr), text: '[' + e.gate.name + ']' }));
          if (e.check) {
            const sk = D.skills[e.check.skill];
            p.appendChild(h('span', { class: 'ck ' + (e.check.red ? 'red' : 'white'), text: '[' + sk.name + ' · ' + e.check.dname + ' ' + e.check.diff + ']' }));
          }
          p.appendChild(h('span', { html: U.markup(e.text) }));
          return p;
        }
        case 'check': {
          const box = h('div', { class: 'e check ' + (e.ok ? 'ok' : 'no') + (e.red ? ' red' : ''), role: 'note' });
          box.appendChild(h('span', { class: 'dice', 'aria-label': '주사위 ' + e.d1 + ', ' + e.d2, text: DICE[e.d1] + DICE[e.d2] }));
          box.appendChild(h('span', { class: 'sk', style: 'color:' + attrColor(e.attr), text: e.name }));
          let math = e.d1 + ' + ' + e.d2 + ' + 기술 ' + e.lvl;
          if (e.mod) math += ' ' + (e.mod > 0 ? '+' : '−') + ' 보정 ' + Math.abs(e.mod);
          math += ' = ' + e.total + ' / ' + e.dname + ' ' + e.diff;
          box.appendChild(h('span', { class: 'math', text: math }));
          let res = e.ok ? '성공' : '실패';
          if (e.d1 === 6 && e.d2 === 6) res = '결정적 성공';
          if (e.d1 === 1 && e.d2 === 1) res = '결정적 실패';
          box.appendChild(h('span', { class: 'res', text: res }));
          if (e.mods && e.mods.length) box.title = e.mods.map(m => (m.v > 0 ? '+' : '−') + Math.abs(m.v) + ' ' + m.label).join('\n');
          return box;
        }
        case 'note':
          return h('div', { class: 'e note ' + e.kind }, h('span', { class: 'ic', 'aria-hidden': 'true', text: NOTE_ICON[e.kind] || '·' }), h('span', { text: e.text }));
        case 'loc':
          return h('div', { class: 'e loc' }, h('span', null, e.name, h('span', { class: 't', text: e.day + '일차 ' + e.clock })));
        case 'day':
          return h('div', { class: 'e day' }, e.day + '일차', h('small', { text: '솔레아 · ' + e.clock }));
        case 'sep':
          return h('div', { class: 'e sep', 'aria-hidden': 'true' });
        case 'ambient':
          return h('p', { class: 'e ambient', html: U.markup(e.text) });
        case 'thought': {
          const box = h('div', { class: 'e thought' });
          box.appendChild(h('span', { class: 'th-k', text: '사고 완성' }));
          box.appendChild(h('span', { class: 'th-n', text: e.name }));
          box.appendChild(h('span', { text: e.text }));
          const def = D.thoughts[e.id];
          const eff = def ? modText(def.bonus) : '';
          const extra = def && def.extra ? Object.keys(def.extra).map(k => (k === 'health' ? '체력 최대치 ' : '사기 최대치 ') + '+' + def.extra[k]).join(', ') : '';
          if (eff || extra) box.appendChild(h('span', { class: 'th-b', text: '효과: ' + [eff, extra].filter(Boolean).join(', ') }));
          return box;
        }
        default:
          return null;
      }
    }

    renderPrompt() {
      const box = this.el.choices;
      box.innerHTML = '';
      const p = this.game.prompt;
      if (!p) return;
      const anim = this.settings.anim;
      if (p.type === 'continue') {
        const b = h('button', { class: 'continue' + (anim ? ' fresh' : ''), type: 'button', text: '계속  ▸' });
        b.addEventListener('click', () => this.act(() => this.game.cont()));
        box.appendChild(b);
        if (!this.panelKind) b.focus({ preventScroll: true });
        return;
      }
      if (p.type !== 'choices') return;
      p.items.forEach((it, i) => {
        const cls = ['choice'];
        if (anim) cls.push('fresh');
        if (it.disabled) cls.push('locked');
        if (it.exit) cls.push('exit');
        if (it.info) cls.push(it.info.red ? 'red' : 'white');
        const b = h('button', { class: cls.join(' '), type: 'button', 'aria-disabled': it.disabled ? 'true' : null });
        if (anim) b.style.animationDelay = (i * 35) + 'ms';
        b.appendChild(h('span', { class: 'n', text: (i + 1) + '.' }));
        const t = h('span', { class: 'txt' });
        if (it.gate) {
          const sk = D.skills[it.gate.skill];
          t.appendChild(h('span', { class: 'gate', style: 'color:' + attrColor(sk.attr), text: '[' + sk.name + ']' }));
        }
        if (it.info) {
          const sk = D.skills[it.info.skill];
          t.appendChild(h('span', { class: 'ck', text: '[' + sk.name + ' · ' + it.info.dname + ' ' + it.info.diff + ']' }));
        }
        t.appendChild(h('span', { html: U.markup(it.text) }));
        if (it.info && !it.disabled) t.appendChild(h('span', { class: 'pct', text: Math.round(it.info.chance * 100) + '%' }));
        if (it.disabled && it.info) {
          const sk = D.skills[it.info.skill];
          t.appendChild(h('span', { class: 'lockmsg', text: '잠김 — ' + sk.name + josaIga(sk.name) + ' ' + (it.info.locked + 1) + ' 이상이 되면 다시 시도할 수 있다.' }));
        }
        b.appendChild(t);
        if (it.info) {
          const parts = ['기술 ' + it.info.lvl];
          for (const m of it.info.mods) parts.push((m.v > 0 ? '+' : '−') + Math.abs(m.v) + ' ' + m.label);
          b.title = (it.info.red ? '빨간색 판정: 단 한 번의 기회.' : '흰색 판정: 실패하면 기술을 올린 뒤 다시 시도할 수 있다.') + '\n' + parts.join('\n');
        }
        b.addEventListener('click', () => { if (!it.disabled) this.act(() => this.game.choose(i)); });
        box.appendChild(b);
      });
    }

    updateHud() {
      const g = this.game, s = g.s;
      if (!s) return;
      const pips = (el, cur, max) => {
        const prev = +el.getAttribute('data-cur');
        el.innerHTML = '';
        for (let i = 0; i < max; i++) el.appendChild(h('i', { class: 'pip' + (i < cur ? ' on' : '') + (!isNaN(prev) && prev !== cur && i < Math.max(cur, prev) && i >= Math.min(cur, prev) ? ' flash' : '') }));
        el.setAttribute('data-cur', cur);
        el.parentElement.setAttribute('aria-label', cur + ' / ' + max);
      };
      pips(this.el.hp, Math.max(0, g.health()), g.healthMax());
      pips(this.el.mp, Math.max(0, g.morale()), g.moraleMax());
      this.el.money.textContent = '¤ ' + U.fmtMoney(s.money) + ' 솔도';
      this.el.lvl.innerHTML = '';
      this.el.lvl.appendChild(document.createTextNode('레벨 ' + s.level));
      if (s.points > 0) this.el.lvl.appendChild(h('span', { class: 'pts', text: ' · 기술 포인트 ' + s.points }));
      const loc = TL.content.nodes[s.loc];
      this.el.placeName.textContent = loc ? (loc.attrs.name || loc.id) : '어둠';
      const phase = TL.phaseOf(g.hour());
      this.el.placeSub.textContent = s.day + '일차 · ' + U.fmtClock(s.min) + ' · ' + PHASE_KO[phase];
      const low = g.isLowTide();
      this.el.tide.textContent = low ? '썰물 — 개펄이 드러남' : '밀물';
      this.el.tide.classList.toggle('low', low);
      this.el.tide.hidden = !s.loc;
      const cb = $('#tb-char');
      cb.classList.toggle('has-points', s.points > 0);
      if (phase !== this.lastPhase) { this.lastPhase = phase; this.sceneDirty = true; }
      if (this.sceneDirty) this.paintScene();
    }

    paintScene(force) {
      const g = this.game;
      if (!g.s || this.screen !== 'game') return;
      this.sceneDirty = false;
      try {
        this.painter.paint(g.s.art || 'void', { hour: g.hour(), v: (n) => { try { return g.value(n); } catch (e) { return 0; } } }, force);
      } catch (e) { console.warn(e); }
    }

    /* ─────────── 결말 ─────────── */
    showEnding(id) {
      const g = this.game, s = g.s;
      const def = (D.endings && D.endings[id]) || { title: '끝', sub: '' };
      const box = this.el.ending;
      box.innerHTML = '';
      const isDeath = id === 'death';
      const inner = h('div', { class: 'ending-box' });
      inner.appendChild(h('div', { class: 'ending-k', text: isDeath ? '게임 오버' : '탱고 레테 · 끝' }));
      inner.appendChild(h('div', { class: 'ending-t', text: def.title }));
      if (def.sub) inner.appendChild(h('div', { class: 'ending-s', text: def.sub }));
      const done = Object.keys(s.thoughts).filter(k => s.thoughts[k].st === 'done').length;
      const tasks = Object.keys(s.tasks).filter(k => s.tasks[k].st === 'done').length;
      const stats = h('div', { class: 'ending-stats' });
      const stat = (v, l) => stats.appendChild(h('div', null, h('b', { text: String(v) }), h('span', { text: l })));
      stat(s.day + '일', '솔레아에서 보낸 날');
      stat(s.level, '레벨');
      stat(s.stats.checksOk + ' / ' + s.stats.checks, '성공한 판정');
      stat(done, '내면화한 사고');
      stat(tasks, '완료한 과제');
      stat(U.fmtMoney(s.money), '남은 솔도');
      inner.appendChild(stats);
      const acts = h('div', { class: 'ending-acts' });
      if (isDeath) acts.appendChild(h('button', { class: 'btn primary', type: 'button', text: '마지막 자동 저장 불러오기', onclick: () => this.loadSlot('auto') }));
      acts.appendChild(h('button', { class: 'btn', type: 'button', text: '기록 다시 읽기', onclick: () => { box.hidden = true; } }));
      acts.appendChild(h('button', { class: 'btn', type: 'button', text: '타이틀로', onclick: () => { box.hidden = true; this.showTitle(); } }));
      inner.appendChild(acts);
      box.appendChild(inner);
      box.hidden = false;
      if (!isDeath) Store.del('auto');
    }

    /* ─────────── 저장 ─────────── */
    slotMeta(key) { return safeJSON(Store.get(key + '.meta')); }
    saveSlot(key) {
      const g = this.game;
      if (!g.s || g.halted) return false;
      const data = g.serialize();
      const loc = TL.content.nodes[g.s.loc];
      const meta = { when: Date.now(), day: g.s.day, clock: U.fmtClock(g.s.min), place: loc ? loc.attrs.name : '', level: g.s.level };
      const ok = Store.set(key, data) && Store.set(key + '.meta', JSON.stringify(meta));
      return ok;
    }
    autosave() {
      if (this.screen !== 'game' || !this.game.s || this.game.halted) return;

    /* ─────────── 키보드 ─────────── */
    onKey(e) {
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (this.panelKind) {
        if (e.key === 'Escape') { e.preventDefault(); this.closePanel(); }
        return;
      }
      if (this.screen !== 'game' || !this.el.ending.hidden) return;
      const code = e.code || '';
      const p = this.game.prompt;
      if (/^(Digit|Numpad)[0-9]$/.test(code)) {
        let n = parseInt(code.slice(-1), 10);
        if (n === 0) n = 10;
        if (p && p.type === 'choices' && !this.busy && p.items[n - 1] && !p.items[n - 1].disabled) {
          e.preventDefault();
          this.act(() => this.game.choose(n - 1));
        }
        return;
      }
      if ((code === 'Space' || code === 'Enter') && p && p.type === 'continue' && !this.busy) {
        e.preventDefault();
        this.act(() => this.game.cont());
        return;
      }
      const map = { KeyC: 'char', KeyT: 'thought', KeyI: 'inv', KeyJ: 'journal', Escape: 'menu' };
      if (map[code]) { e.preventDefault(); this.openPanel(map[code]); }
    }

    /* ─────────── 패널 ─────────── */

        lb.disabled = !meta;
        acts.appendChild(lb);
        list.appendChild(h('div', { class: 'saverow' }, h('div', null, h('div', { text: label }), h('div', { class: 'meta', text: info })), acts));
      };
      const canSave = !!this.game.s && !this.game.halted;
      row('auto', '자동 저장', false);
      for (let i = 1; i <= 5; i++) row('slot' + i, '슬롯 ' + i, canSave);
      saves.appendChild(list);
      grid.appendChild(saves);

      const ex = h('div');
      ex.appendChild(h('h3', { text: '내보내기 · 가져오기' }));
      const ta = h('textarea', { id: 'io-text', 'aria-label': '저장 데이터', placeholder: '여기에 저장 데이터를 붙여 넣고 가져오기를 누르세요.' });
      const msg = h('div', { class: 'msg' });
      const exBtn = h('button', { class: 'btn small', type: 'button', text: '현재 진행 내보내기' });
      exBtn.disabled = !canSave;
      exBtn.addEventListener('click', () => {
        const data = this.game.serialize();
        ta.value = data;
        const done = () => { msg.textContent = '클립보드에 복사했습니다. 안전한 곳에 붙여 넣어 보관하세요.'; };
        const fallback = () => { ta.focus(); ta.select(); msg.textContent = '텍스트를 선택했습니다. 복사해서 보관하세요.'; };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(data).then(done, fallback);
          else fallback();
        } catch (e) { fallback(); }
      });
      const imBtn = h('button', { class: 'btn small', type: 'button', text: '가져오기', onclick: () => { if (ta.value.trim()) this.loadData(ta.value.trim()); else msg.textContent = '먼저 저장 데이터를 붙여 넣으세요.'; } });
      ex.appendChild(h('div', { class: 'sub', style: 'margin:.3em 0 .8em', text: '진행 상황을 텍스트로 옮긴다.' }));
      ex.appendChild(ta);
      ex.appendChild(h('div', { style: 'display:flex;gap:6px;margin-top:8px;flex-wrap:wrap' }, exBtn, imBtn));
      ex.appendChild(msg);

      ex.appendChild(h('h3', { text: '설정', style: 'margin-top:1.4em' }));
      const fs = h('select', { id: 'set-fs', 'aria-label': '글자 크기' });
      for (const [v, l] of [['small', '작게'], ['normal', '보통'], ['large', '크게'], ['xlarge', '아주 크게']]) {
        const o = h('option', { value: v, text: l });
        if (this.settings.fs === v) o.selected = true;
        fs.appendChild(o);
      }
      fs.addEventListener('change', () => { this.settings.fs = fs.value; this.applySettings(); });
      const an = h('select', { id: 'set-anim', 'aria-label': '글 나타나기 효과' });
      for (const [v, l] of [['1', '켜기'], ['0', '끄기 (즉시 표시)']]) {
        const o = h('option', { value: v, text: l });
        if ((this.settings.anim ? '1' : '0') === v) o.selected = true;
        an.appendChild(o);
      }
      an.addEventListener('change', () => { this.settings.anim = an.value === '1'; this.applySettings(); });
      ex.appendChild(h('div', { class: 'setting' }, h('label', { for: 'set-fs', text: '글자 크기' }), fs));
      ex.appendChild(h('div', { class: 'setting' }, h('label', { for: 'set-anim', text: '글 나타나기 효과' }), an));
      const quitBox = h('div', { class: 'confirm-row' });
      const quit = h('button', { class: 'btn small danger', type: 'button', text: '타이틀로 돌아가기' });
      quit.addEventListener('click', () => {
        quitBox.innerHTML = '';
        quitBox.appendChild(h('span', { text: '자동 저장한 뒤 타이틀로 돌아갑니다.' }));
        quitBox.appendChild(h('button', { class: 'btn small danger', type: 'button', text: '확인', onclick: () => { this.autosave(); this.closePanel(); this.showTitle(); } }));
        quitBox.appendChild(h('button', { class: 'btn small', type: 'button', text: '취소', onclick: () => this.renderPanel() }));
      });
      if (this.game.s) { ex.appendChild(h('div', { style: 'margin-top:1.2em' }, quit)); ex.appendChild(quitBox); }
      grid.appendChild(ex);
      body.appendChild(grid);
    }

    panelLoad(body) {
      const wasGame = this.game.s;
      this.panelMenu(body);
      if (!wasGame) body.querySelectorAll('.setting').forEach(e => e.remove());
    }

    panelAbout(body) {
      const txt = [
        ['탱고 레테', '레테 강 하구의 항구 지구 솔레아를 무대로 한 텍스트 수사 롤플레잉 게임이다. 당신은 모든 기억을 잃은 채 무도장 2층에서 깨어난 형사다. 크레인에 매달린 남자의 죽음을 조사하면서, 당신은 도시와 사람들과 당신 자신을 다시 알게 된다.'],
        ['24개의 목소리', '당신의 기술들은 머릿속에서 말을 한다. 논리는 모순을 짚고, 내해는 사물과 대화하고, 전기화학은 술을 권하고, 소름은 도시의 속삭임을 전한다. 기술이 충분히 높으면 대화 중에 저절로 끼어든다(패시브 판정).'],
        ['판정', '주사위 두 개(2d6)에 기술 레벨과 보정을 더해 난이도 이상이면 성공한다. 1·1은 무조건 실패, 6·6은 무조건 성공. 흰색 판정은 실패해도 기술을 올리면 다시 시도할 수 있다. 빨간색 판정은 단 한 번뿐이다.'],
        ['체력과 사기', '체력은 인내에, 사기는 의지에 따라 정해진다. 둘 중 하나라도 0이 되면 끝이다. 진통제, 담배, 음식, 술로 회복할 수 있다. 잠을 자면 조금 회복된다.'],
        ['사고 캐비닛', '대화 중에 떠오른 생각을 내면화할 수 있다. 시간이 지나면 완성되어 영구적인 효과를 준다. 연구 중에는 대가가 따른다.'],
        ['시간', '대화 선택지 하나에 2분, 장소 이동에 몇 분이 흐른다. 사람들은 시간에 따라 다른 곳에 있다. 개펄은 썰물 때만 걸어서 건널 수 있다. 밤이 깊으면 잠을 자야 한다. 사건에는 기한이 있다.'],
        ['조작', '숫자 키 1–9: 선택지 고르기 · 스페이스/엔터: 계속 · C 인물 · T 사고 · I 소지품 · J 일지 · Esc 메뉴'],
        ['이 게임에 대하여', '「디스코 엘리시움」의 구조에 대한 오마주로 만든 오리지널 작품이다. 세계, 인물, 사건, 문장은 모두 이 게임을 위해 새로 쓰였다.'],
      ];
      for (const [t, p] of txt) {
        body.appendChild(h('h3', { text: t, style: 'margin-top:.8em' }));
        body.appendChild(h('p', { text: p, style: 'max-width:44em;color:var(--paper-2)' }));
      }
    }
  }

  TL.UI = UI;
  TL.Store = Store;
})(typeof window !== 'undefined' ? window.TL : globalThis.TL);

</script>
<script>
/* src/js/main.js */
/* 탱고 레테 — 부팅 */
(function (TL) {
  'use strict';
  function boot(data) {
    if (TL.contentErrors && TL.contentErrors.length) {
      console.error('콘텐츠 오류:\n' + TL.contentErrors.join('\n'));
    }
    const ui = new TL.UI();
    TL.ui = ui;
    try {
      ui.init(data || {});
    } catch (e) {
      console.error(e);
      const pre = document.createElement('pre');
      pre.className = 'fatal';
      pre.textContent = '게임을 시작할 수 없습니다.\n' + (e && e.message ? e.message : String(e));
      document.body.appendChild(pre);
    }
  }
  const hot = window.claude && window.claude.hot;
  const start = (d) => {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => boot(d));
    else boot(d);
  };
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});
})(window.TL);

</script>
</body>
</html>
